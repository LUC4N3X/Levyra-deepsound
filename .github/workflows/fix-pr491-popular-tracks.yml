name: Fix PR491 Popular Tracks

on:
  push:
    branches:
      - feature/ui-evolution-living-capsule-home-artist-collections
    paths:
      - .github/workflows/fix-pr491-popular-tracks.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch popular tracks
        run: |
          python3 .github/scripts/patch-pr491-popular-tracks.py
          sed -i 's/\.padding(vertical = 4.dp, end = 4.dp)/.padding(top = 4.dp, end = 4.dp, bottom = 4.dp)/' app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt

      - name: Compile
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "refactor(ui): simplify artist popular tracks"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
