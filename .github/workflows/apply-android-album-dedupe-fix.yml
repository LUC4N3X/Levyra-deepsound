name: Apply Android album deduplication fix

on:
  push:
    branches:
      - fix/android-home-album-deduplication

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: fix/android-home-album-deduplication
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Patch album identity and regression test
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicRepository.kt")
          source = source_path.read_text(encoding="utf-8")
          old_primary_artist = '''    val primaryArtist = albumRecommendationTextKey(
                  album.artist.split(ALBUM_RECOMMENDATION_ARTIST_SEPARATOR, limit = 2).firstOrNull().orEmpty()
              )'''
          new_primary_artist = '''    val primaryArtist = albumRecommendationTextKey(primaryArtistSegment(album.artist))'''
          if source.count(old_primary_artist) != 1:
              raise SystemExit("Expected album primary-artist block not found exactly once")
          source = source.replace(old_primary_artist, new_primary_artist, 1)

          lines = source.splitlines()
          separator_index = next(
              (index for index, line in enumerate(lines) if line == "private val ALBUM_RECOMMENDATION_ARTIST_SEPARATOR ="),
              None,
          )
          if separator_index is None or separator_index + 1 >= len(lines) or "Regex(" not in lines[separator_index + 1]:
              raise SystemExit("Legacy album artist separator declaration not found")
          del lines[separator_index:separator_index + 2]
          source_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          test_path = Path("app/src/test/java/com/luc4n3x/levyra/data/AlbumRecommendationPolicyTest.kt")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''    @Test
              fun albumDeduplicationCollapsesEditionSuffixesForTheSameArtist() {'''
          regression = '''    @Test
              fun albumDeduplicationCollapsesLocalizedArtistConnectors() {
                  val localized = album("AMATORE", "Samurai Jay e Vito Salamanca")
                  val providerVariant = album("AMATORE", "Samurai Jay, Vito Salamanca")

                  assertEquals(
                      albumRecommendationDeduplicationKey(localized),
                      albumRecommendationDeduplicationKey(providerVariant)
                  )
              }

          '''
          if tests.count(marker) != 1:
              raise SystemExit("Album recommendation test insertion point not found exactly once")
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests, encoding="utf-8")

      - name: Run album recommendation tests
        run: ./gradlew testDebugUnitTest --tests com.luc4n3x.levyra.data.AlbumRecommendationPolicyTest

      - name: Commit Android fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicRepository.kt \
                  app/src/test/java/com/luc4n3x/levyra/data/AlbumRecommendationPolicyTest.kt
          git diff --cached --check
          git commit -m "fix(android): deduplicate localized album artist credits"
          git push origin HEAD:fix/android-home-album-deduplication
