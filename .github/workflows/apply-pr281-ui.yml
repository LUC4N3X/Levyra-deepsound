name: Apply PR 281 UI implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/product-experience-navigation-search-player'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-disabled: true

      - name: Prepare CI release signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null

      - name: Apply complete UI implementation
        run: python3 .github/scripts/apply_pr281_ui.py

      - name: Restore multilingual release labels and decoder parity fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          release_type = Path("app/src/main/java/com/luc4n3x/levyra/domain/ReleaseType.kt")
          text = release_type.read_text()
          old = '''private val ALBUM_LABELS = normalizedLabelSet(
              "album", "albumo", "alben", "albom", "albumes", "albumi", "专辑", "專輯", "アルバム", "앨범",
              "अल्बम", "อัลบั้ม", "אלבום", "ألبوم"
          )'''
          new = '''private val ALBUM_LABELS = normalizedLabelSet(
              "album", "albumo", "alben", "albom", "albumes", "albumi", "άλμπουμ", "альбом",
              "专辑", "專輯", "アルバム", "앨범", "अल्बम", "एल्बम", "อัลบั้ม", "אלבום", "ألبوم"
          )'''
          if text.count(old) != 1:
              raise SystemExit("ReleaseType album label anchor not found exactly once")
          release_type.write_text(text.replace(old, new, 1))

          fixtures = Path("app/src/test/resources/config-parity")
          fixtures.mkdir(parents=True, exist_ok=True)
          files = {
              "accept-empty-players.json": '{"schemaVersion":1,"players":{}}\n',
              "accept-entry-with-alias.json": '{"schemaVersion":1,"players":{"2182a2cc":{"sig":"ZP(4,7936,INPUT)","nClass":"SZ","sts":20644,"aliases":["90ed594f"]}}}\n',
              "reject-alias-collision.json": '{"schemaVersion":1,"players":{"2182a2cc":{"sig":"ZP(4,7936,INPUT)","nClass":"SZ","sts":20644,"aliases":["90ed594f"]},"1def3fc2":{"sig":"Ab(1,2,INPUT)","nClass":"Cd","sts":20645,"aliases":["90ed594f"]}}}\n',
              "reject-malformed.json": '{"schemaVersion":1,"players":\n',
              "reject-players-missing.json": '{"schemaVersion":1}\n',
              "reject-root-array.json": '[]\n',
              "reject-schema-version-future.json": '{"schemaVersion":2,"players":{}}\n',
              "reject-schema-version-missing.json": '{"players":{}}\n',
              "reject-schema-version-string.json": '{"schemaVersion":"1","players":{}}\n',
              "reject-schema-version-zero.json": '{"schemaVersion":0,"players":{}}\n',
              "n-template-Yx.golden": "(function(n){try{var u=new g.Yx('https://x.googlevideo.com/videoplayback?n='+n,true);var t=u.get('n');return(t&&t!==n)?t:n;}catch(e){return n;}})(INPUT)\n",
          }
          for name, content in files.items():
              (fixtures / name).write_text(content)
          PY

      - name: Resolve Gradle plugins with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --refresh-dependencies help; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            rm -rf ~/.gradle/caches/modules-2/files-2.1/com.google.devtools.ksp
            sleep $((attempt * 20))
          done

      - name: Run focused product tests
        run: ./gradlew :app:testDebugUnitTest --tests com.luc4n3x.levyra.domain.LevyraProductExperienceTest --no-daemon

      - name: Run Android validation
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:compileReleaseKotlin --no-daemon

      - name: Commit only validated app files
        run: |
          rm .github/scripts/apply_pr281_ui.py
          rm .github/workflows/apply-pr281-ui.yml
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/luc4n3x/levyra/domain/Models.kt \
                  app/src/main/java/com/luc4n3x/levyra/domain/LevyraProductExperience.kt \
                  app/src/main/java/com/luc4n3x/levyra/domain/ReleaseType.kt \
                  app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraScreenViewModels.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
                  app/src/test/java/com/luc4n3x/levyra/domain/LevyraProductExperienceTest.kt \
                  app/src/test/resources/config-parity \
                  .github/scripts/apply_pr281_ui.py \
                  .github/workflows/apply-pr281-ui.yml
          git commit -m "feat: implement navigation, home, search, settings, and player overhaul"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
