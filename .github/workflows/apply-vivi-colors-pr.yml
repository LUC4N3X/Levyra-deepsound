name: Apply Vivi player colors

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'design/player-colors-flat-controls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply palette patch
        run: python3 .github/scripts/apply_vivi_colors.py

      - name: Compile Android app
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit patch and remove temporary files
        run: |
          rm .github/scripts/apply_vivi_colors.py
          rm .github/workflows/apply-vivi-colors-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/components/PlayerControls.kt \
                  .github/scripts/apply_vivi_colors.py \
                  .github/workflows/apply-vivi-colors-pr.yml
          git commit -m "style: align player colors with Vivi-inspired palette"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
