name: One-shot library import patch

on:
  push:
    branches:
      - agent/fix-localization-region-consistency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-localization-region-consistency
          fetch-depth: 0
      - name: Add required LazyList import
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryOverviewComponents.kt')
          text = path.read_text(encoding='utf-8')
          anchor = 'import androidx.compose.foundation.rememberScrollState\n'
          addition = anchor + 'import androidx.compose.foundation.lazy.items\n'
          if 'import androidx.compose.foundation.lazy.items\n' not in text:
              if anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(anchor, addition, 1)
              path.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-shot-library-import-patch.yml').unlink()
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryOverviewComponents.kt \
                  .github/workflows/one-shot-library-import-patch.yml
          git commit -m "fix(android): complete library lazy list imports"
          git push origin HEAD:agent/fix-localization-region-consistency
