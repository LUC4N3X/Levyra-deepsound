name: Apply Player Canvas Speed Improvements

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'feat/central-ytm-editorial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Prepare ephemeral signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null

      - name: Apply guarded changes
        run: python tools/apply_player_canvas_speed.py

      - name: Verify patch contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'state.isVideoMode -> 8.dp' app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          grep -q 'val mediaHeight = artworkSize' app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          grep -q 'RESIZE_MODE_ZOOM' app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          grep -q 'playbackWarmup.primeVideo(resolved)' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q 'community-canvas' app/src/main/java/com/luc4n3x/levyra/feature/motion/MotionArtworkEngine.kt
          grep -q '_video_id_from(renderer)' tools/levyra-editorial/levyra_editorial/youtube_music.py

      - name: Install editorial collector
        run: python -m pip install --disable-pip-version-check -e "tools/levyra-editorial[dev]"

      - name: Python static checks and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools/levyra-editorial/levyra_editorial
          ruff check tools/levyra-editorial
          pytest tools/levyra-editorial/tests

      - name: Focused Android tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests '*CommunityCanvasProviderTest' \
            --tests '*MotionArtworkDestinationPolicyTest'

      - name: Android lint and compile
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :LevyraNexus:compileKotlin \
            :app:compileDebugKotlin \
            :app:lintDebug

      - name: Commit verified improvements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/luc4n3x/levyra/feature/motion/CommunityCanvasProvider.kt \
            app/src/main/java/com/luc4n3x/levyra/feature/motion/MotionArtworkUrlVerifier.kt \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt \
            app/src/test/java/com/luc4n3x/levyra/feature/motion/MotionArtworkDestinationPolicyTest.kt \
            tools/levyra-editorial/levyra_editorial/youtube_music.py \
            tools/levyra-editorial/tests/test_youtube_music.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(player): enlarge and prewarm video mode"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
