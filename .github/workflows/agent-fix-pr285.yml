name: Apply PR 285 review fixes

on:
  push:
    branches:
      - agent/refine-product-experience

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-product-experience
          fetch-depth: 0

      - name: Apply verified review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          policy = Path("app/src/main/java/com/luc4n3x/levyra/ui/ProductShellPolicy.kt")
          policy.write_text('''package com.luc4n3x.levyra.ui

import com.luc4n3x.levyra.domain.LevyraTab
import com.luc4n3x.levyra.viewmodel.LevyraUiState

internal const val PRODUCT_NAVIGATION_HEIGHT_DP = 76
internal const val PRODUCT_MINI_PLAYER_CLEARANCE_DP = 154

internal fun productPrimaryTabs(): List<LevyraTab> = listOf(
    LevyraTab.Home,
    LevyraTab.Search,
    LevyraTab.Explore,
    LevyraTab.Library
)

internal fun hasProductBlockingOverlay(state: LevyraUiState): Boolean =
    state.showOnboarding || state.showSettings || state.showAlbum || state.showArtist ||
        state.showQueue || state.showLyrics || state.showAudioQualityPanel ||
        state.showUpdatePrompt || state.sharedMediaPreview != null || state.openPlaylist != null

internal fun productOverlayBottomPadding(hasCurrentTrack: Boolean): Int =
    if (hasCurrentTrack) PRODUCT_MINI_PLAYER_CLEARANCE_DP else PRODUCT_NAVIGATION_HEIGHT_DP

internal fun shouldShowProductNavigation(
    isInPictureInPicture: Boolean,
    selectedTab: LevyraTab,
    hasBlockingOverlay: Boolean
): Boolean = !isInPictureInPicture && !hasBlockingOverlay && selectedTab in productPrimaryTabs()
''', encoding="utf-8")

          test = Path("app/src/test/java/com/luc4n3x/levyra/ui/ProductShellPolicyTest.kt")
          test.write_text('''package com.luc4n3x.levyra.ui

import com.luc4n3x.levyra.domain.LevyraTab
import com.luc4n3x.levyra.viewmodel.LevyraUiState
import org.junit.Assert.assertEquals
import org.junit.Assert.assertFalse
import org.junit.Assert.assertTrue
import org.junit.Test

class ProductShellPolicyTest {
    @Test
    fun primaryNavigationKeepsPlayerContextual() {
        assertEquals(
            listOf(LevyraTab.Home, LevyraTab.Search, LevyraTab.Explore, LevyraTab.Library),
            productPrimaryTabs()
        )
        assertFalse(LevyraTab.Player in productPrimaryTabs())
    }

    @Test
    fun navigationIsHiddenForPipPlayerAndBlockingOverlays() {
        assertFalse(shouldShowProductNavigation(true, LevyraTab.Home, false))
        assertFalse(shouldShowProductNavigation(false, LevyraTab.Player, false))
        assertFalse(shouldShowProductNavigation(false, LevyraTab.Home, true))
        assertTrue(shouldShowProductNavigation(false, LevyraTab.Search, false))
    }

    @Test
    fun contentClearanceAccountsForMiniPlayer() {
        assertEquals(PRODUCT_NAVIGATION_HEIGHT_DP, productOverlayBottomPadding(false))
        assertEquals(PRODUCT_MINI_PLAYER_CLEARANCE_DP, productOverlayBottomPadding(true))
    }

    @Test
    fun blockingOverlayPolicyUsesEveryOwnedSurface() {
        val empty = LevyraUiState()
        assertFalse(hasProductBlockingOverlay(empty))
        assertTrue(hasProductBlockingOverlay(empty.copy(showOnboarding = true)))
        assertTrue(hasProductBlockingOverlay(empty.copy(showSettings = true)))
        assertTrue(hasProductBlockingOverlay(empty.copy(showAlbum = true)))
        assertTrue(hasProductBlockingOverlay(empty.copy(showArtist = true)))
        assertTrue(hasProductBlockingOverlay(empty.copy(showQueue = true)))
        assertTrue(hasProductBlockingOverlay(empty.copy(showLyrics = true)))
        assertTrue(hasProductBlockingOverlay(empty.copy(showAudioQualityPanel = true)))
        assertTrue(hasProductBlockingOverlay(empty.copy(showUpdatePrompt = true)))
    }
}
''', encoding="utf-8")

