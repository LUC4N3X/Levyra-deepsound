name: Fix Editorial Ruff

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 250 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Wrap remaining long line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/levyra-editorial/levyra_editorial/spotify.py')
          text = path.read_text()
          old = '        missing = [track_id for track_id in dict.fromkeys(ids) if track_id and track_id not in self._track_metadata]\n'
          new = '''        missing = [
              track_id
              for track_id in dict.fromkeys(ids)
              if track_id and track_id not in self._track_metadata
          ]
          '''
          if text.count(old) != 1:
              raise SystemExit('Spotify Ruff anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify collector
        run: |
          python -m pip install --disable-pip-version-check -e 'tools/levyra-editorial[dev]'
          ruff check tools/levyra-editorial
          pytest tools/levyra-editorial/tests -q
      - name: Commit style fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/levyra-editorial/levyra_editorial/spotify.py
          git commit -m 'style(editorial): wrap Spotify metadata filter'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
