name: Fix Editorial Ruff

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 250 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply canonical Ruff formatting
        run: |
          python -m pip install --disable-pip-version-check -e 'tools/levyra-editorial[dev]'
          ruff check --fix tools/levyra-editorial
          ruff check tools/levyra-editorial
          pytest tools/levyra-editorial/tests -q
      - name: Commit style fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/levyra-editorial
          if git diff --cached --quiet; then
            echo 'Ruff already clean'
            exit 0
          fi
          git commit -m 'style(editorial): apply canonical Ruff formatting'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
