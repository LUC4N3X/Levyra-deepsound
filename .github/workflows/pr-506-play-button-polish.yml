name: PR 506 polish hero play action

on:
  push:
    branches:
      - feat/home-artist-hero-and-artist-page-2-5-2

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-artist-hero-and-artist-page-2-5-2
          fetch-depth: 0

      - name: Refine hero play action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '.fillMaxWidth(0.78f)\n            .padding(start = 22.dp, end = 12.dp, bottom = 38.dp)': '.fillMaxWidth(0.74f)\n            .padding(start = 22.dp, end = 12.dp, bottom = 38.dp)',
              '.padding(end = 22.dp, bottom = 42.dp)\n            .size(76.dp)': '.padding(end = 18.dp, bottom = 46.dp)\n            .size(68.dp)',
              'modifier = Modifier.size(22.dp),\n                    strokeWidth = 2.5.dp,': 'modifier = Modifier.size(20.dp),\n                    strokeWidth = 2.25.dp,',
              'modifier = Modifier.size(29.dp)\n                )\n                else -> Icon(': 'modifier = Modifier.size(27.dp)\n                )\n                else -> Icon(',
              'modifier = Modifier.size(32.dp)\n                )\n            }\n        }\n    }': 'modifier = Modifier.size(29.dp)\n                )\n            }\n        }\n    }'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected hero play layout fragment not found: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate focused UI contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt').read_text(encoding='utf-8')
          start = text.index('private fun HomeEditorialSpotlight(')
          end = text.index('\n@Composable', start + 1)
          block = text[start:end]
          required = [
              '.fillMaxWidth(0.74f)',
              '.padding(end = 18.dp, bottom = 46.dp)',
              '.size(68.dp)',
              'Modifier.size(29.dp)',
              'Modifier.size(27.dp)',
              'Modifier.size(20.dp)'
          ]
          for fragment in required:
              if fragment not in block:
                  raise SystemExit(f'Missing expected play-action polish: {fragment}')
          if '.size(76.dp)' in block:
              raise SystemExit('Old oversized hero play action still present')
          print('hero_play_action_contract=ok')
          PY

      - name: Compile Android debug Kotlin
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Commit clean UI polish
        shell: bash
        run: |
          rm .github/workflows/pr-506-play-button-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr-506-play-button-polish.yml
          git commit -m "fix(ui): refine Home hero play action"
          git push origin HEAD:feat/home-artist-hero-and-artist-page-2-5-2
