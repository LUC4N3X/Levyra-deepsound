name: One Shot CodeRabbit Followups

on:
  push:
    branches:
      - feature/lyrics-downloads-motion-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lyrics-downloads-motion-v2
          fetch-depth: 0
      - name: Apply reviewed fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path_str, old, new, count=1):
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"Expected {count} occurrence(s) in {path_str}, found {found}")
              path.write_text(text.replace(old, new, count), encoding="utf-8")

          favorites = "app/src/main/java/com/luc4n3x/levyra/data/FavoritesStore.kt"
          replace(
              favorites,
              "import java.util.Locale\n",
              "import java.util.Locale\nimport java.util.concurrent.atomic.AtomicLong\n"
          )
          replace(
              favorites,
              "import timber.log.Timber\n\nclass FavoritesStore(context: Context) {\n",
              "import timber.log.Timber\n\ninternal val favoritesStoreMutationMutex = Mutex()\nprivate val favoritesTimestampGeneration = AtomicLong(0L)\n\ninternal fun invalidateFavoriteTimestampSnapshots() {\n    favoritesTimestampGeneration.incrementAndGet()\n}\n\nprivate data class FavoriteTimestampSnapshot(\n    val generation: Long,\n    val values: Map<String, Long>\n)\n\nclass FavoritesStore(context: Context) {\n"
          )
          replace(
              favorites,
              "    private val legacyPrefs = appContext.getSharedPreferences(\"levyra_favorites\", Context.MODE_PRIVATE)\n\n",
              "    private val legacyPrefs = appContext.getSharedPreferences(\"levyra_favorites\", Context.MODE_PRIVATE)\n    private var timestampSnapshot: FavoriteTimestampSnapshot? = null\n\n"
          )
          text = Path(favorites).read_text(encoding="utf-8")
          text = text.replace("mutationMutex.withLock", "favoritesStoreMutationMutex.withLock")
          Path(favorites).write_text(text, encoding="utf-8")
          replace(
              favorites,
              "        timestampSnapshot = entities.associate { it.id to it.createdAt }\n",
              "        rememberTimestampSnapshot(entities.associate { it.id to it.createdAt })\n"
          )
          replace(
              favorites,
              "    private suspend fun loadTimestampsInternal(): Map<String, Long> {\n        timestampSnapshot?.let { return it }\n        return runCatching {\n            dao.all().associate { it.id to it.createdAt }\n        }.onSuccess { snapshot ->\n            timestampSnapshot = snapshot\n        }.getOrDefault(emptyMap())\n    }\n",
              "    private suspend fun loadTimestampsInternal(): Map<String, Long> {\n        currentTimestampSnapshot()?.let { return it }\n        return runCatching {\n            dao.all().associate { it.id to it.createdAt }\n        }.onSuccess(::rememberTimestampSnapshot)\n            .getOrDefault(emptyMap())\n    }\n\n    private fun currentTimestampSnapshot(): Map<String, Long>? {\n        val generation = favoritesTimestampGeneration.get()\n        return timestampSnapshot\n            ?.takeIf { it.generation == generation }\n            ?.values\n    }\n\n    private fun rememberTimestampSnapshot(values: Map<String, Long>) {\n        timestampSnapshot = FavoriteTimestampSnapshot(\n            generation = favoritesTimestampGeneration.get(),\n            values = values\n        )\n    }\n"
          )
          replace(
              favorites,
              "    private suspend fun replaceAll(tracks: List<Track>) {\n        val existingTimestamps = timestampSnapshot ?: runCatching {\n            dao.all().associate { it.id to it.createdAt }\n        }.getOrDefault(emptyMap())\n        val now = System.currentTimeMillis()\n        val entities = tracks.mapIndexed { index, track ->\n            val timestamp = existingTimestamps[track.id]?.takeIf { it > 0L } ?: (now - index)\n            track.toFavoriteTrackEntity(timestamp)\n        }\n        dao.replaceAll(entities)\n        timestampSnapshot = entities.associate { it.id to it.createdAt }\n    }\n",
              "    private suspend fun replaceAll(tracks: List<Track>) {\n        val existingTimestamps = currentTimestampSnapshot() ?: dao.all().associate {\n            it.id to it.createdAt\n        }\n        val now = System.currentTimeMillis()\n        val entities = tracks.mapIndexed { index, track ->\n            val timestamp = existingTimestamps[track.id]?.takeIf { it > 0L } ?: (now - index)\n            track.toFavoriteTrackEntity(timestamp)\n        }\n        dao.replaceAll(entities)\n        val generation = favoritesTimestampGeneration.incrementAndGet()\n        timestampSnapshot = FavoriteTimestampSnapshot(\n            generation = generation,\n            values = entities.associate { it.id to it.createdAt }\n        )\n    }\n"
          )
          replace(
              favorites,
              "\n        val mutationMutex = Mutex()\n        var timestampSnapshot: Map<String, Long>? = null\n",
              "\n"
          )

          backup = "app/src/main/java/com/luc4n3x/levyra/data/LevyraBackupManager.kt"
          replace(
              backup,
              "        database.withTransaction {\n            database.favoriteTracksDao().replaceAll(payload.favorites.mapIndexed { index, track -> track.toFavoriteTrackEntity(now - index) })\n            restorePlaylists(payload.playlists)\n            restorePlaylistTags(payload.playlistTags, payload.playlists)\n            database.listenEventsDao().replaceAll(payload.history)\n            restoreQueue(payload.queueItems, payload.queueState)\n        }\n",
              "        favoritesStoreMutationMutex.withLock {\n            database.withTransaction {\n                database.favoriteTracksDao().replaceAll(payload.favorites.mapIndexed { index, track -> track.toFavoriteTrackEntity(now - index) })\n                restorePlaylists(payload.playlists)\n                restorePlaylistTags(payload.playlistTags, payload.playlists)\n                database.listenEventsDao().replaceAll(payload.history)\n                restoreQueue(payload.queueItems, payload.queueState)\n            }\n            invalidateFavoriteTimestampSnapshots()\n        }\n"
          )

          metadata = "app/src/main/java/com/luc4n3x/levyra/data/PlaybackFallbackMetadata.kt"
          replace(
              metadata,
              "private val KNOWN_MISATTRIBUTED_PLAYBACK_ARTISTS = setOf(\n    \"neptune\"\n)\n\ninternal fun isKnownMisattributedPlaybackArtist(value: String): Boolean =\n    value.playbackMatchKey() in KNOWN_MISATTRIBUTED_PLAYBACK_ARTISTS\n",
              "private data class MisattributedPlaybackSignature(\n    val artist: String,\n    val title: String\n)\n\nprivate val KNOWN_MISATTRIBUTED_PLAYBACK_SIGNATURES = setOf(\n    MisattributedPlaybackSignature(artist = \"neptune\", title = \"sottogonna\")\n)\n\ninternal fun isKnownMisattributedPlaybackMetadata(artist: String, title: String): Boolean =\n    MisattributedPlaybackSignature(\n        artist = artist.playbackMatchKey(),\n        title = title.playbackMatchKey()\n    ) in KNOWN_MISATTRIBUTED_PLAYBACK_SIGNATURES\n"
          )
          text = Path(metadata).read_text(encoding="utf-8")
          text = text.replace(
              "!isKnownMisattributedPlaybackArtist(candidate.artist)",
              "!isKnownMisattributedPlaybackMetadata(candidate.artist, candidate.title)"
          )
          text = text.replace(
              "val misattributedArtist = isKnownMisattributedPlaybackArtist(artist)",
              "val misattributedArtist = isKnownMisattributedPlaybackMetadata(track.artist, track.title)"
          )
          text = text.replace(
              "        isKnownMisattributedPlaybackArtist(donorArtist) ||\n",
              "        isKnownMisattributedPlaybackMetadata(donorArtist, donorTitle) ||\n",
              1
          )
          text = text.replace(
              "        isKnownMisattributedPlaybackArtist(donorArtist) ||\n",
              "        isKnownMisattributedPlaybackMetadata(donorArtist, metadataTitle) ||\n",
              1
          )
          old = "    val donorArtist = resolved.artist.trim().ifBlank { candidate.artist.trim() }\n    if (\n        donorArtist.isBlank() ||\n        isKnownMisattributedPlaybackMetadata(donorArtist, donorTitle) ||\n        donorArtist.equals(original.artist.trim(), ignoreCase = true)\n    ) {\n        return original.artist\n    }\n\n    val donorTitle = resolved.title.trim().ifBlank { candidate.title.trim() }\n"
          new = "    val donorArtist = resolved.artist.trim().ifBlank { candidate.artist.trim() }\n    val donorTitle = resolved.title.trim().ifBlank { candidate.title.trim() }\n    if (\n        donorArtist.isBlank() ||\n        isKnownMisattributedPlaybackMetadata(donorArtist, donorTitle) ||\n        donorArtist.equals(original.artist.trim(), ignoreCase = true)\n    ) {\n        return original.artist\n    }\n\n"
          if old not in text:
              raise SystemExit("Expected canonicalFallbackArtist block not found")
          text = text.replace(old, new, 1)
          Path(metadata).write_text(text, encoding="utf-8")

          chart = "app/src/main/java/com/luc4n3x/levyra/data/ChartOfficialArtworkResolver.kt"
          text = Path(chart).read_text(encoding="utf-8")
          found = text.count("isKnownMisattributedPlaybackArtist(track.artist)")
          if found != 2:
              raise SystemExit(f"Expected 2 chart artist-only checks, found {found}")
          text = text.replace(
              "isKnownMisattributedPlaybackArtist(track.artist)",
              "isKnownMisattributedPlaybackMetadata(track.artist, track.title)"
          )
          Path(chart).write_text(text, encoding="utf-8")

          test = "app/src/test/java/com/luc4n3x/levyra/data/PlaybackFallbackMetadataTest.kt"
          replace(
              test,
              "    fun recognizesKnownMisattributedArtistIgnoringPunctuationAndCase() {\n        assertTrue(isKnownMisattributedPlaybackArtist(\"neptune.\"))\n        assertTrue(isKnownMisattributedPlaybackArtist(\"NEPTUNE\"))\n        assertFalse(isKnownMisattributedPlaybackArtist(\"BLANCO\"))\n    }\n",
              "    fun recognizesOnlyKnownMisattributedArtistTitleSignature() {\n        assertTrue(isKnownMisattributedPlaybackMetadata(\"neptune.\", \"SOTTOGONNA\"))\n        assertTrue(isKnownMisattributedPlaybackMetadata(\"NEPTUNE\", \"sottogonna!\"))\n        assertFalse(isKnownMisattributedPlaybackMetadata(\"NEPTUNE\", \"ALTALENA\"))\n        assertFalse(isKnownMisattributedPlaybackMetadata(\"BLANCO\", \"SOTTOGONNA\"))\n    }\n"
          )
      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          python3 scripts/ai_quality_gate.py --profile fast
      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-one-shot-coderabbit-followups.yml
          git add app/src/main/java/com/luc4n3x/levyra/data/FavoritesStore.kt \
                  app/src/main/java/com/luc4n3x/levyra/data/LevyraBackupManager.kt \
                  app/src/main/java/com/luc4n3x/levyra/data/PlaybackFallbackMetadata.kt \
                  app/src/main/java/com/luc4n3x/levyra/data/ChartOfficialArtworkResolver.kt \
                  app/src/test/java/com/luc4n3x/levyra/data/PlaybackFallbackMetadataTest.kt
          git diff --cached --check
          git commit -m "fix: address coderabbit follow-ups"
          git push origin HEAD:feature/lyrics-downloads-motion-v2
