name: Apply PR 309 startup patch on push

on:
  push:
    branches:
      - perf/cold-start-thermal-smoothness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/cold-start-thermal-smoothness
          fetch-depth: 0

      - name: Extract and apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/agent-perf-pr309.yml > /tmp/apply_perf_patch.py
          test -s /tmp/apply_perf_patch.py
          python3 /tmp/apply_perf_patch.py

      - name: Validate source patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'startupWorkGate = Semaphore(1)' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q 'activePlaybackProtectionMs' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q 'snapshot.selectedTab == LevyraTab.Player -> 250L' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt

      - name: Restore CI and commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/pr-check.yml > .github/workflows/pr-check.yml
          rm -f .github/workflows/agent-perf-pr309.yml
          rm -f .github/workflows/agent-perf-pr309-push.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt .github/workflows
          git commit -m 'perf(startup): serialize cold-start work around active playback'
          git push origin HEAD:perf/cold-start-thermal-smoothness
