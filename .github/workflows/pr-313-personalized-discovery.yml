name: Apply PR 313 Localized Discovery

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr-313-localized-discovery
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.number == 313
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: claude/menu-esplora-redesign-t3j2l4
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml

      - name: Apply focused implementation
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr-313-personalized-discovery.py
          python .github/scripts/pr-313-spotify-releases.py
          python .github/scripts/pr-313-editorial-release-test.py
          python .github/scripts/pr-313-final-localization.py
          python .github/scripts/pr-313-final-guarantees.py
          python .github/scripts/pr-313-preserve-source-errors.py
          git rm \
            .github/scripts/pr-313-personalized-discovery.py \
            .github/scripts/pr-313-spotify-releases.py \
            .github/scripts/pr-313-editorial-release-test.py \
            .github/scripts/pr-313-final-localization.py \
            .github/scripts/pr-313-final-guarantees.py \
            .github/scripts/pr-313-preserve-source-errors.py \
            .github/workflows/pr-313-personalized-discovery.yml
          git diff --check

      - name: Validate editorial collector
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e "tools/levyra-editorial[dev]"
          python -m compileall -q tools/levyra-editorial/levyra_editorial
          ruff check tools/levyra-editorial
          pytest tools/levyra-editorial/tests

      - name: Compile Android and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileDebugKotlin
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.YoutubeMusicSamplesPolicyTest' \
            --tests 'com.luc4n3x.levyra.data.YoutubeMusicNewReleasesPolicyTest' \
            --tests 'com.luc4n3x.levyra.data.EditorialReleaseCatalogTest' \
            --tests 'com.luc4n3x.levyra.data.SamplesAllLanguagesPolicyTest' \
            --tests 'com.luc4n3x.levyra.viewmodel.NewReleasesPersonalizationTest' \
            --tests 'com.luc4n3x.levyra.data.YoutubeShortsRepositoryTest' \
            --tests 'com.luc4n3x.levyra.ui.ExploreLayoutTest'

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(explore): use localized Spotify releases"
          git fetch origin claude/menu-esplora-redesign-t3j2l4
          if ! git rebase FETCH_HEAD; then
            git rebase --abort || true
            echo "The branch changed while validation was running; rebase conflicted."
            exit 1
          fi
          git push origin HEAD:claude/menu-esplora-redesign-t3j2l4
