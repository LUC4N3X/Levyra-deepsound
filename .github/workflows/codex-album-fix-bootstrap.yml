name: Codex Album Fix Bootstrap

on:
  push:
    branches:
      - codex/fix-empty-album-detail
    paths:
      - .github/workflows/codex-album-fix-bootstrap.yml
      - scripts/codex_album_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: codex/fix-empty-album-detail

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-disabled: true

      - name: Apply focused album fix
        run: python3 scripts/codex_album_fix.py

      - name: Focused repository tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.data.YoutubeMusicRepositoryTest'

      - name: Android debug Kotlin compile
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git add \
            app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt \
            app/src/test/java/com/luc4n3x/levyra/data/YoutubeMusicRepositoryTest.kt
          git commit -m "fix(android): recover empty album details and refine album error state"
          git push origin HEAD:codex/fix-empty-album-detail
