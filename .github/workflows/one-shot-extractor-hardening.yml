name: One-shot extractor security and SABR hardening

on:
  push:
    branches:
      - agent/extractor-security-aa-potoken-sabr

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/extractor-security-aa-potoken-sabr
          fetch-depth: 0

      - name: Apply selected upstream changes
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            upstream_dir="$(mktemp -d)"
            git clone --filter=blob:none --no-checkout https://github.com/InfinityLoop1308/PipePipeExtractor.git "$upstream_dir"
            git -C "$upstream_dir" fetch --no-tags origin \
              64f864135d2133a6a13a9944608de5a2c3e7e851 \
              7673caed56001d78aad65b48daf9198359b466aa

            python3 - "$upstream_dir" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          upstream = Path(sys.argv[1])
          base = "64f864135d2133a6a13a9944608de5a2c3e7e851"
          tip = "7673caed56001d78aad65b48daf9198359b466aa"
          vendored_root = Path("third_party/LevyraExtractor")

          def git_text(*args: str) -> str:
              return subprocess.check_output(["git", "-C", str(upstream), *args], text=True)

          changed = git_text("diff", "--name-only", base, tip).splitlines()
          exact = {
              "extractor/src/main/java/org/schabi/newpipe/extractor/NewPipe.java",
              "extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/YoutubeParsingHelper.java",
              "extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/YoutubePlayerRequest.java",
              "extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/YoutubeSessionPoToken.java",
              "extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/YoutubeSessionPoTokenProvider.java",
              "extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/extractors/YoutubeStreamExtractor.java",
          }
          sabr_prefix = "extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/"
          selected = {
              path for path in changed
              if path in exact or (path.startswith(sabr_prefix) and path.endswith(".java"))
          }
          selected.update(exact)

          conflicts: list[str] = []
          work = Path(".git") / "levyra-merge-work"
          work.mkdir(parents=True, exist_ok=True)
          for relative in sorted(selected):
              target = vendored_root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              try:
                  theirs = git_text("show", f"{tip}:{relative}")
              except subprocess.CalledProcessError:
                  print(f"SKIP removed upstream file: {relative}")
                  continue
              try:
                  base_text = git_text("show", f"{base}:{relative}")
              except subprocess.CalledProcessError:
                  base_text = ""

              if not target.exists():
                  target.write_text(theirs, encoding="utf-8")
                  print(f"ADD {relative}")
                  continue

              ours_path = work / "ours"
              base_path = work / "base"
              theirs_path = work / "theirs"
              ours_path.write_text(target.read_text(encoding="utf-8"), encoding="utf-8")
              base_path.write_text(base_text, encoding="utf-8")
              theirs_path.write_text(theirs, encoding="utf-8")
              result = subprocess.run(
                  ["git", "merge-file", "-p", str(ours_path), str(base_path), str(theirs_path)],
                  text=True,
                  capture_output=True,
              )
              if result.returncode > 1:
                  raise SystemExit(f"git merge-file failed for {relative}: {result.stderr}")
              if result.returncode == 1 or "<<<<<<<" in result.stdout:
                  conflicts.append(relative)
                  print(f"CONFLICT {relative}")
                  continue
              target.write_text(result.stdout, encoding="utf-8")
              print(f"MERGED {relative}")

          if conflicts:
              raise SystemExit("Manual selective port required for: " + ", ".join(conflicts))

          new_pipe = vendored_root / "extractor/src/main/java/org/schabi/newpipe/extractor/NewPipe.java"
          text = new_pipe.read_text(encoding="utf-8")
          for item in (
              "import javax.net.ssl.HostnameVerifier;\n",
              "import javax.net.ssl.HttpsURLConnection;\n",
              "import javax.net.ssl.SSLContext;\n",
              "import javax.net.ssl.SSLSession;\n",
              "import javax.net.ssl.X509TrustManager;\n",
              "import java.security.SecureRandom;\n",
              "import java.security.cert.CertificateException;\n",
              "import java.security.cert.X509Certificate;\n",
          ):
              text = text.replace(item, "")
          text = text.replace("        trustEveryone();\n", "")
          marker = "    public static void trustEveryone() {\n"
          if marker in text:
              start = text.index(marker)
              depth = 0
              end = None
              for index in range(start, len(text)):
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  raise SystemExit("Could not locate end of trustEveryone()")
              text = text[:start] + text[end:]
          if "trustEveryone" in text or "X509TrustManager" in text:
              raise SystemExit("Insecure TLS override survived")
          new_pipe.write_text(text.rstrip() + "\n", encoding="utf-8")
          PY

            rm -rf .git/levyra-merge-work
            git diff --check
          } 2>&1 | tee .github/extractor-hardening-report.txt

      - name: Test vendored extractor
        id: extractor_tests
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test 2>&1 | tee -a .github/extractor-hardening-report.txt

      - name: Compile Android release sources
        id: app_compile
        if: steps.apply.outcome == 'success' && steps.extractor_tests.outcome == 'success'
        continue-on-error: true
        run: ./gradlew --no-daemon :app:compileReleaseKotlin 2>&1 | tee -a .github/extractor-hardening-report.txt

      - name: Publish result to branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "${{ steps.apply.outcome }}" == "success" && \
                "${{ steps.extractor_tests.outcome }}" == "success" && \
                "${{ steps.app_compile.outcome }}" == "success" ]]; then
            rm -f .github/workflows/one-shot-extractor-hardening.yml \
                  .github/extractor-hardening-trigger \
                  .github/extractor-hardening-report.txt
            git add third_party/LevyraExtractor \
                    .github/workflows/one-shot-extractor-hardening.yml \
                    .github/extractor-hardening-trigger \
                    .github/extractor-hardening-report.txt
            git diff --cached --check
            git commit -m "Harden vendored extractor PoToken and SABR recovery"
          else
            git reset --hard HEAD
            printf 'apply=%s\nextractor_tests=%s\napp_compile=%s\n\n' \
              "${{ steps.apply.outcome }}" \
              "${{ steps.extractor_tests.outcome }}" \
              "${{ steps.app_compile.outcome }}" \
              > .github/extractor-hardening-status.txt
            test -f .github/extractor-hardening-report.txt || echo "No diagnostic output captured" > .github/extractor-hardening-report.txt
            git add .github/extractor-hardening-status.txt .github/extractor-hardening-report.txt
            git commit -m "chore: record extractor hardening diagnostics"
          fi
          git push origin HEAD:agent/extractor-security-aa-potoken-sabr
