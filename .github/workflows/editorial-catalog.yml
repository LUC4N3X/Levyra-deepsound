name: Editorial Catalog

on:
  pull_request:
    paths:
      - "tools/levyra-editorial/**"
      - "tools/apply_chart_ui_polish.py"
      - "app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt"
      - "app/src/main/java/com/luc4n3x/levyra/data/ChartsRepository.kt"
      - "app/src/main/java/com/luc4n3x/levyra/data/ChartOfficialArtworkResolver.kt"
      - "app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicChartsRepository.kt"
      - "app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt"
      - "app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt"
      - "app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt"
      - "app/src/test/java/com/luc4n3x/levyra/data/Editorial*.kt"
      - ".github/workflows/editorial-catalog.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-catalog-${{ github.event_name == 'pull_request' && github.ref || 'publisher' }}
  cancel-in-progress: true

jobs:
  apply_android_polish:
    name: Apply Android Chart Polish
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/editorial-collector' &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/editorial-collector
          fetch-depth: 0
      - name: Apply fixes
        run: python tools/apply_chart_ui_polish.py
      - name: Verify patch
        run: git diff --check
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Compile and test Android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.EditorialArtworkContinuityTest' \
            --tests 'com.luc4n3x.levyra.data.EditorialCatalogParserTest'
      - name: Commit verified fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java
          git diff --cached --quiet && { echo 'No changes to commit.'; exit 0; }
          git commit -m 'fix(android): stabilize charts artwork scrolling and preloading'
          git push origin HEAD:feat/editorial-collector

  verify:
    name: Verify Collector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml
      - name: Install Collector
        run: python -m pip install --disable-pip-version-check -e "tools/levyra-editorial[dev]"
      - name: Static Checks
        run: |
          set -euo pipefail
          python -m compileall -q tools/levyra-editorial/levyra_editorial
          ruff check tools/levyra-editorial
      - name: Unit Tests
        run: pytest tools/levyra-editorial/tests

  integration:
    name: Test Live Editorial Collection
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LEVYRA_EDITORIAL_SP_DC: ${{ secrets.LEVYRA_EDITORIAL_SP_DC }}
    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml
      - name: Install Collector
        run: python -m pip install --disable-pip-version-check -e "tools/levyra-editorial"
      - name: Require Editorial Secret
        run: |
          set -euo pipefail
          test -n "${LEVYRA_EDITORIAL_SP_DC:-}" || { echo "::error::Missing LEVYRA_EDITORIAL_SP_DC"; exit 1; }
      - name: Generate and Validate Live Catalog
        run: |
          set -euo pipefail
          timeout --foreground 240s levyra-editorial --config tools/levyra-editorial/config.json --output build/editorial/catalog.json
          levyra-editorial --validate build/editorial/catalog.json
          test "$(jq '.collections | length' build/editorial/catalog.json)" -ge 26
          if jq -e '.. | objects | has("artworkUrl") or has("isrc")' build/editorial/catalog.json >/dev/null; then
            echo "::error::Catalog contains source artwork or unsupported ISRC fields"
            exit 1
          fi
          sha256sum build/editorial/catalog.json > build/editorial/catalog.sha256
      - name: Upload Pull Request Diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: editorial-pr-${{ github.run_number }}
          path: |
            build/editorial/catalog.json
            build/editorial/catalog.sha256
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect and Publish
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.actor != 'dependabot[bot]'
      )
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      LEVYRA_EDITORIAL_SP_DC: ${{ secrets.LEVYRA_EDITORIAL_SP_DC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml
      - name: Install Collector
        run: python -m pip install --disable-pip-version-check -e "tools/levyra-editorial"
      - name: Require Editorial Secret
        run: |
          set -euo pipefail
          test -n "${LEVYRA_EDITORIAL_SP_DC:-}" || { echo "::error::Missing LEVYRA_EDITORIAL_SP_DC"; exit 1; }
      - name: Generate Catalog
        run: |
          set -euo pipefail
          timeout --foreground 360s levyra-editorial --config tools/levyra-editorial/config.json --output build/editorial/catalog.json
          levyra-editorial --validate build/editorial/catalog.json
          test "$(jq '.collections | length' build/editorial/catalog.json)" -ge 26
          if jq -e '.. | objects | has("artworkUrl") or has("isrc")' build/editorial/catalog.json >/dev/null; then
            echo "::error::Catalog contains source artwork or unsupported ISRC fields"
            exit 1
          fi
          sha256sum build/editorial/catalog.json > build/editorial/catalog.sha256
      - name: Upload Diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: editorial-catalog-${{ github.run_number }}
          path: |
            build/editorial/catalog.json
            build/editorial/catalog.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish Last Valid Catalog
        run: |
          set -euo pipefail
          branch="editorial-data"
          source_ref="$(git rev-parse HEAD)"
          cp build/editorial/catalog.json /tmp/editorial.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            git switch --force-create "${branch}" "origin/${branch}"
            if [ -f catalog/editorial.json ]; then
              jq -S 'del(.generatedAt)' catalog/editorial.json > /tmp/current-editorial-content.json
              jq -S 'del(.generatedAt)' /tmp/editorial.json > /tmp/new-editorial-content.json
              if cmp -s /tmp/current-editorial-content.json /tmp/new-editorial-content.json; then
                echo "Catalog content is unchanged; publication skipped."
                git switch --detach "${source_ref}"
                exit 0
              fi
            fi
          else
            git switch --orphan "${branch}"
            git rm -rf .
          fi

          mkdir -p catalog
          cp /tmp/editorial.json catalog/editorial.json
          git add catalog/editorial.json
          git commit -m "chore(editorial): refresh catalog from run ${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:refs/heads/${branch}"
          git switch --detach "${source_ref}"
          echo "Published catalog to ${branch}/catalog/editorial.json"
