name: Editorial Catalog Mapping Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'feat/central-ytm-editorial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Apply strict dual mapping
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_dual_ytm_mapping_patch.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/levyra-editorial/levyra_editorial/youtube_music.py")
          text = path.read_text(encoding="utf-8")
          old = '        video_type = str(config.get("musicVideoType") or "").strip().upper() if isinstance(config, Mapping) else ""\n'
          new = '''        video_type = (
              str(config.get("musicVideoType") or "").strip().upper()
              if isinstance(config, Mapping)
              else ""
          )
          '''
          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"video type formatting anchor count: {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify collector
        run: |
          python -m pip install --disable-pip-version-check -e "tools/levyra-editorial[dev]"
          ruff check tools/levyra-editorial
          pytest -q tools/levyra-editorial/tests

      - name: Verify Android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:compileDebugKotlin

      - name: Verify mapping contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'audioVideoId' tools/levyra-editorial/levyra_editorial/youtube_music.py
          grep -q 'MUSIC_VIDEO_TYPE_OMV' tools/levyra-editorial/levyra_editorial/youtube_music.py
          grep -q 'youtubeAudioVideoId' app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt
          grep -q 'counterpartVideoId = youtubeOfficialVideoId' app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt
          ! git diff -- app tools | grep -E 'SAPISID|__Secure-|LEVYRA_EDITORIAL_YTM_COOKIE=' >/dev/null

      - name: Commit verified mapping and clean temporary tooling
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git checkout 45c784ae0611348214ad9064f8f0156f16bf844b -- .github/workflows/editorial-catalog.yml
          git rm -f \
            tools/apply_dual_ytm_mapping_patch.py \
            .github/workflows/apply-dual-ytm-mapping.yml \
            .github/.ytm-mapping-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/editorial-catalog.yml \
            tools/levyra-editorial/levyra_editorial/youtube_music.py \
            tools/levyra-editorial/levyra_editorial/collector.py \
            tools/levyra-editorial/tests/test_youtube_music.py \
            tools/levyra-editorial/tests/test_collector.py \
            app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt
          git commit -m "fix(video): map audio and official music videos separately"
          git push origin "HEAD:$HEAD_REF"
