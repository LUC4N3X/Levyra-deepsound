name: Editorial Catalog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr319-final-cleanup
  cancel-in-progress: true

jobs:
  apply-pr319-cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/pro-audio-and-smart-importer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/pro-audio-and-smart-importer
          fetch-depth: 0

      - name: Apply final source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main feature/pro-audio-and-smart-importer

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt')
          source = path.read_text(encoding='utf-8')
          block = '''            if (category == LibraryCategory.Overview) {
                item(key = "overview-import-playlist") {
                    LibraryImportPlaylistCard(
                        onClick = { showImportPlaylist = true },
                        isItalian = isItalian
                    )
                }
            }

'''
          count = source.count(block)
          if count != 1:
              raise SystemExit(f'overview import block: expected 1 match, found {count}')
          source = source.replace(block, '', 1)
          if 'overview-import-playlist' in source:
              raise SystemExit('overview import action still present')
          path.write_text(source, encoding='utf-8')
          PY

          git checkout origin/main -- .github/workflows/editorial-catalog.yml
          git checkout origin/main -- tools/levyra-editorial/levyra_editorial/resilient.py
          git rm -f .github/workflows/apply-pr319-review-fixes.yml || true
          git rm -f .pr319-review-fixes-trigger || true
          git rm -f tools/levyra-editorial/levyra_editorial/pr319_patch.py || true

          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'fix(library): keep playlist import inside Playlists only'
          git push origin HEAD:feature/pro-audio-and-smart-importer
