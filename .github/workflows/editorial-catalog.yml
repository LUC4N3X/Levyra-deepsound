name: Editorial Catalog

on:
  pull_request:
    paths:
      - "tools/levyra-editorial/**"
      - ".github/workflows/editorial-catalog.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-catalog-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Collector
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml

      - name: Install Collector
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e "tools/levyra-editorial[dev]"

      - name: Static Checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools/levyra-editorial/levyra_editorial
          ruff check tools/levyra-editorial

      - name: Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          pytest tools/levyra-editorial/tests

  collect:
    name: Collect and Publish
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      LEVYRA_EDITORIAL_SP_DC: ${{ secrets.LEVYRA_EDITORIAL_SP_DC }}
      LEVYRA_EDITORIAL_TOTP_SECRETS_URL: ${{ vars.LEVYRA_EDITORIAL_TOTP_SECRETS_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml

      - name: Install Collector
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e "tools/levyra-editorial"

      - name: Require Editorial Secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LEVYRA_EDITORIAL_SP_DC:-}" ]; then
            echo "::error::Missing repository secret LEVYRA_EDITORIAL_SP_DC"
            exit 1
          fi

      - name: Generate Catalog
        shell: bash
        run: |
          set -euo pipefail
          levyra-editorial \
            --config tools/levyra-editorial/config.json \
            --output build/editorial/catalog.json
          levyra-editorial --validate build/editorial/catalog.json
          sha256sum build/editorial/catalog.json > build/editorial/catalog.sha256

      - name: Upload Diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: editorial-catalog-${{ github.run_number }}
          path: |
            build/editorial/catalog.json
            build/editorial/catalog.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish Last Valid Catalog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="editorial-data"
          api_path="repos/${GITHUB_REPOSITORY}/contents/catalog/editorial.json"
          output="build/editorial/catalog.json"

          if ! git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git push origin "HEAD:refs/heads/${branch}"
          fi

          current_sha="$(gh api "${api_path}?ref=${branch}" --jq .sha 2>/dev/null || true)"
          if [ -n "${current_sha}" ]; then
            gh api "${api_path}?ref=${branch}" --jq .content \
              | tr -d '\n' \
              | base64 --decode \
              > /tmp/current-editorial.json
            if cmp -s /tmp/current-editorial.json "${output}"; then
              echo "Catalog is unchanged; publication skipped."
              exit 0
            fi
          fi

          encoded="$(base64 -w 0 "${output}")"
          message="chore(editorial): refresh catalog from run ${GITHUB_RUN_NUMBER}"

          if [ -n "${current_sha}" ]; then
            gh api --method PUT "${api_path}" \
              -f branch="${branch}" \
              -f message="${message}" \
              -f content="${encoded}" \
              -f sha="${current_sha}" \
              >/dev/null
          else
            gh api --method PUT "${api_path}" \
              -f branch="${branch}" \
              -f message="${message}" \
              -f content="${encoded}" \
              >/dev/null
          fi

          echo "Published catalog to ${branch}/catalog/editorial.json"
