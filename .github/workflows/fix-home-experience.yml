name: Fix Home experience

on:
  push:
    branches:
      - agent/home-levyra-aura

permissions:
  contents: write

concurrency:
  group: fix-home-experience
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-levyra-aura
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_home_experience.py
      - name: Commit source fix and remove patch tooling
        shell: bash
        run: |
          rm -f scripts/fix_home_experience.py .github/workflows/fix-home-experience.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): correct Compose animation import and tile state"
          git push origin HEAD:agent/home-levyra-aura
