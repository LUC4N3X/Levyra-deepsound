name: Refine README download layout

on:
  push:
    branches:
      - agent/pro-readme-badges-docs
    paths:
      - .github/workflows/refine-download-layout.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/pro-readme-badges-docs
          fetch-depth: 0

      - name: Apply refined platform layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')

          old_readme_block = '''<br>

          <a href="https://github.com/LUC4N3X/Levyra-deepsound/releases/latest">
            <img src="docs/assets/levyra-github-download.svg" alt="Download the latest signed Levyra APK from GitHub Releases" width="370" />
          </a>
          <a href="https://github.com/LUC4N3X/Levyra-deepsound/releases?q=Levyra+Desktop&expanded=true">
            <img src="docs/assets/levyra-windows-download.svg" alt="Download Levyra Desktop for Windows from GitHub Releases" width="370" />
          </a>

          <sub>**Android and Windows. No account. No ads.** · Signed APK · MSI / EXE / Portable ZIP</sub>'''

          new_readme_block = '''<br>

          <sub><strong>CHOOSE YOUR PLATFORM</strong></sub>

          <p>
          <a href="https://github.com/LUC4N3X/Levyra-deepsound/releases/latest">
            <img src="docs/assets/levyra-github-download.svg" alt="Download the latest signed Levyra APK from GitHub Releases" width="365" />
          </a>&nbsp;&nbsp;
          <a href="https://github.com/LUC4N3X/Levyra-deepsound/releases?q=Levyra+Desktop&expanded=true">
            <img src="docs/assets/levyra-windows-download.svg" alt="Download Levyra Desktop for Windows from GitHub Releases" width="365" />
          </a>
          </p>'''

          old_readme_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_readme_block.splitlines())
          new_readme_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_readme_block.splitlines())

          if old_readme_block not in readme:
              raise SystemExit('README download block was not found')
          readme_path.write_text(readme.replace(old_readme_block, new_readme_block, 1), encoding='utf-8')

          script_path = Path('scripts/update-readme-badges.mjs')
          script = script_path.read_text(encoding='utf-8')
          start = script.index('const downloadBlock = `')
          end = script.index('\nconst readme = await readFile', start)

          replacement = r'''const downloadBlock = `<sub><strong>CHOOSE YOUR PLATFORM</strong></sub>\n\n<p>\n<a href="https://github.com/LUC4N3X/Levyra-deepsound/releases/latest">\n  <img src="docs/assets/levyra-github-download.svg" alt="Download the latest signed Levyra APK from GitHub Releases" width="365" />\n</a>&nbsp;&nbsp;\n<a href="https://github.com/LUC4N3X/Levyra-deepsound/releases?q=Levyra+Desktop&expanded=true">\n  <img src="docs/assets/levyra-windows-download.svg" alt="Download Levyra Desktop for Windows from GitHub Releases" width="365" />\n</a>\n</p>`
          const downloadPattern = /(?:<sub><strong>CHOOSE YOUR PLATFORM<\/strong><\/sub>\n\n<p>\n)?<a href="https:\/\/github\.com\/LUC4N3X\/Levyra-deepsound\/releases\/latest">\n\s*<img src="docs\/assets\/levyra-github-download\.svg"[^>]*>\n<\/a>(?:&nbsp;&nbsp;)?\n<a href="https:\/\/github\.com\/LUC4N3X\/Levyra-deepsound\/releases\?q=[^\"]*&expanded=true">\n\s*<img src="docs\/assets\/levyra-windows-download\.svg"[^>]*>\n<\/a>(?:\n<\/p>)?(?:\n\n<sub>\*\*Android and Windows\. No account\. No ads\.\*\* · Signed APK · MSI \/ EXE \/ Portable ZIP<\/sub>)?/'''

          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          script_path.write_text(script[:start] + replacement + script[end:], encoding='utf-8')

          Path('.github/workflows/refine-download-layout.yml').unlink()
          PY

      - name: Commit refined layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/update-readme-badges.mjs .github/workflows/refine-download-layout.yml
          git commit -m "docs: refine platform download layout"
          git push origin HEAD:agent/pro-readme-badges-docs
