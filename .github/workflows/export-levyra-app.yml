name: Export LevyraApp source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/final-ui-trigger

permissions:
  contents: write

concurrency:
  group: final-ui-polish
  cancel-in-progress: false

jobs:
  export:
    if: github.event.pull_request.head.ref == 'refactor/home-experience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Apply final UI patch
        shell: bash
        run: |
          echo '' | base64 --decode | gzip -d > /tmp/final-ui.patch
          echo '09ab160905412151d2e0cb1868d426e8cb6fa4c4ccefc2c743862f9ad1a52f7b  /tmp/final-ui.patch' | sha256sum -c -
          git apply --check /tmp/final-ui.patch
          git apply /tmp/final-ui.patch
          rm -f \
            .github/final-ui-trigger \
            .github/workflows/apply-final-home-search-video-polish.yml \
            .github/workflows/export-levyra-app.yml
          git diff --check
      - name: Commit clean changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): refine video previews and Search header"
          git push origin HEAD:refactor/home-experience
