name: Debug Home validation

on:
  push:
    branches:
      - refactor/home-experience
    paths:
      - .github/workflows/debug-home-validation.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Capture validation diagnostics
        shell: bash
        env:
          YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
          LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
          LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
          LEVYRA_KEY_ALIAS: levyra_ci
          LEVYRA_KEY_PASSWORD: levyra_ci_password
        run: |
          set +e
          REPORT=.github/home-validation-report.txt
          : > "$REPORT"
          echo '=== repository matches ===' >> "$REPORT"
          grep -R -n --exclude-dir=.git --exclude='*.class' --exclude='*.jar' \
            -e 'validateHomeContentConfiguration' \
            -e 'tracked Home sections' \
            -e 'Expected 3 tracked' . >> "$REPORT" 2>&1 || true

          echo >> "$REPORT"
          echo '=== Gradle task output ===' >> "$REPORT"
          ./gradlew --no-daemon :app:validateHomeContentConfiguration --stacktrace --info \
            > /tmp/home-validation.log 2>&1
          STATUS=$?
          tail -n 350 /tmp/home-validation.log >> "$REPORT"

          echo >> "$REPORT"
          echo '=== Gradle cache matches ===' >> "$REPORT"
          grep -R -a -n -m 3 \
            -e 'validateHomeContentConfiguration' \
            -e 'Expected 3 tracked Home sections' \
            "$HOME/.gradle/caches" >> "$REPORT" 2>&1 || true
          echo >> "$REPORT"
          echo "exit_status=$STATUS" >> "$REPORT"

          rm .github/workflows/debug-home-validation.yml
      - name: Publish diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture Home validation diagnostics"
          git push origin HEAD:refactor/home-experience
