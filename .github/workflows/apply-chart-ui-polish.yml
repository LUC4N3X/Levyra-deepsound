name: Apply Chart UI Polish

on:
  push:
    branches:
      - feat/editorial-collector
    paths:
      - tools/apply_chart_ui_polish.py
      - .github/workflows/apply-chart-ui-polish.yml

permissions:
  contents: write

concurrency:
  group: apply-chart-ui-polish
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/editorial-collector
          fetch-depth: 0

      - name: Apply fixes
        run: python tools/apply_chart_ui_polish.py

      - name: Verify patch
        run: git diff --check

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile and test Android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest

      - name: Commit verified fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java
          git diff --cached --quiet && { echo 'No changes to commit.'; exit 0; }
          git commit -m 'fix(android): stabilize charts artwork scrolling and preloading'
          git push origin HEAD:feat/editorial-collector

# Triggered after the workflow file existed on the branch.
