name: PR504 Soundtrack Hero Refinement

on:
  push:
    branches:
      - feat/amazon-inspired-explore-cards

permissions:
  contents: write

jobs:
  refine-home-hero:
    if: ${{ github.actor == 'LUC4N3X' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/amazon-inspired-explore-cards
          fetch-depth: 0

      - name: Apply hero patch
        run: python3 .github/pr504_hero_patch.py

      - name: Commit refined hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/pr504-hero-refine.yml .github/pr504_hero_patch.py
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --cached --check
          git commit -m "feat(home): make soundtrack an immersive artist hero"
          git push origin HEAD:feat/amazon-inspired-explore-cards
