name: Temporary Home polish

on:
  push:
    branches:
      - ui/soft-home-ambient-blend
    paths:
      - .github/workflows/temp-home-polish.yml

permissions:
  contents: write

jobs:
  polish-home:
    if: ${{ !contains(github.event.head_commit.message, '[home-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/soft-home-ambient-blend
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Home polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          def block_end(source: str, start: int) -> int:
              brace = source.index('{', start)
              depth = 0
              quote = None
              escape = False
              i = brace
              while i < len(source):
                  ch = source[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ('\"', "'"):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i + 1
                  i += 1
              raise RuntimeError('unterminated Kotlin block')

          def replace_composable(marker: str, replacement: str) -> None:
              global text
              start = text.index(marker)
              end = block_end(text, start)
              text = text[:start] + replacement.rstrip() + '\n\n' + text[end:].lstrip('\n')

          old_visible = '''    val visibleEditorialCollections = remember(editorialCollections, spotlightCandidate?.track?.id) {
              editorialCollections.mapNotNull { collection ->
                  val filteredTracks = collection.tracks.filterNot { it.id == spotlightCandidate?.track?.id }
                  collection.copy(tracks = filteredTracks).takeIf { filteredTracks.size >= 4 }
              }
          }'''
          new_visible = '''    val visibleEditorialCollections = remember(editorialCollections, spotlightCandidate?.track?.id) {
              editorialCollections.map { collection ->
                  val filteredTracks = collection.tracks.filterNot { it.id == spotlightCandidate?.track?.id }
                  if (filteredTracks.size >= 4) collection.copy(tracks = filteredTracks) else collection
              }
          }'''
          replace_once(old_visible, new_visible, 'collection visibility')

          collection_marker = '            if (showDeferredHomeSections && visibleEditorialCollections.isNotEmpty()) {'
          collection_start = text.index(collection_marker)
          collection_end = block_end(text, collection_start)
          collection_block = text[collection_start:collection_end]
          text = text[:collection_start] + text[collection_end:]
          video_anchor = '            if (showDeferredHomeSections && homeVideoTracks.isNotEmpty()) {'
          video_index = text.index(video_anchor)
          text = text[:video_index] + collection_block + '\n\n' + text[video_index:]

          text, width_count = re.subn(
              r'private const val HOME_COLLECTION_COLUMN_WIDTH = \\d+',
              'private const val HOME_COLLECTION_COLUMN_WIDTH = 304',
              text,
              count=1
          )
          text, height_count = re.subn(
              r'private const val HOME_COLLECTION_CARD_HEIGHT = \\d+',
              'private const val HOME_COLLECTION_CARD_HEIGHT = 126',
              text,
              count=1
          )
          if width_count != 1 or height_count != 1:
              raise RuntimeError(f'collection constants: width={width_count}, height={height_count}')

          replace_composable(
              '@Composable\nprivate fun HomeEditorialCollectionCard(',
              r'''@Composable
          private fun HomeEditorialCollectionCard(
              collection: HomeEditorialCollection,
              strings: LevyraStrings,
              visualIndex: Int,
              animationsEnabled: Boolean,
              onClick: () -> Unit
          ) {
              val title = homeCollectionTitle(collection, strings)
              val palette = homeCollectionVisualPalette(collection.kind)
              val artwork = collection.tracks
                  .asSequence()
                  .map(::trackArtworkUrl)
                  .filter(String::isNotBlank)
                  .take(2)
                  .toList()
              val interaction = remember { MutableInteractionSource() }
              val pressed by interaction.collectIsPressedAsState()
              val scale by animateFloatAsState(
                  targetValue = if (pressed) 0.982f else 1f,
                  animationSpec = if (animationsEnabled) {
                      spring(dampingRatio = Spring.DampingRatioNoBouncy, stiffness = Spring.StiffnessHigh)
                  } else {
                      snap()
                  },
                  label = "homeCollectionCardScale"
              )
              val cardWidth = if (visualIndex == 0) 320.dp else HOME_COLLECTION_COLUMN_WIDTH.dp
              val artworkWidth = if (visualIndex == 0) 140.dp else 128.dp
              val shape = RoundedCornerShape(20.dp)

              Box(
                  modifier = Modifier
                      .width(cardWidth)
                      .height(HOME_COLLECTION_CARD_HEIGHT.dp)
                      .graphicsLayer {
                          scaleX = scale
                          scaleY = scale
                      }
                      .clip(shape)
                      .background(
                          Brush.linearGradient(
                              listOf(
                                  palette.first.copy(alpha = if (LevyraIsLight) 0.9f else 0.96f),
                                  palette.second.copy(alpha = if (LevyraIsLight) 0.78f else 0.88f),
                                  LevyraSurface.copy(alpha = if (LevyraIsLight) 0.88f else 0.68f)
                              )
                          )
                      )
                      .border(1.dp, Color.White.copy(alpha = if (LevyraIsLight) 0.18f else 0.12f), shape)
                      .clickable(
                          interactionSource = interaction,
                          indication = LocalIndication.current,
                          onClick = onClick
                      )
              ) {
                  if (artwork.isNotEmpty()) {
                      AsyncImage(
                          model = artwork.first(),
                          contentDescription = null,
                          modifier = Modifier
                              .align(Alignment.CenterEnd)
                              .fillMaxHeight()
                              .width(artworkWidth),
                          contentScale = ContentScale.Crop
                      )
                      if (artwork.size > 1) {
                          AsyncImage(
                              model = artwork[1],
                              contentDescription = null,
                              modifier = Modifier
                                  .align(Alignment.BottomEnd)
                                  .padding(end = if (visualIndex == 0) 94.dp else 84.dp, bottom = 8.dp)
                                  .size(54.dp)
                                  .clip(RoundedCornerShape(13.dp))
                                  .border(1.dp, Color.White.copy(alpha = 0.24f), RoundedCornerShape(13.dp)),
                              contentScale = ContentScale.Crop
                          )
                      }
                  }
                  Box(
                      modifier = Modifier
                          .matchParentSize()
                          .background(
                              Brush.horizontalGradient(
                                  colorStops = arrayOf(
                                      0f to Color.Black.copy(alpha = if (LevyraIsLight) 0.08f else 0.36f),
                                      0.58f to Color.Black.copy(alpha = if (LevyraIsLight) 0.03f else 0.16f),
                                      1f to Color.Transparent
                                  )
                              )
                          )
                  )
                  Column(
                      modifier = Modifier
                          .fillMaxHeight()
                          .width(if (visualIndex == 0) 214.dp else 204.dp)
                          .padding(horizontal = 16.dp, vertical = 14.dp),
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      HomeEditorialLabel(
                          text = homeCollectionKicker(collection, strings),
                          tint = Color.White.copy(alpha = 0.88f)
                      )
                      Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                          Text(
                              text = title,
                              color = Color.White,
                              fontWeight = FontWeight.Black,
                              fontSize = if (visualIndex == 0) 20.sp else 19.sp,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis,
                              lineHeight = 21.sp
                          )
                          Text(
                              text = collection.tracks
                                  .take(2)
                                  .joinToString(" · ") { track -> track.artist }
                                  .ifBlank { strings.collectionsSubtitle },
                              color = Color.White.copy(alpha = 0.74f),
                              fontSize = 11.sp,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                  }
              }
          }'''
          )

          replace_composable(
              '@Composable\nprivate fun HomeMusicVideoShelf(',
              r'''@Composable
          private fun HomeMusicVideoShelf(
              title: String,
              tracks: List<Track>,
              currentId: String?,
              isPlaying: Boolean,
              isResolving: Boolean,
              onPlay: (Track) -> Unit,
              onToggleCurrent: () -> Unit
          ) {
              if (tracks.isEmpty()) return
              Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  HomeSectionInset {
                      HomeSectionHeader(title)
                  }
                  LazyRow(
                      horizontalArrangement = Arrangement.spacedBy(12.dp),
                      contentPadding = PaddingValues(
                          start = HomeHorizontalInset,
                          end = HomeHorizontalShelfEndPadding
                      )
                  ) {
                      items(
                          items = tracks.take(10),
                          key = { "home-video-${it.id}" },
                          contentType = { "home-video-card" }
                      ) { track ->
                          val isCurrent = track.id == currentId
                          val artwork = trackArtworkUrl(track)
                          val shape = RoundedCornerShape(16.dp)
                          Column(
                              modifier = Modifier.width(256.dp),
                              verticalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              Box(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .aspectRatio(16f / 9f)
                                      .clip(shape)
                                      .background(LevyraSurface)
                                      .border(
                                          1.dp,
                                          if (isCurrent) LevyraOrange.copy(alpha = 0.66f)
                                          else LevyraGlassStroke.copy(alpha = 0.16f),
                                          shape
                                      )
                                      .clickable {
                                          if (isCurrent && !isResolving) onToggleCurrent() else onPlay(track)
                                      }
                              ) {
                                  AsyncImage(
                                      model = artwork,
                                      contentDescription = track.title,
                                      modifier = Modifier.fillMaxSize(),
                                      contentScale = ContentScale.Crop
                                  )
                                  Box(
                                      modifier = Modifier
                                          .matchParentSize()
                                          .background(
                                              Brush.verticalGradient(
                                                  colorStops = arrayOf(
                                                      0f to Color.Transparent,
                                                      0.64f to Color.Transparent,
                                                      1f to Color.Black.copy(alpha = 0.48f)
                                                  )
                                              )
                                          )
                                  )
                                  Box(
                                      modifier = Modifier
                                          .align(Alignment.BottomEnd)
                                          .padding(9.dp)
                                          .size(36.dp)
                                          .clip(CircleShape)
                                          .background(Color.Black.copy(alpha = 0.74f)),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      if (isCurrent && isResolving) {
                                          CircularProgressIndicator(
                                              modifier = Modifier.size(18.dp),
                                              color = Color.White,
                                              strokeWidth = 2.dp
                                          )
                                      } else {
                                          Icon(
                                              if (isCurrent && isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                                              contentDescription = null,
                                              tint = Color.White,
                                              modifier = Modifier.size(21.dp)
                                          )
                                      }
                                  }
                              }
                              Text(
                                  text = track.title,
                                  color = LevyraText,
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 15.sp,
                                  lineHeight = 17.sp,
                                  maxLines = 2,
                                  overflow = TextOverflow.Ellipsis
                              )
                              Text(
                                  text = track.artist,
                                  color = LevyraMuted,
                                  fontSize = 12.sp,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                      }
                  }
              }
          }'''
          )

          replace_composable(
              '@Composable\nprivate fun ResonanceShelf(',
              r'''@Composable
          private fun ResonanceShelf(
              tracks: List<Track>,
              currentId: String?,
              isPlaying: Boolean,
              isResolving: Boolean,
              onPlay: (Track) -> Unit,
              onPlayAll: () -> Unit
          ) {
              if (tracks.isEmpty()) return
              val columns = remember(tracks) { tracks.take(8).chunked(2) }
              Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  HomeSectionInset {
                      SectionHeaderAction(LevyraLocalStrings.current.voicesTitle, onPlayAll = onPlayAll)
                  }
                  LazyRow(
                      horizontalArrangement = Arrangement.spacedBy(12.dp),
                      contentPadding = PaddingValues(
                          start = HomeHorizontalInset,
                          end = HomeHorizontalShelfEndPadding
                      )
                  ) {
                      itemsIndexed(
                          items = columns,
                          key = { index, chunk -> "res-column-$index-${chunk.joinToString("-") { it.id }}" },
                          contentType = { _, _ -> "home-resonance-column" }
                      ) { _, chunk ->
                          Column(
                              modifier = Modifier.width(312.dp),
                              verticalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              chunk.forEach { track ->
                                  val isCurrent = track.id == currentId
                                  val shape = RoundedCornerShape(12.dp)
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .height(68.dp)
                                          .clip(shape)
                                          .background(
                                              LevyraSurface.copy(
                                                  alpha = if (LevyraIsLight) 0.82f else if (isCurrent) 0.9f else 0.68f
                                              )
                                          )
                                          .border(
                                              1.dp,
                                              if (isCurrent) LevyraOrange.copy(alpha = 0.62f)
                                              else LevyraGlassStroke.copy(alpha = 0.16f),
                                              shape
                                          )
                                          .clickable { onPlay(track) },
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      AsyncImage(
                                          model = trackArtworkUrl(track),
                                          contentDescription = track.title,
                                          modifier = Modifier.size(68.dp),
                                          contentScale = ContentScale.Crop
                                      )
                                      Column(
                                          modifier = Modifier
                                              .weight(1f)
                                              .padding(horizontal = 11.dp),
                                          verticalArrangement = Arrangement.spacedBy(3.dp)
                                      ) {
                                          Text(
                                              text = track.title,
                                              color = LevyraText,
                                              fontWeight = FontWeight.Bold,
                                              fontSize = 14.sp,
                                              maxLines = 1,
                                              overflow = TextOverflow.Ellipsis
                                          )
                                          Text(
                                              text = track.artist,
                                              color = LevyraMuted,
                                              fontSize = 12.sp,
                                              maxLines = 1,
                                              overflow = TextOverflow.Ellipsis
                                          )
                                      }
                                      Box(
                                          modifier = Modifier
                                              .padding(end = 8.dp)
                                              .size(34.dp)
                                              .clip(CircleShape)
                                              .background(
                                                  if (isCurrent) LevyraPlayerControl.copy(alpha = 0.92f)
                                                  else Color.Black.copy(alpha = if (LevyraIsLight) 0.08f else 0.24f)
                                              ),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          if (isCurrent && isResolving) {
                                              CircularProgressIndicator(
                                                  modifier = Modifier.size(18.dp),
                                                  strokeWidth = 2.dp,
                                                  color = LevyraOnPlayerSurface
                                              )
                                          } else {
                                              Icon(
                                                  if (isCurrent && isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                                                  contentDescription = null,
                                                  tint = if (isCurrent) LevyraOnPlayerSurface else LevyraText,
                                                  modifier = Modifier.size(20.dp)
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }'''
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile Android debug Kotlin
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Commit Home polish
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt; then
            echo "No Home changes produced"
            exit 1
          fi
          git config user.name "LUC4N3X"
          git config user.email "luca.testing96@gmail.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git commit -m "Polish Home collections, videos and resonance [home-polish]"
          git push origin HEAD:ui/soft-home-ambient-blend
