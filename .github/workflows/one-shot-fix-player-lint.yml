name: One-shot player lint fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/player-experience-motion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/player-experience-motion
          fetch-depth: 0

      - name: Apply targeted lint fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraExperienceHost.kt')
          source = path.read_text(encoding='utf-8')
          marker = 'label = "mini-track-title"'
          if source.count(marker) != 1:
              raise SystemExit(f'Expected one mini-player AnimatedContent marker, found {source.count(marker)}')

          marker_index = source.index(marker)
          block_start = source.rfind('AnimatedContent(', 0, marker_index)
          block_end_marker = '\n            MiniControlButton('
          block_end = source.find(block_end_marker, marker_index)
          if block_start < 0 or block_end < 0:
              raise SystemExit('Unable to isolate mini-player AnimatedContent block')

          block = source[block_start:block_end]
          replacements = {
              'targetState = track.id,': 'targetState = track,',
              ') {\n                    Column': ') { animatedTrack ->\n                    Column',
              'text = track.title,': 'text = animatedTrack.title,',
              'text = track.artist,': 'text = animatedTrack.artist,',
          }
          for old, new in replacements.items():
              if block.count(old) != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r} in mini-player block, found {block.count(old)}')
              block = block.replace(old, new, 1)

          source = source[:block_start] + block + source[block_end:]
          path.write_text(source, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/one-shot-fix-player-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraExperienceHost.kt .github/workflows/one-shot-fix-player-lint.yml
          git commit -m "fix(ui): use AnimatedContent target state"
          git push origin HEAD:feat/player-experience-motion
