name: Finalize Personal Orbit Count

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.ref == 'feat/central-ytm-editorial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Keep twenty unique Orbit entries visible
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")
          replacement = '''    val visiblePersonalTracks = remember(personalTracks) {
              LevyraPersonalOrbit.distinctRecordings(personalTracks)
                  .take(LevyraPersonalOrbit.DISPLAY_LIMIT)
          }
          val visibleEditorialCollections'''
          if "val visiblePersonalTracks = remember(personalTracks)" not in text:
              pattern = re.compile(
                  r"    val visiblePersonalTracks = remember\([^\n]*\) \{.*?\n    \}\n    val visibleEditorialCollections",
                  re.DOTALL,
              )
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f"personal orbit visibility block count: {count}")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Verify and compile
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'val visiblePersonalTracks = remember(personalTracks)' app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          grep -q 'const val DISPLAY_LIMIT = 20' app/src/main/java/com/luc4n3x/levyra/domain/LevyraPersonalOrbit.kt
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            --tests com.luc4n3x.levyra.domain.LevyraPersonalOrbitIdentityTest \
            :app:lintDebug \
            :app:compileDebugKotlin

      - name: Commit verified UI fix
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git commit -m "fix(home): keep twenty Orbit recordings visible"
          git push origin "HEAD:$HEAD_REF"
