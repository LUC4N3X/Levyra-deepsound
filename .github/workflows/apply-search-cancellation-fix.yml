name: Apply search cancellation fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/reliable-artist-search' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply cancellation fix
        run: python3 .github/scripts/apply_search_cancellation_fix.py

      - name: Compile Android app
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit fix and remove temporary files
        run: |
          rm .github/scripts/apply_search_cancellation_fix.py
          rm .github/workflows/apply-search-cancellation-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt \
                  .github/scripts/apply_search_cancellation_fix.py \
                  .github/workflows/apply-search-cancellation-fix.yml
          git commit -m "fix(search): preserve coroutine cancellation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
