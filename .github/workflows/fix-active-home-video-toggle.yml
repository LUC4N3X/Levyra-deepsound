name: Fix active Home video toggle

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-active-home-video-toggle.yml

permissions:
  contents: write

concurrency:
  group: fix-active-home-video-toggle
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'refactor/home-experience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Toggle current video instead of restarting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')

          replacements = (
              (
                  'video shelf call',
                  '''                        isResolving = state.isResolving,
                        onPlay = { track -> viewModel.playFrom(homeVideoTracks, track) }
''',
                  '''                        isResolving = state.isResolving,
                        onPlay = { track -> viewModel.playFrom(homeVideoTracks, track) },
                        onToggleCurrent = viewModel::togglePlay
'''
              ),
              (
                  'video shelf signature',
                  '''    isPlaying: Boolean,
    isResolving: Boolean,
    onPlay: (Track) -> Unit
) {
''',
                  '''    isPlaying: Boolean,
    isResolving: Boolean,
    onPlay: (Track) -> Unit,
    onToggleCurrent: () -> Unit
) {
'''
              ),
              (
                  'video card click',
                  '''                Column(
                    modifier = Modifier.width(236.dp).pressable(onClick = { onPlay(track) }),
                    verticalArrangement = Arrangement.spacedBy(7.dp)
                ) {
''',
                  '''                Column(
                    modifier = Modifier
                        .width(236.dp)
                        .pressable(
                            onClick = {
                                if (active) onToggleCurrent() else onPlay(track)
                            }
                        ),
                    verticalArrangement = Arrangement.spacedBy(7.dp)
                ) {
'''
              ),
          )

          for label, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-active-home-video-toggle.yml
          git diff --check
      - name: Commit clean fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): toggle active video playback"
          git push origin HEAD:refactor/home-experience
