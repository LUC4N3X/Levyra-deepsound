name: CodeRabbit 646 Fixes

on:
  push:
    branches:
      - codex/persistent-queue-spaces-local-library

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/persistent-queue-spaces-local-library
          fetch-depth: 0

      - name: Apply reviewed fixes
        run: python3 .github/coderabbit_646_fixes.py

      - name: Check diff
        run: git diff --check

      - name: Run targeted regression tests
        run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest
          --tests "com.luc4n3x.levyra.player.queue.QueueSpaceEngineTest"
          --tests "com.luc4n3x.levyra.data.locallibrary.LocalLibraryReconcilerTest"
          --tests "com.luc4n3x.levyra.ui.i18n.LevyraNewFeatureLocalizationTest"

      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/coderabbit_646_fixes.py .github/workflows/coderabbit-646-fixes.yml
          git add app/src/main/java/com/luc4n3x/levyra/data/locallibrary/LocalLibraryRepository.kt
          git add app/src/main/java/com/luc4n3x/levyra/player/AndroidAutoLibrary.kt
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          git add app/src/main/java/com/luc4n3x/levyra/ui/i18n/LevyraStrings.kt
          git add app/src/main/java/com/luc4n3x/levyra/ui/i18n/LevyraLocalLibraryStrings.kt
          git add app/src/test/java/com/luc4n3x/levyra/ui/i18n/LevyraNewFeatureLocalizationTest.kt
          git commit -m "fix: address verified CodeRabbit findings"
          git push origin HEAD:codex/persistent-queue-spaces-local-library
