name: PR504 Kotlin Hero Compile Fix

on:
  push:
    branches:
      - feat/amazon-inspired-explore-cards

permissions:
  contents: write

jobs:
  fix-kotlin:
    if: ${{ github.actor == 'LUC4N3X' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/amazon-inspired-explore-cards
          fetch-depth: 0

      - name: Normalize soundtrack artist portrait models
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')

          pool_start = text.index('    val soundtrackArtistPool = remember(')
          pool_end = text.index('    val spotlightCandidate = remember(', pool_start)
          new_pool = '\n'.join([
              '    val soundtrackArtistPool = remember(',
              '        state.followedArtists,',
              '        state.homeArtists,',
              '        state.similarArtists',
              '    ) {',
              '        buildList<Triple<String, String, String>> {',
              '            state.followedArtists.forEach { artist ->',
              '                if (artist.thumbnailUrl.isNotBlank()) {',
              '                    add(Triple(artist.name, artist.browseId, artist.thumbnailUrl))',
              '                }',
              '            }',
              '            (state.homeArtists + state.similarArtists).forEach { artist ->',
              '                if (artist.thumbnailUrl.isNotBlank()) {',
              '                    add(Triple(artist.name, artist.browseId, artist.thumbnailUrl))',
              '                }',
              '            }',
              '        }.distinctBy { artist ->',
              '            artist.second.ifBlank { artist.first.trim().lowercase(Locale.ROOT) }',
              '        }',
              '    }',
              ''
          ])
          text = text[:pool_start] + new_pool + text[pool_end:]

          candidate_start = text.index('    val spotlightCandidate = remember(', pool_start)
          candidate_end = text.index('    val spotlightTracks = remember(', candidate_start)
          candidate = text[candidate_start:candidate_end]
          candidate = candidate.replace(
              'homeSoundtrackMatchesArtist(candidate.track, artist.name, artist.browseId)',
              'homeSoundtrackMatchesArtist(candidate.track, artist.first, artist.second)'
          )
          if 'artist.name' in candidate or 'artist.browseId' in candidate:
              raise SystemExit('mixed artist model access remains in spotlight candidate block')
          text = text[:candidate_start] + candidate + text[candidate_end:]

          hero_start = text.index('            spotlightCandidate?.let { candidate ->')
          hero_end = text.index('\n            if (\n                showDeferredHomeSections && state.interfaceSettings.showNewReleases', hero_start)
          hero = text[hero_start:hero_end]
          hero = hero.replace('homeSoundtrackMatchesArtist(heroTrack, artist.name, artist.browseId)', 'homeSoundtrackMatchesArtist(heroTrack, artist.first, artist.second)')
          hero = hero.replace('homeSoundtrackMatchesArtist(track, artist.name, artist.browseId)', 'homeSoundtrackMatchesArtist(track, artist.first, artist.second)')
          hero = hero.replace('heroPortraitArtist?.name', 'heroPortraitArtist?.first')
          hero = hero.replace('heroPortraitArtist?.thumbnailUrl', 'heroPortraitArtist?.third')
          hero = hero.replace('homeSoundtrackPrimaryArtist(artist.name)', 'homeSoundtrackPrimaryArtist(artist.first)')
          hero = hero.replace('}?.thumbnailUrl', '}?.third')
          hero = hero.replace('val soundtrackArtists = buildList {', 'val soundtrackArtists = buildList<String> {', 1)
          hero = hero.replace('?.let(::add)', '?.let { artist -> add(artist) }', 1)
          hero = hero.replace('if (none { it.equals(artist, ignoreCase = true) }) add(artist)', 'if (none { existing -> existing.equals(artist, ignoreCase = true) }) {\n                            add(artist)\n                        }', 1)
          forbidden = ('artist.name', 'artist.browseId', 'heroPortraitArtist?.name', 'heroPortraitArtist?.thumbnailUrl', '?.let(::add)', 'val soundtrackArtists = buildList {')
          if any(token in hero for token in forbidden):
              raise SystemExit('soundtrack hero normalization incomplete')
          text = text[:hero_start] + hero + text[hero_end:]

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile debug Kotlin
        shell: bash
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr504-kotlin-fix.yml
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --cached --check
          git commit -m "fix(home): normalize soundtrack artist portrait sources"
          git push origin HEAD:feat/amazon-inspired-explore-cards
