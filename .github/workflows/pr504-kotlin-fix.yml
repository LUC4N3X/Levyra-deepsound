name: PR504 Kotlin Hero Compile Fix

on:
  push:
    branches:
      - feat/amazon-inspired-explore-cards

permissions:
  contents: write

jobs:
  fix-kotlin:
    if: ${{ github.actor == 'LUC4N3X' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/amazon-inspired-explore-cards
          fetch-depth: 0

      - name: Patch soundtrack artist list type inference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')
          home_start = text.index('spotlightCandidate?.let { candidate ->')
          block_start = text.index('val soundtrackArtists = buildList {', home_start)
          block_end = text.index('val heroArtistArtworkUrl', block_start)
          block = text[block_start:block_end]
          block = block.replace('val soundtrackArtists = buildList {', 'val soundtrackArtists = buildList<String> {', 1)
          block = block.replace('?.let(::add)', '?.let { artist -> add(artist) }', 1)
          block = block.replace(
              'if (none { it.equals(artist, ignoreCase = true) }) add(artist)',
              'if (none { existing -> existing.equals(artist, ignoreCase = true) }) {\n                            add(artist)\n                        }',
              1
          )
          if 'buildList<String>' not in block or '?.let(::add)' in block:
              raise SystemExit('soundtrack artist block was not patched as expected')
          text = text[:block_start] + block + text[block_end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile debug Kotlin
        shell: bash
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr504-kotlin-fix.yml
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --cached --check
          git commit -m "fix(home): make soundtrack artist list type-safe"
          git push origin HEAD:feat/amazon-inspired-explore-cards
