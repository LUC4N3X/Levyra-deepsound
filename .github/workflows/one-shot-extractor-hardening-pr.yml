name: One-shot extractor hardening PR runner

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  run-focused-port:
    if: github.head_ref == 'agent/extractor-security-aa-potoken-sabr' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPORT_FILE: /tmp/levyra-extractor-hardening-report.txt
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/extractor-security-aa-potoken-sabr
          fetch-depth: 0

      - name: Extract focused patch script
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-extractor-hardening.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == '- name: Apply focused extractor changes')
          run_line = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name:'))
          block = lines[run_line + 1:end]
          yaml_indent = '          '
          script = '\n'.join(
              line[len(yaml_indent):] if line.startswith(yaml_indent) else line
              for line in block
          ) + '\n'

          script = script.replace(
              'import subprocess\nimport sys\n',
              'import shutil\nimport subprocess\nimport sys\n',
              1,
          )
          sabr_start = script.index('# SABR is kept as a true three-way merge')
          sabr_end = script.index('# NewPipe: retain Levyra client support', sabr_start)
          coherent_sabr_sync = '\n'.join((
              '# SABR is synchronized as one coherent upstream subsystem. Levyra-specific',
              '# client aggregation lives outside this package and is therefore preserved.',
              'sabr_prefixes = (',
              '    "extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/",',
              '    "extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/sabr/",',
              ')',
              'for prefix in sabr_prefixes:',
              '    destination = root / prefix',
              '    if destination.exists():',
              '        shutil.rmtree(destination)',
              '    upstream_paths = subprocess.check_output(',
              '        ["git", "-C", str(upstream), "ls-tree", "-r", "--name-only", tip, "--", prefix],',
              '        text=True,',
              '    ).splitlines()',
              '    if not upstream_paths:',
              '        raise SystemExit(f"No upstream SABR files found under {prefix}")',
              '    for relative in upstream_paths:',
              '        target = root / relative',
              '        target.parent.mkdir(parents=True, exist_ok=True)',
              '        target.write_text(upstream_text(tip, relative), encoding="utf-8")',
              '        print(f"SYNCED {relative}")',
              '',
              '',
          ))
          script = script[:sabr_start] + coherent_sabr_sync + script[sabr_end:]
          Path('/tmp/apply-focused-extractor.sh').write_text(script, encoding='utf-8')

      - name: Apply focused extractor changes
        shell: bash
        run: bash /tmp/apply-focused-extractor.sh

      - name: Test vendored extractor
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test 2>&1 | tee -a "$REPORT_FILE"

      - name: Compile Android release sources
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:compileReleaseKotlin 2>&1 | tee -a "$REPORT_FILE"

      - name: Commit verified extractor changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-shot-extractor-hardening.yml \
            .github/workflows/one-shot-extractor-hardening-pr.yml \
            .github/extractor-hardening-trigger \
            .github/extractor-hardening-report.txt \
            .github/extractor-hardening-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/LevyraExtractor .github
          git diff --cached --check
          git commit -m "Harden vendored extractor PoToken and SABR recovery"
          git push origin HEAD:agent/extractor-security-aa-potoken-sabr
