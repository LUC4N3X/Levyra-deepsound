name: Apply PR 309 startup performance patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'perf/cold-start-thermal-smoothness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: perf/cold-start-thermal-smoothness
          fetch-depth: 0

      - name: Apply startup scheduling refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    private val homeInteractionGate = HomeInteractionGate()
    private val homeFeedRequestGeneration = AtomicLong(0L)
''',
              '''    private val homeInteractionGate = HomeInteractionGate()
    private val startupWorkGate = Semaphore(1)
    private val startupStartedAtMs = System.nanoTime() / 1_000_000L
    private val homeFeedRequestGeneration = AtomicLong(0L)
''',
              'startup gate fields'
          )

          replace_once(
              '''    private suspend fun awaitHomeUiIdle(plan: HomeStartupWorkPlan = homeStartupWorkPlan()) {
        homeInteractionGate.awaitIdle(plan.idleWindowMs)
    }

    val state: StateFlow<LevyraUiState> = _state.asStateFlow()
''',
              '''    private suspend fun awaitHomeUiIdle(plan: HomeStartupWorkPlan = homeStartupWorkPlan()) {
        homeInteractionGate.awaitIdle(plan.idleWindowMs)
    }

    private suspend fun awaitColdStartWindow(
        plan: HomeStartupWorkPlan,
        requestedDelayMs: Long
    ) {
        while (currentCoroutineContext().isActive) {
            val elapsedMs = (System.nanoTime() / 1_000_000L - startupStartedAtMs).coerceAtLeast(0L)
            val targetDelayMs = if (player.isPlaying) {
                maxOf(requestedDelayMs, plan.activePlaybackProtectionMs)
            } else {
                requestedDelayMs
            }
            val remainingMs = targetDelayMs - elapsedMs
            if (remainingMs <= 0L) break
            delay(remainingMs.coerceIn(80L, 400L))
        }
        awaitHomeUiIdle(plan)
    }

    private suspend fun runColdStartWork(
        plan: HomeStartupWorkPlan,
        requestedDelayMs: Long,
        block: suspend () -> Unit
    ) {
        awaitColdStartWindow(plan, requestedDelayMs)
        startupWorkGate.withPermit { block() }
    }

    val state: StateFlow<LevyraUiState> = _state.asStateFlow()
''',
              'cold-start helpers'
          )

          replace_once(
              '''        applyFollowedArtists(followedArtistsStore.load())
        startTicker()
''',
              '''        viewModelScope.launch(Dispatchers.IO) {
            applyFollowedArtists(followedArtistsStore.load())
        }
        startTicker()
''',
              'followed artist load'
          )

          replace_once(
              '''        refreshListeningPulse(force = true)
        scheduleColdStartRefresh(initialTracks)
''',
              '''        viewModelScope.launch {
            delay(2_500L)
            refreshListeningPulse(force = true)
        }
        scheduleColdStartRefresh(initialTracks)
''',
              'listening pulse delay'
          )

          schedule_pattern = re.compile(
              r'''    private fun scheduleColdStartRefresh\(initialTracks: List<Track>\) \{.*?\n    \}\n\n    private fun warmPersistentOrbit''',
              re.S
          )
          schedule_replacement = '''    private fun scheduleColdStartRefresh(initialTracks: List<Track>) {
        val appContext = getApplication<Application>().applicationContext
        val orbitSeed = _state.value.personalOrbitTracks.take(LevyraPersonalOrbit.DISPLAY_LIMIT)
        val playbackPlan = adaptivePlaybackPolicy.current(videoMode = false)
        val playbackWarmPlan = StartupPlaybackWarmPolicy.create(
            lowRam = playbackPlan.lowRam,
            powerConstrained = playbackPlan.powerConstrained,
            preferredConcurrency = playbackPlan.concurrency
        )
        val startupPlan = homeStartupWorkPlan()

        viewModelScope.launch(Dispatchers.IO) {
            runColdStartWork(startupPlan, playbackWarmPlan.delayMs) {
                resolver.warmNetwork()
                if (!player.isPlaying && !playbackPlan.lowRam && !playbackPlan.powerConstrained) {
                    resolver.warmPlaybackSecurity()
                }
                val hot = (orbitSeed.take(1) + initialTracks.take(playbackWarmPlan.trackCount))
                    .filter { it.id.isNotBlank() || it.videoUrl.isNotBlank() || it.title.isNotBlank() }
                    .distinctBy { playbackIdentity(it) }
                    .take(playbackWarmPlan.trackCount)
                warmTracks(
                    tracks = hot,
                    concurrency = playbackWarmPlan.concurrency,
                    delayStepMs = playbackPlan.staggerMs,
                    prime = true,
                    respectHomeScroll = true
                )
            }
        }

        if (orbitSeed.isNotEmpty()) {
            viewModelScope.launch(Dispatchers.IO) {
                runColdStartWork(startupPlan, startupPlan.secondaryStartDelayMs) {
                    LevyraArtworkCache.preloadPriority(
                        appContext,
                        orbitSeed,
                        startupPlan.priorityArtworkCount
                    )
                    refreshMissingOfficialOrbitArtwork(orbitSeed, deferUntilHomeIdle = false)
                    orbitArtworkJob?.join()
                }
            }
        }

        viewModelScope.launch {
            runColdStartWork(startupPlan, startupPlan.homeFeedStartDelayMs) {
                loadHomeFeed(deferUntilHomeIdle = true)
                homeFeedJob?.join()
                refreshHomeResonanceIfStale()
                homeResonanceJob?.join()
            }
        }

        viewModelScope.launch {
            runColdStartWork(startupPlan, startupPlan.chartRefreshStartDelayMs) {
                loadCharts(deferUntilHomeIdle = false)
                chartsJob?.join()
            }
        }

        viewModelScope.launch {
            runColdStartWork(startupPlan, startupPlan.chartPrefetchStartDelayMs) {
                prefetchChartRegions(_state.value.selectedChartId)
                chartPrefetchJob?.join()
            }
        }

        viewModelScope.launch {
            runColdStartWork(startupPlan, startupPlan.chartMemoryWarmStartDelayMs) {
                warmChartRegionMemoryCache()
                chartMemoryWarmJob?.join()
            }
        }

        viewModelScope.launch {
            runColdStartWork(startupPlan, startupPlan.maintenanceStartDelayMs) {
                checkForUpdates(silent = true)
                updateJob?.join()
                loadReleaseRadar(deferUntilHomeIdle = false)
                radarJob?.join()
            }
        }
    }

    private fun warmPersistentOrbit'''
          text, count = schedule_pattern.subn(schedule_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'scheduleColdStartRefresh: expected 1 match, found {count}')

          replace_once(
              '''    private fun startTicker() {
        viewModelScope.launch {
            var lastBackgroundUiUpdateMs = 0L
''',
              '''    private fun startTicker() {
        viewModelScope.launch {
            delay(600L)
            var lastBackgroundUiUpdateMs = 0L
''',
              'ticker initial delay'
          )

          replace_once(
              '''                    nowElapsed - lastBackgroundUiUpdateMs >= 1_000L ||
''',
              '''                    nowElapsed - lastBackgroundUiUpdateMs >= 2_000L ||
''',
              'background publish interval'
          )

          replace_once(
              '''                delay(if (snapshot.showLyrics) 50L else 500L)
''',
              '''                delay(
                    when {
                        snapshot.showLyrics -> 50L
                        snapshot.selectedTab == LevyraTab.Player -> 250L
                        else -> 1_000L
                    }
                )
''',
              'ticker cadence'
          )

          replace_once(
              '''    private fun loadPlaylists() {
        viewModelScope.launch {
            val lists = playlistStore.loadAll()
''',
              '''    private fun loadPlaylists() {
        viewModelScope.launch(Dispatchers.IO) {
            val lists = playlistStore.loadAll()
''',
              'playlist loading dispatcher'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'startupWorkGate = Semaphore(1)' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q 'activePlaybackProtectionMs' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q 'chartPrefetchStartDelayMs' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q 'snapshot.selectedTab == LevyraTab.Player -> 250L' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt

      - name: Commit source patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-perf-pr309.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt .github/workflows/agent-perf-pr309.yml
          git commit -m 'perf(startup): serialize cold-start work around active playback'
          git push origin HEAD:perf/cold-start-thermal-smoothness
