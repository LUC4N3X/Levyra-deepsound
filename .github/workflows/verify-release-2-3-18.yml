name: Verify Release 2.3.18

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-release-2-3-18.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: verify-release-2-3-18
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      BUMP_SHA: 1e11fe9fb1e9143488cc0e2050cd1b1d11e37a12
      VERSION: 2.3.18
      RELEASE_TAG: v2.3.18
      FDROID_TAG: fdroid-2.3.18-r6
      APK_NAME: LEVYRA-2.3.18.apk
      APK_CHECKSUM: LEVYRA-2.3.18.apk.sha256
      FDROID_APK_NAME: LEVYRA-2.3.18-fdroid.apk
      FDROID_CHECKSUM: LEVYRA-2.3.18-fdroid.apk.sha256
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for release workflow and verify assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status_file="release-2.3.18-status.txt"
          : > "${status_file}"
          echo "version=${VERSION}" >> "${status_file}"
          echo "sourceCommit=${BUMP_SHA}" >> "${status_file}"

          run_id=""
          for attempt in $(seq 1 180); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-apk.yml/runs?event=push&branch=main&per_page=50" \
              --jq ".workflow_runs[] | select(.head_sha == \"${BUMP_SHA}\") | .id" | head -n 1)"
            if [ -n "${run_id}" ]; then
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')"
              echo "releaseRunId=${run_id}"
              echo "releaseRunStatus=${status}"
              echo "releaseRunConclusion=${conclusion}"
              if [ "${status}" = "completed" ]; then
                break
              fi
            fi
            sleep 30
          done

          if [ -z "${run_id}" ]; then
            echo "releaseRun=not-found" >> "${status_file}"
            exit 1
          fi

          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')"
          run_url="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.html_url')"
          {
            echo "releaseRunId=${run_id}"
            echo "releaseRunStatus=${status}"
            echo "releaseRunConclusion=${conclusion}"
            echo "releaseRunUrl=${run_url}"
          } >> "${status_file}"

          if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
            echo >> "${status_file}"
            echo "--- failed logs ---" >> "${status_file}"
            gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --log-failed >> "${status_file}" 2>&1 || true
            exit 1
          fi

          rm -rf release-check fdroid-check
          mkdir -p release-check fdroid-check

          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,name,isDraft,isPrerelease,url,targetCommitish > /tmp/release.json
          test "$(jq -r '.tagName' /tmp/release.json)" = "${RELEASE_TAG}"
          test "$(jq -r '.name' /tmp/release.json)" = "Levyra ${VERSION}"
          test "$(jq -r '.isDraft' /tmp/release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/release.json)" = "false"

          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${APK_NAME}" --pattern "${APK_CHECKSUM}" --dir release-check --clobber
          test -f "release-check/${APK_NAME}"
          test -f "release-check/${APK_CHECKSUM}"
          (cd release-check && sha256sum --check "${APK_CHECKSUM}")
          apk_sha="$(sha256sum "release-check/${APK_NAME}" | awk '{print $1}')"

          gh release view "${FDROID_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,name,isDraft,isPrerelease,url,targetCommitish > /tmp/fdroid-release.json
          test "$(jq -r '.tagName' /tmp/fdroid-release.json)" = "${FDROID_TAG}"
          test "$(jq -r '.isDraft' /tmp/fdroid-release.json)" = "false"

          gh release download "${FDROID_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${FDROID_APK_NAME}" --pattern "${FDROID_CHECKSUM}" --dir fdroid-check --clobber
          test -f "fdroid-check/${FDROID_APK_NAME}"
          test -f "fdroid-check/${FDROID_CHECKSUM}"
          (cd fdroid-check && sha256sum --check "${FDROID_CHECKSUM}")
          fdroid_sha="$(sha256sum "fdroid-check/${FDROID_APK_NAME}" | awk '{print $1}')"

          {
            echo "releaseTag=${RELEASE_TAG}"
            echo "releaseUrl=$(jq -r '.url' /tmp/release.json)"
            echo "releaseTarget=$(jq -r '.targetCommitish' /tmp/release.json)"
            echo "apkName=${APK_NAME}"
            echo "apkSha256=${apk_sha}"
            echo "fdroidTag=${FDROID_TAG}"
            echo "fdroidReleaseUrl=$(jq -r '.url' /tmp/fdroid-release.json)"
            echo "fdroidReleaseTarget=$(jq -r '.targetCommitish' /tmp/fdroid-release.json)"
            echo "fdroidApkName=${FDROID_APK_NAME}"
            echo "fdroidApkSha256=${fdroid_sha}"
            echo "verified=true"
          } >> "${status_file}"

      - name: Commit verification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f release-2.3.18-status.txt || echo "verification did not produce a status file" > release-2.3.18-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-2.3.18-status.txt
          git commit -m "chore(release): record 2.3.18 verification"
          git push origin HEAD:main
