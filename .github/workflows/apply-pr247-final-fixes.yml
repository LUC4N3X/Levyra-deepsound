name: Apply PR 247 Final Fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_pr247_final_fixes.py
      - .github/workflows/apply-pr247-final-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-pr247-final-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'feat/editorial-collector' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/editorial-collector
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Apply verified fixes
        run: python tools/apply_pr247_final_fixes.py

      - name: Validate diff
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'has("isrc") or has("sourceId") or has("sourceUrl")' .github/workflows/editorial-catalog.yml
          grep -F 'ChartsCatalog.regions.take(CHART_PRIME_REGION_COUNT)' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -F 'searchAlbumsForArtistQuery' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt

      - name: Compile Android app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit clean result
        run: |
          set -euo pipefail
          rm -f tools/apply_pr247_final_fixes.py .github/workflows/apply-pr247-final-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "fix(search): show real albums and address review findings"
          git push origin HEAD:feat/editorial-collector
