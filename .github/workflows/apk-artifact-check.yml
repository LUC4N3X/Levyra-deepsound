name: APK Artifact

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Signed Release APK
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YOUTUBE_INNERTUBE_API_KEY: ${{ secrets.YOUTUBE_INNERTUBE_API_KEY }}
      LEVYRA_KEYSTORE_FILE: app/levyra-release.jks
      LEVYRA_KEYSTORE_PASSWORD: ${{ secrets.LEVYRA_KEYSTORE_PASSWORD }}
      LEVYRA_KEY_ALIAS: ${{ secrets.LEVYRA_KEY_ALIAS }}
      LEVYRA_KEY_PASSWORD: ${{ secrets.LEVYRA_KEY_PASSWORD }}
      LEVYRA_TEST_AVD: levyra-api35
      LEVYRA_TEST_SYSTEM_IMAGE: system-images;android-35;default;x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "${LEVYRA_TEST_SYSTEM_IMAGE}"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon --version

      - name: Android Runtime Compatibility Scan
        run: python3 scripts/check_android_regex_compatibility.py

      - name: Resolve APK Version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^levyraVersionName=' gradle.properties | head -n 1 | cut -d '=' -f 2- | tr -d '\r' | xargs)"
          VERSION_CODE="$(grep -E '^levyraVersionCode=' gradle.properties | head -n 1 | cut -d '=' -f 2- | tr -d '\r' | xargs)"
          test -n "${VERSION}"
          test -n "${VERSION_CODE}"
          printf '%s' "${VERSION_CODE}" | grep -Eq '^[1-9][0-9]*$'
          {
            echo "VERSION=${VERSION}"
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "SOURCE_REF=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          } >> "${GITHUB_ENV}"

      - name: Prepare Release Signing
        shell: bash
        env:
          LEVYRA_KEYSTORE_BASE64: ${{ secrets.LEVYRA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_INNERTUBE_API_KEY}"
          test -n "${LEVYRA_KEYSTORE_BASE64}"
          test -n "${LEVYRA_KEYSTORE_PASSWORD}"
          test -n "${LEVYRA_KEY_ALIAS}"
          test -n "${LEVYRA_KEY_PASSWORD}"
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          printf '%s' "${LEVYRA_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > "${LEVYRA_KEYSTORE_FILE}"
          keytool -list \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            >/dev/null

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache clean assembleRelease \
            -PlevyraVersionName="${VERSION}" \
            -PlevyraVersionCode="${VERSION_CODE}"

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "${APK}"
          SIZE_BYTES="$(stat -c%s "${APK}")"
          test "${SIZE_BYTES}" -gt 1048576
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${APK}")"
          printf '%s\n' "${BADGING}" > artifacts/apk-badging.txt
          printf '%s\n' "${BADGING}" | grep -F "versionName='${VERSION}'"
          printf '%s\n' "${BADGING}" | grep -F "versionCode='${VERSION_CODE}'"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${APK}" > artifacts/apk-signing-certs.txt
          cp "${APK}" "artifacts/LEVYRA-${VERSION}.apk"
          sha256sum "artifacts/LEVYRA-${VERSION}.apk" > "artifacts/LEVYRA-${VERSION}.apk.sha256"
          {
            echo "LEVYRA signed release APK"
            echo "version=${VERSION}"
            echo "versionCode=${VERSION_CODE}"
            echo "signingProfile=release"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${SOURCE_REF}"
            echo "sizeBytes=${SIZE_BYTES}"
            echo "builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/build-info.txt
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt artifacts/mapping.txt
          fi

      - name: Create Android Test Device
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${HOME}/.android/avd/${LEVYRA_TEST_AVD}.avd" "${HOME}/.android/avd/${LEVYRA_TEST_AVD}.ini"
          echo no | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "${LEVYRA_TEST_AVD}" \
            --package "${LEVYRA_TEST_SYSTEM_IMAGE}" \
            --device "pixel_6"

      - name: Launch Exact Signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          adb kill-server || true
          nohup "${ANDROID_HOME}/emulator/emulator" \
            -avd "${LEVYRA_TEST_AVD}" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > artifacts/emulator.log 2>&1 &
          echo $! > artifacts/emulator.pid

          timeout 240 adb wait-for-device
          BOOTED=""
          for _ in $(seq 1 120); do
            BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "${BOOTED}" = "1" ]; then
              break
            fi
            sleep 2
          done
          if [ "${BOOTED}" != "1" ]; then
            echo "Android emulator did not finish booting." >&2
            exit 1
          fi

          adb logcat -c
          APK="artifacts/LEVYRA-${VERSION}.apk"
          adb install -r "${APK}" | tee artifacts/apk-install.txt
          adb shell am force-stop com.luc4n3x.levyra
          LAUNCH_OUTPUT="$(adb shell am start -W -n com.luc4n3x.levyra/.MainActivity)"
          printf '%s\n' "${LAUNCH_OUTPUT}" | tee artifacts/apk-startup.txt
          if printf '%s\n' "${LAUNCH_OUTPUT}" | grep -Eqi 'error|exception'; then
            echo "Android reported an application launch error." >&2
            exit 1
          fi

          sleep 5
          adb logcat -d -v threadtime > artifacts/startup-logcat.txt
          PROCESS_ID="$(adb shell pidof com.luc4n3x.levyra | tr -d '\r' | xargs)"
          test -n "${PROCESS_ID}"
          CURRENT_FOCUS="$(adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true)"
          printf '%s\n' "${CURRENT_FOCUS}" > artifacts/window-focus.txt
          printf '%s\n' "${CURRENT_FOCUS}" | grep -F 'com.luc4n3x.levyra'
          if grep -Fq 'Process: com.luc4n3x.levyra' artifacts/startup-logcat.txt && \
             grep -Fq 'FATAL EXCEPTION' artifacts/startup-logcat.txt; then
            echo "Levyra crashed during startup." >&2
            exit 1
          fi

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v7
        with:
          name: levyra-release-${{ env.VERSION }}-run-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error

      - name: Cleanup Emulator and Signing Material
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [ -f artifacts/emulator.pid ]; then
            kill "$(cat artifacts/emulator.pid)" >/dev/null 2>&1 || true
          fi
          rm -f "${LEVYRA_KEYSTORE_FILE}"
