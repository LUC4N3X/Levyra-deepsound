name: APK Artifact

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Signed Release APK
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_INNERTUBE_API_KEY: ${{ secrets.YOUTUBE_INNERTUBE_API_KEY }}
      LEVYRA_EDITORIAL_SP_DC: ${{ secrets.LEVYRA_EDITORIAL_SP_DC }}
      LEVYRA_EDITORIAL_YTM_COOKIE: ${{ secrets.LEVYRA_EDITORIAL_YTM_COOKIE }}
      LEVYRA_KEYSTORE_FILE: app/levyra-release.jks
      LEVYRA_KEYSTORE_PASSWORD: ${{ secrets.LEVYRA_KEYSTORE_PASSWORD }}
      LEVYRA_KEY_ALIAS: ${{ secrets.LEVYRA_KEY_ALIAS }}
      LEVYRA_KEY_PASSWORD: ${{ secrets.LEVYRA_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-disabled: true

      - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon --version

      - name: Android Runtime Compatibility Scan
        run: python3 scripts/check_android_regex_compatibility.py

      - name: Resolve APK Version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^levyraVersionName=' gradle.properties | head -n 1 | cut -d '=' -f 2- | tr -d '\r' | xargs)"
          VERSION_CODE="$(grep -E '^levyraVersionCode=' gradle.properties | head -n 1 | cut -d '=' -f 2- | tr -d '\r' | xargs)"
          test -n "${VERSION}"
          test -n "${VERSION_CODE}"
          printf '%s' "${VERSION_CODE}" | grep -Eq '^[1-9][0-9]*$'
          {
            echo "VERSION=${VERSION}"
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "SOURCE_REF=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          } >> "${GITHUB_ENV}"

      - name: Build Pull Request Editorial Preview
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LEVYRA_EDITORIAL_SP_DC:-}" || { echo "::error::Missing LEVYRA_EDITORIAL_SP_DC"; exit 1; }
          if [ -z "${LEVYRA_EDITORIAL_YTM_COOKIE:-}" ]; then
            echo "::warning::LEVYRA_EDITORIAL_YTM_COOKIE is not configured; building Spotify-only fallback metadata"
          fi

          python -m pip install --disable-pip-version-check -e "tools/levyra-editorial"
          mkdir -p build/editorial-preview
          timeout --foreground 360s levyra-editorial \
            --config tools/levyra-editorial/config.json \
            --output build/editorial-preview/catalog.json
          levyra-editorial --validate build/editorial-preview/catalog.json
          test "$(jq '.collections | length' build/editorial-preview/catalog.json)" -ge 26

          if jq -e 'any(.. | objects; has("uri") or has("externalUrl") or has("sourceId") or has("sourceUrl") or has("snapshotId"))' build/editorial-preview/catalog.json >/dev/null; then
            echo "::error::Catalog contains private source identifiers"
            exit 1
          fi
          if jq -e 'any(.. | objects | select(has("isrc")); ((.isrc | type) != "string" or (.isrc | test("^[A-Z]{2}[A-Z0-9]{3}[0-9]{7}$") | not)))' build/editorial-preview/catalog.json >/dev/null; then
            echo "::error::Catalog contains an invalid ISRC"
            exit 1
          fi
          if grep -qiE '"(cookie|cookies|authorization|access_token|sp_dc|sapisid)"[[:space:]]*:' build/editorial-preview/catalog.json; then
            echo "::error::Catalog contains credential-related material"
            exit 1
          fi
          if jq -e 'any(.. | objects | select(has("artworkUrl")); (.artworkUrl | test("^https://([a-z0-9-]+\\.)*scdn\\.co/|^https://image-cdn-ak\\.spotifycdn\\.com/") | not))' build/editorial-preview/catalog.json >/dev/null; then
            echo "::error::Catalog contains an unapproved artwork host"
            exit 1
          fi

          mkdir -p app/src/main/assets/editorial artifacts
          cp build/editorial-preview/catalog.json app/src/main/assets/editorial/catalog-preview.json
          EDITORIAL_PREVIEW_SHA="$(sha256sum app/src/main/assets/editorial/catalog-preview.json | cut -d ' ' -f 1)"
          test -n "${EDITORIAL_PREVIEW_SHA}"
          echo "EDITORIAL_PREVIEW_SHA=${EDITORIAL_PREVIEW_SHA}" >> "${GITHUB_ENV}"
          printf '%s  %s\n' "${EDITORIAL_PREVIEW_SHA}" "catalog-preview.json" > artifacts/editorial-preview.sha256

      - name: Prepare Release Signing
        shell: bash
        env:
          LEVYRA_KEYSTORE_BASE64: ${{ secrets.LEVYRA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_INNERTUBE_API_KEY}"
          test -n "${LEVYRA_KEYSTORE_BASE64}"
          test -n "${LEVYRA_KEYSTORE_PASSWORD}"
          test -n "${LEVYRA_KEY_ALIAS}"
          test -n "${LEVYRA_KEY_PASSWORD}"
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          printf '%s' "${LEVYRA_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > "${LEVYRA_KEYSTORE_FILE}"
          keytool -list \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            >/dev/null

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache clean assembleRelease \
            -PlevyraVersionName="${VERSION}" \
            -PlevyraVersionCode="${VERSION_CODE}"

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "${APK}"
          SIZE_BYTES="$(stat -c%s "${APK}")"
          test "${SIZE_BYTES}" -gt 1048576
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${APK}")"
          printf '%s\n' "${BADGING}" > artifacts/apk-badging.txt
          printf '%s\n' "${BADGING}" | grep -F "versionName='${VERSION}'"
          printf '%s\n' "${BADGING}" | grep -F "versionCode='${VERSION_CODE}'"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${APK}" > artifacts/apk-signing-certs.txt

          if [ -n "${EDITORIAL_PREVIEW_SHA:-}" ]; then
            unzip -p "${APK}" assets/editorial/catalog-preview.json > artifacts/editorial-preview.json
            test -s artifacts/editorial-preview.json
            EMBEDDED_PREVIEW_SHA="$(sha256sum artifacts/editorial-preview.json | cut -d ' ' -f 1)"
            test "${EMBEDDED_PREVIEW_SHA}" = "${EDITORIAL_PREVIEW_SHA}"
            levyra-editorial --validate artifacts/editorial-preview.json
          fi

          cp "${APK}" "artifacts/LEVYRA-${VERSION}.apk"
          sha256sum "artifacts/LEVYRA-${VERSION}.apk" > "artifacts/LEVYRA-${VERSION}.apk.sha256"
          {
            echo "LEVYRA signed release APK"
            echo "version=${VERSION}"
            echo "versionCode=${VERSION_CODE}"
            echo "signingProfile=release"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${SOURCE_REF}"
            echo "sizeBytes=${SIZE_BYTES}"
            echo "editorialPreviewSha=${EDITORIAL_PREVIEW_SHA:-none}"
            echo "builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/build-info.txt
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt artifacts/mapping.txt
          fi

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v7
        with:
          name: levyra-release-${{ env.VERSION }}-run-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error

      - name: Cleanup Signing Material
        if: always()
        shell: bash
        run: rm -f "${LEVYRA_KEYSTORE_FILE}"
