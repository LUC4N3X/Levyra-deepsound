name: PR 428 CodeRabbit fixes

on:
  push:
    branches:
      - feat/youtube-resilience-upstream-2026-08

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/youtube-resilience-upstream-2026-08
          fetch-depth: 0
          persist-credentials: true

      - name: Apply focused review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          resolver = Path('app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt')
          text = resolver.read_text(encoding='utf-8')
          old = '''internal fun scoreYoutubeAudioTrackPreference(format: JSONObject): Int {
              val audioTrack = format.optJSONObject("audioTrack") ?: return 0
              return when {
                  audioTrack.optBoolean("isAutoDubbed", false) -> -1_000_000
                  audioTrack.optBoolean("audioIsDefault", false) -> 250_000
                  else -> 0
              }
          }
          '''
          new = '''private const val AUDIO_TRACK_SCORE_BAND = 10_000_000
          private const val AUDIO_FORMAT_SCORE_LIMIT = AUDIO_TRACK_SCORE_BAND / 2 - 1

          internal fun youtubeAudioTrackTier(format: JSONObject): Int {
              val audioTrack = format.optJSONObject("audioTrack") ?: return 1
              return when {
                  audioTrack.optBoolean("isAutoDubbed", false) -> 0
                  audioTrack.optBoolean("audioIsDefault", false) -> 2
                  else -> 1
              }
          }

          internal fun extractorAudioTrackTier(type: AudioTrackType?, autoGenerated: Boolean): Int = when {
              autoGenerated -> 0
              type == AudioTrackType.ORIGINAL -> 5
              type == null -> 4
              type == AudioTrackType.SECONDARY -> 3
              type == AudioTrackType.DUBBED -> 2
              type == AudioTrackType.DESCRIPTIVE -> 1
              else -> 1
          }

          internal fun strictAudioSelectionScore(trackTier: Int, formatScore: Int): Int =
              trackTier * AUDIO_TRACK_SCORE_BAND +
                  formatScore.coerceIn(-AUDIO_FORMAT_SCORE_LIMIT, AUDIO_FORMAT_SCORE_LIMIT)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one audio preference helper, found {text.count(old)}')
          text = text.replace(old, new)

          old_expr = '''scoreYoutubeAudioTrackPreference(format) +
                                      scoreAudioFormat('''
          new_expr = '''strictAudioSelectionScore(
                                      youtubeAudioTrackTier(format),
                                      scoreAudioFormat('''
          if text.count(old_expr) != 2:
              raise SystemExit(f'Expected two direct scoring sites, found {text.count(old_expr)}')
          text = text.replace(old_expr, new_expr)
          # Close the strict score wrapper after the scoreAudioFormat call at the two known sites.
          text = text.replace(
              '''formatAudioQuality = format.optString("audioQuality"),
                                      preferMp4Audio = preferMp4Audio,
                                      requestedAudioQuality = audioQuality
                                  )''',
              '''formatAudioQuality = format.optString("audioQuality"),
                                      preferMp4Audio = preferMp4Audio,
                                      requestedAudioQuality = audioQuality
                                  )
                              )''',
              1
          )
          text = text.replace(
              '''scoreAudioFormat(mime, itag, bitrate, formatAudioQuality, preferMp4Audio, audioQuality),
                                  formatLabel''',
              '''scoreAudioFormat(mime, itag, bitrate, formatAudioQuality, preferMp4Audio, audioQuality)
                              ),
                                  formatLabel''',
              1
          )

          old_extractor = '''        val trackBonus = when (stream.audioTrackType) {
                      AudioTrackType.ORIGINAL -> 1_000_000
                      AudioTrackType.DUBBED -> -200_000
                      AudioTrackType.DESCRIPTIVE -> -300_000
                      AudioTrackType.SECONDARY -> -100_000
                      null -> 0
                  }
                  val generatedPenalty = if (stream.itagItem?.isAutoGenerated == true) -250_000 else 0
                  return trackBonus + generatedPenalty +
                      scoreAudioFormat(mime, stream.formatId, stream.averageBitrate, "", preferMp4Audio, audioQuality)
          '''
          new_extractor = '''        val trackTier = extractorAudioTrackTier(
                      stream.audioTrackType,
                      stream.itagItem?.isAutoGenerated == true
                  )
                  return strictAudioSelectionScore(
                      trackTier,
                      scoreAudioFormat(mime, stream.formatId, stream.averageBitrate, "", preferMp4Audio, audioQuality)
                  )
          '''
          if text.count(old_extractor) != 1:
              raise SystemExit(f'Expected one extractor scoring block, found {text.count(old_extractor)}')
          resolver.write_text(text.replace(old_extractor, new_extractor), encoding='utf-8')

          app_test = Path('app/src/test/java/com/luc4n3x/levyra/data/YoutubeExtractorFallbackContractTest.kt')
          text = app_test.read_text(encoding='utf-8')
          if 'import org.schabi.newpipe.extractor.stream.AudioTrackType\n' not in text:
              text = text.replace(
                  'import org.json.JSONObject\n',
                  'import org.json.JSONObject\nimport org.schabi.newpipe.extractor.stream.AudioTrackType\n'
              )
          start = text.index('    @Test\n    fun directAudioSelectionStronglyPenalizesAutoDubbedTracks()')
          end = text.index('    @Test\n    fun youtubeJsonReadAcceptsSmallPayloads()', start)
          replacement = '''    @Test
              fun directAudioSelectionUsesNonOverlappingTrackTiers() {
                  val autoDubbed = JSONObject().put(
                      "audioTrack",
                      JSONObject().put("isAutoDubbed", true).put("audioIsDefault", true)
                  )
                  val originalDefault = JSONObject().put(
                      "audioTrack",
                      JSONObject().put("isAutoDubbed", false).put("audioIsDefault", true)
                  )

                  assertEquals(0, youtubeAudioTrackTier(autoDubbed))
                  assertEquals(2, youtubeAudioTrackTier(originalDefault))
                  assertEquals(1, youtubeAudioTrackTier(JSONObject()))
                  assertTrue(
                      strictAudioSelectionScore(youtubeAudioTrackTier(originalDefault), -4_999_999) >
                          strictAudioSelectionScore(youtubeAudioTrackTier(autoDubbed), 4_999_999)
                  )
              }

              @Test
              fun extractorTrackTierKeepsOriginalAndHumanAudioAboveAutoGeneratedAudio() {
                  assertTrue(
                      extractorAudioTrackTier(AudioTrackType.ORIGINAL, false) >
                          extractorAudioTrackTier(AudioTrackType.DUBBED, false)
                  )
                  assertTrue(
                      extractorAudioTrackTier(AudioTrackType.DUBBED, false) >
                          extractorAudioTrackTier(AudioTrackType.DUBBED, true)
                  )
              }

          '''
          replacement = '\n'.join(line[4:] if line.startswith('    ') else line for line in replacement.splitlines())
          app_test.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          canary = Path('scripts/youtube_canary.py')
          text = canary.read_text(encoding='utf-8')
          if text.count('SCHEMA_VERSION = 1') != 1:
              raise SystemExit('Expected SCHEMA_VERSION = 1 exactly once')
          text = text.replace('SCHEMA_VERSION = 1', 'SCHEMA_VERSION = 2', 1)
          marker = '''    accepted = baseline.get("observation")
              if not isinstance(accepted, dict):
          '''
          replacement = '''    accepted = baseline.get("observation")
              baseline_schema = baseline.get("schema")
              if baseline_schema is None and isinstance(accepted, dict):
                  baseline_schema = accepted.get("schema")
              if isinstance(accepted, dict) and baseline_schema != SCHEMA_VERSION:
                  return {
                      "decision": "blocked",
                      "severity": "warning",
                      "material_changes": [],
                      "informational_changes": [
                          f"Accepted baseline schema {baseline_schema!r} is incompatible with current schema "
                          f"{SCHEMA_VERSION}; accept a fresh observation before comparison."
                      ],
                  }
              if not isinstance(accepted, dict):
          '''
          if text.count(marker) != 1:
              raise SystemExit(f'Expected classify baseline marker once, found {text.count(marker)}')
          canary.write_text(text.replace(marker, replacement), encoding='utf-8')

          canary_test = Path('scripts/tests/test_youtube_canary.py')
          text = canary_test.read_text(encoding='utf-8')
          text = text.replace('self.assertEqual(1, baseline["schema"])', 'self.assertEqual(canary.SCHEMA_VERSION, baseline["schema"])')
          text = text.replace('            "schema": 1,\n            "sentinels": [', '            "schema": canary.SCHEMA_VERSION,\n            "sentinels": [')
          insertion = '''    def test_legacy_baseline_is_blocked_before_format_comparison(self):
                  legacy = self._observation(js="a", ok=True, formats=8, adaptive_video=5, muxed_video=1)
                  legacy["schema"] = 1
                  legacy["sentinels"][0]["observation"]["player"].pop("adaptive_video_formats", None)
                  legacy["sentinels"][0]["observation"]["player"].pop("muxed_video_formats", None)
                  after = self._observation(js="b", ok=True, formats=2, adaptive_video=0, muxed_video=1)

                  decision = canary._classify(
                      {"schema": 1, "observation": legacy},
                      after,
                      {"thresholds": {"required_sentinel_regressions_for_repair": 1}},
                  )

                  self.assertEqual("blocked", decision["decision"])
                  self.assertTrue(any("baseline schema" in item.lower() for item in decision["informational_changes"]))

          '''
          insertion = '\n'.join(line[4:] if line.startswith('    ') else line for line in insertion.splitlines())
          anchor = '    def test_required_sentinels_expect_adaptive_video(self):\n'
          if text.count(anchor) != 1:
              raise SystemExit('Canary test insertion anchor not found')
          canary_test.write_text(text.replace(anchor, insertion + anchor, 1), encoding='utf-8')

          helper = Path('third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/YoutubeParsingHelper.java')
          text = helper.read_text(encoding='utf-8')
          start_marker = '    @Nullable\n    public static String extractXtagsValue(@Nullable final String xtags,'
          end_marker = '\n    private static long readProtoVarint'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    @Nullable
          public static String extractXtagsValue(@Nullable final String xtags,
                                                 @Nonnull final String wantedKey) {
              if (isNullOrEmpty(xtags)) {
                  return null;
              }
              final String protobufValue = extractProtobufXtagsValue(xtags, wantedKey);
              if (!isNullOrEmpty(protobufValue)) {
                  return protobufValue;
              }
              for (final String pair : xtags.split(":")) {
                  final int separator = pair.indexOf('=');
                  if (separator <= 0) {
                      continue;
                  }
                  if (wantedKey.equals(pair.substring(0, separator))) {
                      return pair.substring(separator + 1);
                  }
              }
              return null;
          }

          @Nullable
          private static String extractProtobufXtagsValue(@Nonnull final String xtags,
                                                           @Nonnull final String wantedKey) {
              try {
                  final String padded = xtags + "====".substring(0, (4 - xtags.length() % 4) % 4);
                  final byte[] data = Base64.getUrlDecoder().decode(padded);
                  int position = 0;
                  while (position < data.length) {
                      final int[] cursor = {position};
                      final long tag = readProtoVarint(data, cursor);
                      position = cursor[0];
                      if ((tag & 7) != 2) {
                          return null;
                      }
                      final long pairLength = readProtoVarint(data, cursor);
                      position = cursor[0];
                      if (pairLength < 0 || pairLength > data.length - position) {
                          return null;
                      }
                      final int pairEnd = position + (int) pairLength;
                      String key = null;
                      String value = null;
                      while (position < pairEnd) {
                          cursor[0] = position;
                          final long pairTag = readProtoVarint(data, cursor);
                          position = cursor[0];
                          if ((pairTag & 7) != 2) {
                              return null;
                          }
                          final long length = readProtoVarint(data, cursor);
                          position = cursor[0];
                          if (length < 0 || length > pairEnd - position) {
                              return null;
                          }
                          final String valueText = new String(data, position, (int) length,
                                  StandardCharsets.UTF_8);
                          position += (int) length;
                          final int field = (int) (pairTag >>> 3);
                          if (field == 1) {
                              key = valueText;
                          } else if (field == 2) {
                              value = valueText;
                          }
                      }
                      if (wantedKey.equals(key)) {
                          return value;
                      }
                      position = pairEnd;
                  }
              } catch (final IllegalArgumentException ignored) {
              }
              return null;
          }
          '''
          replacement = '\n'.join(line[4:] if line.startswith('    ') else line for line in replacement.splitlines())
          helper.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          extractor_test = Path('third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/YoutubeModernAudioMetadataTest.java')
          text = extractor_test.read_text(encoding='utf-8')
          anchor = '    @Test\n    void copyConstructorPreservesModernFormatMetadataAndIdentity() throws Exception {\n'
          test = '''    @Test
              void parsesColonDelimitedXtagsAfterProtobufFallback() {
                  final String xtags = "acont=original:lang=en-US:label=Studio=Master";

                  assertEquals(AudioTrackType.ORIGINAL, YoutubeParsingHelper.extractAudioTrackType(xtags));
                  assertEquals("en-US", YoutubeParsingHelper.extractXtagsValue(xtags, "lang"));
                  assertEquals("Studio=Master", YoutubeParsingHelper.extractXtagsValue(xtags, "label"));
                  assertNull(YoutubeParsingHelper.extractXtagsValue(xtags, "missing"));
              }

          '''
          test = '\n'.join(line[4:] if line.startswith('    ') else line for line in test.splitlines())
          if text.count(anchor) != 1:
              raise SystemExit('Extractor test insertion anchor not found')
          extractor_test.write_text(text.replace(anchor, test + anchor, 1), encoding='utf-8')

          sabr = Path('third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrFormat.java')
          text = sabr.read_text(encoding='utf-8')
          javadoc = '''    /**
               * Identity used to prevent state or initialization bytes from leaking between variants that
               * share the same itag.
               */
          '''
          if text.count(javadoc) != 1:
              raise SystemExit(f'Expected one formatIdentity Javadoc, found {text.count(javadoc)}')
          sabr.write_text(text.replace(javadoc, '', 1), encoding='utf-8')
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Validate script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate extractor tests
        run: ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test

      - name: Validate focused Android tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.YoutubeExtractorFallbackContractTest' \
            --tests 'com.luc4n3x.levyra.data.PlaybackRecoveryBudgetContractTest'

      - name: Publish validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr428-coderabbit-fixes.yml
          git add \
            app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt \
            app/src/test/java/com/luc4n3x/levyra/data/YoutubeExtractorFallbackContractTest.kt \
            scripts/youtube_canary.py \
            scripts/tests/test_youtube_canary.py \
            third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/YoutubeParsingHelper.java \
            third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/YoutubeModernAudioMetadataTest.java \
            third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrFormat.java
          git diff --cached --check
          git commit -m "fix(youtube): address review correctness findings"
          git push origin HEAD:feat/youtube-resilience-upstream-2026-08
