name: Apply Album Title Integrity Fix V2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 247 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply guarded patch
        run: |
          python3 -m py_compile tools/apply_album_title_integrity_v3.py
          python3 tools/apply_album_title_integrity_v3.py

      - name: Test and compile
        run: ./gradlew :app:testDebugUnitTest --tests com.luc4n3x.levyra.data.YoutubeMusicAlbumTitleTest :app:compileDebugKotlin --stacktrace

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt \
            app/src/test/java/com/luc4n3x/levyra/data/YoutubeMusicAlbumTitleTest.kt
          if git diff --cached --quiet; then
            echo "Album title fix already applied"
            exit 0
          fi
          git commit -m "fix(album): reject playback metrics as release titles"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
