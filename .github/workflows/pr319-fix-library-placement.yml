              '            return@withContext PlaylistImportResult.Failure(playlistImportFailureMessage(languageCode))\n',
              1
          )
          source = source.replace(
              '            return@withContext PlaylistImportResult.Failure("Un\'importazione playlist è già in corso")\n',
              '            return@withContext PlaylistImportResult.Failure(playlistImportAlreadyRunningMessage(languageCode))\n',
              1
          )

          try_old = '''        try {
            when {
                trimmed.startsWith("{") || trimmed.startsWith("[") -> importFromJson(trimmed, customName)
                isYoutubeUrl(trimmed) -> importFromYoutubeUrl(trimmed, customName)
                isSpotifyUrl(trimmed) -> importFromSpotifyUrl(trimmed, customName)
