name: Apply PR 319 CodeRabbit Fixes

on:
  push:
    branches:
      - feature/pro-audio-and-smart-importer

permissions:
  contents: write

concurrency:
  group: pr319-coderabbit-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/pro-audio-and-smart-importer
          fetch-depth: 0

      - name: Apply CodeRabbit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          python3 scripts/pr319_coderabbit_fix.py
          git checkout origin/main -- .github/workflows/pr-check.yml
          git checkout origin/main -- .github/workflows/editorial-catalog.yml
          git rm .github/workflows/pr319-fix-library-placement.yml
          git rm scripts/pr319_coderabbit_fix.py
          git add -A
          git diff --cached --check
          grep -q 'spotifyHtmlContentTypeAccepted' app/src/main/java/com/luc4n3x/levyra/data/UniversalPlaylistImporter.kt
          grep -q 'mappedIpv6' app/src/test/java/com/luc4n3x/levyra/data/UniversalPlaylistImporterTest.kt
          grep -q 'playlistImportSuccessMessage' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          git commit -m 'fix(import): harden Spotify validation and localize status'
          git push origin HEAD:feature/pro-audio-and-smart-importer
