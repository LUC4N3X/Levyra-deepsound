            throw error
        } catch (error: Throwable) {
            Timber.w(error, "Playlist import failed")
            PlaylistImportResult.Failure(error.message ?: "Errore durante l'importazione")
        } finally {
            PlaylistImportCoordinator.finish()
        }
'''
