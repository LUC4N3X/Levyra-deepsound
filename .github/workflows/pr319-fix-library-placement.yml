name: Apply PR 319 Library Placement Fix

on:
  push:
    branches:
      - feature/pro-audio-and-smart-importer

permissions:
  contents: write

concurrency:
  group: pr319-library-placement
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/pro-audio-and-smart-importer
          fetch-depth: 0

      - name: Keep import action inside Playlists only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt')
          source = path.read_text(encoding='utf-8')
          block = '''            if (category == LibraryCategory.Overview) {
                item(key = "overview-import-playlist") {
                    LibraryImportPlaylistCard(
                        onClick = { showImportPlaylist = true },
                        isItalian = isItalian
                    )
                }
            }

'''
          count = source.count(block)
          if count != 1:
              raise SystemExit(f'overview import block: expected exactly one match, found {count}')
          source = source.replace(block, '', 1)
          if 'overview-import-playlist' in source:
              raise SystemExit('overview import action still present after patch')
          path.write_text(source, encoding='utf-8')
          PY

          # This workflow is unrelated to the feature and must stay identical to main.
          git checkout origin/main -- .github/workflows/editorial-catalog.yml
          git rm .github/workflows/pr319-fix-library-placement.yml

          git add -A
          git diff --cached --check
          git diff --cached -- app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt .github/workflows/editorial-catalog.yml
          git commit -m 'fix(library): show playlist import only in Playlists'
          git push origin HEAD:feature/pro-audio-and-smart-importer
