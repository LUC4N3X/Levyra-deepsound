                                    result.playlist.name
                                )
                            )
                        }
                        loadPlaylists()
                    }
                    is com.luc4n3x.levyra.data.PlaylistImportResult.Failure -> {
                        _state.update { current ->
                            val alreadyRunning = playlistImportAlreadyRunningMessage(current.languageCode)
