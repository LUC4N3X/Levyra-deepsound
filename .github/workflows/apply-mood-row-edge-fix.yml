name: Apply mood row edge fix

on:
  push:
    branches:
      - refactor/home-experience
    paths:
      - .github/workflows/apply-mood-row-edge-fix.yml
      - .github/mood-row-edge-fix-trigger

permissions:
  contents: write

concurrency:
  group: apply-mood-row-edge-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Remove edge clipping from mood chips
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")

          old_top = '''            item(key = "home-top", contentType = "home-header") {
                HomeSectionInset {
                    Column(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                        GreetingBar(
                            userName = state.userName,
                            isResolving = state.isResolving,
                            onSearch = viewModel::openSearch,
                            onSettings = viewModel::openSettings
                        )
                        MoodRow(
                            moods = state.moods,
                            selectedId = state.selectedMood?.id,
                            onSelect = viewModel::selectMood
                        )
                    }
                }
            }
'''
          new_top = '''            item(key = "home-top", contentType = "home-header") {
                Column(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                    HomeSectionInset {
                        GreetingBar(
                            userName = state.userName,
                            isResolving = state.isResolving,
                            onSearch = viewModel::openSearch,
                            onSettings = viewModel::openSettings
                        )
                    }
                    MoodRow(
                        moods = state.moods,
                        selectedId = state.selectedMood?.id,
                        onSelect = viewModel::selectMood
                    )
                }
            }
'''

          old_row = '''@Composable
private fun MoodRow(moods: List<Mood>, selectedId: String?, onSelect: (Mood) -> Unit) {
    val listState = rememberLazyListState()
    val flingBehavior = rememberSnapFlingBehavior(lazyListState = listState)

    LazyRow(
        state = listState,
        modifier = Modifier.fillMaxWidth(),
        horizontalArrangement = Arrangement.spacedBy(8.dp),
        contentPadding = PaddingValues(start = 1.dp, end = 1.dp),
        flingBehavior = flingBehavior
    ) {
'''
          new_row = '''@Composable
private fun MoodRow(moods: List<Mood>, selectedId: String?, onSelect: (Mood) -> Unit) {
    LazyRow(
        modifier = Modifier
            .fillMaxWidth()
            .padding(bottom = 4.dp),
        horizontalArrangement = Arrangement.spacedBy(8.dp),
        contentPadding = PaddingValues(
            start = HomeHorizontalInset,
            end = HomeHorizontalInset + 24.dp
        )
    ) {
'''

          if text.count(old_top) != 1:
              raise SystemExit(f"Expected one Home top block, found {text.count(old_top)}")
          if text.count(old_row) != 1:
              raise SystemExit(f"Expected one MoodRow block, found {text.count(old_row)}")

          text = text.replace(old_top, new_top, 1)
          text = text.replace(old_row, new_row, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/apply-mood-row-edge-fix.yml .github/mood-row-edge-fix-trigger
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): remove mood row edge clipping"
          git push origin HEAD:refactor/home-experience
