name: PR 506 restore artist hero

on:
  push:
    branches:
      - feat/home-artist-hero-and-artist-page-2-5-2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-artist-hero-and-artist-page-2-5-2
          fetch-depth: 0
      - name: Restore hero candidate fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')
          start = text.index('val spotlightCandidate = remember(')
          end = text.index('LaunchedEffect(spotlightDayKey', start)
          block = text[start:end]
          needle = '            ?: spotlightCandidates.firstOrNull(::hasArtistPortrait)\n'
          if needle not in block:
              raise SystemExit('spotlight candidate fallback anchor not found')
          if '?: spotlightCandidates.firstOrNull()' not in block:
              replacement = (
                  needle
                  + '            ?: spotlightCandidates.firstOrNull { it.track.id == stableSpotlightId }\n'
                  + '            ?: spotlightCandidates.firstOrNull { it.track.id != state.currentTrack?.id }\n'
                  + '            ?: spotlightCandidates.firstOrNull()\n'
              )
              block = block.replace(needle, replacement, 1)
              text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate focused source contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt').read_text(encoding='utf-8')
          start = text.index('val spotlightCandidate = remember(')
          end = text.index('LaunchedEffect(spotlightDayKey', start)
          block = text[start:end]
          if '?: spotlightCandidates.firstOrNull()' not in block:
              raise SystemExit('hero can still disappear when the local portrait pool is empty')
          spotlight_start = text.index('private fun HomeEditorialSpotlight(')
          spotlight_end = text.index('\n@Composable', spotlight_start + 1)
          spotlight = text[spotlight_start:spotlight_end]
          if 'SpotifyArtistArtworkRepository.get(context)' not in spotlight:
              raise SystemExit('Spotify artist portrait resolver is not wired')
          if 'CoverImage(' in spotlight:
              raise SystemExit('track-cover fallback returned to the artist hero')
          print('artist_hero_contract=ok')
          PY
      - name: Compile Android debug Kotlin
        run: ./gradlew --no-daemon :app:compileDebugKotlin
      - name: Commit clean fix
        shell: bash
        run: |
          rm .github/workflows/pr-506-restore-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr-506-restore-hero.yml
          git commit -m "fix: keep Home artist radio visible while Spotify portrait resolves"
          git push origin HEAD:feat/home-artist-hero-and-artist-page-2-5-2
