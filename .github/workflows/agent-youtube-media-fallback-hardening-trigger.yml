name: Apply YouTube fallback hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-youtube-media-fallback-hardening-trigger
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/youtube-media-fallback' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/youtube-media-fallback
          fetch-depth: 0

      - name: Apply verified hardening payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          import gzip
          import re

          carrier_path = Path('.github/workflows/agent-youtube-media-fallback-hardening.yml')
          carrier = carrier_path.read_text()

          def payload(name: str) -> bytes:
              match = re.search(rf'^\s*{name}:\s*(\S+)\s*$', carrier, re.MULTILINE)
              if match is None:
                  raise SystemExit(f'Missing {name} payload')
              return gzip.decompress(base64.b64decode(match.group(1), validate=True))

          helper = payload('HELPER_GZ_B64')
          tests = payload('TEST_GZ_B64')
          Path('app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicResilienceClient.kt').write_bytes(helper)
          Path('app/src/test/java/com/luc4n3x/levyra/data/YoutubeMusicResilienceClientTest.kt').write_bytes(tests)

          repository_path = Path('app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicRepository.kt')
          text = repository_path.read_text()
          for unused_import in (
              'import com.luc4n3x.levyra.data.security.GoogleApiKeyHeaders\n',
              'import java.io.BufferedReader\n',
              'import java.io.InputStreamReader\n',
          ):
              text = text.replace(unused_import, '')

          marker = '    private fun clientPayload(languageCode: String): JSONObject {'
          if marker in text:
              start = text.index(marker)
              end = text.index('\n    private fun searchInnerTubeRaw', start)
              text = text[:start] + text[end + 1:]

          start = text.index('    private fun searchInnerTubeRaw(')
          end = text.index('\n    suspend fun home(', start)
          text = text[:start] + '''    private fun searchInnerTubeRaw(query: String, languageCode: String): JSONObject? {
              return resilienceClient.search(query, languageCode)
          }
          ''' + text[end:]

          start = text.index('    private fun requestMusicBrowseRoot(')
          end = text.index('\n    private fun homeFeedInnerTube', start)
          text = text[:start] + '''    private fun requestMusicBrowseRoot(
              languageCode: String,
              browseId: String,
              params: String = "",
              continuation: String = ""
          ): JSONObject? {
              return resilienceClient.browse(languageCode, browseId, params, continuation)
          }
          ''' + text[end:]

          start = text.index('    private fun searchInnerTube(query: String, limit: Int, languageCode: String): List<Track> {')
          end = text.index('\n    private fun searchYoutubeExtractor', start)
          text = text[:start] + '''    private fun searchInnerTube(query: String, limit: Int, languageCode: String): List<Track> {
              val root = searchInnerTubeRaw(query, languageCode) ?: return emptyList()
              val renderers = mutableListOf<JSONObject>()
              collectObjectsByKey(root, "musicResponsiveListItemRenderer", renderers)
              val tracks = LinkedHashMap<String, Track>()
              renderers.forEach { renderer ->
                  val track = parseMusicRenderer(renderer, query)
                  if (track != null && !tracks.containsKey(track.id)) tracks[track.id] = track
              }
              if (tracks.isEmpty()) {
                  val videoRenderers = mutableListOf<JSONObject>()
                  collectObjectsByKey(root, "videoRenderer", videoRenderers)
                  videoRenderers.forEach { renderer ->
                      val track = parseVideoRenderer(renderer, query)
                      if (track != null && !tracks.containsKey(track.id)) tracks[track.id] = track
                  }
              }
              return tracks.values.take(limit)
          }
          ''' + text[end:]

          had_terminal_newline = text.endswith('\n')
          text = '\n'.join(line.rstrip() for line in text.splitlines())
          if had_terminal_newline:
              text += '\n'
          repository_path.write_text(text)
          PYCODE

          rm -f \
            .github/workflows/agent-youtube-media-fallback-hardening.yml \
            .github/workflows/agent-youtube-media-fallback-hardening-trigger.yml
          git diff --check

      - name: Compile focused unit tests
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --tests com.luc4n3x.levyra.data.YoutubeMusicResilienceClientTest --stacktrace

      - name: Publish hardening pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden YouTube fallback concurrency and memory'
          git push origin HEAD:agent/youtube-media-fallback
