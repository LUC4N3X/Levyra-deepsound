name: Apply busy spin fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/selectable-fonts-settings-motion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply busy spin fix
        run: python3 .github/scripts/apply_busy_spin_fix.py

      - name: Compile Android app
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit patch and remove temporary files
        run: |
          rm .github/scripts/apply_busy_spin_fix.py
          rm .github/workflows/apply-busy-spin-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
                  .github/scripts/apply_busy_spin_fix.py \
                  .github/workflows/apply-busy-spin-fix.yml
          git commit -m "fix(ui): stop settings spin while busy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
