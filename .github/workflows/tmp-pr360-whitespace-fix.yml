name: Temporary PR 360 whitespace fix

on:
  push:
    branches:
      - agent/fix-localization-region-consistency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-localization-region-consistency
      - name: Normalize file ending
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryOverviewComponents.kt')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryOverviewComponents.kt
          git commit -m "fix(android): normalize library source ending"
          git push origin HEAD:agent/fix-localization-region-consistency
          git rm .github/workflows/tmp-pr360-whitespace-fix.yml
          git commit -m "chore(ci): remove temporary whitespace workflow"
          git push origin HEAD:agent/fix-localization-region-consistency
