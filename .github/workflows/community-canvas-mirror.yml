name: Community Canvas Mirror

on:
  pull_request:
    paths:
      - "catalog/community-canvas-sources.json"
      - "catalog/community-canvas-extra.json"
      - "scripts/sync_community_canvas.py"
      - "scripts/build_community_canvas_index.py"
      - "app/src/main/java/com/luc4n3x/levyra/feature/motion/CommunityCanvasProvider.kt"
      - "app/src/main/java/com/luc4n3x/levyra/feature/motion/CommunityCanvasIndex.kt"
      - "app/src/test/java/com/luc4n3x/levyra/feature/motion/CommunityCanvasIndexTest.kt"
      - ".github/workflows/community-canvas-mirror.yml"
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-canvas-mirror-${{ github.event_name == 'pull_request' && github.ref || 'publisher' }}
  cancel-in-progress: true

env:
  CANVAS_MIN_ENTRIES: "150"

jobs:
  normalize:
    name: Normalize and Index Upstream Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Normalize Catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_community_canvas.py \
            --sources-file catalog/community-canvas-sources.json \
            --output build/canvas/community-canvas.json \
            --min-entries "${CANVAS_MIN_ENTRIES}"
          jq -e '.version == 1 and (.items | length) > 0' build/canvas/community-canvas.json >/dev/null

      - name: Build Sharded Lookup Index
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_community_canvas_index.py \
            --input build/canvas/community-canvas.json \
            --output-dir build/canvas/index
          jq -e '
            .version == 2 and
            .hash == "sha256" and
            .hashEncoding == "base64url" and
            .entryCount >= (env.CANVAS_MIN_ENTRIES | tonumber) and
            .keyCount >= .entryCount and
            .shardCount > 0 and
            .largestShardBytes <= 196608
          ' build/canvas/index/v2/manifest.json >/dev/null
          test "$(find build/canvas/index/v2/shards -type f -name '*.json' | wc -l)" \
            -eq "$(jq -r '.shardCount' build/canvas/index/v2/manifest.json)"

      - name: Upload Normalized Catalog
        uses: actions/upload-artifact@v7
        with:
          name: community-canvas-${{ github.run_number }}
          path: |
            build/canvas/community-canvas.json
            build/canvas/index
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Mirror Branch
    if: github.event_name != 'pull_request'
    needs: normalize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish Validated Snapshot
        shell: bash
        run: |
          set -euo pipefail
          branch="canvas-data"
          source_ref="$(git rev-parse HEAD)"
          python3 scripts/sync_community_canvas.py \
            --sources-file catalog/community-canvas-sources.json \
            --output /tmp/community-canvas.json \
            --min-entries "${CANVAS_MIN_ENTRIES}"
          python3 scripts/build_community_canvas_index.py \
            --input /tmp/community-canvas.json \
            --output-dir /tmp/canvas-index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            git switch --force-create "${branch}" "origin/${branch}"
            if [ -f catalog/community-canvas.json ]; then
              jq -S 'del(.generatedAt)' catalog/community-canvas.json > /tmp/current-canvas-content.json
              jq -S 'del(.generatedAt)' /tmp/community-canvas.json > /tmp/new-canvas-content.json
              if cmp -s /tmp/current-canvas-content.json /tmp/new-canvas-content.json && \
                 [ -f catalog/index/v2/manifest.json ]; then
                echo "Community canvas catalog and index are unchanged; publication skipped."
                git switch --detach "${source_ref}"
                exit 0
              fi
            fi
          else
            git switch --orphan "${branch}"
            git rm -rf --ignore-unmatch .
          fi

          mkdir -p catalog
          rm -rf catalog/index
          cp /tmp/community-canvas.json catalog/community-canvas.json
          cp -R /tmp/canvas-index catalog/index
          git add catalog/community-canvas.json catalog/index
          git commit -m "chore(canvas): refresh sharded community index from run ${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:refs/heads/${branch}"
          git switch --detach "${source_ref}"
          echo "Published flat fallback and sharded index to ${branch}/catalog"
