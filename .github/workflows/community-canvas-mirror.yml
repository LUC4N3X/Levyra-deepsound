name: Community Canvas Mirror

on:
  pull_request:
    paths:
      - "catalog/community-canvas-sources.json"
      - "catalog/community-canvas-extra.json"
      - "scripts/sync_community_canvas.py"
      - "scripts/build_community_canvas_index.py"
      - "app/src/main/java/com/luc4n3x/levyra/feature/motion/CommunityCanvasProvider.kt"
      - "app/src/main/java/com/luc4n3x/levyra/feature/motion/CommunityCanvasIndex.kt"
      - "app/src/test/java/com/luc4n3x/levyra/feature/motion/CommunityCanvasIndexTest.kt"
      - ".github/workflows/community-canvas-mirror.yml"
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-canvas-mirror-${{ github.event_name == 'pull_request' && github.ref || 'publisher' }}
  cancel-in-progress: true

env:
  CANVAS_MIN_ENTRIES: "150"
  CANVAS_COMPAT_MIN_ENTRIES: "100"
  CANVAS_COMPAT_MAX_BYTES: "921600"
  CANVAS_GENERATION_RETENTION_HOURS: "72"

jobs:
  normalize:
    name: Normalize and Index Catalog Sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Lookup Compatibility
        run: python3 scripts/build_community_canvas_index.py --self-test

      - name: Normalize Catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_community_canvas.py \
            --sources-file catalog/community-canvas-sources.json \
            --output build/canvas/community-canvas-full.json \
            --compat-output build/canvas/community-canvas.json \
            --compat-max-bytes "${CANVAS_COMPAT_MAX_BYTES}" \
            --compat-min-entries "${CANVAS_COMPAT_MIN_ENTRIES}" \
            --min-entries "${CANVAS_MIN_ENTRIES}"
          jq -e '.version == 1 and (.items | length) >= (env.CANVAS_MIN_ENTRIES | tonumber)' \
            build/canvas/community-canvas-full.json >/dev/null
          jq -e '.version == 1 and (.items | length) >= (env.CANVAS_COMPAT_MIN_ENTRIES | tonumber)' \
            build/canvas/community-canvas.json >/dev/null
          test "$(wc -c < build/canvas/community-canvas.json)" -le "${CANVAS_COMPAT_MAX_BYTES}"

      - name: Build Sharded Lookup Index
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_community_canvas_index.py \
            --input build/canvas/community-canvas-full.json \
            --output-dir build/canvas/index
          manifest="build/canvas/index/v2/manifest.json"
          jq -e '
            .version == 2 and
            .hash == "sha256" and
            .hashEncoding == "base64url" and
            (.contentDigest | test("^[0-9a-f]{64}$")) and
            (.shardDirectory == ("g" + (.contentDigest[0:16]) + "/p" + (.prefixChars | tostring))) and
            .entryCount >= (env.CANVAS_MIN_ENTRIES | tonumber) and
            .keyCount >= .entryCount and
            .shardCount > 0 and
            .largestShardBytes <= 196608
          ' "${manifest}" >/dev/null
          shard_dir="$(jq -r '.shardDirectory' "${manifest}")"
          [[ "${shard_dir}" =~ ^g[0-9a-f]{16}/p[2-5]$ ]]
          test "$(find "build/canvas/index/v2/${shard_dir}/shards" -type f -name '*.json' | wc -l)" \
            -eq "$(jq -r '.shardCount' "${manifest}")"

      - name: Upload Normalized Catalog
        uses: actions/upload-artifact@v7
        with:
          name: community-canvas-${{ github.run_number }}
          path: |
            build/canvas/community-canvas-full.json
            build/canvas/community-canvas.json
            build/canvas/index
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Mirror Branch
    if: github.event_name != 'pull_request'
    needs: normalize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish Validated Snapshot
        shell: bash
        run: |
          set -euo pipefail
          branch="canvas-data"
          source_ref="$(git rev-parse HEAD)"
          python3 scripts/build_community_canvas_index.py --self-test
          python3 scripts/sync_community_canvas.py \
            --sources-file catalog/community-canvas-sources.json \
            --output /tmp/community-canvas-full.json \
            --compat-output /tmp/community-canvas.json \
            --compat-max-bytes "${CANVAS_COMPAT_MAX_BYTES}" \
            --compat-min-entries "${CANVAS_COMPAT_MIN_ENTRIES}" \
            --min-entries "${CANVAS_MIN_ENTRIES}"
          python3 scripts/build_community_canvas_index.py \
            --input /tmp/community-canvas-full.json \
            --output-dir /tmp/canvas-index
          new_manifest="/tmp/canvas-index/v2/manifest.json"
          new_shard_dir="$(jq -r '.shardDirectory' "${new_manifest}")"
          [[ "${new_shard_dir}" =~ ^g[0-9a-f]{16}/p[2-5]$ ]]
          test "$(wc -c < /tmp/community-canvas.json)" -le "${CANVAS_COMPAT_MAX_BYTES}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          content_changed=true

          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            git switch --force-create "${branch}" "origin/${branch}"
            if [ -f catalog/community-canvas.json ] && [ -f catalog/index/v2/manifest.json ]; then
              jq -S 'del(.generatedAt)' catalog/community-canvas.json > /tmp/current-canvas-content.json
              jq -S 'del(.generatedAt)' /tmp/community-canvas.json > /tmp/new-canvas-content.json
              jq -S 'del(.generatedAt)' catalog/index/v2/manifest.json > /tmp/current-index-manifest.json
              jq -S 'del(.generatedAt)' "${new_manifest}" > /tmp/new-index-manifest.json
              if cmp -s /tmp/current-canvas-content.json /tmp/new-canvas-content.json && \
                 cmp -s /tmp/current-index-manifest.json /tmp/new-index-manifest.json; then
                content_changed=false
                echo "Community canvas content is unchanged; checking generation retention only."
              fi
            fi
          else
            git switch --orphan "${branch}"
            git rm -rf --ignore-unmatch .
          fi

          if [ "${content_changed}" = true ]; then
            mkdir -p "catalog/index/v2/${new_shard_dir}/shards"
            cp /tmp/community-canvas.json catalog/community-canvas.json
            cp "${new_manifest}" catalog/index/v2/manifest.json
            cp -R "/tmp/canvas-index/v2/${new_shard_dir}/shards/." \
              "catalog/index/v2/${new_shard_dir}/shards/"
          fi

          new_generation="${new_shard_dir%%/*}"
          cutoff_epoch=$(($(date +%s) - CANVAS_GENERATION_RETENTION_HOURS * 3600))
          for generation_dir in catalog/index/v2/g*; do
            [ -d "${generation_dir}" ] || continue
            [ "$(basename "${generation_dir}")" = "${new_generation}" ] && continue
            last_touch="$(git log -1 --format=%ct -- "${generation_dir}" 2>/dev/null || true)"
            if [[ "${last_touch}" =~ ^[0-9]+$ ]] && (( last_touch < cutoff_epoch )); then
              echo "Removing expired canvas index generation ${generation_dir}"
              rm -rf "${generation_dir}"
            fi
          done

          git add -A catalog
          if git diff --cached --quiet; then
            echo "Community canvas catalog, index and retained generations are unchanged."
            git switch --detach "${source_ref}"
            exit 0
          fi

          git commit -m "chore(canvas): refresh sharded community index from run ${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:refs/heads/${branch}"
          git switch --detach "${source_ref}"
          echo "Published bounded fallback and immutable ${new_shard_dir} index to ${branch}/catalog"
