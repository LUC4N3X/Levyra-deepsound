name: PR504 Amazon Soundtrack Hero

on:
  push:
    branches:
      - feat/amazon-inspired-explore-cards
    paths:
      - .github/workflows/pr504-amazon-soundtrack-hero.yml

permissions:
  contents: write

jobs:
  patch-home-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/amazon-inspired-explore-cards
          fetch-depth: 0

      - name: Apply soundtrack hero patch
        run: python .github/pr504_amazon_soundtrack_patch.py

      - name: Commit final PR changes
        run: |
          rm -f .github/workflows/pr504-amazon-soundtrack-hero.yml
          rm -f .github/pr504_amazon_soundtrack_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr504-amazon-soundtrack-hero.yml .github/pr504_amazon_soundtrack_patch.py
          git commit -m "feat(home): add Amazon-style soundtrack hero"
          git push origin HEAD:feat/amazon-inspired-explore-cards
