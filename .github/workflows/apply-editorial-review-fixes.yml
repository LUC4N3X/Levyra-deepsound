name: Apply Editorial Review Fixes

on:
  pull_request:
    paths:
      - tools/apply_editorial_review_fixes.py
      - .github/workflows/apply-editorial-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-editorial-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/editorial-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/editorial-collector
          fetch-depth: 0

      - name: Apply review fixes
        run: |
          set -euo pipefail
          python tools/apply_editorial_review_fixes.py
          git checkout HEAD -- .github/workflows/editorial-catalog.yml

      - name: Preserve server-time failure semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/levyra-editorial/levyra_editorial/spotify.py')
          content = path.read_text(encoding='utf-8')
          old = '''            try:
                          server_time = self._fetch_server_time()
                          otp = generate_totp(totp_secret, server_time)
                          token_data = self._request_access_token(
          '''
          new = '''            server_time = self._fetch_server_time()
                      otp = generate_totp(totp_secret, server_time)
                      try:
                          token_data = self._request_access_token(
          '''
          if content.count(old) != 1:
              raise SystemExit('Unable to patch authentication attempt structure')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml

      - name: Verify collector
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e 'tools/levyra-editorial[dev]'
          python -m compileall -q tools/levyra-editorial/levyra_editorial
          ruff check tools/levyra-editorial
          pytest tools/levyra-editorial/tests

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify Android integration
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.EditorialCatalogParserTest' \
            --tests 'com.luc4n3x.levyra.data.EditorialArtworkContinuityTest'

      - name: Commit verified fixes
        run: |
          set -euo pipefail
          rm -rf tools/levyra-editorial/levyra_editorial.egg-info
          find tools/levyra-editorial -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache tools/levyra-editorial/.pytest_cache
          rm -f tools/apply_editorial_review_fixes.py
          git checkout HEAD -- .github/workflows/editorial-catalog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit.'; exit 0; }
          git commit -m 'fix(editorial): harden catalog pipeline and artwork continuity'
          git push origin HEAD:feat/editorial-collector
