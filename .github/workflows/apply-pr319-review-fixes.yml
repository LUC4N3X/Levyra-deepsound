name: Apply PR 319 Review Fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr319-final-review-fixes
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/pro-audio-and-smart-importer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/pro-audio-and-smart-importer
          fetch-depth: 0

      - name: Apply routed Library and import-state fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          # Import belongs only to the Playlists destination, not the Library overview.
          library = Path('app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt')
          source = library.read_text(encoding='utf-8')
          overview_block = '''            if (category == LibraryCategory.Overview) {
                item(key = "overview-import-playlist") {
                    LibraryImportPlaylistCard(
                        onClick = { showImportPlaylist = true },
                        isItalian = isItalian
                    )
                }
            }

'''
          source = replace_once(source, overview_block, '', 'Library overview import block')

          playlist_card_old = '''                    item(key = "playlist-import-action") {
                        LibraryImportPlaylistCard(
                            onClick = { showImportPlaylist = true },
                            isItalian = isItalian
                        )
                    }
'''
          playlist_card_new = '''                    item(key = "playlist-import-action") {
                        LibraryImportPlaylistCard(
                            onClick = { showImportPlaylist = true }
                        )
                    }
'''
          source = replace_once(source, playlist_card_old, playlist_card_new, 'Playlists import card')

          dialog_old = '''    if (showImportPlaylist) {
        LibraryImportPlaylistDialog(
            isItalian = isItalian,
            onDismiss = { showImportPlaylist = false },
'''
          dialog_new = '''    if (showImportPlaylist) {
        LibraryImportPlaylistDialog(
            onDismiss = { showImportPlaylist = false },
'''
          source = replace_once(source, dialog_old, dialog_new, 'Import dialog wiring')
          if 'overview-import-playlist' in source:
              raise SystemExit('Import action still appears on the Library overview')
          library.write_text(source, encoding='utf-8')

          # Guard the ViewModel entry point as well as the importer-level coordinator.
          viewmodel = Path('app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt')
          source = viewmodel.read_text(encoding='utf-8')
          field_anchor = '''    private var searchJob: Job? = null
    private var sharedMediaJob: Job? = null
'''
          field_replacement = '''    private var searchJob: Job? = null
    private var sharedMediaJob: Job? = null
    private var playlistImportJob: Job? = null
'''
          source = replace_once(source, field_anchor, field_replacement, 'Playlist import job field')

          old_import = '''    fun importPlaylist(input: String) {
        viewModelScope.launch {
            _state.update { it.copy(offlineExportMessage = "Importazione playlist in corso...") }
            val importer = com.luc4n3x.levyra.data.UniversalPlaylistImporter(
                context = getApplication<Application>().applicationContext,
                playlistStore = playlistStore,
                youtubeRepository = repository
            )
            when (val result = importer.importFromUrlOrJson(input)) {
                is com.luc4n3x.levyra.data.PlaylistImportResult.Success -> {
                    _state.update { it.copy(offlineExportMessage = "Importati ${result.importedCount} brani in ${result.playlist.name}!") }
                    loadPlaylists()
                }
                is com.luc4n3x.levyra.data.PlaylistImportResult.Failure -> {
                    _state.update { it.copy(offlineExportMessage = "Errore: ${result.reason}") }
                }
            }
        }
    }
'''
          new_import = '''    fun importPlaylist(input: String) {
        val languageCode = _state.value.languageCode
        if (playlistImportJob?.isActive == true) {
            _state.update {
                it.copy(
                    offlineExportMessage = com.luc4n3x.levyra.ui.i18n.playlistImportAlreadyRunningMessage(languageCode)
                )
            }
            return
        }

        playlistImportJob = viewModelScope.launch {
            _state.update {
                it.copy(
                    offlineExportMessage = com.luc4n3x.levyra.ui.i18n.playlistImportStartedMessage(languageCode)
                )
            }
            try {
                val importer = com.luc4n3x.levyra.data.UniversalPlaylistImporter(
                    context = getApplication<Application>().applicationContext,
                    playlistStore = playlistStore,
                    youtubeRepository = repository
                )
                when (val result = importer.importFromUrlOrJson(input)) {
                    is com.luc4n3x.levyra.data.PlaylistImportResult.Success -> {
                        _state.update {
                            it.copy(
                                offlineExportMessage = com.luc4n3x.levyra.ui.i18n.playlistImportSuccessMessage(
                                    languageCode,
                                    result.importedCount,
                                    result.playlist.name
                                )
                            )
                        }
                        loadPlaylists()
                    }
                    is com.luc4n3x.levyra.data.PlaylistImportResult.Failure -> {
                        Timber.w("Playlist import failed: %s", result.reason)
                        _state.update {
                            it.copy(
                                offlineExportMessage = com.luc4n3x.levyra.ui.i18n.playlistImportFailureMessage(languageCode)
                            )
                        }
                    }
                }
            } finally {
                playlistImportJob = null
            }
        }
    }
'''
          source = replace_once(source, old_import, new_import, 'LevyraViewModel.importPlaylist')
          viewmodel.write_text(source, encoding='utf-8')
          PY

          rm -f .pr319-review-fixes-trigger
          git rm .github/workflows/apply-pr319-review-fixes.yml
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(library): finalize localized playlist import flow'
          git push origin HEAD:feature/pro-audio-and-smart-importer
