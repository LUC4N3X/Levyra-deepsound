name: PR 313 mood card border

on:
  push:
    branches:
      - claude/menu-esplora-redesign-t3j2l4
    paths:
      - .github/workflows/pr313-mood-border.yml

permissions:
  contents: write

jobs:
  apply-mood-border:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: claude/menu-esplora-redesign-t3j2l4
          fetch-depth: 0

      - name: Patch only ExploreMoodCard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text()
          old = '''@Composable
          private fun RowScope.ExploreMoodCard(zone: ExploreZone, isSelected: Boolean, onClick: () -> Unit) {
              val animationsEnabled = LocalAnimationsEnabled.current
              val accentStart = Color(zone.accentStart)
              val accentEnd = Color(zone.accentEnd)
              val shape = RoundedCornerShape(8.dp)
              val background by animateColorAsState(
                  targetValue = if (isSelected) {
                      accentStart.copy(alpha = if (LevyraIsLight) 0.12f else 0.18f)
                  } else {
                      if (LevyraIsLight) LevyraAdaptiveCardDeep else Color(0xFF18181D)
                  },
                  animationSpec = if (animationsEnabled) tween(180) else snap(),
                  label = "explore-mood-background"
              )
              val edgeBrush = remember(accentStart, accentEnd) {
                  Brush.verticalGradient(listOf(accentStart, accentEnd))
              }
              Row(
                  modifier = Modifier
                      .weight(1f)
                      .heightIn(min = 58.dp)
                      .clip(shape)
                      .background(background)
                      .border(
                          width = if (isSelected) 1.dp else Dp.Hairline,
                          color = if (isSelected) accentStart.copy(alpha = 0.56f) else LevyraAdaptiveHairline,
                          shape = shape
                      )
                      .semantics(mergeDescendants = true) {
                          role = Role.Button
                          selected = isSelected
                      }
                      .pressable(onClick = onClick),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxHeight()
                          .width(6.dp)
                          .background(edgeBrush)
                  )
                  Text(
                      text = zone.label,
                      modifier = Modifier
                          .weight(1f)
                          .padding(horizontal = 12.dp),
                      color = LevyraText,
                      fontSize = 14.sp,
                      lineHeight = 18.sp,
                      fontWeight = FontWeight.SemiBold,
                      maxLines = 2,
                      overflow = TextOverflow.Ellipsis
                  )
              }
          }
          '''.replace('          ', '')
          new = '''@Composable
          private fun RowScope.ExploreMoodCard(zone: ExploreZone, isSelected: Boolean, onClick: () -> Unit) {
              val animationsEnabled = LocalAnimationsEnabled.current
              val accentStart = Color(zone.accentStart)
              val accentEnd = Color(zone.accentEnd)
              val shape = RoundedCornerShape(10.dp)
              val background by animateColorAsState(
                  targetValue = if (isSelected) {
                      accentStart.copy(alpha = if (LevyraIsLight) 0.12f else 0.18f)
                  } else {
                      if (LevyraIsLight) LevyraAdaptiveCardDeep else Color(0xFF18181D)
                  },
                  animationSpec = if (animationsEnabled) tween(180) else snap(),
                  label = "explore-mood-background"
              )
              val edgeBrush = remember(accentStart, accentEnd) {
                  Brush.verticalGradient(listOf(accentStart, accentEnd))
              }
              val outlineBrush = remember(accentStart, accentEnd, isSelected) {
                  Brush.horizontalGradient(
                      listOf(
                          accentStart.copy(alpha = if (isSelected) 0.90f else 0.68f),
                          accentEnd.copy(alpha = if (isSelected) 0.46f else 0.26f),
                          Color.White.copy(alpha = if (isSelected) 0.14f else 0.07f)
                      )
                  )
              }
              Row(
                  modifier = Modifier
                      .weight(1f)
                      .heightIn(min = 58.dp)
                      .clip(shape)
                      .background(background)
                      .border(
                          border = BorderStroke(
                              width = if (isSelected) 1.5.dp else 1.dp,
                              brush = outlineBrush
                          ),
                          shape = shape
                      )
                      .semantics(mergeDescendants = true) {
                          role = Role.Button
                          selected = isSelected
                      }
                      .pressable(onClick = onClick),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxHeight()
                          .width(if (isSelected) 8.dp else 7.dp)
                          .background(edgeBrush)
                  )
                  Text(
                      text = zone.label,
                      modifier = Modifier
                          .weight(1f)
                          .padding(horizontal = 12.dp),
                      color = LevyraText,
                      fontSize = 14.sp,
                      lineHeight = 18.sp,
                      fontWeight = FontWeight.SemiBold,
                      maxLines = 2,
                      overflow = TextOverflow.Ellipsis
                  )
              }
          }
          '''.replace('          ', '')

          if text.count(old) != 1:
              raise SystemExit(f'ExploreMoodCard block mismatch: found {text.count(old)} matches')
          updated = text.replace(old, new, 1)
          path.write_text(updated)
          PY

          git diff --check -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt

      - name: Commit only mood card visual change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git commit -m "style(explore): refine mood card accent border"
          git push origin HEAD:claude/menu-esplora-redesign-t3j2l4
