name: PR 313 mood card border

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-mood-border:
    if: github.head_ref == 'claude/menu-esplora-redesign-t3j2l4'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: claude/menu-esplora-redesign-t3j2l4
          fetch-depth: 0

      - name: Patch only ExploreMoodCard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text()
          start = text.index('private fun RowScope.ExploreMoodCard(')
          end = text.index('\n@Composable\nprivate fun ExploreSamplesRow(', start)
          block = text[start:end]

          if 'val outlineBrush = remember(accentStart, accentEnd, isSelected)' in block:
              print('Mood card border already patched')
              raise SystemExit(0)

          replacements = [
              ('val shape = RoundedCornerShape(8.dp)', 'val shape = RoundedCornerShape(10.dp)'),
              (
                  '    val edgeBrush = remember(accentStart, accentEnd) {\n'
                  '        Brush.verticalGradient(listOf(accentStart, accentEnd))\n'
                  '    }\n',
                  '    val edgeBrush = remember(accentStart, accentEnd) {\n'
                  '        Brush.verticalGradient(listOf(accentStart, accentEnd))\n'
                  '    }\n'
                  '    val outlineBrush = remember(accentStart, accentEnd, isSelected) {\n'
                  '        Brush.horizontalGradient(\n'
                  '            listOf(\n'
                  '                accentStart.copy(alpha = if (isSelected) 0.90f else 0.68f),\n'
                  '                accentEnd.copy(alpha = if (isSelected) 0.46f else 0.26f),\n'
                  '                Color.White.copy(alpha = if (isSelected) 0.14f else 0.07f)\n'
                  '            )\n'
                  '        )\n'
                  '    }\n'
              ),
              (
                  '            .border(\n'
                  '                width = if (isSelected) 1.dp else Dp.Hairline,\n'
                  '                color = if (isSelected) accentStart.copy(alpha = 0.56f) else LevyraAdaptiveHairline,\n'
                  '                shape = shape\n'
                  '            )\n',
                  '            .border(\n'
                  '                border = BorderStroke(\n'
                  '                    width = if (isSelected) 1.5.dp else 1.dp,\n'
                  '                    brush = outlineBrush\n'
                  '                ),\n'
                  '                shape = shape\n'
                  '            )\n'
              ),
              ('.width(6.dp)', '.width(if (isSelected) 8.dp else 7.dp)')
          ]

          for old, new in replacements:
              count = block.count(old)
              if count != 1:
                  raise RuntimeError(f'ExploreMoodCard patch mismatch for {old[:40]!r}: {count} matches')
              block = block.replace(old, new, 1)

          updated = text[:start] + block + text[end:]
          path.write_text(updated)
          PY

          git diff --check -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt

      - name: Commit only mood card visual change
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt; then
            echo "No mood card diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git commit -m "style(explore): refine mood card accent border"
          git push origin HEAD:claude/menu-esplora-redesign-t3j2l4
