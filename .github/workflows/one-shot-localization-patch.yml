name: One-shot localization patch

on:
  push:
    branches:
      - agent/fix-localization-region-consistency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-localization-region-consistency
          fetch-depth: 0

      - name: Patch localization and region preservation
        shell: python
        run: |
          from pathlib import Path

          strings_path = Path('app/src/main/java/com/luc4n3x/levyra/ui/i18n/LevyraStrings.kt')
          strings = strings_path.read_text(encoding='utf-8')
          old_limiter = '''    val truePeakLimiter: String get() = when (code) {
                  "it" -> "Limiter true-peak"
                  "es" -> "Limitador true-peak"
                  "fr" -> "Limiteur true-peak"
                  "de" -> "True-Peak-Limiter"
                  else -> "True-peak limiter"
              }'''
          new_limiter = '''    val truePeakLimiter: String get() = when (code) {
                  "it" -> "Limiter true-peak"
                  "es" -> "Limitador true-peak"
                  "fr" -> "Limiteur true-peak"
                  "de" -> "True-Peak-Limiter"
                  "pt" -> "Limitador true-peak"
                  "nl" -> "True-peaklimiter"
                  "pl" -> "Limiter true peak"
                  "ro" -> "Limitator true-peak"
                  "el" -> "Περιοριστής true-peak"
                  "sv" -> "True-peak-begränsare"
                  "da" -> "True-peak-begrænser"
                  "cs" -> "True-peak limiter"
                  "uk" -> "Лімітер true-peak"
                  "ru" -> "Лимитер true-peak"
                  "tr" -> "True-peak sınırlayıcı"
                  "ar" -> "محدد الذروة الحقيقية"
                  "zh" -> "真峰值限制器"
                  "ja" -> "トゥルーピークリミッター"
                  "ko" -> "트루 피크 리미터"
                  "hi" -> "ट्रू-पीक लिमिटर"
                  "id" -> "Pembatas true-peak"
                  "vi" -> "Bộ giới hạn true-peak"
                  "th" -> "ตัวจำกัดทรูพีก"
                  "fil" -> "Limiter ng true-peak"
                  "he" -> "מגביל שיא אמיתי"
                  else -> "True-peak limiter"
              }'''
          if old_limiter not in strings:
              raise SystemExit('truePeakLimiter block not found')
          strings_path.write_text(strings.replace(old_limiter, new_limiter, 1), encoding='utf-8')

          viewmodel_path = Path('app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt')
          viewmodel = viewmodel_path.read_text(encoding='utf-8')
          start = viewmodel.index('    private fun applyLanguageContent(languageCode: String, refreshRemote: Boolean) {')
          end = viewmodel.index('\n    fun restartOnboarding()', start)
          block = viewmodel[start:end]
          old_decl = '        val defaultChartRegion = ChartsCatalog.defaultRegionForLanguage(languageCode)'
          new_decl = '''        val selectedChartRegion = ChartsCatalog.regions
                      .firstOrNull { it.id == _state.value.selectedChartId }
                      ?: ChartsCatalog.defaultRegionForLanguage(languageCode)'''
          if old_decl not in block:
              raise SystemExit('applyLanguageContent chart declaration not found')
          block = block.replace(old_decl, new_decl, 1).replace('defaultChartRegion', 'selectedChartRegion')
          viewmodel_path.write_text(viewmodel[:start] + block + viewmodel[end:], encoding='utf-8')

          Path('.github/workflows/one-shot-localization-patch.yml').unlink()

      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/i18n/LevyraStrings.kt \
                  app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt \
                  .github/workflows/one-shot-localization-patch.yml
          git commit -m "fix(android): complete locale and region consistency"
          git push origin HEAD:agent/fix-localization-region-consistency
