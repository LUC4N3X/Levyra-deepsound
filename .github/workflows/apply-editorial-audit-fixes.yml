name: Apply Editorial Audit Fixes

on:
  push:
    branches:
      - feat/central-ytm-editorial
    paths:
      - tools/apply_editorial_audit_fixes.py
      - .github/workflows/apply-editorial-audit-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-editorial-audit-fixes-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/central-ytm-editorial
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml
      - name: Apply, verify, and commit
        shell: bash
        run: |
          set +e
          original_head="$(git rev-parse HEAD)"
          log=/tmp/editorial-audit-fix.log
          : > "$log"

          run_logged() {
            echo "> $*" | tee -a "$log"
            "$@" >> "$log" 2>&1
            return $?
          }

          status=0
          run_logged python tools/apply_editorial_audit_fixes.py || status=$?
          if [ "$status" -eq 0 ]; then
            run_logged python -m pip install --disable-pip-version-check -e "tools/levyra-editorial[dev]" || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_logged python -m compileall -q tools/levyra-editorial/levyra_editorial || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_logged ruff check tools/levyra-editorial || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_logged pytest tools/levyra-editorial/tests || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_logged python scripts/check_android_regex_compatibility.py || status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            git add -A
            if git diff --cached --quiet; then
              echo "No changes to commit" | tee -a "$log"
              status=1
            else
              git commit -m "fix(editorial): address resolver audit regressions" >> "$log" 2>&1 || status=$?
            fi
          fi
          if [ "$status" -eq 0 ]; then
            git push origin HEAD:feat/central-ytm-editorial >> "$log" 2>&1 || status=$?
          fi

          if [ "$status" -ne 0 ]; then
            cat "$log"
            git reset --hard "$original_head"
            cp "$log" tools/editorial-audit-fix-error.txt
            git add tools/editorial-audit-fix-error.txt
            git commit -m "chore(ci): capture editorial audit failure"
            git push origin HEAD:feat/central-ytm-editorial
            exit 0
          fi

          cat "$log"
