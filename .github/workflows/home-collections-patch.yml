name: Home Collections Patch

on:
  push:
    branches:
      - feat/home-ytmusic-style
    paths:
      - .github/workflows/home-collections-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-ytmusic-style
          fetch-depth: 0

      - name: Apply focused Home collections update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "private val HOME_COLLECTION_CARD_WIDTH = 164.dp": "private val HOME_COLLECTION_CARD_WIDTH = 180.dp",
              "private val HOME_COLLECTION_CARD_HEIGHT = 150.dp": "private val HOME_COLLECTION_CARD_HEIGHT = 96.dp",
              "private val HOME_COLLECTION_CARD_CORNER = 12.dp": "private val HOME_COLLECTION_CARD_CORNER = 8.dp",
              "private val HOME_COLLECTION_COMPACT_WIDTH = 160.dp": "private val HOME_COLLECTION_COMPACT_WIDTH = 188.dp",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          old_shelf = '''private fun HomeEditorialCollectionsShelf(
              collections: List<HomeEditorialCollection>,
              animationsEnabled: Boolean,
              onOpen: (HomeEditorialCollection) -> Unit
          ) {
              val strings = LocalLevyraStrings.current
              val indexedColumns = remember(collections) {
                  collections.mapIndexed { index, collection -> index to collection }.chunked(2)
              }
              Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  HomeSectionHeader(
                      title = strings.collectionsTitle,
                      subtitle = strings.collectionsSubtitle,
                      modifier = Modifier.padding(horizontal = HomeHorizontalInset)
                  )
                  BoxWithConstraints(modifier = Modifier.fillMaxWidth()) {
                      val cardWidth = ((maxWidth - (HomeHorizontalInset * 2) - LevyraHomeDesign.ShelfItemGap) / 2f)
                          .coerceIn(HOME_COLLECTION_CARD_WIDTH, 188.dp)
                      LazyRow(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(LevyraHomeDesign.ShelfItemGap),
                          contentPadding = PaddingValues(
                              start = HomeHorizontalInset,
                              end = HOME_COLLECTION_SHELF_END_PADDING
                          )
                      ) {
                          itemsIndexed(
                              items = indexedColumns,
                              key = { _, column -> column.joinToString(prefix = "home-collection-column-") { it.second.id } },
                              contentType = { _, _ -> "home-collection-column" }
                          ) { _, column ->
                              Column(
                                  modifier = Modifier.width(cardWidth),
                                  verticalArrangement = Arrangement.spacedBy(LevyraHomeDesign.ShelfItemGap)
                              ) {
                                  column.forEach { (visualIndex, collection) ->
                                      HomeEditorialCollectionCard(
                                          collection = collection,
                                          visualIndex = visualIndex,
                                          cardWidth = cardWidth,
                                          animationsEnabled = animationsEnabled,
                                          onOpen = { onOpen(collection) }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }'''

          new_shelf = '''private fun HomeEditorialCollectionsShelf(
              collections: List<HomeEditorialCollection>,
              animationsEnabled: Boolean,
              onOpen: (HomeEditorialCollection) -> Unit
          ) {
              val strings = LocalLevyraStrings.current
              Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  HomeSectionHeader(
                      title = strings.collectionsTitle,
                      subtitle = strings.collectionsSubtitle,
                      modifier = Modifier.padding(horizontal = HomeHorizontalInset)
                  )
                  LazyRow(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(LevyraHomeDesign.ShelfItemGap),
                      contentPadding = PaddingValues(
                          start = HomeHorizontalInset,
                          end = HOME_COLLECTION_SHELF_END_PADDING
                      )
                  ) {
                      itemsIndexed(
                          items = collections,
                          key = { _, collection -> "home-collection-${collection.id}" },
                          contentType = { _, _ -> "home-collection-card" }
                      ) { visualIndex, collection ->
                          HomeEditorialCollectionCard(
                              collection = collection,
                              visualIndex = visualIndex,
                              cardWidth = HOME_COLLECTION_CARD_WIDTH,
                              animationsEnabled = animationsEnabled,
                              onOpen = { onOpen(collection) }
                          )
                      }
                  }
              }
          }'''

          count = text.count(old_shelf)
          if count != 1:
              raise RuntimeError(f"Expected exactly one HomeEditorialCollectionsShelf block, found {count}")
          text = text.replace(old_shelf, new_shelf, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git diff -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --check

      - name: Commit source change and remove temporary helpers
        shell: bash
        run: |
          rm -f .github/workflows/home-collections-diagnostic.yml
          rm -f .github/workflows/home-collections-patch.yml
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/home-collections-diagnostic.yml .github/workflows/home-collections-patch.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(home): make collections a compact horizontal shelf"
          git push origin HEAD:feat/home-ytmusic-style
