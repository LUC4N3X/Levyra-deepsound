name: Apply Refined Player Timeline

on:
  push:
    branches:
      - agent/scalable-canvas-index
    paths:
      - .github/workflows/apply-refined-player-timeline.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/scalable-canvas-index
          fetch-depth: 0

      - name: Apply refined player polish
        run: python3 scripts/apply_refined_player_timeline.py

      - name: Remove one-shot helper
        run: |
          rm scripts/apply_refined_player_timeline.py
          rm .github/workflows/apply-refined-player-timeline.yml

      - name: Validate and commit player polish
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(player): refine timeline and visual rhythm"
          git push origin HEAD:agent/scalable-canvas-index
