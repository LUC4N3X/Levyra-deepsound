name: Apply Video Surface Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'feat/central-ytm-editorial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare ephemeral signing
        shell: bash
        run: |
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null
      - name: Apply guarded player fix
        run: python3 tools/apply_video_surface_fix.py
      - name: Verify bounded TextureView implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'app:surface_type="texture_view"' app/src/main/res/layout/levyra_video_player_view.xml
          grep -q 'R.layout.levyra_video_player_view' app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          grep -q 'TextureView stays inside Compose bounds' app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          grep -q 'text = strings.song' app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          ! grep -q 'modifier.aspectRatio(aspectRatio.coerceIn' app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
      - name: Android lint and compile
        run: |
          ./gradlew \
            :app:lintDebug \
            :app:compileDebugKotlin \
            --stacktrace
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/main/res/layout/levyra_video_player_view.xml
          git reset -- tools/apply_video_surface_fix.py .github/workflows/apply-video-surface-fix.yml
          git commit -m 'fix(player): keep video surface inside player controls'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
