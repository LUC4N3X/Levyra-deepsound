name: Apply YouTube media fallback

on:
  push:
    branches:
      - agent/youtube-media-fallback

permissions:
  contents: write

concurrency:
  group: agent-youtube-media-fallback
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/youtube-media-fallback
          fetch-depth: 0

      - name: Apply resilient YouTube Music client
        shell: bash
        env:
          HELPER_GZ_B64: 
          TEST_GZ_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          import gzip
          import os

          helper_path = Path("app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicResilienceClient.kt")
          test_path = Path("app/src/test/java/com/luc4n3x/levyra/data/YoutubeMusicResilienceClientTest.kt")
          helper_path.write_bytes(gzip.decompress(base64.b64decode(os.environ["HELPER_GZ_B64"])))
          test_path.write_bytes(gzip.decompress(base64.b64decode(os.environ["TEST_GZ_B64"])))

          repository_path = Path("app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicRepository.kt")
          text = repository_path.read_text()
          field = "    private val watchRepository = YoutubeMusicWatchRepository(context)\n"
          if text.count(field) != 1:
              raise SystemExit("Expected watchRepository field exactly once")
          if "private val resilienceClient = YoutubeMusicResilienceClient" in text:
              raise SystemExit("Resilience client is already integrated")
          text = text.replace(
              field,
              field + "    private val resilienceClient = YoutubeMusicResilienceClient(context, apiKey, clientVersion)\n",
              1,
          )

          start = text.index("    private fun searchInnerTubeRaw(")
          end = text.index("\n    suspend fun home(", start)
          search_replacement = """    private fun searchInnerTubeRaw(query: String, languageCode: String): JSONObject? {
              return resilienceClient.search(query, languageCode)
          }
          """
          text = text[:start] + search_replacement + text[end:]

          start = text.index("    private fun requestMusicBrowseRoot(")
          end = text.index("\n    private fun homeFeedInnerTube", start)
          browse_replacement = """    private fun requestMusicBrowseRoot(
              languageCode: String,
              browseId: String,
              params: String = "",
              continuation: String = ""
          ): JSONObject? {
              return resilienceClient.browse(languageCode, browseId, params, continuation)
          }
          """
          text = text[:start] + browse_replacement + text[end:]

          if text.count("private val resilienceClient =") != 1:
              raise SystemExit("Unexpected resilience client field count")
          if "/youtubei/v1/search?key=" in text or "/youtubei/v1/browse?key=" in text:
              raise SystemExit("Legacy direct request implementation still present")
          repository_path.write_text(text)
          PYCODE

          rm -f .github/workflows/agent-youtube-media-fallback.yml
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add resilient YouTube Music fallback'
          git push origin HEAD:agent/youtube-media-fallback
