name: Liquid Glass branch patch

on:
  push:
    branches:
      - feat/global-liquid-glass-ui

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[glass-patcher]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-liquid-glass-ui
          fetch-depth: 0
      - name: Apply guarded source patch
        run: python3 scripts/liquid_glass_branch_patch.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ui): wire liquid glass preference [glass-patcher]"
          git push origin HEAD:feat/global-liquid-glass-ui
