name: Home Collections Polish

on:
  push:
    branches:
      - feat/home-ytmusic-style
    paths:
      - .github/workflows/home-collections-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/home-ytmusic-style
          fetch-depth: 0

      - name: Polish Levyra Collections cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "private val HOME_COLLECTION_CARD_WIDTH = 180.dp": "private val HOME_COLLECTION_CARD_WIDTH = 178.dp",
              "private val HOME_COLLECTION_CARD_HEIGHT = 96.dp": "private val HOME_COLLECTION_CARD_HEIGHT = 166.dp",
              "private val HOME_COLLECTION_CARD_CORNER = 8.dp": "private val HOME_COLLECTION_CARD_CORNER = 12.dp",
              "private val HOME_COLLECTION_COMPACT_WIDTH = 188.dp": "private val HOME_COLLECTION_COMPACT_WIDTH = 170.dp",
              "private val HOME_COLLECTION_ART_SIZE = 64.dp": "private val HOME_COLLECTION_ART_SIZE = 78.dp",
              "private val HOME_COLLECTION_ART_INSET = 10.dp": "private val HOME_COLLECTION_ART_INSET = 12.dp",
              "private val HOME_COLLECTION_TEXT_END_PADDING = 12.dp": "private val HOME_COLLECTION_TEXT_END_PADDING = 14.dp",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          anchor = "private val HOME_COLLECTION_TEXT_END_PADDING = 14.dp\n"
          if text.count(anchor) != 1:
              raise RuntimeError("Collection padding anchor not found exactly once")
          text = text.replace(anchor, anchor + "private val HOME_COLLECTION_CARD_GAP = 10.dp\n", 1)

          shelf_start = text.index("private fun HomeEditorialCollectionsShelf(")
          shelf_end = text.index("@Composable\nprivate fun HomeEditorialCollectionCard(", shelf_start)
          shelf = text[shelf_start:shelf_end]
          old_gap = "horizontalArrangement = Arrangement.spacedBy(LevyraHomeDesign.ShelfItemGap)"
          if shelf.count(old_gap) != 1:
              raise RuntimeError(f"Expected one collection shelf gap, found {shelf.count(old_gap)}")
          shelf = shelf.replace(old_gap, "horizontalArrangement = Arrangement.spacedBy(HOME_COLLECTION_CARD_GAP)", 1)
          text = text[:shelf_start] + shelf + text[shelf_end:]

          card_start = text.index("private fun HomeEditorialCollectionCard(")
          card_end = text.index("@Composable\nprivate fun HomeEditorialArtworkStack(", card_start)
          card = text[card_start:card_end]

          card_replacements = {
              "targetValue = if (isPressed && effectiveAnimationsEnabled) 0.972f else 1f": "targetValue = if (isPressed && effectiveAnimationsEnabled) 0.982f else 1f",
              "val titleSize = if (compact) 15.sp else 16.5.sp": "val titleSize = if (compact) 16.sp else 18.sp",
              "val titleLineHeight = if (compact) 16.5.sp else 18.sp": "val titleLineHeight = if (compact) 18.sp else 20.sp",
              "val artworkTilt = if (visualIndex % 2 == 0) 6f else -5f": "val artworkTilt = if (visualIndex % 2 == 0) 4f else -4f",
              "border = BorderStroke(Dp.Hairline, Color.White.copy(alpha = 0.14f))": "border = BorderStroke(Dp.Hairline, Color.White.copy(alpha = 0.10f))",
              ".shadow(9.dp, RoundedCornerShape(9.dp))": ".shadow(8.dp, RoundedCornerShape(10.dp))",
              "start = 14.dp,\n                        top = 12.dp,\n                        end = HOME_COLLECTION_TEXT_END_PADDING,\n                        bottom = 11.dp": "start = 16.dp,\n                        top = 14.dp,\n                        end = HOME_COLLECTION_TEXT_END_PADDING,\n                        bottom = 13.dp",
              "Column(verticalArrangement = Arrangement.spacedBy(5.dp))": "Column(verticalArrangement = Arrangement.spacedBy(6.dp))",
              "color = Color.White.copy(alpha = 0.72f),\n                        fontSize = 8.5.sp,\n                        lineHeight = LevyraTypeRhythm.lineHeight(8.5.sp),": "color = Color.White.copy(alpha = 0.78f),\n                        fontSize = 9.sp,\n                        lineHeight = LevyraTypeRhythm.lineHeight(9.sp),",
              "letterSpacing = 0.75.sp": "letterSpacing = 0.8.sp",
              "color = Color.White.copy(alpha = 0.80f),\n                        fontSize = 10.sp,\n                        lineHeight = 12.sp,": "color = Color.White.copy(alpha = 0.82f),\n                        fontSize = 11.sp,\n                        lineHeight = 13.sp,",
          }
          for old, new in card_replacements.items():
              count = card.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one card occurrence of {old!r}, found {count}")
              card = card.replace(old, new, 1)

          text = text[:card_start] + card + text[card_end:]
          path.write_text(text, encoding="utf-8")
          PY

          git diff -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --check

      - name: Commit polish and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/home-collections-polish.yml
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/home-collections-polish.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(home): polish Levyra Collections cards"
          git push origin HEAD:feat/home-ytmusic-style
