name: Desktop Windows Build

on:
  pull_request:
    paths:
      - "desktop/**"
      - "third_party/LevyraExtractor/**"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "desktop/**"
      - "third_party/LevyraExtractor/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile modules and run tests
        shell: bash
        working-directory: desktop
        run: ./gradlew --stacktrace assemble check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: levyra-desktop-test-reports
          path: |
            desktop/core/build/reports/tests
            desktop/player/build/reports/tests
          retention-days: 7
          if-no-files-found: ignore

  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve Levyra version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content gradle.properties | Where-Object { $_ -match '^levyraVersionName=' } | Select-Object -First 1
          if (-not $line) {
            throw "levyraVersionName non trovato in gradle.properties"
          }
          $version = ($line -split '=', 2)[1].Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Versione Levyra non valida: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Levyra Windows version: $version"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          function Find-WixBin {
            Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
              Select-Object -First 1
          }

          $bin = Find-WixBin
          if (-not $bin) {
            choco install wixtoolset --no-progress --yes
            $bin = Find-WixBin
          }
          if (-not $bin) {
            throw "WiX Toolset 3 non disponibile sul runner"
          }
          Write-Host "WiX Toolset: $bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Build portable distribution
        shell: pwsh
        working-directory: desktop
        run: .\gradlew.bat --stacktrace createReleaseDistributable -PlevyraDesktopVersion="${{ steps.version.outputs.version }}"

      - name: Build installers
        shell: pwsh
        working-directory: desktop
        run: .\gradlew.bat --stacktrace packageReleaseMsi packageReleaseExe -PlevyraDesktopVersion="${{ steps.version.outputs.version }}"

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $output = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $msi = Get-ChildItem "desktop/app/build/compose/binaries/main-release/msi" -Filter "*.msi" | Select-Object -First 1
          $exe = Get-ChildItem "desktop/app/build/compose/binaries/main-release/exe" -Filter "*.exe" | Select-Object -First 1
          $portable = "desktop/app/build/compose/binaries/main-release/app"

          if (-not $msi) {
            throw "Installer MSI non trovato"
          }
          if (-not $exe) {
            throw "Installer EXE non trovato"
          }
          if (-not (Test-Path $portable)) {
            throw "Distribuzione portabile non trovata"
          }

          $msiName = "LEVYRA-Windows-$version-x64.msi"
          $exeName = "LEVYRA-Windows-$version-x64.exe"
          $zipName = "LEVYRA-Windows-$version-portable-x64.zip"

          Copy-Item $msi.FullName (Join-Path $output $msiName)
          Copy-Item $exe.FullName (Join-Path $output $exeName)
          Compress-Archive -Path "$portable\*" -DestinationPath (Join-Path $output $zipName) -CompressionLevel Optimal -Force

          Get-ChildItem $output -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }

          Get-ChildItem $output | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: levyra-desktop-windows-${{ steps.version.outputs.version }}
          path: release-assets/*
          retention-days: 14
          if-no-files-found: error

      - name: Add Windows assets to Levyra release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $releaseFound = $false

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              $releaseFound = $true
              break
            }
            Start-Sleep -Seconds 10
          }

          if (-not $releaseFound) {
            throw "Release $tag non trovata: impossibile aggiungere i file Windows"
          }

          $assets = Get-ChildItem release-assets -File | Sort-Object Name
          if ($assets.Count -eq 0) {
            throw "Nessun asset Windows da pubblicare"
          }

          $arguments = @("release", "upload", $tag)
          $arguments += $assets.FullName
          $arguments += @("--clobber", "--repo", $env:GITHUB_REPOSITORY)
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Upload degli asset Windows non riuscito"
          }
