name: Desktop Windows Build

on:
  pull_request:
    paths:
      - "desktop/**"
      - "gradle.properties"
      - "app/src/main/java/com/luc4n3x/levyra/data/hqaudio/**"
      - "app/src/main/java/com/luc4n3x/levyra/data/PlaybackConcurrency.kt"
      - "app/src/main/java/com/luc4n3x/levyra/data/spotify/SpotifyArtistAudience.kt"
      - "app/src/main/java/com/luc4n3x/levyra/data/spotify/SpotifyHttpBody.kt"
      - "app/src/main/java/com/luc4n3x/levyra/ui/update/LevyraReleaseContent.kt"
      - "app/src/main/java/com/luc4n3x/levyra/ui/theme/LevyraTypeRhythm.kt"
      - "app/src/main/java/com/luc4n3x/levyra/update/AppUpdateProgress.kt"
      - "app/src/main/java/com/luc4n3x/levyra/update/ReleaseHighlights.kt"
      - "app/src/main/res/drawable*/onboarding_levyra_brand.*"
      - "app/src/main/java/com/luc4n3x/levyra/domain/**"
      - "app/src/main/java/com/luc4n3x/levyra/ui/i18n/**"
      - "app/src/main/java/com/luc4n3x/levyra/player/offline/TidalDashFlac.kt"
      - "app/src/test/java/com/luc4n3x/levyra/data/hqaudio/**"
      - "app/src/test/resources/**"
      - "third_party/LevyraExtractor/**"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "desktop/**"
      - "gradle.properties"
      - "third_party/LevyraExtractor/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: Version of the verified Android release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}-${{ inputs.release_version || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile modules and run tests
        shell: bash
        working-directory: desktop
        run: |
          set +e
          ./gradlew --stacktrace assemble check > gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Desktop Gradle build failed. Last 240 lines:"
            tail -n 240 gradle-build.log
            exit "$status"
          fi
          tail -n 80 gradle-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: levyra-desktop-build-log
          path: desktop/gradle-build.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: levyra-desktop-test-reports
          path: |
            desktop/core/build/reports/tests
            desktop/player/build/reports/tests
            desktop/app/build/reports/tests
          retention-days: 7
          if-no-files-found: ignore

  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: verify
    outputs:
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve desktop version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $versionFile = "gradle.properties"
          if (-not (Test-Path $versionFile)) { throw "$versionFile non trovato" }
          $line = Get-Content $versionFile | Where-Object { $_ -match '^levyraVersionName=' } | Select-Object -First 1
          if (-not $line) { throw "levyraVersionName non trovato in $versionFile" }
          $version = ($line -split '=', 2)[1].Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$') { throw "Versione Levyra Desktop non valida: $version" }
          if ($env:RELEASE_VERSION -and $version -cne $env:RELEASE_VERSION) { throw "La versione Windows non corrisponde alla release Android $env:RELEASE_VERSION" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Levyra Desktop version: $version"
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          function Find-WixBin {
            Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
              Select-Object -First 1
          }
          $bin = Find-WixBin
          if (-not $bin) {
            choco install wixtoolset --no-progress --yes
            $bin = Find-WixBin
          }
          if (-not $bin) { throw "WiX Toolset 3 non disponibile sul runner" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Build portable distribution
        shell: pwsh
        working-directory: desktop
        run: .\gradlew.bat --stacktrace createReleaseDistributable
      - name: Build installers
        shell: pwsh
        working-directory: desktop
        run: .\gradlew.bat --stacktrace packageReleaseMsi packageReleaseExe
      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $output = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $msi = Get-ChildItem "desktop/app/build/compose/binaries/main-release/msi" -Filter "*.msi" | Select-Object -First 1
          $exe = Get-ChildItem "desktop/app/build/compose/binaries/main-release/exe" -Filter "*.exe" | Select-Object -First 1
          $portable = "desktop/app/build/compose/binaries/main-release/app"
          if (-not $msi) { throw "Installer MSI non trovato" }
          if (-not $exe) { throw "Installer EXE non trovato" }
          if (-not (Test-Path $portable)) { throw "Distribuzione portabile non trovata" }
          $msiName = "LEVYRA-Windows-$version-x64.msi"
          $exeName = "LEVYRA-Windows-$version-x64.exe"
          $zipName = "LEVYRA-Windows-$version-portable-x64.zip"
          Copy-Item $msi.FullName (Join-Path $output $msiName)
          Copy-Item $exe.FullName (Join-Path $output $exeName)
          Compress-Archive -Path "$portable\*" -DestinationPath (Join-Path $output $zipName) -CompressionLevel Optimal -Force
          Get-ChildItem $output -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }
          $expected = @(
            $msiName,
            "$msiName.sha256",
            $exeName,
            "$exeName.sha256",
            $zipName,
            "$zipName.sha256"
          )
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path $output $name))) {
              throw "Asset Windows obbligatorio non trovato: $name"
            }
          }
      - name: Smoke test the Windows MSI
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $msi = Join-Path $PWD "release-assets/LEVYRA-Windows-$version-x64.msi"
          $installDir = Join-Path $env:RUNNER_TEMP "levyra-msi-smoke"
          $log = Join-Path $env:RUNNER_TEMP "levyra-msi-smoke.log"
          $arguments = '/i "{0}" INSTALLDIR="{1}" /quiet /norestart /L*v "{2}"' -f $msi, $installDir, $log
          $install = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed with exit code $($install.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir "Levyra.exe") -PathType Leaf)) {
            throw "Levyra.exe missing from the MSI installation"
          }
      - name: Upload MSI smoke test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: levyra-windows-msi-smoke
          path: ${{ runner.temp }}/levyra-msi-smoke.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: levyra-desktop-windows-${{ steps.version.outputs.version }}
          path: release-assets/*
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish Windows release
    if: inputs.release_version != '' && github.ref == 'refs/heads/main'
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: levyra-desktop-windows-${{ needs.installer.outputs.version }}
          path: release-assets
      - name: Publish immutable desktop release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LEVYRA_DESKTOP_VERSION: ${{ needs.installer.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $version = $env:LEVYRA_DESKTOP_VERSION
          $tag = "desktop-v$version"
          $repo = $env:GITHUB_REPOSITORY
          $remote = "https://github.com/$repo.git"
          $releaseAssets = Join-Path $PWD "release-assets"
          $downloadRoot = Join-Path $env:RUNNER_TEMP "levyra-existing-release-$version"
          $msiName = "LEVYRA-Windows-$version-x64.msi"
          $exeName = "LEVYRA-Windows-$version-x64.exe"
          $zipName = "LEVYRA-Windows-$version-portable-x64.zip"
          $remoteAssetsByName = @{}

          function Resolve-TagCommit([string]$tagName) {
            $tagRef = "refs/tags/$tagName"
            $peeledRef = "$tagRef^{}"
            $lines = @(git ls-remote --exit-code --tags $remote $tagRef $peeledRef 2>$null)
            if ($LASTEXITCODE -ne 0) { return $null }

            $resolved = $null
            foreach ($line in $lines) {
              $parts = $line -split '\s+', 2
              if ($parts.Count -ne 2) { continue }
              if ($parts[1] -eq $tagRef) {
                $resolved = $parts[0]
              }
              if ($parts[1] -eq $peeledRef) {
                $resolved = $parts[0]
                break
              }
            }
            if ([string]::IsNullOrWhiteSpace($resolved)) { return $null }
            return $resolved.Trim()
          }

          function Get-FileDigest([string]$path) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "File non trovato per la verifica SHA-256: $path"
            }
            return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          function Read-Checksum([string]$path) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Checksum non trovato: $path"
            }
            $value = ((Get-Content -LiteralPath $path -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            if ($value -notmatch '^[0-9a-f]{64}$') {
              throw "Checksum SHA-256 non valido in $path"
            }
            return $value
          }

          function Download-ReleaseAsset([string]$assetName, [string]$directory) {
            $metadata = $remoteAssetsByName[$assetName]
            if ($null -eq $metadata) {
              throw "Metadati GitHub mancanti per l'asset $assetName"
            }
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            $path = Join-Path $directory $assetName
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
            gh release download $tag --repo $repo --pattern $assetName --dir $directory
            if ($LASTEXITCODE -ne 0) {
              throw "Impossibile scaricare l'asset esistente $assetName"
            }
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "GitHub non ha restituito l'asset esistente $assetName"
            }
            if ($null -eq $metadata.size) {
              throw "Dimensione GitHub mancante per l'asset $assetName"
            }
            $declaredSize = [int64]$metadata.size
            $downloadedSize = [int64](Get-Item -LiteralPath $path).Length
            if ($downloadedSize -ne $declaredSize) {
              throw "Asset $assetName incompleto: GitHub dichiara $declaredSize byte, scaricati $downloadedSize byte"
            }
            return $path
          }

          gh release view $tag --repo $repo *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $remoteTag = git ls-remote --exit-code --tags $remote "refs/tags/$tag" 2>$null
          $tagQueryExit = $LASTEXITCODE
          $tagExists = switch ($tagQueryExit) {
            0 { $true }
            2 { $false }
            default { throw "Impossibile verificare l'esistenza del tag remoto $tag (git ls-remote exit $tagQueryExit)" }
          }

          if ($tagExists) {
            $tagCommit = Resolve-TagCommit $tag
            if (-not $tagCommit) { throw "Impossibile risolvere il commit del tag $tag" }
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "La versione Desktop $version è già legata al commit $tagCommit. Aggiornare levyraVersionName in gradle.properties prima di pubblicare un nuovo build."
            }
          }

          if (-not $releaseExists) {
            $releaseFlags = @()
            if ($version.Contains("-")) { $releaseFlags += "--prerelease" }
            $assets = @(Get-ChildItem -LiteralPath $releaseAssets -File | Select-Object -ExpandProperty FullName)
            foreach ($name in @($msiName, $exeName, $zipName)) {
              $digest = Get-FileDigest (Join-Path $releaseAssets $name)
              if ($digest -ne (Read-Checksum (Join-Path $releaseAssets "$name.sha256"))) {
                throw "Checksum locale non valido per $name"
              }
            }
            $androidNotes = gh release view "v$version" --repo $repo --json body --jq .body
            if ($LASTEXITCODE -ne 0) { throw "Impossibile leggere le novità della release Android v$version" }
            $highlights = [regex]::Match(($androidNotes -join "`n"), '(?s)<!-- levyra-highlights.*?-->').Value
            $notesFile = Join-Path $env:RUNNER_TEMP "levyra-windows-release-notes.md"
            @("Windows packages for Levyra $version, built from the Android release revision.", "", $highlights) |
              Set-Content -LiteralPath $notesFile -Encoding utf8
            gh release create $tag @assets --repo $repo --target $env:GITHUB_SHA --title "Levyra Windows $version" --notes-file $notesFile --latest=false @releaseFlags
            if ($LASTEXITCODE -ne 0) { throw "Impossibile creare la release desktop $tag" }
          }

          $releaseJson = gh release view $tag --repo $repo --json assets,isDraft,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw "Impossibile leggere gli asset esistenti di $tag" }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft -and -not $tagExists -and $release.targetCommitish -cne $env:GITHUB_SHA) {
            throw "La bozza $tag non corrisponde al commit della release Android"
          }
          $remoteAssets = @($release.assets)
          foreach ($remoteAsset in $remoteAssets) {
            $remoteAssetsByName[[string]$remoteAsset.name] = $remoteAsset
          }
          $existingNames = @($remoteAssetsByName.Keys)

          $pairs = @(
            [pscustomobject]@{ Artifact = $msiName; Checksum = "$msiName.sha256" },
            [pscustomobject]@{ Artifact = $exeName; Checksum = "$exeName.sha256" },
            [pscustomobject]@{ Artifact = $zipName; Checksum = "$zipName.sha256" }
          )

          foreach ($pair in $pairs) {
            $localArtifact = Join-Path $releaseAssets $pair.Artifact
            $localChecksum = Join-Path $releaseAssets $pair.Checksum
            $localDigest = Get-FileDigest $localArtifact
            $declaredLocalDigest = Read-Checksum $localChecksum
            if ($localDigest -ne $declaredLocalDigest) {
              throw "La coppia locale $($pair.Artifact) / $($pair.Checksum) non è coerente"
            }

            $artifactExists = $pair.Artifact -in $existingNames
            $checksumExists = $pair.Checksum -in $existingNames
            $pairDirectory = Join-Path $downloadRoot ([IO.Path]::GetFileNameWithoutExtension($pair.Artifact))

            if ($artifactExists -and $checksumExists) {
              $existingArtifact = Download-ReleaseAsset $pair.Artifact $pairDirectory
              $existingChecksum = Download-ReleaseAsset $pair.Checksum $pairDirectory
              $existingDigest = Get-FileDigest $existingArtifact
              $declaredExistingDigest = Read-Checksum $existingChecksum
              if ($existingDigest -ne $declaredExistingDigest) {
                throw "La release $tag contiene una coppia non valida: $($pair.Artifact) / $($pair.Checksum). Gli asset pubblicati non vengono sostituiti."
              }
              Write-Host "Coppia già pubblicata e verificata: $($pair.Artifact)"
              continue
            }

            if ($artifactExists -and -not $checksumExists) {
              $existingArtifact = Download-ReleaseAsset $pair.Artifact $pairDirectory
              $existingDigest = Get-FileDigest $existingArtifact
              $recoveryChecksum = Join-Path $pairDirectory $pair.Checksum
              if ($existingDigest -ne $localDigest) {
                Write-Host "::warning::L'asset pubblicato $($pair.Artifact) differisce dal build corrente; il checksum viene ricostruito dall'asset immutabile già pubblicato."
              }
              "$existingDigest  $($pair.Artifact)" | Set-Content -LiteralPath $recoveryChecksum -Encoding ascii -NoNewline
              gh release upload $tag $recoveryChecksum --repo $repo
              if ($LASTEXITCODE -ne 0) {
                throw "Impossibile completare la coppia pubblicata per $($pair.Artifact)"
              }
              Write-Host "Checksum ricostruito dall'asset già pubblicato: $($pair.Checksum)"
              continue
            }

            if (-not $artifactExists -and $checksumExists) {
              $existingChecksum = Download-ReleaseAsset $pair.Checksum $pairDirectory
              $declaredExistingDigest = Read-Checksum $existingChecksum
              if ($localDigest -ne $declaredExistingDigest) {
                throw "La release $tag contiene $($pair.Checksum) per un build differente. Aggiornare levyraVersionName in gradle.properties o rimuovere manualmente l'asset orfano."
              }
              gh release upload $tag $localArtifact --repo $repo
              if ($LASTEXITCODE -ne 0) {
                throw "Impossibile completare la coppia pubblicata per $($pair.Checksum)"
              }
              Write-Host "Artifact compatibile aggiunto al checksum esistente: $($pair.Artifact)"
              continue
            }

            gh release upload $tag $localArtifact $localChecksum --repo $repo
            if ($LASTEXITCODE -ne 0) {
              throw "Upload non riuscito per la coppia $($pair.Artifact) / $($pair.Checksum)"
            }
            Write-Host "Coppia pubblicata: $($pair.Artifact) / $($pair.Checksum)"
          }

          $finalJson = gh release view $tag --repo $repo --json assets
          if ($LASTEXITCODE -ne 0) { throw "Impossibile verificare la release finale $tag" }
          $finalNames = @((($finalJson | ConvertFrom-Json).assets | ForEach-Object { $_.name }))
          foreach ($pair in $pairs) {
            if ($pair.Artifact -notin $finalNames -or $pair.Checksum -notin $finalNames) {
              throw "Release incompleta: manca la coppia $($pair.Artifact) / $($pair.Checksum)"
            }
          }
          if ($release.isDraft) {
            gh release edit $tag --repo $repo --draft=false --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Impossibile pubblicare la bozza $tag" }
          }
          Write-Host "Release immutabile $tag completa: tutte le coppie artifact/checksum sono presenti e coerenti."
