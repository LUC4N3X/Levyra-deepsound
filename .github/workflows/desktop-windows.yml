name: Desktop Windows Build

on:
  pull_request:
    paths:
      - "desktop/**"
      - "third_party/LevyraExtractor/**"
      - ".github/scripts/fix_pr265.py"
      - ".github/workflows/fix-pr265.yml"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Compile, test and apply PR 265 fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Apply targeted fixes
        run: python .github/scripts/fix_pr265.py
      - name: Compile modules and run tests
        shell: bash
        working-directory: desktop
        run: |
          set +e
          ./gradlew --stacktrace assemble check > gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Desktop Gradle build failed. Last 240 lines:"
            tail -n 240 gradle-build.log
            exit "$status"
          fi
          tail -n 100 gradle-build.log
      - name: Commit verified fixes to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop
          git rm -f .github/scripts/fix_pr265.py .github/workflows/fix-pr265.yml
          git diff --cached --check
          git commit -m "fix desktop CI and CodeRabbit findings"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: levyra-desktop-build-log
          path: desktop/gradle-build.log
          retention-days: 7
          if-no-files-found: ignore
