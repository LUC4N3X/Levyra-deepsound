name: Apply Compile Warning Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'feat/central-ytm-editorial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Prepare ephemeral signing
        shell: bash
        run: |
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null
      - name: Apply guarded cleanup
        run: python3 tools/apply_compile_warning_cleanup.py
      - name: Compile and capture warnings
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon \
            :LevyraNexus:compileKotlin \
            :app:compileDebugKotlin \
            :app:lintDebug \
            --stacktrace 2>&1 | tee compile-warning-cleanup.log
      - name: Verify warning cleanup
        shell: bash
        run: |
          set -euo pipefail
          if grep -E 'w: file:///.+(app/src/main|third_party/LevyraNexus)' compile-warning-cleanup.log; then
            echo 'Kotlin source warnings remain.'
            exit 1
          fi
          ! grep -R 'Icons.Rounded.OpenInNew' \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/main/java/com/luc4n3x/levyra/ui/support/OpenSourceSupportPrompt.kt
          grep -q '@file:androidx.annotation.OptIn' \
            app/src/main/java/com/luc4n3x/levyra/player/offline/OfflineAudioExporter.kt
      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            third_party/LevyraNexus/src/main/kotlin/com/luc4n3x/levyra/nexus/network/LevyraRouteEngine.kt \
            app/src/main/java/com/luc4n3x/levyra/data/AlbumDescriptionRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/data/ChartsRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicChartsRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/data/lore/ArtistLoreRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/player/offline/OfflineAudioExporter.kt \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/main/java/com/luc4n3x/levyra/ui/support/OpenSourceSupportPrompt.kt
          git reset -- tools/apply_compile_warning_cleanup.py .github/workflows/apply-compile-warning-cleanup.yml
          git commit -m 'chore(android): remove compiler deprecation warnings'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
