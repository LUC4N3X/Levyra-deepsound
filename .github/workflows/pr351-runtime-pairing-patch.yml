name: Apply PR 351 runtime pairing patch

on:
  push:
    branches:
      - fix/editorial-video-pairing-missing-metadata

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/editorial-video-pairing-missing-metadata

      - name: Apply minimal runtime fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt")
          text = path.read_text()

          old_entry = '''    private suspend fun preferredVideoPlaybackTrack(track: Track): Track? {
              val sourceId = PlaybackSourceIdentity.sourceVideoId(track)
          '''
          new_entry = '''    private suspend fun preferredVideoPlaybackTrack(track: Track): Track? {
              verifiedCounterpartVideoTrack(track)?.let { return it }
              val sourceId = PlaybackSourceIdentity.sourceVideoId(track)
          '''
          if text.count(old_entry) != 1:
              raise SystemExit(f"expected one preferredVideoPlaybackTrack anchor, found {text.count(old_entry)}")
          text = text.replace(old_entry, new_entry, 1)

          old_helper_anchor = '''private val YOUTUBE_PLAYABLE_VIDEO_ID = Regex("^[A-Za-z0-9_-]{11}$")

          internal fun youtubePlayableTrack(track: Track, preferVideo: Boolean = false): Track? {
          '''
          new_helper_anchor = '''private val YOUTUBE_PLAYABLE_VIDEO_ID = Regex("^[A-Za-z0-9_-]{11}$")

          internal fun verifiedCounterpartVideoTrack(track: Track): Track? {
              val audioId = track.audioVideoId.trim().takeIf(YOUTUBE_PLAYABLE_VIDEO_ID::matches).orEmpty()
              val videoId = track.counterpartVideoId.trim().takeIf(YOUTUBE_PLAYABLE_VIDEO_ID::matches).orEmpty()
              if (audioId.isBlank() || videoId.isBlank() || audioId == videoId) return null
              return track.copy(
                  videoUrl = "https://www.youtube.com/watch?v=$videoId",
                  audioVideoId = audioId,
              )
          }

          internal fun youtubePlayableTrack(track: Track, preferVideo: Boolean = false): Track? {
          '''
          if text.count(old_helper_anchor) != 1:
              raise SystemExit(f"expected one youtubePlayableTrack anchor, found {text.count(old_helper_anchor)}")
          text = text.replace(old_helper_anchor, new_helper_anchor, 1)
          path.write_text(text)
          PY

          git diff --check
          grep -n -A 8 -B 2 'verifiedCounterpartVideoTrack' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          git rm .github/workflows/pr351-runtime-pairing-patch.yml
          git commit -m "fix(playback): honor verified video pairing"
          git push origin HEAD:fix/editorial-video-pairing-missing-metadata
