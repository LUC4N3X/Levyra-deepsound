name: Validate Core Stabilization Patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply checked stabilization patch
        run: python3 scripts/apply_core_stabilization.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Save patched sources
        uses: actions/upload-artifact@v7
        with:
          name: core-stabilization-patched-sources
          path: |
            app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt
            app/src/main/java/com/luc4n3x/levyra/player/PlaybackService.kt
            app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          if-no-files-found: error
