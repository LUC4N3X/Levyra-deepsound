name: Apply Core Stabilization

on:
  push:
    branches:
      - agent/stabilize-playback-core
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-core-stabilization
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/stabilize-playback-core
          fetch-depth: 0

      - name: Apply stabilization
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'private val singleFlight = PlaybackSingleFlight' app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt; then
            echo "PlaybackResolver.kt is already stabilized."
          else
            python3 scripts/apply_core_stabilization.py
          fi

      - name: Validate patch
        run: git diff --check

      - name: Commit stabilized resolver
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt; then
            echo "PlaybackResolver.kt is already stabilized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt
          git commit -m "fix: commit playback stabilization"
          git push origin HEAD:agent/stabilize-playback-core
