name: Apply reliable artist search

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/reliable-artist-search' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply artist search patch
        run: python3 .github/scripts/apply_reliable_artist_search.py

      - name: Run focused tests
        run: ./gradlew :app:testDebugUnitTest --tests com.luc4n3x.levyra.viewmodel.ReliableArtistSearchTest --no-daemon

      - name: Compile Android app
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit patch and remove temporary files
        run: |
          rm .github/scripts/apply_reliable_artist_search.py
          rm .github/workflows/apply-reliable-artist-search.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt \
                  .github/scripts/apply_reliable_artist_search.py \
                  .github/workflows/apply-reliable-artist-search.yml
          git commit -m "fix(search): resolve exact artists independently"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
