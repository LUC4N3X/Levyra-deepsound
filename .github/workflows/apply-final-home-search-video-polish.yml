name: Apply final Home and Search polish

on:
  push:
    branches:
      - refactor/home-experience
    paths:
      - .github/workflows/apply-final-home-search-video-polish.yml

permissions:
  contents: write

concurrency:
  group: apply-final-home-search-video-polish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Apply video previews and Search redesign
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')

          anchor = 'import com.luc4n3x.levyra.data.LevyraArtworkStartupMetrics\n'
          playback_import = 'import com.luc4n3x.levyra.data.PlaybackSourceIdentity\n'
          if playback_import not in text:
              if anchor not in text:
                  raise SystemExit('Artwork import anchor not found')
              text = text.replace(anchor, anchor + playback_import, 1)

          old_call = '''                    HomeMusicVideoShelf(
                        title = strings.exploreNewVideos,
                        tracks = homeVideoTracks,
                        currentId = state.currentTrack?.id,
                        isPlaying = state.isPlaying,
                        isResolving = state.isResolving,
                        onPlay = { track -> viewModel.playFrom(homeVideoTracks, track) },
                        onPlayAll = { viewModel.playAll(homeVideoTracks) }
                    )
'''
          new_call = '''                    HomeMusicVideoShelf(
                        title = strings.video,
                        tracks = homeVideoTracks,
                        currentId = state.currentTrack?.id,
                        isPlaying = state.isPlaying,
                        isResolving = state.isResolving,
                        onPlay = { track -> viewModel.playFrom(homeVideoTracks, track) }
                    )
'''
          if text.count(old_call) != 1:
              raise SystemExit(f'Expected one video shelf call, found {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)

          old_signature = '''private fun HomeMusicVideoShelf(
    title: String,
    tracks: List<Track>,
    currentId: String?,
    isPlaying: Boolean,
    isResolving: Boolean,
    onPlay: (Track) -> Unit,
    onPlayAll: () -> Unit
) {
    val videos = remember(tracks) { LevyraPersonalOrbit.distinctRecordings(tracks).take(12) }
    Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
        HomeSectionInset { SectionHeaderAction(title, onPlayAll) }
'''
          new_signature = '''private fun HomeMusicVideoShelf(
    title: String,
    tracks: List<Track>,
    currentId: String?,
    isPlaying: Boolean,
    isResolving: Boolean,
    onPlay: (Track) -> Unit
) {
    val videos = remember(tracks) {
        LevyraPersonalOrbit.distinctRecordings(tracks)
            .take(12)
            .map(::homeMusicVideoPreviewTrack)
    }
    Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
        HomeSectionInset { HomeSectionHeader(title) }
'''
          if text.count(old_signature) != 1:
              raise SystemExit(f'Expected one video shelf signature, found {text.count(old_signature)}')
          text = text.replace(old_signature, new_signature, 1)

          old_card = '''                Column(
                    modifier = Modifier.width(154.dp).pressable(onClick = { onPlay(track) }),
                    verticalArrangement = Arrangement.spacedBy(7.dp)
                ) {
                    Box(
                        modifier = Modifier
                            .fillMaxWidth()
                            .aspectRatio(1f)
                            .clip(RoundedCornerShape(22.dp))
                            .border(
                                if (active) 1.5.dp else Dp.Hairline,
                                if (active) LevyraCyan.copy(alpha = 0.82f) else LevyraAdaptiveSoftHairline,
                                RoundedCornerShape(22.dp)
                            )
                    ) {
                        CoverImage(track = track, modifier = Modifier.fillMaxSize(), highRes = true, zoom = 1.03f)
'''
          new_card = '''                Column(
                    modifier = Modifier.width(236.dp).pressable(onClick = { onPlay(track) }),
                    verticalArrangement = Arrangement.spacedBy(7.dp)
                ) {
                    Box(
                        modifier = Modifier
                            .fillMaxWidth()
                            .aspectRatio(16f / 9f)
                            .clip(LevyraHomeDesign.ShelfShape)
                            .border(
                                if (active) 1.5.dp else Dp.Hairline,
                                if (active) LevyraCyan.copy(alpha = 0.82f) else LevyraAdaptiveSoftHairline,
                                LevyraHomeDesign.ShelfShape
                            )
                    ) {
                        CoverImage(track = track, modifier = Modifier.fillMaxSize(), highRes = true, zoom = 1f)
'''
          if text.count(old_card) != 1:
              raise SystemExit(f'Expected one square video card, found {text.count(old_card)}')
          text = text.replace(old_card, new_card, 1)

          helper_anchor = '''private fun isMusicVideoSectionTitle(title: String, strings: LevyraStrings): Boolean {
'''
          helper = '''private val HomeVideoIdPattern = Regex("[A-Za-z0-9_-]{11}")

private fun homeMusicVideoPreviewTrack(track: Track): Track {
    val videoId = track.counterpartVideoId
        .trim()
        .takeIf(HomeVideoIdPattern::matches)
        ?: PlaybackSourceIdentity.sourceVideoId(track)
            .trim()
            .takeIf(HomeVideoIdPattern::matches)
        ?: return track
    return track.copy(
        thumbnailUrl = "https://i.ytimg.com/vi/$videoId/mqdefault.jpg",
        largeThumbnailUrl = "https://i.ytimg.com/vi/$videoId/maxresdefault.jpg"
    )
}

'''
          if 'private fun homeMusicVideoPreviewTrack' in text:
              raise SystemExit('Video preview helper already exists unexpectedly')
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'Expected one video helper anchor, found {text.count(helper_anchor)}')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_search = '''        Surface(
            color = CinematicGlass.copy(alpha = 0.78f),
            border = BorderStroke(1.dp, Color.White.copy(alpha = 0.12f)),
            shape = CircleShape,
            shadowElevation = 10.dp,
            modifier = Modifier.weight(1f)
        ) {
            Row(
                modifier = Modifier
                    .fillMaxWidth()
                    .padding(horizontal = 14.dp, vertical = 2.dp),
                verticalAlignment = Alignment.CenterVertically,
                horizontalArrangement = Arrangement.spacedBy(8.dp)
            ) {
                BasicTextField(
                    value = query,
                    onValueChange = onQuery,
                    modifier = Modifier.weight(1f).padding(vertical = 10.dp),
                    singleLine = true,
                    textStyle = TextStyle(color = LevyraText, fontWeight = FontWeight.SemiBold, fontSize = 15.sp),
                    cursorBrush = SolidColor(LevyraCyan),
                    decorationBox = { innerTextField ->
                        if (query.isEmpty()) {
                            Text(strings.searchPlaceholder, color = LevyraMuted, fontWeight = FontWeight.Medium, fontSize = 15.sp)
                        }
                        innerTextField()
                    }
                )

                if (query.isNotEmpty()) {
                    IconButton(
                        onClick = onClear,
                        modifier = Modifier.size(24.dp)
                    ) {
                        Icon(
                            imageVector = Icons.Rounded.Close,
                            contentDescription = strings.clear,
                            tint = LevyraMuted,
                            modifier = Modifier.size(18.dp)
                        )
                    }
                }
            }
        }
'''
          new_search = '''        val searchShape = RoundedCornerShape(20.dp)
        Surface(
            color = if (LevyraIsLight) Color.White.copy(alpha = 0.92f) else Color(0xFF11131A),
            border = BorderStroke(
                Dp.Hairline,
                if (LevyraIsLight) Color(0x1811131F) else Color.White.copy(alpha = 0.09f)
            ),
            shape = searchShape,
            shadowElevation = if (LevyraIsLight) 3.dp else 8.dp,
            modifier = Modifier
                .weight(1f)
                .heightIn(min = 58.dp)
        ) {
            Row(
                modifier = Modifier
                    .fillMaxWidth()
                    .padding(start = 9.dp, end = 10.dp, top = 8.dp, bottom = 8.dp),
                verticalAlignment = Alignment.CenterVertically,
                horizontalArrangement = Arrangement.spacedBy(10.dp)
            ) {
                Box(
                    modifier = Modifier
                        .size(38.dp)
                        .background(
                            Brush.linearGradient(
                                listOf(
                                    LevyraCyan.copy(alpha = 0.22f),
                                    LevyraViolet.copy(alpha = 0.14f)
                                )
                            ),
                            RoundedCornerShape(13.dp)
                        ),
                    contentAlignment = Alignment.Center
                ) {
                    Icon(
                        imageVector = Icons.Rounded.Search,
                        contentDescription = null,
                        tint = LevyraCyan,
                        modifier = Modifier.size(20.dp)
                    )
                }

                BasicTextField(
                    value = query,
                    onValueChange = onQuery,
                    modifier = Modifier.weight(1f),
                    singleLine = true,
                    textStyle = TextStyle(
                        color = LevyraText,
                        fontWeight = FontWeight.SemiBold,
                        fontSize = 15.sp
                    ),
                    cursorBrush = SolidColor(LevyraCyan),
                    decorationBox = { innerTextField ->
                        Box(contentAlignment = Alignment.CenterStart) {
                            if (query.isEmpty()) {
                                Text(
                                    text = strings.searchPlaceholder,
                                    color = LevyraMuted.copy(alpha = 0.86f),
                                    fontWeight = FontWeight.Medium,
                                    fontSize = 14.5.sp,
                                    maxLines = 1,
                                    overflow = TextOverflow.Ellipsis
                                )
                            }
                            innerTextField()
                        }
                    }
                )

                if (isSearching) {
                    CircularProgressIndicator(
                        modifier = Modifier.size(20.dp),
                        strokeWidth = 2.dp,
                        color = LevyraCyan
                    )
                } else if (query.isNotEmpty()) {
                    IconButton(
                        onClick = onClear,
                        modifier = Modifier
                            .size(34.dp)
                            .background(
                                if (LevyraIsLight) Color(0x0D11131F) else Color.White.copy(alpha = 0.05f),
                                RoundedCornerShape(12.dp)
                            )
                    ) {
                        Icon(
                            imageVector = Icons.Rounded.Close,
                            contentDescription = strings.clear,
                            tint = LevyraMuted,
                            modifier = Modifier.size(18.dp)
                        )
                    }
                }
            }
        }
'''
          if text.count(old_search) != 1:
              raise SystemExit(f'Expected one Search header surface, found {text.count(old_search)}')
          text = text.replace(old_search, new_search, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f \
            .github/workflows/apply-final-home-search-video-polish.yml \
            .github/workflows/export-levyra-app.yml
          git diff --check
      - name: Commit clean changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): refine video previews and Search header"
          git push origin HEAD:refactor/home-experience
