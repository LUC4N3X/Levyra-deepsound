name: Fix Sonar Home section header literal

on:
  push:
    branches:
      - refactor/home-experience
    paths:
      - .github/workflows/fix-sonar-home-section-header.yml

permissions:
  contents: write

concurrency:
  group: fix-sonar-home-section-header
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Extract duplicated Home content type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')
          literal = '"home-section-header"'
          usage = 'contentType = "home-section-header"'
          constant = 'HOME_SECTION_HEADER_CONTENT_TYPE'
          replacement = f'contentType = {constant}'
          anchor = 'private const val HOME_HORIZONTAL_ROW_CONTENT_TYPE = "home-horizontal-row"\n'
          declaration = f'private const val {constant} = {literal}\n'

          if text.count(usage) != 6:
              raise SystemExit(f'Expected 6 duplicated contentType usages, found {text.count(usage)}')
          if constant in text:
              raise SystemExit('Constant already exists unexpectedly')
          if anchor not in text:
              raise SystemExit('Content-type constant anchor not found')

          text = text.replace(usage, replacement)
          text = text.replace(anchor, anchor + declaration, 1)

          if text.count(literal) != 1:
              raise SystemExit(f'Expected one literal in the declaration, found {text.count(literal)}')
          if text.count(replacement) != 6:
              raise SystemExit(f'Expected 6 constant usages, found {text.count(replacement)}')
          if text.count(declaration) != 1:
              raise SystemExit('Expected exactly one constant declaration')

          path.write_text(text, encoding='utf-8')
          PY
          rm -f \
            .github/workflows/fix-sonar-home-section-header.yml \
            .github/workflows/debug-home-validation.yml \
            .github/workflows/inspect-home-validation-task.yml \
            .github/workflows/export-pr-source-debug.yml \
            .github/home-validation-report.txt \
            .github/home-validation-inspection.txt
          git diff --check
      - name: Commit clean fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(home): extract section header content type"
          git push origin HEAD:refactor/home-experience
