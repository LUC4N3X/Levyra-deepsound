name: Fix PR 265

on:
  push:
    branches:
      - agent/fast-desktop-downloads-mp3
    paths:
      - .github/scripts/fix_pr265.py
      - .github/workflows/fix-pr265.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/fast-desktop-downloads-mp3
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply targeted fixes
        run: python .github/scripts/fix_pr265.py

      - name: Compile and test desktop
        working-directory: desktop
        run: ./gradlew --stacktrace assemble check

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop
          git diff --cached --check
          git commit -m "fix desktop CI and CodeRabbit findings"
          git push origin HEAD:agent/fast-desktop-downloads-mp3

# Triggered after the workflow file exists on the PR branch.
