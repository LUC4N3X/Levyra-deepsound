name: Resolve Premium Home Main Conflict

on:
  push:
    branches:
      - feat/premium-home-playlist-detail
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-premium-home-main
  cancel-in-progress: false

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/premium-home-playlist-detail
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge current main with guarded LevyraApp resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Current main is already contained in the branch. Nothing to resolve."
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected="app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "$expected" ]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[*]}"
              git merge --abort
              exit 1
            fi

            # Main owns the newly merged seasonal-promotion work. Reapply only
            # this PR's isolated Personal Orbit presentation on top of it.
            git checkout --theirs -- "$expected"
            python3 scripts/resolve_premium_home_merge.py
            git add "$expected"
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain; refusing to commit."
            exit 1
          fi

          git diff --check
          python3 scripts/ai_quality_gate.py --profile fast --base-ref origin/main

          git add -A
          if git diff --cached --quiet; then
            echo "No merge changes to commit."
            exit 0
          fi

          git commit -m "merge(main): preserve promotion and premium Home"
          git push origin HEAD:feat/premium-home-playlist-detail
