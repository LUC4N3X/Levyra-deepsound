name: Apply Strict Official Video Guard

on:
  push:
    branches:
      - feat/central-ytm-editorial

permissions:
  contents: write

concurrency:
  group: strict-official-video-guard
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/central-ytm-editorial
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply strict video selection fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one anchor in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          youtube_music = "tools/levyra-editorial/levyra_editorial/youtube_music.py"
          replace_once(
              youtube_music,
              'NON_OFFICIAL_VIDEO_TERMS = {"lyrics", "lyric", "visualizer", "visualiser", "audio"}\n',
              '''NON_OFFICIAL_VIDEO_TERMS = {"lyrics", "lyric", "visualizer", "visualiser", "audio"}\nFORBIDDEN_OFFICIAL_VIDEO_VARIANT = re.compile(\n    r"(?i)(?:^|[^a-z0-9])(?:live(?:\\s+performance)?|performance|concert|festival|acoustic|session|stage|ceremony|halftime|half\\s+time|award\\s+show|tour)(?:$|[^a-z0-9])"\n)\n''',
          )
          replace_once(
              youtube_music,
              '''    if any(term in title_key for term in ("lyrics", "lyric", "visualizer", "visualiser", "reaction")):\n        return None\n    if not candidate.get("verifiedArtist"):\n''',
              '''    if any(term in title_key for term in ("lyrics", "lyric", "visualizer", "visualiser", "reaction")):\n        return None\n    if FORBIDDEN_OFFICIAL_VIDEO_VARIANT.search(title_key):\n        return None\n    if not candidate.get("verifiedArtist"):\n''',
          )

          python_test = "tools/levyra-editorial/tests/test_youtube_music.py"
          replace_once(
              python_test,
              '\ndef test_web_selector_abstains_without_official_artist_channel() -> None:\n',
              '''\ndef test_web_selector_rejects_live_performance_from_official_artist_channel() -> None:\n    mapping = select_official_youtube_video(\n        "Dai Dai",\n        "Shakira, Burna Boy",\n        223_448,\n        [\n            {\n                "videoId": "Live1234567",\n                "title": "Shakira, Burna Boy - Dai Dai (Official Video) Live Performance at Halftime",\n                "owner": "Shakira",\n                "channelId": "UCOfficial",\n                "durationMs": 223_448,\n                "verifiedArtist": True,\n            }\n        ],\n    )\n\n    assert mapping is None\n\n\ndef test_web_selector_abstains_without_official_artist_channel() -> None:\n''',
          )

          viewmodel = "app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt"
          replace_once(
              viewmodel,
              '    val videoId = if (preferVideo) counterpart.ifBlank { regular } else regular.ifBlank { counterpart }\n',
              '    val videoId = if (preferVideo) counterpart else regular.ifBlank { counterpart }\n',
          )
          replace_once(
              viewmodel,
              '''        val requestedVideoMode = _state.value.isVideoMode\n        val playableTrack = youtubePlayableTrack(track, preferVideo = requestedVideoMode) ?: track\n        val instant = localDownloadedTrack(track) ?: resolver.cached(playableTrack, requestedVideoMode)\n''',
              '''        val requestedVideoMode = _state.value.isVideoMode\n        val playableTrack = youtubePlayableTrack(track, preferVideo = requestedVideoMode)\n        if (requestedVideoMode && playableTrack == null) {\n            if (!isActive || requestId != playRequestId) return\n            player.stop()\n            _state.update {\n                it.copy(\n                    isVideoMode = false,\n                    isResolving = false,\n                    isPlaying = false,\n                    currentTrack = track.copy(streamUrl = ""),\n                    playerError = "Video ufficiale non verificato per questo brano"\n                )\n            }\n            return\n        }\n        val selectedTrack = playableTrack ?: track\n        val instant = localDownloadedTrack(track) ?: resolver.cached(selectedTrack, requestedVideoMode)\n''',
          )
          replace_once(
              viewmodel,
              '            val playable = resolveForPlayback(track)\n',
              '            val playable = resolveForPlayback(selectedTrack)\n',
          )

          player_test = "app/src/test/java/com/luc4n3x/levyra/player/LevyraPlayerTest.kt"
          replace_once(
              player_test,
              'import org.junit.Assert.assertEquals\n',
              'import org.junit.Assert.assertEquals\nimport org.junit.Assert.assertNull\n',
          )
          replace_once(
              player_test,
              '''    private fun track(streamUrl: String): Track = Track(\n''',
              '''    @Test\n    fun youtubePlayableTrackDoesNotUseUnverifiedCurrentVideoInVideoMode() {\n        val unverified = track(streamUrl = "").copy(counterpartVideoId = "")\n\n        assertNull(youtubePlayableTrack(unverified, preferVideo = true))\n    }\n\n    private fun track(streamUrl: String): Track = Track(\n''',
          )

          workflow = Path(".github/workflows/apply-strict-official-video-guard.yml")
          workflow.unlink()
          PY

      - name: Run editorial selector tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest requests
          PYTHONPATH=tools/levyra-editorial python -m pytest -q tools/levyra-editorial/tests/test_youtube_music.py

      - name: Verify strict player guard source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          viewmodel = Path("app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt").read_text()
          tests = Path("app/src/test/java/com/luc4n3x/levyra/player/LevyraPlayerTest.kt").read_text()
          assert "val videoId = if (preferVideo) counterpart else regular.ifBlank { counterpart }" in viewmodel
          assert "Video ufficiale non verificato per questo brano" in viewmodel
          assert "resolveForPlayback(selectedTrack)" in viewmodel
          assert "youtubePlayableTrackDoesNotUseUnverifiedCurrentVideoInVideoMode" in tests
          PY

      - name: Commit verified fix
        shell: bash
        env:
          HEAD_REF: feat/central-ytm-editorial
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(video): reject unverified and live substitutes"
          git push origin "HEAD:${HEAD_REF}"
