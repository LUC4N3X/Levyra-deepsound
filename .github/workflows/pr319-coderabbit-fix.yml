name: PR 319 CodeRabbit Fix

on:
  push:
    branches:
      - feature/pro-audio-and-smart-importer

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/pro-audio-and-smart-importer
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-disabled: true

      - name: Apply CodeRabbit fixes
        run: python3 scripts/pr319_coderabbit_fix.py

      - name: Run focused regression tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.SponsorBlockRepositoryTest' \
            --tests 'com.luc4n3x.levyra.data.UniversalPlaylistImporterTest'

      - name: Commit clean result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pr319-coderabbit-fix.yml scripts/pr319_coderabbit_fix.py
          git add app/src/main/java/com/luc4n3x/levyra/data/SponsorBlockRepository.kt
          git add app/src/main/java/com/luc4n3x/levyra/data/UniversalPlaylistImporter.kt
          git add app/src/test/java/com/luc4n3x/levyra/data/SponsorBlockRepositoryTest.kt
          git diff --cached --check
          git commit -m "fix(review): address CodeRabbit cancellation findings"
          git pull --rebase origin feature/pro-audio-and-smart-importer
          git push origin HEAD:feature/pro-audio-and-smart-importer
