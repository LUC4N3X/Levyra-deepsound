name: Fix artist duration and motion review once

on:
  push:
    branches:
      - fix/instant-page-canvas

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      ORG_GRADLE_PROJECT_levyraNativeAudio: "true"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/instant-page-canvas
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: RED artist popular songs duration
        shell: bash
        run: |
          cat > app/src/test/java/com/luc4n3x/levyra/data/ArtistPopularSongsMergeTest.kt <<'EOF'
          package com.luc4n3x.levyra.data

          import com.luc4n3x.levyra.domain.Track
          import org.junit.Assert.assertEquals
          import org.junit.Test

          class ArtistPopularSongsMergeTest {
              @Test
              fun expandedSongsBackfillMissingPreviewDurationsWithoutChangingOrder() {
                  val preview = listOf(
                      track("a", 0L),
                      track("b", 0L),
                      track("c", 205_000L)
                  )
                  val expanded = listOf(
                      track("a", 181_000L),
                      track("b", 194_000L),
                      track("c", 999_000L),
                      track("d", 212_000L)
                  )

                  val merged = mergeArtistSongs(preview, expanded)

                  assertEquals(listOf("a", "b", "c", "d"), merged.map { it.id })
                  assertEquals(181_000L, merged[0].durationMs)
                  assertEquals(194_000L, merged[1].durationMs)
                  assertEquals(205_000L, merged[2].durationMs)
              }

              private fun track(id: String, durationMs: Long) = Track(
                  id = id,
                  title = "Song $id",
                  artist = "Artist",
                  album = "Album",
                  durationMs = durationMs,
                  streamUrl = "",
                  videoUrl = "",
                  thumbnailUrl = "",
                  largeThumbnailUrl = "",
                  source = "test",
                  moodTags = emptySet(),
                  energy = 0,
                  vocal = 0,
                  replayScore = 0,
                  cacheScore = 0,
                  accentStart = 0,
                  accentEnd = 0
              )
          }
          EOF
          set +e
          ./gradlew :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.data.ArtistPopularSongsMergeTest' --console=plain --warning-mode summary
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected duration regression test to fail before implementation'
            exit 1
          fi

      - name: GREEN artist popular songs duration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/data/ArtistRepository.kt')
          text = path.read_text()

          marker = 'internal fun normalizeInlineArtistBiography(value: String): ArtistBiography? {'
          if marker not in text:
              raise SystemExit('ArtistRepository insertion marker not found')

          helper = '''internal fun mergeArtistSongs(
              preview: List<Track>,
              expanded: List<Track>,
              limit: Int = 100
          ): List<Track> {
              val expandedById = expanded.associateBy { it.id }
              val seen = HashSet<String>()
              val merged = ArrayList<Track>(minOf(limit, preview.size + expanded.size))

              fun append(track: Track) {
                  if (merged.size >= limit || !seen.add(track.id)) return
                  val expandedTrack = expandedById[track.id]
                  val resolved = if (
                      track.durationMs <= 0L &&
                      expandedTrack != null &&
                      expandedTrack.durationMs > 0L
                  ) {
                      track.copy(durationMs = expandedTrack.durationMs)
                  } else {
                      track
                  }
                  merged += resolved
              }

              preview.forEach(::append)
              expanded.forEach(::append)
              return merged
          }

          '''
          text = text.replace(marker, helper + marker, 1)

          old = 'val songs = (extractTopSongs(root, name) + expanded.songs).distinctBy { it.id }.take(100)'
          new = 'val songs = mergeArtistSongs(extractTopSongs(root, name), expanded.songs)'
          if text.count(old) != 1:
              raise SystemExit(f'Artist songs merge expression expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          ./gradlew :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.data.ArtistPopularSongsMergeTest' --console=plain --warning-mode summary

      - name: RED keep static cover until Canvas first frame
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/com/luc4n3x/levyra/ui/MotionArtworkLayerTest.kt')
          text = path.read_text()
          old = '''    @Test
              fun pageMotionKeepsStaticCoverHiddenUntilFirstVideoFrame() {
                  assertFalse(
                      motionStaticBedVisible(
                          pageMode = true,
                          motionResolving = false,
                          motionVisible = false,
                          videoCandidatePending = true,
                          videoUnavailable = false
                      )
                  )
              }
          '''
          new = '''    @Test
              fun pageMotionKeepsStaticCoverVisibleUntilFirstVideoFrame() {
                  assertTrue(
                      motionStaticBedVisible(
                          pageMode = true,
                          motionResolving = false,
                          motionVisible = false,
                          videoCandidatePending = true,
                          videoUnavailable = false
                      )
                  )
              }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Motion static bed test block expected once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          set +e
          ./gradlew :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.ui.MotionArtworkLayerTest.pageMotionKeepsStaticCoverVisibleUntilFirstVideoFrame' --console=plain --warning-mode summary
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected first-frame static cover regression test to fail before implementation'
            exit 1
          fi

      - name: GREEN keep static cover until Canvas first frame
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/MotionArtworkLayer.kt')
          text = path.read_text()
          old = '    if (motionResolving || videoCandidatePending) return false\n'
          new = '    if (motionResolving) return false\n'
          if text.count(old) != 1:
              raise SystemExit(f'Motion static visibility condition expected once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          ./gradlew :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.ui.MotionArtworkLayerTest.pageMotionKeepsStaticCoverVisibleUntilFirstVideoFrame' --console=plain --warning-mode summary

      - name: RED retain late metadata enrichment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/com/luc4n3x/levyra/feature/motion/MotionArtworkRequestCoordinatorTest.kt')
          text = path.read_text()
          marker = '''    @Test
              fun cancellingLastSubscriberCancelsUnderlyingResolution() = runBlocking {
          '''
          if marker not in text:
              raise SystemExit('Motion metadata cache test insertion marker not found')
          test = '''    @Test
              fun latePreparedMetadataIsReusedAsTheNextLookupBase() {
                  val cache = MotionMetadataWarmCache(maxEntries = 4)
                  val raw = track(
                      id = "youtube-id",
                      title = "Song",
                      artist = "Wrong Artist",
                      album = "YouTube Music"
                  )
                  val prepared = raw.copy(
                      artist = "Correct Artist",
                      album = "Real Album",
                      isrc = "ITABC2600001"
                  )

                  assertEquals(null, cache.get(raw))
                  cache.put(raw, prepared)
                  assertEquals(prepared, cache.get(raw))
              }

          '''
          path.write_text(text.replace(marker, test + marker, 1))
          PY
          set +e
          ./gradlew :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.feature.motion.MotionArtworkRequestCoordinatorTest.latePreparedMetadataIsReusedAsTheNextLookupBase' --console=plain --warning-mode summary
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected late metadata retention regression test to fail before implementation'
            exit 1
          fi

      - name: GREEN retain late metadata enrichment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/feature/motion/MotionArtworkEngine.kt')
          text = path.read_text()

          import_marker = 'import java.util.Locale\n'
          if import_marker not in text:
              raise SystemExit('Locale import marker not found')
          text = text.replace(import_marker, 'import java.util.LinkedHashMap\nimport java.util.Locale\n', 1)

          property_marker = '    private val requestCoordinator = MotionArtworkRequestCoordinator(lookupScope)\n'
          if property_marker not in text:
              raise SystemExit('requestCoordinator marker not found')
          text = text.replace(
              property_marker,
              property_marker + '    private val metadataWarmCache = MotionMetadataWarmCache()\n',
              1
          )

          old = '''    private suspend fun prepareLookupTrackWithinBudget(track: Track): Track {
              val budgetMs = motionMetadataForegroundBudgetMs(track)
              if (budgetMs <= 0L) return track
              val prepared = lookupScope.async { prepareLookupTrack(track) }
              return withTimeoutOrNull(budgetMs) { prepared.await() } ?: track
          }
          '''
          new = '''    private suspend fun prepareLookupTrackWithinBudget(track: Track): Track {
              val remembered = metadataWarmCache.get(track) ?: track
              val budgetMs = motionMetadataForegroundBudgetMs(remembered)
              if (budgetMs <= 0L) return remembered
              val prepared = lookupScope.async {
                  prepareLookupTrack(remembered).also { resolved ->
                      metadataWarmCache.put(track, resolved)
                  }
              }
              return withTimeoutOrNull(budgetMs) { prepared.await() } ?: remembered
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'prepareLookupTrackWithinBudget block expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = 'internal fun motionArtworkCacheKey(identityKey: String, source: LevyraCanvasSource): String =\n'
          if marker not in text:
              raise SystemExit('motionArtworkCacheKey marker not found')
          helper = '''internal class MotionMetadataWarmCache(private val maxEntries: Int = 64) {
              private val entries = LinkedHashMap<String, Track>(16, 0.75f, true)

              @Synchronized
              fun get(track: Track): Track? = entries[key(track)]

              @Synchronized
              fun put(original: Track, prepared: Track) {
                  if (prepared == original) return
                  entries[key(original)] = prepared
                  while (entries.size > maxEntries) {
                      val iterator = entries.entries.iterator()
                      if (!iterator.hasNext()) return
                      iterator.next()
                      iterator.remove()
                  }
              }

              private fun key(track: Track): String = track.id.trim().ifBlank {
                  listOf(track.title, track.artist)
                      .joinToString("|") { value -> value.trim().lowercase(Locale.ROOT) }
              }
          }

          '''
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
          ./gradlew :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.feature.motion.MotionArtworkRequestCoordinatorTest.latePreparedMetadataIsReusedAsTheNextLookupBase' --console=plain --warning-mode summary

      - name: Verify targeted suite and Kotlin compile
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.ArtistPopularSongsMergeTest' \
            --tests 'com.luc4n3x.levyra.ui.MotionArtworkLayerTest' \
            --tests 'com.luc4n3x.levyra.feature.motion.MotionArtworkRequestCoordinatorTest' \
            --console=plain --warning-mode summary
          ./gradlew :app:compileDebugKotlin --console=plain --warning-mode summary
          git diff --check

      - name: Remove one-shot workflow and push result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr762-duration-motion-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/luc4n3x/levyra/data/ArtistRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/feature/motion/MotionArtworkEngine.kt \
            app/src/main/java/com/luc4n3x/levyra/ui/MotionArtworkLayer.kt \
            app/src/test/java/com/luc4n3x/levyra/data/ArtistPopularSongsMergeTest.kt \
            app/src/test/java/com/luc4n3x/levyra/feature/motion/MotionArtworkRequestCoordinatorTest.kt \
            app/src/test/java/com/luc4n3x/levyra/ui/MotionArtworkLayerTest.kt \
            .github/workflows/pr762-duration-motion-fix-once.yml
          git commit -m "fix(artist): restore durations and harden page motion"
          git push origin HEAD:fix/instant-page-canvas
