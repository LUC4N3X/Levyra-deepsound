name: Refine Home Polish

on:
  push:
    branches:
      - feature/home-discovery-remix
    paths:
      - .github/workflows/refine-home-polish.yml
      - .github/scripts/refine-home-polish.py

permissions:
  contents: write

concurrency:
  group: refine-home-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply final Home visual polish
        run: |
          python3 .github/scripts/refine-home-polish.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "private fun TrendingArtistLoadingItem(featured: Boolean) {",
              "private fun TrendingArtistLoadingItem(featured: Boolean = false) {",
              1,
          )
          text = text.replace(
              "url = artist.thumbnailUrl,\n                contentDescription = artist.name,",
              "url = artist.thumbnailUrl,\n                contentDescription = null,",
              1,
          )
          text = text.replace(
              "imageVector = Icons.Rounded.Person,\n                    contentDescription = artist.name,",
              "imageVector = Icons.Rounded.Person,\n                    contentDescription = null,",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Compile Android debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Run Android debug unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Run Levyra AI quality gate
        run: python3 scripts/ai_quality_gate.py --profile full

      - name: Commit validated source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No validated source changes to commit."
            exit 0
          fi
          git commit -m "refactor(home): finish artist discovery polish"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
