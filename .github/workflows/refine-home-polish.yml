name: Refine Home Polish

on:
  push:
    branches:
      - feature/home-discovery-remix
    paths:
      - .github/workflows/refine-home-polish.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply focused Home polish
        run: python3 .github/scripts/refine-home-polish.py

      - name: Compile Android debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Run Android debug unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Run Levyra AI quality gate
        run: python3 scripts/ai_quality_gate.py --profile full

      - name: Commit validated source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git add \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/main/java/com/luc4n3x/levyra/data/HomeAlbumShelfEngine.kt \
            app/src/test/java/com/luc4n3x/levyra/data/HomeAlbumShelfEngineTest.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No validated source changes to commit."
            exit 0
          fi
          git commit -m "refactor(home): polish orbit collections and album shelf"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
