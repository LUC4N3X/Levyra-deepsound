name: Refine Home Polish

on:
  push:
    branches:
      - feature/home-discovery-remix
    paths:
      - .github/workflows/refine-home-polish.yml
      - .github/scripts/refine-home-polish.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Scope Home-only patch markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/refine-home-polish.py')
          text = path.read_text(encoding='utf-8')

          old_state = '''replace_exact(
              "    var addTarget by remember { mutableStateOf<Track?>(null) }\\n",
              "    var addTarget by remember { mutableStateOf<Track?>(null) }\\n    var selectedHomeCollection by remember { mutableStateOf<HomeEditorialCollection?>(null) }\\n",
              "selected collection state"
          )'''
          new_state = '''replace_exact(
              "    val context = LocalContext.current\\n    var addTarget by remember { mutableStateOf<Track?>(null) }\\n    LaunchedEffect(homeDerivedState.artistRefreshFingerprint) {\\n",
              "    val context = LocalContext.current\\n    var addTarget by remember { mutableStateOf<Track?>(null) }\\n    var selectedHomeCollection by remember { mutableStateOf<HomeEditorialCollection?>(null) }\\n    LaunchedEffect(homeDerivedState.artistRefreshFingerprint) {\\n",
              "selected collection state"
          )'''
          if old_state not in text:
              raise RuntimeError('Home selected-collection marker drifted')
          text = text.replace(old_state, new_state, 1)

          old_end_call = 'replace_exact(old_home_end, new_home_end, "home collection dialog attachment")'
          new_end_call = '''home_screen_start = text.find("private fun HomeScreen(")
          home_end_index = text.find(old_home_end, home_screen_start)
          if home_screen_start < 0 or home_end_index < 0:
              raise RuntimeError("Home collection dialog attachment marker drifted")
          text = text[:home_end_index] + new_home_end + text[home_end_index + len(old_home_end):]'''
          if old_end_call not in text:
              raise RuntimeError('Home dialog attachment call drifted')
          text = text.replace(old_end_call, new_end_call, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply focused Home polish
        run: python3 .github/scripts/refine-home-polish.py

      - name: Compile Android debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Run Android debug unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Run Levyra AI quality gate
        run: python3 scripts/ai_quality_gate.py --profile full

      - name: Commit validated source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No validated source changes to commit."
            exit 0
          fi
          git commit -m "refactor(home): align discovery with spotify rhythm"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
