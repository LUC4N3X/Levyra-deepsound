name: Apply PR 319 Library Import Audit

on:
  push:
    branches:
      - feature/pro-audio-and-smart-importer

permissions:
  contents: write

concurrency:
  group: pr319-library-import-audit
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/pro-audio-and-smart-importer
          fetch-depth: 0

      - name: Align with main and patch active Library UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

          # The app routes Library to LevyraLibraryScreen. Drop the old, dead importer UI
          # that PR 319 had added to the legacy private LibraryScreen in LevyraApp.kt.
          git checkout origin/main -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt')
          source = path.read_text(encoding='utf-8')

          def once(old: str, new: str, label: str):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)

          once(
              'import androidx.compose.material.icons.rounded.LibraryMusic\nimport androidx.compose.material.icons.rounded.MoreVert\n',
              'import androidx.compose.material.icons.rounded.LibraryMusic\nimport androidx.compose.material.icons.rounded.Link\nimport androidx.compose.material.icons.rounded.MoreVert\n',
              'Link icon import',
          )

          once(
              '    var showCreatePlaylist by remember { mutableStateOf(false) }\n    var openSmartCollectionName by rememberSaveable { mutableStateOf<String?>(null) }\n',
              '    var showCreatePlaylist by remember { mutableStateOf(false) }\n    var showImportPlaylist by remember { mutableStateOf(false) }\n    var openSmartCollectionName by rememberSaveable { mutableStateOf<String?>(null) }\n',
              'import dialog state',
          )

          overview_import = '''
            if (category == LibraryCategory.Overview) {
                item(key = "overview-import-playlist") {
                    LibraryImportPlaylistCard(
                        onClick = { showImportPlaylist = true },
                        isItalian = isItalian
                    )
                }
            }

'''
          once(
              '            if (category != LibraryCategory.Overview) {\n',
              overview_import + '            if (category != LibraryCategory.Overview) {\n',
              'overview import CTA',
          )

          playlist_import = '''                    item(key = "playlist-import-action") {
                        LibraryImportPlaylistCard(
                            onClick = { showImportPlaylist = true },
                            isItalian = isItalian
                        )
                    }
'''
          once(
              '                    if (visiblePlaylists.isEmpty()) {\n',
              playlist_import + '                    if (visiblePlaylists.isEmpty()) {\n',
              'playlist import CTA',
          )

          import_dialog_call = '''
    if (showImportPlaylist) {
        LibraryImportPlaylistDialog(
            isItalian = isItalian,
            onDismiss = { showImportPlaylist = false },
            onImport = { input ->
                viewModel.importPlaylist(input)
                showImportPlaylist = false
            }
        )
    }

'''
          once(
              '    if (addToPlaylistTracks.isNotEmpty()) {\n',
              import_dialog_call + '    if (addToPlaylistTracks.isNotEmpty()) {\n',
              'import dialog wiring',
          )

          helpers = r'''
@OptIn(ExperimentalFoundationApi::class)
@Composable
private fun LibraryImportPlaylistCard(
    onClick: () -> Unit,
    isItalian: Boolean
) {
    val shape = RoundedCornerShape(22.dp)
    Surface(
        color = Color.Transparent,
        shape = shape,
        border = BorderStroke(1.dp, LevyraCyan.copy(alpha = 0.22f)),
        modifier = Modifier
            .fillMaxWidth()
            .clip(shape)
            .combinedClickable(onClick = onClick)
    ) {
        Row(
            modifier = Modifier
                .background(
                    Brush.linearGradient(
                        listOf(
                            LevyraCyan.copy(alpha = 0.11f),
                            LevyraViolet.copy(alpha = 0.055f),
                            LevyraPanel.copy(alpha = 0.76f)
                        )
                    )
                )
                .padding(horizontal = 15.dp, vertical = 14.dp),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.spacedBy(13.dp)
        ) {
            Box(
                modifier = Modifier
                    .size(46.dp)
                    .background(LevyraCyan.copy(alpha = 0.12f), RoundedCornerShape(15.dp))
                    .border(1.dp, LevyraCyan.copy(alpha = 0.20f), RoundedCornerShape(15.dp)),
                contentAlignment = Alignment.Center
            ) {
                Icon(
                    imageVector = Icons.Rounded.Link,
                    contentDescription = null,
                    tint = LevyraCyan,
                    modifier = Modifier.size(23.dp)
                )
            }
            Column(
                modifier = Modifier.weight(1f),
                verticalArrangement = Arrangement.spacedBy(3.dp)
            ) {
                Text(
                    text = if (isItalian) "Importa playlist" else "Import playlist",
                    color = LevyraText,
                    fontSize = 16.sp,
                    lineHeight = 19.sp,
                    fontWeight = FontWeight.Bold
                )
                Text(
                    text = if (isItalian) {
                        "YouTube Music · Spotify · backup JSON"
                    } else {
                        "YouTube Music · Spotify · JSON backup"
                    },
                    color = LevyraMuted,
                    fontSize = 12.sp,
                    lineHeight = 15.sp,
                    fontWeight = FontWeight.Medium,
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis
                )
            }
            Surface(
                color = LevyraCyan.copy(alpha = 0.12f),
                shape = RoundedCornerShape(999.dp),
                border = BorderStroke(1.dp, LevyraCyan.copy(alpha = 0.18f))
            ) {
                Text(
                    text = if (isItalian) "IMPORTA" else "IMPORT",
                    color = LevyraCyan,
                    fontSize = 10.sp,
                    lineHeight = 12.sp,
                    fontWeight = FontWeight.Black,
                    letterSpacing = 0.7.sp,
                    modifier = Modifier.padding(horizontal = 10.dp, vertical = 7.dp)
                )
            }
        }
    }
}

@Composable
private fun LibraryImportPlaylistDialog(
    isItalian: Boolean,
    onDismiss: () -> Unit,
    onImport: (String) -> Unit
) {
    var input by remember { mutableStateOf("") }
    val canImport = input.isNotBlank()
    AlertDialog(
        onDismissRequest = onDismiss,
        containerColor = LevyraPanel,
        title = {
            Text(
                text = if (isItalian) "Importa playlist" else "Import playlist",
                color = LevyraText,
                fontWeight = FontWeight.Bold
            )
        },
        text = {
            Column(verticalArrangement = Arrangement.spacedBy(14.dp)) {
                Text(
                    text = if (isItalian) {
                        "Incolla un link di YouTube/YouTube Music, una playlist Spotify pubblica oppure il JSON di un backup ViMusic/InnerTune. Levyra importerà i brani nella tua libreria."
                    } else {
                        "Paste a YouTube/YouTube Music link, a public Spotify playlist, or ViMusic/InnerTune backup JSON. Levyra will import the tracks into your library."
                    },
                    color = LevyraMuted,
                    fontSize = 13.sp,
                    lineHeight = 18.sp
                )
                OutlinedTextField(
                    value = input,
                    onValueChange = { input = it },
                    modifier = Modifier.fillMaxWidth(),
                    minLines = 3,
                    maxLines = 7,
                    shape = RoundedCornerShape(16.dp),
                    textStyle = MaterialTheme.typography.bodyMedium.copy(color = LevyraText),
                    placeholder = {
                        Text(
                            text = if (isItalian) "Incolla link o JSON…" else "Paste link or JSON…",
                            color = LevyraMuted.copy(alpha = 0.62f)
                        )
                    },
                    colors = OutlinedTextFieldDefaults.colors(
                        focusedTextColor = LevyraText,
                        unfocusedTextColor = LevyraText,
                        focusedBorderColor = LevyraCyan.copy(alpha = 0.72f),
                        unfocusedBorderColor = Color.White.copy(alpha = 0.12f),
                        cursorColor = LevyraCyan
                    )
                )
                Text(
                    text = if (isItalian) {
                        "Spotify viene usato solo per identificare i brani; la riproduzione resta gestita da Levyra."
                    } else {
                        "Spotify is only used to identify tracks; playback remains handled by Levyra."
                    },
                    color = LevyraMuted.copy(alpha = 0.78f),
                    fontSize = 11.sp,
                    lineHeight = 15.sp
                )
            }
        },
        confirmButton = {
            TextButton(
                enabled = canImport,
                onClick = { onImport(input.trim()) }
            ) {
                Text(
                    text = if (isItalian) "Importa" else "Import",
                    color = if (canImport) LevyraCyan else LevyraMuted.copy(alpha = 0.50f),
                    fontWeight = FontWeight.Bold
                )
            }
        },
        dismissButton = {
            TextButton(onClick = onDismiss) {
                Text(if (isItalian) "Annulla" else "Cancel", color = LevyraMuted)
            }
        }
    )
}

'''
          once(
              '\n@Composable\nprivate fun LibraryHero(title: String, subtitle: String) {\n',
              '\n' + helpers + '@Composable\nprivate fun LibraryHero(title: String, subtitle: String) {\n',
              'import UI helpers',
          )

          required = [
              'var showImportPlaylist by remember',
              'overview-import-playlist',
              'playlist-import-action',
              'private fun LibraryImportPlaylistCard',
              'private fun LibraryImportPlaylistDialog',
              'viewModel.importPlaylist(input)',
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit(f'missing expected markers after patch: {missing}')

          path.write_text(source, encoding='utf-8')
          PY

          git rm --ignore-unmatch .github/workflows/apply-pr319-library-import-audit.yml
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'fix(library): surface playlist import in active library'
          git push origin HEAD:feature/pro-audio-and-smart-importer
