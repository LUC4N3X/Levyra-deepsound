name: Update README badges

on:
  workflow_dispatch:
  watch:
    types:
      - started
  release:
    types:
      - published
      - edited
      - deleted
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/update-readme-badges.mjs
      - scripts/update-translation-pulse.mjs
      - .github/workflows/update-readme-badges.yml

permissions:
  contents: write

concurrency:
  group: update-readme-badges
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node scripts/update-readme-badges.mjs
      - run: node scripts/update-translation-pulse.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          badge_files=(
            docs/assets/levyra-release.svg
            docs/assets/levyra-downloads.svg
            docs/assets/levyra-license.svg
            docs/assets/levyra-stars.svg
            docs/assets/levyra-release-light.svg
            docs/assets/levyra-downloads-light.svg
            docs/assets/levyra-license-light.svg
            docs/assets/levyra-stars-light.svg
            docs/assets/levyra-release-mobile.svg
            docs/assets/levyra-downloads-mobile.svg
            docs/assets/levyra-license-mobile.svg
            docs/assets/levyra-stars-mobile.svg
            docs/assets/levyra-release-mobile-light.svg
            docs/assets/levyra-downloads-mobile-light.svg
            docs/assets/levyra-license-mobile-light.svg
            docs/assets/levyra-stars-mobile-light.svg
            docs/assets/levyra-translation-pulse.svg
            docs/assets/levyra-translation-pulse-light.svg
            docs/assets/levyra-translation-pulse-mobile.svg
            docs/assets/levyra-translation-pulse-mobile-light.svg
          )
          if git diff --quiet -- README.md "${badge_files[@]}"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md "${badge_files[@]}"
          git commit -m "chore: update README badges"
          git push origin HEAD:main
