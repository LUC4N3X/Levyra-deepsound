name: Home Collections Readability Patch

on:
  push:
    branches:
      - feat/home-ytmusic-style
    paths:
      - .github/workflows/home-collections-readability-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/home-ytmusic-style
          fetch-depth: 0

      - name: Apply focused Collections readability fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "private val HOME_COLLECTION_CARD_WIDTH = 178.dp": "private val HOME_COLLECTION_CARD_WIDTH = 196.dp",
              "private val HOME_COLLECTION_CARD_HEIGHT = 166.dp": "private val HOME_COLLECTION_CARD_HEIGHT = 178.dp",
              "private val HOME_COLLECTION_ART_SIZE = 78.dp": "private val HOME_COLLECTION_ART_SIZE = 80.dp",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          card_start = text.index("private fun HomeEditorialCollectionCard(")
          card_end = text.index("@Composable\nprivate fun HomeEditorialArtworkStack(", card_start)
          card = text[card_start:card_end]

          ellipsis_count = card.count("overflow = TextOverflow.Ellipsis,")
          if ellipsis_count != 2:
              raise RuntimeError(f"Expected exactly two collection-card ellipsis policies, found {ellipsis_count}")
          card = card.replace("                        overflow = TextOverflow.Ellipsis,\n", "")

          artist_start = card.index("if (artistLine.isNotBlank()) {")
          artist_end = card.index("\n                }", artist_start) + len("\n                }")
          artist_block = card[artist_start:artist_end]
          if artist_block.count("maxLines = 1,") != 1:
              raise RuntimeError("Expected exactly one single-line artist label")
          if "modifier = Modifier.padding(end = HOME_COLLECTION_ART_TEXT_KEEPOUT)" not in artist_block:
              raise RuntimeError("Artist artwork keepout is missing")
          artist_block = artist_block.replace("maxLines = 1,", "maxLines = 2,", 1)
          card = card[:artist_start] + artist_block + card[artist_end:]

          text = text[:card_start] + card + text[card_end:]
          path.write_text(text, encoding="utf-8")
          PY

          git diff -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --check

      - name: Commit source change and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/home-collections-readability-patch.yml
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/home-collections-readability-patch.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(home): make Collections readable and substantial"
          git push origin HEAD:feat/home-ytmusic-style
