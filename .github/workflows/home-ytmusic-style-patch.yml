name: Home YouTube Music style patch

on:
  push:
    branches:
      - feat/home-ytmusic-style

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[home-style-patcher]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-ytmusic-style
          fetch-depth: 0
      - name: Apply guarded Home style patch
        run: python3 scripts/home_ytmusic_style_patch.py
      - name: Commit patched Home sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(home): sharpen cards and compact shelves [home-style-patcher]"
          git push origin HEAD:feat/home-ytmusic-style
