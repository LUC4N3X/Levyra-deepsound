name: PR636 Detekt Probe

on:
  push:
    branches:
      - feat/playlist-drag-reorder

jobs:
  detekt-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run CodeFactor Detekt version
        shell: bash
        run: |
          curl -fsSL -o detekt.jar https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-cli/1.23.8/detekt-cli-1.23.8-all.jar
          set +e
          java -jar detekt.jar \
            --input app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt,app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryActions.kt,app/src/main/java/com/luc4n3x/levyra/data/local/PlaylistDao.kt,app/src/main/java/com/luc4n3x/levyra/data/PlaylistStore.kt,app/src/androidTest/java/com/luc4n3x/levyra/data/local/PlaylistProDaoTest.kt \
            --build-upon-default-config \
            --report txt:detekt-report.txt
          code=$?
          echo "detekt exit: $code"
          echo "----- DETEKT REPORT -----"
          cat detekt-report.txt || true
          exit 0
