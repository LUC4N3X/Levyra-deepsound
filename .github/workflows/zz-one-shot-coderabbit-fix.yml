name: One Shot Karaoke Review Fix

on:
  push:
    branches:
      - feature/lyrics-downloads-motion-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lyrics-downloads-motion-v2
          fetch-depth: 0
      - name: Apply wrapped-line karaoke fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")
          old = '''        val fraction = boundedProgress - completedCharacters
                  val charStart = layoutResult.getHorizontalPosition(completedCharacters, usePrimaryDirection = true)
                  val charEnd = if (completedCharacters + 1 <= textLength) {
                      layoutResult.getHorizontalPosition(completedCharacters + 1, usePrimaryDirection = true)
                  } else {
                      charStart
                  }
                  val currentX = charStart + (charEnd - charStart) * fraction
          '''
          new = '''        val fraction = boundedProgress - completedCharacters
                  val charStart = layoutResult.getHorizontalPosition(completedCharacters, usePrimaryDirection = true)
                  val nextOffset = (completedCharacters + 1).coerceAtMost(textLength)
                  val charEnd = if (
                      nextOffset < textLength && layoutResult.getLineForOffset(nextOffset) != activeLine
                  ) {
                      if (isRtl) layoutResult.getLineLeft(activeLine) else layoutResult.getLineRight(activeLine)
                  } else {
                      layoutResult.getHorizontalPosition(nextOffset, usePrimaryDirection = true)
                  }
                  val currentX = charStart + (charEnd - charStart) * fraction
          '''
          if old not in text:
              raise SystemExit("Expected karaoke block not found; refusing to modify the file")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --cached --check
          git commit -m "fix(lyrics): clamp karaoke fill at line wraps"
          git push origin HEAD:feature/lyrics-downloads-motion-v2
