name: Apply home resume and orbit fix v3

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/home-resume-orbit-live

      - name: Apply deterministic patch
        run: python scripts/apply_home_resume_orbit_fix.py

      - name: Validate patch
        run: git diff --check

      - name: Commit final changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-home-resume-orbit-fix.yml \
            .github/workflows/apply-home-resume-orbit-fix-v2.yml \
            .github/workflows/apply-home-resume-orbit-fix-v3.yml \
            scripts/apply_home_resume_orbit_fix.py
          git add \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraScreenViewModels.kt \
            app/src/test/java/com/luc4n3x/levyra/viewmodel/HomeRenderSnapshotTest.kt
          git diff --cached --check
          git commit -m "fix(home): polish resume card and update orbit instantly"
          git push origin HEAD:fix/home-resume-orbit-live
