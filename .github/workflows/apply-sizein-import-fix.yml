name: Apply sizeIn Import Fix

on:
  push:
    branches:
      - agent/scalable-canvas-index
    paths:
      - scripts/apply_sizein_import_fix.py
      - .github/workflows/apply-sizein-import-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/scalable-canvas-index
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply missing Compose import
        run: python3 scripts/apply_sizein_import_fix.py

      - name: Prepare ephemeral CI signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile release Kotlin
        run: ./gradlew --no-daemon :app:compileReleaseKotlin

      - name: Remove one-shot helpers
        run: |
          rm scripts/apply_sizein_import_fix.py
          rm .github/workflows/apply-sizein-import-fix.yml
          rm -f "${LEVYRA_KEYSTORE_FILE}"

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): import sizeIn for player touch targets"
          git push origin HEAD:agent/scalable-canvas-index
