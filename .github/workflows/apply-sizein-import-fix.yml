name: Apply sizeIn Import Fix

on:
  push:
    branches:
      - agent/scalable-canvas-index
    paths:
      - scripts/apply_sizein_import_fix.py
      - .github/workflows/apply-sizein-import-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/scalable-canvas-index
          fetch-depth: 0

      - name: Apply missing Compose import
        run: python3 scripts/apply_sizein_import_fix.py

      - name: Verify release Kotlin compilation
        uses: gradle/actions/setup-gradle@v4

      - name: Compile release Kotlin
        run: ./gradlew --no-daemon :app:compileReleaseKotlin

      - name: Remove one-shot helpers
        run: |
          rm scripts/apply_sizein_import_fix.py
          rm .github/workflows/apply-sizein-import-fix.yml

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): import sizeIn for player touch targets"
          git push origin HEAD:agent/scalable-canvas-index
