name: Withdraw superseded 2.5.5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/withdraw-2.5.5.yml"

permissions:
  contents: write

jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Levyra 2.5.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..60}; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v2.5.6" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "Levyra 2.5.6 was not published within the expected window."
          exit 1

      - name: Withdraw Levyra 2.5.5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v2.5.5" --jq '.id' 2>/dev/null || true)"
          if [ -n "$release_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$release_id"
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v2.5.5" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v2.5.5"
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git rm ".github/workflows/withdraw-2.5.5.yml"
          git commit -m "chore: remove temporary 2.5.5 withdrawal workflow"
          git push origin HEAD:main
