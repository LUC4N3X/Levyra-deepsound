name: Apply CodeRabbit fixes

on:
  push:
    branches:
      - "agent/advanced-lyrics-dsp-motion"

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.ref == 'refs/heads/agent/advanced-lyrics-dsp-motion'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/advanced-lyrics-dsp-motion
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          playback = "app/src/main/java/com/luc4n3x/levyra/player/PlaybackService.kt"
          replace_once(
              playback,
              "        fun applyPremiumAudioSettings(settings: LevyraAudioSettings) {\n",
              "        fun applyPremiumAudioSettings(\n"
              "            settings: LevyraAudioSettings,\n"
              "            audioNormalization: Boolean = normalizationProcessor.enabled\n"
              "        ) {\n",
          )
          replace_once(
              playback,
              "            limiterProcessor.enabled = normalized.limiterEnabled &&\n"
              "                (normalized.equalizerEnabled || normalized.virtualizer > 0 || normalized.replayGainEnabled)\n",
              "            limiterProcessor.enabled = normalized.limiterEnabled &&\n"
              "                (normalized.equalizerEnabled || normalized.virtualizer > 0 ||\n"
              "                    normalized.replayGainEnabled || audioNormalization)\n",
          )
          replace_once(
              playback,
              "                    .setEnableFloatOutput(enableFloatOutput)\n",
              "                    .setEnableFloatOutput(false)\n",
          )
          replace_once(
              playback,
              "        applyPremiumAudioSettings(snapshot.audioSettings)\n",
              "        applyPremiumAudioSettings(snapshot.audioSettings, snapshot.audioNormalization)\n",
          )

          player = "app/src/main/java/com/luc4n3x/levyra/player/LevyraPlayer.kt"
          replace_once(
              player,
              "    fun setPremiumAudioSettings(settings: LevyraAudioSettings) {\n",
              "    fun setPremiumAudioSettings(\n"
              "        settings: LevyraAudioSettings,\n"
              "        audioNormalization: Boolean = PlaybackService.normalizationProcessor.enabled\n"
              "    ) {\n",
          )
          replace_once(
              player,
              "        PlaybackService.applyPremiumAudioSettings(audioSettings)\n",
              "        PlaybackService.applyPremiumAudioSettings(audioSettings, audioNormalization)\n",
          )

          view_model = "app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt"
          replace_once(
              view_model,
              "        player.setPremiumAudioSettings(normalized)\n"
              "        player.setPlayback(normalized.playbackSpeed, normalized.pitch)\n"
              "        com.luc4n3x.levyra.player.PlaybackService.normalizationProcessor.enabled = audioNormalization || normalized.replayGainEnabled\n",
              "        com.luc4n3x.levyra.player.PlaybackService.normalizationProcessor.enabled =\n"
              "            audioNormalization || normalized.replayGainEnabled\n"
              "        player.setPremiumAudioSettings(normalized, audioNormalization)\n"
              "        player.setPlayback(normalized.playbackSpeed, normalized.pitch)\n",
          )

          Path(".github/workflows/apply-coderabbit-fixes.yml").unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/player/PlaybackService.kt \
                  app/src/main/java/com/luc4n3x/levyra/player/LevyraPlayer.kt \
                  app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt \
                  .github/workflows/apply-coderabbit-fixes.yml
          git commit -m "fix(audio): keep limiter aligned with normalization"
          git push origin HEAD:agent/advanced-lyrics-dsp-motion
