name: Apply Top 50 Artwork Polish

on:
  push:
    branches:
      - agent/scalable-canvas-index
    paths:
      - .github/workflows/apply-top50-artwork-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/scalable-canvas-index
          fetch-depth: 0

      - name: Apply focused artwork fixes
        run: python3 scripts/apply_top50_artwork_and_player_polish.py

      - name: Remove one-shot helper
        run: |
          rm scripts/apply_top50_artwork_and_player_polish.py
          rm .github/workflows/apply-top50-artwork-polish.yml

      - name: Commit artwork continuity and UI polish
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
                  app/src/test/java/com/luc4n3x/levyra/data/EditorialArtworkContinuityTest.kt \
                  scripts/apply_top50_artwork_and_player_polish.py \
                  .github/workflows/apply-top50-artwork-polish.yml
          git commit -m "fix(player): preserve Top 50 artwork and refine cover card"
          git push origin HEAD:agent/scalable-canvas-index
