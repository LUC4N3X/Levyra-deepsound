name: Apply ISRC Release Auth Feature

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 250 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply guarded feature patch
        run: |
          python3 -m py_compile \
            tools/prepare_isrc_release_patch.py \
            tools/prepare_collector_identity_patch.py \
            tools/apply_isrc_release_youtube_auth.py
          python3 tools/prepare_isrc_release_patch.py
          python3 tools/prepare_collector_identity_patch.py
          python3 tools/apply_isrc_release_youtube_auth.py
      - name: Test collector
        run: |
          python -m pip install --disable-pip-version-check pytest -e tools/levyra-editorial
          python -m pytest tools/levyra-editorial/tests -q
      - name: Test and compile Android
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            --tests com.luc4n3x.levyra.data.RecordingIdentityTest \
            --tests com.luc4n3x.levyra.domain.ReleaseTypeTest \
            --tests com.luc4n3x.levyra.data.security.YoutubeMusicCookieParserTest \
            :app:compileDebugKotlin \
            --stacktrace
      - name: Commit verified feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test tools/levyra-editorial .github/workflows/editorial-catalog.yml
          git reset -- \
            tools/apply_isrc_release_youtube_auth.py \
            tools/prepare_isrc_release_patch.py \
            tools/prepare_collector_identity_patch.py \
            .github/workflows/inspect-isrc-release-auth.yml
          if git diff --cached --quiet; then
            echo "Feature already applied"
            exit 0
          fi
          git commit -m "feat(metadata): add ISRC-first matching and release types"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
