name: PR504 Home Hero Patch

on:
  push:
    branches:
      - feat/amazon-inspired-explore-cards
    paths:
      - .github/workflows/pr504-home-hero-patch.yml

permissions:
  contents: write

jobs:
  patch-home-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/amazon-inspired-explore-cards
          fetch-depth: 0

      - name: Redesign new-release spotlight as immersive editorial hero
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")
          function_start = text.index("private fun HomeEditorialSpotlight(")
          layout_start = text.index("    BoxWithConstraints(", function_start)
          function_end = text.index("\n}\n\nprivate fun homeCollectionTitle", layout_start)

          replacement = r'''    BoxWithConstraints(
              modifier = Modifier
                  .fillMaxWidth()
                  .height(276.dp)
                  .graphicsLayer {
                      scaleX = scale
                      scaleY = scale
                  }
                  .clip(LevyraHomeDesign.HeroShape)
                  .background(Color(0xFF050609))
                  .border(
                      Dp.Hairline,
                      Color.White.copy(alpha = 0.11f),
                      LevyraHomeDesign.HeroShape
                  )
                  .clickable(
                      interactionSource = interaction,
                      indication = null,
                      onClick = onOpen
                  )
          ) {
              CoverImage(
                  track = track,
                  modifier = Modifier.fillMaxSize(),
                  highRes = true,
                  zoom = 1f,
                  onImageLoaded = { image ->
                      if (!paletteExtractionStarted && loadedArtworkBitmap == null) {
                          loadedArtworkBitmap = image.toBitmap()
                      }
                  }
              )

              Box(
                  modifier = Modifier
                      .matchParentSize()
                      .background(
                          Brush.verticalGradient(
                              colorStops = arrayOf(
                                  0f to Color.Black.copy(alpha = 0.10f),
                                  0.28f to Color.Black.copy(alpha = 0.04f),
                                  0.58f to Color.Black.copy(alpha = 0.28f),
                                  0.78f to Color.Black.copy(alpha = 0.68f),
                                  1f to Color.Black.copy(alpha = 0.94f)
                              )
                          )
                      )
              )
              Box(
                  modifier = Modifier
                      .matchParentSize()
                      .background(
                          Brush.horizontalGradient(
                              colorStops = arrayOf(
                                  0f to Color.Black.copy(alpha = 0.50f),
                                  0.42f to Color.Black.copy(alpha = 0.16f),
                                  0.78f to Color.Transparent,
                                  1f to Color.Black.copy(alpha = 0.10f)
                              )
                          )
                      )
              )
              Box(
                  modifier = Modifier
                      .matchParentSize()
                      .background(
                          Brush.radialGradient(
                              colors = listOf(
                                  accentStart.copy(alpha = 0.18f),
                                  accentEnd.copy(alpha = 0.07f),
                                  Color.Transparent
                              ),
                              center = Offset(0f, 0f),
                              radius = 620f
                          )
                      )
              )

              Column(
                  modifier = Modifier
                      .align(Alignment.BottomStart)
                      .fillMaxWidth(0.78f)
                      .padding(start = 22.dp, end = 10.dp, bottom = 22.dp),
                  verticalArrangement = Arrangement.spacedBy(6.dp)
              ) {
                  Text(
                      text = badge.uppercase(Locale.ROOT),
                      color = accentStart
                          .copy(alpha = 0.98f)
                          .compositeOver(Color.White.copy(alpha = 0.08f)),
                      fontSize = 11.sp,
                      lineHeight = LevyraTypeRhythm.lineHeight(11.sp),
                      fontWeight = FontWeight.Black,
                      letterSpacing = 1.45.sp,
                      maxLines = 1
                  )
                  Text(
                      text = track.title,
                      color = Color.White,
                      fontSize = 31.sp,
                      lineHeight = 34.sp,
                      fontWeight = FontWeight.Black,
                      letterSpacing = (-1.05).sp,
                      maxLines = 2,
                      overflow = TextOverflow.Ellipsis
                  )
                  Text(
                      text = track.artist,
                      color = Color.White.copy(alpha = 0.92f),
                      fontSize = 16.5.sp,
                      lineHeight = LevyraTypeRhythm.lineHeight(16.5.sp),
                      fontWeight = FontWeight.SemiBold,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis
                  )
                  Text(
                      text = detail,
                      color = Color.White.copy(alpha = 0.68f),
                      fontSize = 13.sp,
                      lineHeight = LevyraTypeRhythm.lineHeight(13.sp),
                      fontWeight = FontWeight.Medium,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis
                  )
              }

              Surface(
                  color = Color.White,
                  shape = CircleShape,
                  border = BorderStroke(1.dp, Color.White.copy(alpha = 0.42f)),
                  modifier = Modifier
                      .align(Alignment.BottomEnd)
                      .padding(end = 18.dp, bottom = 20.dp)
                      .size(60.dp)
              ) {
                  Box(contentAlignment = Alignment.Center) {
                      when {
                          isResolving -> CircularProgressIndicator(
                              modifier = Modifier.size(22.dp),
                              strokeWidth = 2.5.dp,
                              color = accentStart
                          )
                          isCurrent && isPlaying -> Icon(
                              imageVector = Icons.Rounded.Pause,
                              contentDescription = strings.playing,
                              tint = Color(0xFF07080C),
                              modifier = Modifier.size(29.dp)
                          )
                          else -> Icon(
                              imageVector = Icons.Rounded.PlayArrow,
                              contentDescription = strings.playNow,
                              tint = Color(0xFF07080C),
                              modifier = Modifier.size(32.dp)
                          )
                      }
                  }
              }

              if (isCurrent && isPlaying) {
                  Surface(
                      color = Color.Black.copy(alpha = 0.48f),
                      shape = CircleShape,
                      border = BorderStroke(Dp.Hairline, Color.White.copy(alpha = 0.14f)),
                      modifier = Modifier
                          .align(Alignment.TopEnd)
                          .padding(14.dp)
                  ) {
                      Row(
                          modifier = Modifier.padding(horizontal = 10.dp, vertical = 7.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          ActiveTrackEqualizer(
                              color = accentStart,
                              isPlaying = true,
                              width = 13.dp,
                              height = 9.dp
                          )
                          Text(
                              text = strings.playing,
                              color = Color.White.copy(alpha = 0.90f),
                              fontSize = 10.5.sp,
                              fontWeight = FontWeight.Bold,
                              maxLines = 1
                          )
                      }
                  }
              }
          }'''

          patched = text[:layout_start] + replacement + text[function_end:]
          if patched == text:
              raise SystemExit("Home spotlight patch produced no change")
          path.write_text(patched, encoding="utf-8")

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr504-home-hero-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr504-home-hero-patch.yml
          git commit -m "feat(home): make new-release spotlight immersive"
          git push origin HEAD:feat/amazon-inspired-explore-cards
