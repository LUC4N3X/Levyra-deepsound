name: Verify PR769 directional settle once

on:
  push:
    branches:
      - fix/player-morph-motion

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      ORG_GRADLE_PROJECT_levyraNativeAudio: "true"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/player-morph-motion
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply directional settle fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text()
          old = 'playerExpansion.animateTo(target, LevyraPlayerDesign.expandSpring())'
          new = '''playerExpansion.animateTo(
                          target,
                          if (target > playerExpansion.value) {
                              LevyraPlayerDesign.expandSpring()
                          } else {
                              LevyraPlayerDesign.collapseSpring()
                          }
                      )'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one normal settle callsite, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt "

      - name: Verify focused motion tests
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.ui.player.PlayerExpansionTest' --tests 'com.luc4n3x.levyra.ui.player.PlayerCinematicGeometryTest' --console=plain --warning-mode summary

      - name: Compile Android Kotlin
        shell: bash
        run: ./gradlew :app:compileDebugKotlin --console=plain --warning-mode summary

      - name: Remove one-shot workflow and push verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr769-collapse-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr769-collapse-fix-once.yml
          git diff --cached --check
          git commit -m "fix(player): use directional settle spring"
          git push origin HEAD:fix/player-morph-motion
