name: Port PR 416 Ambient Chroma

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/port-pr416-ambient.yml

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/desktop-audio-and-local-library
          fetch-depth: 0
      - name: Fetch ambient branch
        run: git fetch origin feature/player-ambient-chroma-system
      - name: Apply reviewed ambient commit
        shell: bash
        run: |
          set -euo pipefail
          git cherry-pick --no-commit 220cd590424ac6c4667e212e774f00b3e067b6ee
          git diff --check
      - name: Commit port
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat(android): integrate ambient chroma player"
          git push origin HEAD:feature/desktop-audio-and-local-library
