name: PR 318 Final Card

on:
  push:
    branches:
      - fix/home-resume-orbit-live

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/home-resume-orbit-live
          fetch-depth: 0
      - name: Apply final Continue Listening design
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          source = path.read_text()
          start_marker = '@Composable\nprivate fun ContinueListeningCard('
          end_marker = '\n@Composable\nprivate fun HomeShortcutRow('
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = textwrap.dedent('''
          @Composable
          private fun ContinueListeningCard(
              track: Track,
              progress: Float,
              onResume: () -> Unit
          ) {
              val accentStart = if (track.accentStart == 0) LevyraCyan else Color(track.accentStart)
              val accentEnd = if (track.accentEnd == 0) LevyraViolet else Color(track.accentEnd)
              val safeProgress = progress.coerceIn(0f, 1f)
              val shape = RoundedCornerShape(20.dp)
              val borderBrush = Brush.horizontalGradient(
                  listOf(
                      accentStart.copy(alpha = 0.58f),
                      Color.White.copy(alpha = 0.10f),
                      accentEnd.copy(alpha = 0.48f)
                  )
              )

              Surface(
                  color = Color.Transparent,
                  shape = shape,
                  border = BorderStroke(1.dp, borderBrush),
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(72.dp)
                      .pressable(onClick = onResume)
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(cinematicGlassBrush(accentStart, accentEnd, 0.42f))
                  ) {
                      Box(
                          modifier = Modifier
                              .size(112.dp)
                              .align(Alignment.CenterStart)
                              .offset(x = (-46).dp)
                              .background(
                                  Brush.radialGradient(
                                      listOf(accentStart.copy(alpha = 0.20f), Color.Transparent)
                                  )
                              )
                      )
                      Box(
                          modifier = Modifier
                              .size(126.dp)
                              .align(Alignment.CenterEnd)
                              .offset(x = 52.dp)
                              .background(
                                  Brush.radialGradient(
                                      listOf(accentEnd.copy(alpha = 0.20f), Color.Transparent)
                                  )
                              )
                      )
                      Box(
                          modifier = Modifier
                              .align(Alignment.CenterStart)
                              .padding(start = 5.dp)
                              .width(3.dp)
                              .height(38.dp)
                              .background(
                                  Brush.verticalGradient(listOf(accentStart, accentEnd)),
                                  RoundedCornerShape(99.dp)
                              )
                      )
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(start = 12.dp, end = 10.dp, top = 8.dp, bottom = 8.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          CoverImage(
                              track = track,
                              modifier = Modifier
                                  .size(50.dp)
                                  .clip(RoundedCornerShape(14.dp))
                                  .border(
                                      1.dp,
                                      Color.White.copy(alpha = 0.16f),
                                      RoundedCornerShape(14.dp)
                                  ),
                              highRes = false
                          )
                          Column(
                              modifier = Modifier.weight(1f),
                              verticalArrangement = Arrangement.Center
                          ) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(5.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Rounded.Headphones,
                                      contentDescription = null,
                                      tint = LevyraCyan,
                                      modifier = Modifier.size(11.dp)
                                  )
                                  Text(
                                      text = LocalLevyraStrings.current.continueListening,
                                      color = LevyraCyan,
                                      fontSize = 9.4.sp,
                                      lineHeight = 10.5.sp,
                                      fontWeight = FontWeight.ExtraBold,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                              Text(
                                  text = track.title,
                                  color = LevyraText,
                                  fontSize = 14.5.sp,
                                  lineHeight = 16.sp,
                                  fontWeight = FontWeight.ExtraBold,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                              Text(
                                  text = track.artist,
                                  color = LevyraMuted,
                                  fontSize = 10.7.sp,
                                  lineHeight = 12.sp,
                                  fontWeight = FontWeight.Medium,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                          Surface(
                              color = Color.White.copy(alpha = 0.07f),
                              shape = CircleShape,
                              border = BorderStroke(
                                  1.dp,
                                  Brush.horizontalGradient(
                                      listOf(accentStart.copy(alpha = 0.75f), accentEnd.copy(alpha = 0.75f))
                                  )
                              ),
                              modifier = Modifier.size(36.dp)
                          ) {
                              Box(contentAlignment = Alignment.Center) {
                                  Icon(
                                      imageVector = Icons.Rounded.PlayArrow,
                                      contentDescription = null,
                                      tint = LevyraText,
                                      modifier = Modifier.size(20.dp)
                                  )
                              }
                          }
                      }
                      Box(
                          modifier = Modifier
                              .align(Alignment.BottomStart)
                              .padding(start = 72.dp, end = 58.dp)
                              .fillMaxWidth()
                              .height(2.dp)
                              .clip(RoundedCornerShape(99.dp))
                              .background(Color.White.copy(alpha = 0.08f))
                      ) {
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth(safeProgress)
                                  .height(2.dp)
                                  .background(Brush.horizontalGradient(listOf(accentStart, accentEnd)))
                          )
                      }
                  }
              }
          }
          ''').strip()
          path.write_text(source[:start] + replacement + source[end:])
          PY
          git diff --check
          git rm .github/workflows/pr318-final-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git commit -m "style(home): refine Continue Listening card"
          git push origin HEAD:fix/home-resume-orbit-live
