name: PR 313 targeted fixes

on:
  push:
    branches:
      - claude/menu-esplora-redesign-t3j2l4
    paths:
      - .github/workflows/pr313-targeted-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: claude/menu-esplora-redesign-t3j2l4
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply targeted fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          vm_path = Path('app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt')
          vm = vm_path.read_text()

          vm = vm.replace('    private var pauseAfterNextPlaybackStart: Boolean = false\n', '')

          if 'internal data class PlaybackResolveRequest' not in vm:
              marker = 'internal fun prioritizeNewReleasesForUser('
              policy = '''internal data class PlaybackResolveRequest(
              val id: Long,
              val startPaused: Boolean = false
          )

          internal fun shouldStartPlaybackPaused(
              request: PlaybackResolveRequest,
              activeRequestId: Long
          ): Boolean = request.id == activeRequestId && request.startPaused

          '''
              if marker not in vm:
                  raise SystemExit('prioritizeNewReleasesForUser marker not found')
              vm = vm.replace(marker, policy + marker, 1)

          vm = re.sub(
              r'(?m)^(\s*)pauseAfterNextPlaybackStart = !session\.wasPlaying\n\s*startResolve\(restoredTrack\)$',
              lambda m: f'{m.group(1)}startResolve(restoredTrack, startPaused = !session.wasPlaying)',
              vm,
              count=1,
          )

          old_sig = 'private fun startResolve(track: Track, preserveCrossfade: Boolean = false, autoRetryWhenOffline: Boolean = false) {'
          new_sig = 'private fun startResolve(track: Track, preserveCrossfade: Boolean = false, autoRetryWhenOffline: Boolean = false, startPaused: Boolean = false) {'
          vm = vm.replace(old_sig, new_sig, 1)

          start_resolve_pos = vm.find(new_sig)
          if start_resolve_pos < 0:
              raise SystemExit('startResolve signature not found')
          request_pos = vm.find('        val requestId = ++playRequestId\n', start_resolve_pos)
          if request_pos < 0:
              raise SystemExit('playRequestId increment not found in startResolve')
          insertion_at = request_pos + len('        val requestId = ++playRequestId\n')
          if 'val request = PlaybackResolveRequest(requestId, startPaused)' not in vm[start_resolve_pos:insertion_at + 200]:
              vm = vm[:insertion_at] + '        val request = PlaybackResolveRequest(requestId, startPaused)\n' + vm[insertion_at:]

          vm = vm.replace(
              'resolveAndStartPlayback(track, requestId, autoRetryWhenOffline)',
              'resolveAndStartPlayback(track, request, autoRetryWhenOffline)',
              1,
          )

          old_resolve = '''private suspend fun CoroutineScope.resolveAndStartPlayback(
              track: Track,
              requestId: Long,
              autoRetryWhenOffline: Boolean
          ) {
          '''
          new_resolve = '''private suspend fun CoroutineScope.resolveAndStartPlayback(
              track: Track,
              request: PlaybackResolveRequest,
              autoRetryWhenOffline: Boolean
          ) {
              val requestId = request.id
          '''
          if old_resolve in vm:
              vm = vm.replace(old_resolve, new_resolve, 1)
          elif 'request: PlaybackResolveRequest' not in vm:
              raise SystemExit('resolveAndStartPlayback signature not found')

          vm = vm.replace(
              'startPlayback(preserveEditorialArtwork(track, instant))',
              'startPlayback(preserveEditorialArtwork(track, instant), request)',
              1,
          )
          # This exact call belongs to resolveAndStartPlayback; the request object must travel with it.
          resolve_start = vm.find('private suspend fun CoroutineScope.resolveAndStartPlayback(')
          resolve_end = vm.find('\n    private fun publishResolveFailure(', resolve_start)
          resolve_block = vm[resolve_start:resolve_end]
          resolve_block = resolve_block.replace('startPlayback(playable)', 'startPlayback(playable, request)', 1)
          vm = vm[:resolve_start] + resolve_block + vm[resolve_end:]

          vm = vm.replace('        pauseAfterNextPlaybackStart = false\n', '')

          old_playback_sig = 'private fun startPlayback(playable: Track) {'
          new_playback_sig = 'private fun startPlayback(playable: Track, request: PlaybackResolveRequest) {'
          vm = vm.replace(old_playback_sig, new_playback_sig, 1)
          playback_pos = vm.find(new_playback_sig)
          if playback_pos < 0:
              raise SystemExit('startPlayback signature not found')
          selected_line = '        val selectedIndex = queueEngine.state.value.currentIndex\n'
          selected_pos = vm.find(selected_line, playback_pos)
          if selected_pos < 0:
              raise SystemExit('startPlayback body marker not found')
          prelude = vm[playback_pos:selected_pos]
          if 'request.id != playRequestId' not in prelude:
              vm = vm[:selected_pos] + (
                  '        if (request.id != playRequestId) return\n'
                  '        val startPaused = shouldStartPlaybackPaused(request, playRequestId)\n'
              ) + vm[selected_pos:]

          vm = vm.replace(
              '        val startPaused = pauseAfterNextPlaybackStart\n        pauseAfterNextPlaybackStart = false\n',
              '',
          )

          if 'pauseAfterNextPlaybackStart' in vm:
              raise SystemExit('stale global pause flag remains')
          if 'startResolve(restoredTrack, startPaused = !session.wasPlaying)' not in vm:
              raise SystemExit('paused Samples restore is not request-scoped')
          if vm.count('startPlayback(preserveEditorialArtwork(track, instant), request)') != 1:
              raise SystemExit('instant resolve path did not receive request policy')
          if vm.count('startPlayback(playable, request)') < 1:
              raise SystemExit('resolved playback path did not receive request policy')
          vm_path.write_text(vm)

          app_path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          app = app_path.read_text()
          start = app.find('private fun RowScope.ExploreMoodCard(')
          end = app.find('\n@Composable\nprivate fun ExploreSamplesRow(', start)
          if start < 0 or end < 0:
              raise SystemExit('ExploreMoodCard block not found')
          block = app[start:end]
          block = block.replace('.height(58.dp)', '.heightIn(min = 58.dp)', 1)
          block = block.replace('maxLines = 1,', 'maxLines = 2,', 1)
          if '.heightIn(min = 58.dp)' not in block or 'maxLines = 2,' not in block:
              raise SystemExit('ExploreMoodCard accessibility fix not applied')
          app_path.write_text(app[:start] + block + app[end:])

          spotify_path = Path('tools/levyra-editorial/levyra_editorial/spotify.py')
          spotify = spotify_path.read_text()
          metadata_field = '        self._track_metadata: dict[str, Mapping[str, Any]] = {}\n'
          if '_track_metadata_rate_limited' not in spotify:
              if metadata_field not in spotify:
                  raise SystemExit('Spotify metadata cache field not found')
              spotify = spotify.replace(
                  metadata_field,
                  metadata_field + '        self._track_metadata_rate_limited = False\n',
                  1,
              )

          enrich_sig = '    def enrich_track_metadata(self, items: list[dict[str, Any]]) -> list[dict[str, Any]]:\n'
          enrich_pos = spotify.find(enrich_sig)
          if enrich_pos < 0:
              raise SystemExit('enrich_track_metadata not found')
          doc_end = spotify.find('\n', spotify.find('"""Best-effort ISRC and release metadata without weakening Pathfinder reads."""', enrich_pos))
          if doc_end < 0:
              raise SystemExit('enrich_track_metadata docstring not found')
          early_return = '        if self._track_metadata_rate_limited:\n            return items\n'
          if early_return not in spotify[enrich_pos:enrich_pos + 500]:
              spotify = spotify[:doc_end + 1] + early_return + spotify[doc_end + 1:]

          rate_start = spotify.find('                if response.status_code == 429:', enrich_pos)
          rate_end = spotify.find('                if response.status_code >= 400:', rate_start)
          if rate_start < 0 or rate_end < 0:
              raise SystemExit('Spotify metadata 429 branch not found')
          replacement = '''                if response.status_code == 429:
                      self._track_metadata_rate_limited = True
                      LOGGER.warning(
                          "Spotify track metadata rate-limited; disabling best-effort metadata enrichment for the remainder of this run."
                      )
                      break
          '''
          spotify = spotify[:rate_start] + replacement + spotify[rate_end:]
          spotify_path.write_text(spotify)

          test_path = Path('tools/levyra-editorial/tests/test_pathfinder.py')
          test = test_path.read_text().replace('import levyra_editorial.spotify as spotify_module\n', '')
          test_start = test.find('def test_track_metadata_enrichment_retries_one_rate_limited_batch(')
          if test_start >= 0:
              test_end = test.find('\n\ndef test_playlist_limit_stops_paging_after_the_first_page()', test_start)
              if test_end < 0:
                  raise SystemExit('rate limit regression test boundary not found')
              replacement_test = '''def test_track_metadata_enrichment_disables_after_first_rate_limit() -> None:
              session = SequencedSession(
                  [FakeResponse({}, status_code=429, headers={"Retry-After": "5"})]
              )
              client = authenticated_client(session)
              first = [{"track": {"id": "track12345", "album": {}}}]
              second = [{"track": {"id": "track67890", "album": {}}}]

              assert client.enrich_track_metadata(first) == first
              assert client.enrich_track_metadata(second) == second
              assert [url for url, _ in session.calls] == [f"{API_BASE_URL}/tracks"]
          '''
              test = test[:test_start] + replacement_test + test[test_end:]
          test_path.write_text(test)

          restore_test = Path('app/src/test/java/com/luc4n3x/levyra/viewmodel/SamplesPlaybackRestorePolicyTest.kt')
          restore_test.write_text('''package com.luc4n3x.levyra.viewmodel

          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class SamplesPlaybackRestorePolicyTest {
              @Test
              fun pausedRestoreStartsPausedOnlyForItsOwnRequest() {
                  val request = PlaybackResolveRequest(id = 10L, startPaused = true)
                  assertTrue(shouldStartPlaybackPaused(request, activeRequestId = 10L))
              }

              @Test
              fun supersededRestoreCannotPauseTheReplacementRequest() {
                  val staleRestore = PlaybackResolveRequest(id = 10L, startPaused = true)
                  assertFalse(shouldStartPlaybackPaused(staleRestore, activeRequestId = 11L))
              }

              @Test
              fun normalRequestAfterFailedRestoreDoesNotInheritPause() {
                  val failedRestore = PlaybackResolveRequest(id = 10L, startPaused = true)
                  val normalReplacement = PlaybackResolveRequest(id = 11L)
                  assertFalse(shouldStartPlaybackPaused(failedRestore, activeRequestId = 11L))
                  assertFalse(shouldStartPlaybackPaused(normalReplacement, activeRequestId = 11L))
              }
          }
          '''.replace('          ', ''))
          PY

      - name: Editorial regression tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -e tools/levyra-editorial pytest ruff
          ruff check tools/levyra-editorial
          python -m pytest -q tools/levyra-editorial/tests/test_pathfinder.py tools/levyra-editorial/tests/test_resilient.py

      - name: Validate targeted patch
        shell: bash
        run: |
          git diff --check
          ! grep -q "pauseAfterNextPlaybackStart" app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q "startResolve(restoredTrack, startPaused = !session.wasPlaying)" app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q "heightIn(min = 58.dp)" app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          grep -q "_track_metadata_rate_limited" tools/levyra-editorial/levyra_editorial/spotify.py

      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/pr313-targeted-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(explore): harden samples restore and editorial collection"
          git push origin HEAD:claude/menu-esplora-redesign-t3j2l4
