name: PR 313 targeted fixes

on:
  push:
    branches:
      - claude/menu-esplora-redesign-t3j2l4
    paths:
      - .github/workflows/pr313-targeted-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: claude/menu-esplora-redesign-t3j2l4
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply deterministic patch
        id: patch
        shell: bash
        run: |
          set +e
          python .github/scripts/pr313_targeted_fix.py > /tmp/pr313-patch.log 2>&1
          status=$?
          cat /tmp/pr313-patch.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Editorial regression tests
        id: tests
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          set +e
          {
            python -m pip install --disable-pip-version-check -e tools/levyra-editorial pytest ruff &&
            ruff check tools/levyra-editorial &&
            python -m pytest -q tools/levyra-editorial/tests/test_pathfinder.py tools/levyra-editorial/tests/test_resilient.py &&
            git diff --check
          } > /tmp/pr313-tests.log 2>&1
          status=$?
          cat /tmp/pr313-tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit targeted fixes
        if: steps.patch.outputs.status == '0' && steps.tests.outputs.status == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
                  app/src/test/java/com/luc4n3x/levyra/viewmodel/SamplesPlaybackRestorePolicyTest.kt \
                  tools/levyra-editorial/levyra_editorial/spotify.py \
                  tools/levyra-editorial/tests/test_pathfinder.py
          git commit -m "fix(explore): harden samples restore and editorial collection"
          git push origin HEAD:claude/menu-esplora-redesign-t3j2l4

      - name: Persist failure diagnostics
        if: steps.patch.outputs.status != '0' || steps.tests.outputs.status != '0'
        shell: bash
        run: |
          {
            echo "patch_status=${{ steps.patch.outputs.status }}"
            echo "tests_status=${{ steps.tests.outputs.status }}"
            echo
            echo "--- patch log ---"
            cat /tmp/pr313-patch.log 2>/dev/null || true
            echo
            echo "--- tests log ---"
            cat /tmp/pr313-tests.log 2>/dev/null || true
          } > pr313-fix-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr313-fix-diagnostic.txt
          git commit -m "chore(ci): record PR 313 fix diagnostics"
          git push origin HEAD:claude/menu-esplora-redesign-t3j2l4
          exit 1
