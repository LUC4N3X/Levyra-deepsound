name: Apply Home Discovery Remix

on:
  push:
    branches:
      - feature/home-discovery-remix
    paths:
      - .github/workflows/apply-home-discovery-remix.yml
      - .github/scripts/patch-home-discovery-remix.py
      - .github/scripts/patch-home-discovery-height.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply focused Home redesign
        run: |
          python3 .github/scripts/patch-home-discovery-remix.py
          python3 .github/scripts/patch-home-discovery-height.py

      - name: Compile Android debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Run Home-focused unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Run Levyra AI quality gate
        run: python3 scripts/ai_quality_gate.py --profile full

      - name: Commit validated source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt app/src/main/java/com/luc4n3x/levyra/ui/theme/HomeDesign.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat(ui): remix home discovery experience"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
