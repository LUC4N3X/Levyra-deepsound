name: Queue Space Hotfix

on:
  push:
    branches:
      - codex/persistent-queue-spaces-local-library
    paths:
      - .github/workflows/queue-space-hotfix.yml
      - .github/queue_space_hotfix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/persistent-queue-spaces-local-library
          fetch-depth: 0

      - name: Apply focused fixes
        run: python3 .github/queue_space_hotfix.py

      - name: Check diff
        run: git diff --check

      - name: Run queue regression tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.luc4n3x.levyra.player.queue.QueueSpaceEngineTest"

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/player/queue/PersistentQueueEngine.kt
          git add app/src/test/java/com/luc4n3x/levyra/player/queue/QueueSpaceEngineTest.kt
          git add app/src/main/java/com/luc4n3x/levyra/ui/components/LevyraTrackActionSheet.kt
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git commit -m "fix: preserve empty queue spaces and improve queue controls"
          git push origin HEAD:codex/persistent-queue-spaces-local-library
