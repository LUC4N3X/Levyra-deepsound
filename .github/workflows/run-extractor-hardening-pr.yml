name: Run isolated extractor hardening

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  run:
    if: github.head_ref == 'automation/extractor-hardening-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v4
        with:
          ref: automation/extractor-hardening-runner
          fetch-depth: 0

      - name: Extract reviewed patch step
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/apply-extractor-hardening.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines)
                       if line.strip() == '- name: Apply reviewed upstream extractor changes')
          run_line = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(lines))
                     if lines[i].startswith('      - name:'))
          indent = '          '
          script = '\n'.join(
              line[len(indent):] if line.startswith(indent) else line
              for line in lines[run_line + 1:end]
          ) + '\n'

          merge_start = script.index(
              '# Merge the upstream player-request changes into Levyra\'s multi-client extractor.'
          )
          merge_end = script.index(
              '# Remove the global TLS bypass and expose the session PoToken provider.',
              merge_start,
          )
          stream_patch = '\n'.join((
              '# Preserve Levyra multi-client aggregation. The upstream stream extractor',
              '# is intentionally not merged because it would replace Android VR, Safari and TV.',
              'stream_relative = (',
              '    "extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/"',
              '    "extractors/YoutubeStreamExtractor.java"',
              ')',
              'stream_target = root / stream_relative',
              'stream_text = stream_target.read_text(encoding="utf-8")',
              'stream_text = replace_once(',
              '    stream_text,',
              '    \'        final Localization localization = new Localization("en");\\n\',',
              '    \'        final Localization localization = \'',
              '    \'YoutubeParsingHelper.getPlayerRequestLocalization();\\n\',',
              '    "Youtube player request localization",',
              ')',
              'stream_target.write_text(stream_text, encoding="utf-8")',
              '',
              '',
          ))
          script = script[:merge_start] + stream_patch + script[merge_end:]
          Path('/tmp/apply-extractor-hardening.sh').write_text(script, encoding='utf-8')

      - name: Check out target implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/extractor-security-aa-potoken-sabr
          git checkout -B agent/extractor-security-aa-potoken-sabr \
            origin/agent/extractor-security-aa-potoken-sabr

      - name: Apply reviewed extractor changes
        shell: bash
        run: bash /tmp/apply-extractor-hardening.sh

      - name: Improve Android Auto local and voice search
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/player/AndroidAutoLibrary.kt')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext\n',
              'import kotlinx.coroutines.CoroutineScope\n'
              'import kotlinx.coroutines.Dispatchers\n'
              'import kotlinx.coroutines.Job\n'
              'import kotlinx.coroutines.SupervisorJob\n'
              'import kotlinx.coroutines.launch\n'
              'import kotlinx.coroutines.withContext\n',
              'Android Auto coroutine imports',
          )
          replace_once(
              '    private val searchCache = ConcurrentHashMap<String, TimedTracks>()\n',
              '    private val searchCache = ConcurrentHashMap<String, TimedTracks>()\n'
              '    private val searchScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)\n'
              '    private val searchInFlight = ConcurrentHashMap<String, Job>()\n',
              'Android Auto search fields',
          )
          replace_once(
              '''    fun preloadSearch(query: String) {
        if (query.cleanQuery().isBlank()) return
    }

    suspend fun search(query: String): List<MediaItem> = withContext(Dispatchers.IO) {
        val clean = query.cleanQuery()
        if (clean.isBlank()) return@withContext flowTracks().map { trackItem(it) }
        searchTracks(clean).map { trackItem(it) }
    }
''',
              '''    fun preloadSearch(query: String) {
        val clean = query.voiceSearchQuery()
        if (clean.isBlank()) return
        val now = System.currentTimeMillis()
        if (searchCache[clean]?.let { now - it.createdAt < SEARCH_TTL_MS } == true) return
        if (searchInFlight.containsKey(clean)) return

        val job = searchScope.launch {
            try {
                searchTracks(clean)
            } catch (error: Throwable) {
                Timber.d(error, "Android Auto search preload failed")
            } finally {
                searchInFlight.remove(clean)
            }
        }
        searchInFlight.putIfAbsent(clean, job)?.let { job.cancel() }
    }

    suspend fun search(query: String): List<MediaItem> = withContext(Dispatchers.IO) {
        val clean = query.voiceSearchQuery()
        if (clean.isBlank()) return@withContext flowTracks().map { trackItem(it) }
        searchTracks(clean).map { trackItem(it) }
    }
''',
              'Android Auto preload and search',
          )
          replace_once(
              '''    private suspend fun searchLocal(query: String): List<Track> = withContext(Dispatchers.IO) {
        val needle = query.lowercase(Locale.ROOT)
        buildList {
            addAll(favorites())
            addAll(recents())
            addAll(downloads())
            playlists().forEach { addAll(it.tracks) }
        }.filter { track ->
            track.title.lowercase(Locale.ROOT).contains(needle) ||
                track.artist.lowercase(Locale.ROOT).contains(needle) ||
                track.album.lowercase(Locale.ROOT).contains(needle)
        }.distinctTracks().take(20)
    }
''',
              '''    private suspend fun searchLocal(query: String): List<Track> = withContext(Dispatchers.IO) {
        val needle = query.lowercase(Locale.ROOT)
        val tokens = query.searchTokens()
        buildList {
            addAll(favorites())
            addAll(recents())
            addAll(downloads())
            playlists().forEach { addAll(it.tracks) }
        }.filter { track ->
            val searchable = listOf(track.title, track.artist, track.album, track.source)
                .joinToString(" ")
                .lowercase(Locale.ROOT)
            searchable.contains(needle) || tokens.isNotEmpty() && tokens.all(searchable::contains)
        }.sortedByDescending { track ->
            val title = track.title.lowercase(Locale.ROOT)
            val artist = track.artist.lowercase(Locale.ROOT)
            when {
                title == needle -> 5
                title.startsWith(needle) -> 4
                artist == needle -> 3
                title.contains(needle) -> 2
                else -> 1
            }
        }.distinctTracks().take(24)
    }
''',
              'Android Auto local search',
          )
          replace_once(
              '''    private fun String.cleanQuery(): String = trim()
        .replace(Regex("[^\\p{L}\\p{M}\\p{N} .,'’&+_-]+"), " ")
        .replace(Regex("\\s+"), " ")
        .take(90)
        .trim()
''',
              '''    private fun String.cleanQuery(): String = trim()
        .replace(Regex("[^\\p{L}\\p{M}\\p{N} .,'’&+_-]+"), " ")
        .replace(Regex("\\s+"), " ")
        .take(90)
        .trim()

    private fun String.voiceSearchQuery(): String {
        var value = cleanQuery()
        VOICE_COMMAND_PREFIXES.firstOrNull { value.startsWith(it, ignoreCase = true) }
            ?.let { prefix -> value = value.drop(prefix.length).trim() }
        value = value.replace(Regex("\\s+(?:su|in)\\s+levyra$", RegexOption.IGNORE_CASE), "")
        return value.cleanQuery()
    }

    private fun String.searchTokens(): List<String> = lowercase(Locale.ROOT)
        .split(Regex("\\s+"))
        .map(String::trim)
        .filter { it.length >= 2 && it !in SEARCH_STOP_WORDS }
        .distinct()
''',
              'Android Auto voice helpers',
          )
          replace_once(
              '        private const val SEARCH_TTL_MS = 3L * 60L * 1000L\n',
              '        private const val SEARCH_TTL_MS = 3L * 60L * 1000L\n'
              '        private val VOICE_COMMAND_PREFIXES = listOf(\n'
              '            "riproduci ", "suona ", "metti ", "ascolta ", "cerca ", "play "\n'
              '        )\n'
              '        private val SEARCH_STOP_WORDS = setOf(\n'
              '            "di", "del", "della", "dei", "degli", "delle", "da", "by", "the",\n'
              '            "un", "una", "uno", "il", "lo", "la", "i", "gli", "le"\n'
              '        )\n',
              'Android Auto voice constants',
          )
          path.write_text(text, encoding='utf-8')

      - name: Compile vendored extractor production sources
        run: ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:compileJava

      - name: Compile Android release
        env:
          YOUTUBE_INNERTUBE_API_KEY: ci-placeholder-key
        run: ./gradlew --no-daemon :app:compileReleaseKotlin

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app third_party/LevyraExtractor
          git diff --cached --check
          git commit -m "feat: harden extractor security and Android Auto search"
          git push origin HEAD:agent/extractor-security-aa-potoken-sabr
