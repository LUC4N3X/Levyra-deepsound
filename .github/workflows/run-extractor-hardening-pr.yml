name: Harden Android Auto search prewarm

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'automation/extractor-hardening-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/extractor-security-aa-potoken-sabr
          fetch-depth: 0

      - name: Make search prewarm single-flight
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/player/AndroidAutoLibrary.kt')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          old_imports = ''.join((
              'import kotlinx.coroutines.CoroutineScope\n',
              'import kotlinx.coroutines.Dispatchers\n',
              'import kotlinx.coroutines.Job\n',
              'import kotlinx.coroutines.SupervisorJob\n',
              'import kotlinx.coroutines.launch\n',
          ))
          new_imports = ''.join((
              'import kotlinx.coroutines.CancellationException\n',
              'import kotlinx.coroutines.CoroutineScope\n',
              'import kotlinx.coroutines.CoroutineStart\n',
              'import kotlinx.coroutines.Dispatchers\n',
              'import kotlinx.coroutines.Job\n',
              'import kotlinx.coroutines.SupervisorJob\n',
              'import kotlinx.coroutines.launch\n',
          ))
          replace_once(old_imports, new_imports, 'coroutine imports')

          old_preload = '\n'.join((
              '    fun preloadSearch(query: String) {',
              '        val clean = query.voiceSearchQuery()',
              '        if (clean.isBlank()) return',
              '        val now = System.currentTimeMillis()',
              '        if (searchCache[clean]?.let { now - it.createdAt < SEARCH_TTL_MS } == true) return',
              '        if (searchInFlight.containsKey(clean)) return',
              '',
              '        val job = searchScope.launch {',
              '            try {',
              '                searchTracks(clean)',
              '            } catch (error: Throwable) {',
              '                Timber.d(error, "Android Auto search preload failed")',
              '            } finally {',
              '                searchInFlight.remove(clean)',
              '            }',
              '        }',
              '        searchInFlight.putIfAbsent(clean, job)?.let { job.cancel() }',
              '    }',
              '',
          ))
          new_preload = '\n'.join((
              '    fun preloadSearch(query: String) {',
              '        val clean = query.voiceSearchQuery()',
              '        if (clean.isBlank()) return',
              '        val now = System.currentTimeMillis()',
              '        if (searchCache[clean]?.let { now - it.createdAt < SEARCH_TTL_MS } == true) return',
              '',
              '        val job = searchScope.launch(start = CoroutineStart.LAZY) {',
              '            try {',
              '                searchTracks(clean)',
              '            } catch (cancelled: CancellationException) {',
              '                throw cancelled',
              '            } catch (error: Exception) {',
              '                Timber.d(error, "Android Auto search preload failed")',
              '            } finally {',
              '                searchInFlight.remove(clean)',
              '            }',
              '        }',
              '        if (searchInFlight.putIfAbsent(clean, job) == null) {',
              '            job.start()',
              '        } else {',
              '            job.cancel()',
              '        }',
              '    }',
              '',
          ))
          replace_once(old_preload, new_preload, 'preloadSearch')
          path.write_text(text, encoding='utf-8')

      - name: Check patch integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R --line-number -E 'trustEveryone|X509TrustManager|setDefaultHostnameVerifier' \
            third_party/LevyraExtractor/extractor/src/main/java

      - name: Run vendored extractor tests
        run: ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test

      - name: Compile Android sources
        env:
          YOUTUBE_INNERTUBE_API_KEY: ci-placeholder-key
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/player/AndroidAutoLibrary.kt
          git diff --cached --check
          git commit -m "fix(android-auto): make search prewarm single-flight"
          git push origin HEAD:agent/extractor-security-aa-potoken-sabr
