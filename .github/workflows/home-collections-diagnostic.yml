name: Home Collections Diagnostic

on:
  push:
    branches:
      - feat/home-ytmusic-style
    paths:
      - .github/workflows/home-collections-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Levyra Collections layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          lines = path.read_text(encoding="utf-8").splitlines()
          needles = ["Levyra Collections", "HomeEditorialCollectionCard", "HOME_COLLECTION_CARD_WIDTH"]
          for needle in needles:
              print(f"\n=== {needle} ===")
              matches = [i for i, line in enumerate(lines) if needle in line]
              if not matches:
                  print("NO MATCH")
                  continue
              for i in matches:
                  start = max(0, i - 100)
                  end = min(len(lines), i + 180)
                  print(f"--- match at line {i + 1} ---")
                  for n in range(start, end):
                      print(f"{n + 1:05d}: {lines[n]}")
          PY
