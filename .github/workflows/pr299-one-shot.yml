              minimum=1
          )

          single_flight = "third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrClientVersionSingleFlightTest.java"
          replace_once(
              single_flight,
              "import java.util.concurrent.atomic.AtomicInteger;\n",
              "import java.util.concurrent.atomic.AtomicInteger;\n"
              "import java.util.concurrent.atomic.AtomicReference;\n"
          )
          replace_once(
              single_flight,
              "            final CountDownLatch secondStarted = new CountDownLatch(1);\n"
              "            final Future<String> second = executor.submit(() -> {\n"
              "                secondStarted.countDown();\n"
              "                return YoutubeParsingHelper.getClientVersion();\n"
              "            });\n"
              "            assertTrue(secondStarted.await(2, TimeUnit.SECONDS));\n\n"
              "            assertEquals(1, downloader.requestCount.get());",
              "            final AtomicReference<Thread> secondThread = new AtomicReference<>();\n"
              "            final Future<String> second = executor.submit(() -> {\n"
              "                secondThread.set(Thread.currentThread());\n"
              "                return YoutubeParsingHelper.getClientVersion();\n"
              "            });\n"
              "            assertTrue(waitUntilBlocked(secondThread, 2_000));\n\n"
              "            assertEquals(1, downloader.requestCount.get());"
          )
          replace_once(
              single_flight,
              "    private static final class BlockingDownloader extends Downloader {",
              "    private static boolean waitUntilBlocked(\n"
              "            @Nonnull final AtomicReference<Thread> threadReference,\n"
              "            final long timeoutMs) throws InterruptedException {\n"
              "        final long deadline = System.nanoTime() + TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n"
              "        while (System.nanoTime() < deadline) {\n"
              "            final Thread thread = threadReference.get();\n"
              "            if (thread != null) {\n"
              "                final Thread.State state = thread.getState();\n"
              "                if (state == Thread.State.BLOCKED || state == Thread.State.WAITING\n"
              "                        || state == Thread.State.TIMED_WAITING) {\n"
              "                    return true;\n"
              "                }\n"
              "            }\n"
              "            Thread.sleep(10);\n"
              "        }\n"
              "        return false;\n"
              "    }\n\n"
              "    private static final class BlockingDownloader extends Downloader {"
          )

          def add_newpipe_restore(path, class_name):
              text = load(path)
              if "import org.junit.jupiter.api.AfterEach;" not in text:
                  text = text.replace(
                      "import org.junit.jupiter.api.Test;\n",
                      "import org.junit.jupiter.api.AfterEach;\n"
                      "import org.junit.jupiter.api.Test;\n",
                      1
                  )
              class_marker = f"class {class_name} {{"
              restore_block = (
                  class_marker
                  + "\n    private Downloader previousDownloader;\n\n"
                  "    @AfterEach\n"
                  "    void restoreDownloader() {\n"
                  "        if (previousDownloader != null) {\n"
                  "            NewPipe.init(previousDownloader);\n"
                  "            previousDownloader = null;\n"
                  "        }\n"
                  "    }\n\n"
                  "    private void installDownloader(final Downloader downloader) {\n"
                  "        if (previousDownloader == null) {\n"
                  "            previousDownloader = NewPipe.getDownloader();\n"
                  "        }\n"
                  "        NewPipe.init(downloader);\n"
                  "    }"
              )
              if class_marker not in text:
                  raise SystemExit(f"Class marker missing: {path}")
              text = text.replace(class_marker, restore_block, 1)
              text = text.replace("private static Fixture createFixture", "private Fixture createFixture")
              if "NewPipe.init(downloader);" not in text:
                  raise SystemExit(f"Downloader install call missing: {path}")
              text = text.replace("NewPipe.init(downloader);", "installDownloader(downloader);")
              save(path, text)

          add_newpipe_restore(
              "third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrSessionStreamProtectionTest.java",
              "YoutubeSabrSessionStreamProtectionTest"
          )
          add_newpipe_restore(
              "third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrSessionInitializationStateTest.java",
              "YoutubeSabrSessionInitializationStateTest"
          )

          hardening_test = "third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/sabr/Pr299HardeningTest.java"
          replace_once(
              hardening_test,
              "import java.io.IOException;\n",
              "import java.io.IOException;\n"
              "import java.lang.reflect.InvocationTargetException;\n"
              "import java.lang.reflect.Method;\n"
          )
          hardening_text = load(hardening_test)
          new_test = '''
    @Test
    void truncatedControlPayloadUsesRecoverableFailure() throws Exception {
        final Method method = SabrStreamingResponseReader.class.getDeclaredMethod(
                "readPayloadBytes", java.io.InputStream.class, int.class);
        method.setAccessible(true);
        final InvocationTargetException thrown = assertThrows(
