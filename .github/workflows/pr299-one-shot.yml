name: PR 299 One-Shot Review Fixes

on:
  push:
    branches:
      - agent/extractor-security-aa-potoken-sabr
    paths:
      - .github/workflows/pr299-one-shot.yml

permissions:
  contents: write

concurrency:
  group: pr299-one-shot-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/extractor-security-aa-potoken-sabr
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-disabled: true

      - name: Apply verified PR 299 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding="utf-8")

          def save(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = load(path)
              if old not in text:
                  raise SystemExit(f"Missing expected text in {path}: {old[:120]!r}")
              save(path, text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              text = load(path)
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(
                      f"Expected at least {minimum} occurrences in {path}, found {count}: {old[:120]!r}"
                  )
              save(path, text.replace(old, new))

          def find_matching_brace(text, opening):
              depth = 0
              i = opening
              state = "normal"
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""
                  if state == "normal":
                      if c == '"':
                          state = "string"
                      elif c == "'":
                          state = "char"
                      elif c == "/" and n == "/":
                          state = "line_comment"
                          i += 1
                      elif c == "/" and n == "*":
                          state = "block_comment"
                          i += 1
                      elif c == "{":
                          depth += 1
                      elif c == "}":
                          depth -= 1
                          if depth == 0:
                              return i
                  elif state == "string":
                      if c == "\\":
                          i += 1
                      elif c == '"':
                          state = "normal"
                  elif state == "char":
                      if c == "\\":
                          i += 1
                      elif c == "'":
                          state = "normal"
                  elif state == "line_comment":
                      if c == "\n":
                          state = "normal"
                  elif state == "block_comment":
                      if c == "*" and n == "/":
                          state = "normal"
                          i += 1
                  i += 1
              raise SystemExit("Unbalanced Java braces")

          def wrap_all_methods(path, marker, lock_name):
              text = load(path)
              cursor = 0
              wrapped = 0
              while True:
                  index = text.find(marker, cursor)
                  if index < 0:
                      break
                  opening = text.find("{", index)
                  if opening < 0:
                      raise SystemExit(f"Method opening brace not found: {path} / {marker}")
                  closing = find_matching_brace(text, opening)
                  body = text[opening + 1:closing]
                  if re.match(r"\s*synchronized\s*\(\s*" + re.escape(lock_name) + r"\s*\)", body):
                      cursor = closing + 1
                      continue
                  line_start = text.rfind("\n", 0, index) + 1
                  method_indent = text[line_start:index]
                  if method_indent.strip():
                      method_indent = re.match(r"\s*", method_indent).group(0)
                  lines = body.strip("\n").split("\n")
                  indented = "\n".join(
                      ("    " + line) if line.strip() else line for line in lines
                  )
                  replacement = (
                      "{\n"
                      + method_indent + "    synchronized (" + lock_name + ") {\n"
                      + indented
                      + "\n" + method_indent + "    }\n"
                      + method_indent
                  )
                  text = text[:opening] + replacement + text[closing:]
                  cursor = opening + len(replacement) + 1
                  wrapped += 1
              if wrapped == 0:
                  raise SystemExit(f"No methods matched in {path}: {marker}")
              save(path, text)

          def replace_method(path, marker, replacement):
              text = load(path)
              index = text.find(marker)
              if index < 0:
                  raise SystemExit(f"Method not found in {path}: {marker}")
              line_start = text.rfind("\n", 0, index) + 1
              opening = text.find("{", index)
              closing = find_matching_brace(text, opening)
              save(path, text[:line_start] + replacement + text[closing + 1:])

          session = "third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrSession.java"
          replace_once(
              session,
              "    private final Object segmentAvailable = new Object();",
              "    private final Object segmentAvailable = new Object();\n"
              "    // Serializes network requests and all policy/stream-state transitions per session.\n"
              "    private final Object requestLock = new Object();\n"
              "    // Keeps cacheOrder and byte accounting consistent with concurrent release/discard calls.\n"
              "    private final Object cacheLock = new Object();"
          )
          replace_once(
              session,
              "    // Insertion order + total bytes of cached MEDIA segments (init segments are never evicted).\n"
              "    // Mutated only by the single pump thread in pumpOnce; readers only do concurrent-map gets.",
              "    // Insertion order + total bytes of cached MEDIA segments (init segments are never evicted).\n"
              "    // Network paths are serialized by requestLock; bookkeeping is guarded by cacheLock."
          )
          replace_once(session, "    private long cachedBytes;", "    private volatile long cachedBytes;")
          replace_once(session, "    private long peakCachedBytes;", "    private volatile long peakCachedBytes;")

          for marker in (
              "public SabrMediaSegment fetchSegment(",
              "public YoutubeSabrProbeResult fetchNextResponse(",
              "public int pumpOnceStreaming(",
              "public int pumpOnceStreamingForStartup(",
              "public int pumpOnceStreamingUntilCached(",
              "public DemandResponseResult pumpOnceStreamingForDemand(",
              "public SabrSessionPolicy.DemandRoute evaluateDemandRoute(",
              "public SabrSessionPolicy.DemandResponseDecision evaluateDemandResponse(",
              "public void bootstrapInitialization(",
              "public byte[] fetchInitializationData(",
              "public void prepareForMediaSegment(",
              "public void prepareForInitialization(",
              "public void prepareForRewind(",
              "public void prepareForForwardJump(",
              "public void prepareForMissingSegment(",
          ):
              wrap_all_methods(session, marker, "requestLock")

          for marker in (
              "private void ingestAndCacheSegment(",
              "private void evictCacheIfNeeded(",
              "private void evictOutsideSeekWindow(",
              "public void clearCache(",
              "public void discardCachedSegment(",
          ):
              wrap_all_methods(session, marker, "cacheLock")

          replace_once(
              session,
              "    public void close() {\n"
              "        if (cacheClosed) {\n"
              "            return;\n"
              "        }\n"
              "        cacheClosed = true;\n"
              "        clearCache();\n"
              "        sessionPolicyHost.close();\n"
              "    }",
              "    public void close() {\n"
              "        if (cacheClosed) {\n"
              "            return;\n"
              "        }\n"
              "        cacheClosed = true;\n"
              "        synchronized (requestLock) {\n"
              "            clearCache();\n"
              "            sessionPolicyHost.close();\n"
              "        }\n"
              "    }"
          )
          replace_once(
              session,
              "sessionPolicyHost.commitAppliedState(policyResult, sessionPolicyState(),\n"
              "                    executedActions, completed);",
              "sessionPolicyHost.commitAppliedState(sessionPolicyState(), executedActions, completed);"
          )

          reader = "third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/SabrStreamingResponseReader.java"
          replace_once(
              reader,
              '                throw new IOException("Unexpected EOF while reading UMP part data");',
              '                throw new SabrRecoverableException(\n'
              '                        "Unexpected EOF while reading UMP part data");'
          )

          decoder = "third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/SabrResponseDecoder.java"
          decoder_text = load(decoder)
          obsolete_media_cases = re.compile(
              r"\n\s*case MEDIA_HEADER:\n"
              r"\s*decoded\.addMediaHeader\(SabrMediaHeader\.decode\(partData\)\);\n"
              r"\s*break;\n"
              r"\s*case MEDIA:\n"
              r"\s*if \(partData\.length > 0\) \{\n"
              r"\s*decoded\.addMediaBytes\(partData\[0\] & 0xff, partData\.length - 1L\);\n"
              r"\s*\}\n"
              r"\s*break;\n"
              r"\s*case MEDIA_END:\n"
              r"\s*if \(partData\.length > 0\) \{\n"
              r"\s*decoded\.addMediaEndHeaderId\(partData\[0\] & 0xff\);\n"
              r"\s*\}\n"
              r"\s*break;"
          )
          decoder_text, count = obsolete_media_cases.subn("", decoder_text, count=1)
          if count != 1:
              raise SystemExit("Could not remove duplicate builtin media switch cases")
          save(decoder, decoder_text)

          live = "third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/SabrLiveMetadata.java"
          replace_once(
              live,
              "        if (headSequenceNumber < -1 || headTimeMs < -1 || wallTimeMs < -1\n"
              "                || minSeekableTimeTicks < -1 || minSeekableTimescale < -1",
              "        if (headSequenceNumber < -1 || headTimeMs < -1 || wallTimeMs < -1\n"
              "                || headm < -1\n"
              "                || minSeekableTimeTicks < -1 || minSeekableTimescale < -1"
          )

          request_builder = "third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrRequestBuilder.java"
          replace_once(
              request_builder,
              "        final boolean includeInitialPlaybackState = forcedInitialPlaybackState\n"
              "                || playerTimeMs > 0 || !bufferedRanges.isEmpty();",
              "        final boolean includeInitialPlaybackState = streamState != null\n"
              "                && (forcedInitialPlaybackState || playerTimeMs > 0\n"
              "                || !bufferedRanges.isEmpty());"
          )

          sabr_format = "third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrFormat.java"
          replace_once(
              sabr_format,
              "import java.util.Set;\n",
              "import java.util.Set;\n"
              "import java.util.regex.Matcher;\n"
              "import java.util.regex.Pattern;\n"
          )
          replace_once(
              sabr_format,
              "    private static final long serialVersionUID = 1L;\n",
              "    private static final long serialVersionUID = 1L;\n"
              "    private static final Pattern N_QUERY_PATTERN = Pattern.compile(\"([?&])n=([^&]+)\");\n"
              "    private static final Pattern N_PATH_PATTERN = Pattern.compile(\"/n/([^/?#]+)\");\n"
          )
          replace_all(
              sabr_format,
              '        final java.util.regex.Matcher queryMatcher = java.util.regex.Pattern\n'
              '                .compile("([?&])n=([^&]+)").matcher(url);',
              '        final Matcher queryMatcher = N_QUERY_PATTERN.matcher(url);',
              minimum=2
          )
          replace_all(
              sabr_format,
              '        final java.util.regex.Matcher pathMatcher = java.util.regex.Pattern\n'
              '                .compile("/n/([^/?#]+)").matcher(url);',
              '        final Matcher pathMatcher = N_PATH_PATTERN.matcher(url);',
              minimum=2
          )

          transcript = "third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/SabrSessionPolicyTranscript.java"
          replace_once(
              transcript,
              "    synchronized void record(@Nonnull final SabrSessionPolicy.State state,\n"
              "                             @Nonnull final SabrSessionPolicy.Event event,\n"
              "                             @Nonnull final SabrSessionPolicy.Result result) {\n"
              "        if (entries.size() == capacity) entries.removeFirst();\n"
              "        entries.addLast(new Entry(summary(state, event, result)));\n"
              "    }",
              "    synchronized void record(@Nonnull final SabrSessionPolicy.State state,\n"
              "                             @Nonnull final SabrSessionPolicy.Event event,\n"
              "                             @Nonnull final SabrSessionPolicy.Result result) {\n"
              "        append(summary(state, event, result));\n"
              "    }"
          )
          replace_once(
              transcript,
              "    synchronized void commitLast(@Nonnull final SabrSessionPolicy.Result result,\n"
              "                                 @Nonnull final SabrSessionPolicy.State appliedState,\n",
              "    synchronized void commitLast(@Nonnull final SabrSessionPolicy.State appliedState,\n"
          )
          replace_once(
              transcript,
              "        commitLastTypes(result, appliedState, types, completed);",
              "        commitLastTypes(appliedState, types, completed);"
          )
          replace_once(
              transcript,
              "    synchronized void commitLastTypes(@Nonnull final SabrSessionPolicy.Result result,\n"
              "                                      @Nonnull final SabrSessionPolicy.State appliedState,\n",
              "    synchronized void commitLastTypes(@Nonnull final SabrSessionPolicy.State appliedState,\n"
          )

          host = "third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/SabrSessionPolicyHost.java"
          replace_once(
              host,
              "        if (transcript != null) transcript.commitLast(result, state, result.getActions(), true);",
              "        if (transcript != null) transcript.commitLast(state, result.getActions(), true);"
          )
          replace_once(
              host,
              "    public void commitAppliedState(@Nonnull final SabrSessionPolicy.Result result,\n"
              "                                   @Nonnull final SabrSessionPolicy.State state,\n"
              "                                   @Nonnull final List<SabrSessionPolicy.ActionType> actions,\n"
              "                                   final boolean completed) {\n"
              "        if (transcript != null) transcript.commitLastTypes(result, state, actions, completed);\n"
              "    }",
              "    public void commitAppliedState(@Nonnull final SabrSessionPolicy.State state,\n"
              "                                   @Nonnull final List<SabrSessionPolicy.ActionType> actions,\n"
              "                                   final boolean completed) {\n"
              "        if (transcript != null) transcript.commitLastTypes(state, actions, completed);\n"
              "    }"
          )

          validate_result_replacement = '''    private static void validateResult(@Nonnull final SabrSessionPolicy.State state,
                                       @Nonnull final SabrSessionPolicy.Event event,
                                       @Nullable final SabrSessionPolicy.Result result) {
        if (result == null || result.getActions().isEmpty()) {
            throw new IllegalStateException("SABR policy returned no result");
        }
        validateState(result.getNextState());
        if (event instanceof SabrSessionPolicy.RequestEvent) {
            validateRequestResult(state, result);
            return;
        }
        final Set<SabrSessionPolicy.ActionType> seen = validateControlActions(result);
        validateControlTransition(state, (SabrSessionPolicy.ControlResponseEvent) event,
                result, seen);
    }

    private static void validateRequestResult(
            @Nonnull final SabrSessionPolicy.State state,
            @Nonnull final SabrSessionPolicy.Result result) {
        final SabrSessionPolicy.ActionType expected = state.getRequestNumber() == 0
                ? SabrSessionPolicy.ActionType.SEND_INITIAL_REQUEST
                : SabrSessionPolicy.ActionType.SEND_FOLLOW_UP_REQUEST;
        if (result.getActions().size() != 1
                || result.getActions().get(0).getType() != expected
                || result.getRequestBody() == null || result.getRequestBody().length == 0
                || result.getRequestBody().length > MAX_REQUEST_BYTES
                || result.getControlDecision() != null || !state.equals(result.getNextState())) {
            throw new IllegalStateException("Invalid SABR request policy result");
        }
    }

    @Nonnull
    private static Set<SabrSessionPolicy.ActionType> validateControlActions(
            @Nonnull final SabrSessionPolicy.Result result) {
        if (result.getRequestBody() != null || result.getControlDecision() == null) {
            throw new IllegalStateException("Invalid SABR control policy result");
        }
        final List<SabrSessionPolicy.Action> actions = result.getActions();
        final Set<SabrSessionPolicy.ActionType> seen = EnumSet.noneOf(
                SabrSessionPolicy.ActionType.class);
        for (final SabrSessionPolicy.Action action : actions) {
            if (action == null || !seen.add(action.getType())) {
                throw new IllegalStateException("Duplicate SABR control action");
            }
        }
        int terminalCount = 0;
        for (final SabrSessionPolicy.Action action : actions) {
            if (TERMINAL.contains(action.getType())) {
                terminalCount++;
            }
        }
        if (terminalCount != 1 || !TERMINAL.contains(actions.get(actions.size() - 1).getType())) {
            throw new IllegalStateException("SABR control policy has no terminal action");
        }
        if (seen.contains(SabrSessionPolicy.ActionType.APPLY_RESPONSE_STATE)
                != (result.getStatePatch() != null)) {
            throw new IllegalStateException("SABR response state action/patch mismatch");
        }
        if (seen.contains(SabrSessionPolicy.ActionType.APPLY_RESPONSE_STATE)
                && seen.contains(SabrSessionPolicy.ActionType.APPLY_BUILTIN_RESPONSE_STATE)) {
            throw new IllegalStateException("SABR response state actions are mutually exclusive");
        }
        return seen;
    }

    private static void validateControlTransition(
            @Nonnull final SabrSessionPolicy.State state,
            @Nonnull final SabrSessionPolicy.ControlResponseEvent control,
            @Nonnull final SabrSessionPolicy.Result result,
            @Nonnull final Set<SabrSessionPolicy.ActionType> seen) {
        final SabrSessionPolicy.ControlDecision decision = result.getControlDecision();
        if (seen.contains(SabrSessionPolicy.ActionType.APPLY_REDIRECT)
                != (decision.getRedirectUrl() != null && !decision.getRedirectUrl().isEmpty())) {
            throw new IllegalStateException("SABR redirect action/value mismatch");
        }
        final boolean reset = seen.contains(SabrSessionPolicy.ActionType.RESET_RECOVERY_BUDGETS);
        final boolean redirect = seen.contains(SabrSessionPolicy.ActionType.APPLY_REDIRECT);
        int expectedRedirects = state.getRedirectCount();
        if (reset) {
            expectedRedirects = 0;
        } else if (redirect) {
            expectedRedirects++;
        }
        final SabrSessionPolicy.State next = result.getNextState();
        if (next.getRequestNumber() != state.getRequestNumber()
                || next.getReloads() != state.getReloads()
                || next.getRedirectCount() != expectedRedirects
                || reset && (control.getMode() != SabrSessionPolicy.ControlMode.PUMP
                || control.getSegmentCount() <= 0)) {
            throw new IllegalStateException("Invalid SABR recovery state transition");
        }
        if (seen.contains(SabrSessionPolicy.ActionType.SLEEP_BACKOFF)
                != (decision.getBackoffTimeMs() > 0 && control.shouldHonorBackoff())
                || seen.contains(SabrSessionPolicy.ActionType.DEFER_BACKOFF)
                != (decision.getBackoffTimeMs() > 0 && !control.shouldHonorBackoff())
                || seen.contains(SabrSessionPolicy.ActionType.CLEAR_DEMAND_BACKOFF)
                && (decision.getBackoffTimeMs() > 0 || control.shouldHonorBackoff())) {
            throw new IllegalStateException("SABR Host action/event mismatch");
        }
    }'''
          replace_method(host, "private static void validateResult(", validate_result_replacement)

          policy_test = "third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/sabr/BuiltinSabrSessionPolicyTest.java"
          replace_all(
              policy_test,
              "protectionResponse(2,",
              "protectionResponse(SabrStreamProtectionStatus.ATTESTATION_PENDING,",
              minimum=1
          )
          replace_all(
              policy_test,
