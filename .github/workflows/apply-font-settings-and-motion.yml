name: Apply font settings and motion

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/selectable-fonts-settings-motion' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply font settings and motion patch
        run: python3 .github/scripts/apply_font_settings_and_motion.py

      - name: Run focused font tests
        run: ./gradlew :app:testDebugUnitTest --tests com.luc4n3x.levyra.domain.LevyraFontPresetTest --no-daemon

      - name: Compile Android app
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit changes and remove temporary files
        run: |
          rm .github/scripts/apply_font_settings_and_motion.py
          rm .github/workflows/apply-font-settings-and-motion.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/luc4n3x/levyra/domain/LevyraExperienceSettings.kt \
                  app/src/main/java/com/luc4n3x/levyra/data/LevyraPreferences.kt \
                  app/src/main/java/com/luc4n3x/levyra/data/LevyraBackupManager.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/theme/LevyraTheme.kt \
                  app/src/main/java/com/luc4n3x/levyra/MainActivity.kt \
                  app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/i18n/LevyraStrings.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
                  .github/scripts/apply_font_settings_and_motion.py \
                  .github/workflows/apply-font-settings-and-motion.yml
          git commit -m "feat(ui): add selectable fonts and subtle settings motion"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
