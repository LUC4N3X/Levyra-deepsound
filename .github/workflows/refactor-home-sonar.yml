name: Refactor Home Sonar findings

on:
  push:
    branches:
      - agent/home-levyra-aura

permissions:
  contents: write

concurrency:
  group: refactor-home-sonar
  cancel-in-progress: false

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-levyra-aura
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refactor_home_sonar.py
      - name: Commit source refactor and remove patch tooling
        shell: bash
        run: |
          rm -f scripts/refactor_home_sonar.py .github/workflows/refactor-home-sonar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(home): resolve Sonar maintainability findings"
          git push origin HEAD:agent/home-levyra-aura
