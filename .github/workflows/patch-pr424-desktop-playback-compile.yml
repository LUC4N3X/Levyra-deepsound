name: PR424 Desktop Playback Compile Fix

on:
  push:
    branches:
      - feature/desktop-audio-and-local-library
    paths:
      - .github/workflows/patch-pr424-desktop-playback-compile.yml
      - .github/scripts/patch_pr424_desktop_playback_compile.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/desktop-audio-and-local-library
          fetch-depth: 0
      - run: python3 .github/scripts/patch_pr424_desktop_playback_compile.py
      - run: git diff --check && git diff -- desktop/player/src/main/kotlin/com/luc4n3x/levyra/desktop/player/VlcAudioPlayer.kt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- desktop/player/src/main/kotlin/com/luc4n3x/levyra/desktop/player/VlcAudioPlayer.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix(desktop): preserve YouTube identity on output restart"
          git push origin HEAD:feature/desktop-audio-and-local-library
