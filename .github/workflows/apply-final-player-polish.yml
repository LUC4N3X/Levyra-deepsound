name: Apply Final Player Polish

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_final_player_polish.py
      - .github/workflows/apply-final-player-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/scalable-canvas-index
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate helper
        run: python3 -m py_compile scripts/apply_final_player_polish.py

      - name: Apply final player polish
        run: python3 scripts/apply_final_player_polish.py

      - name: Validate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt app/src/main/java/com/luc4n3x/levyra/ui/MotionArtworkLayer.kt | wc -l)" -gt 0

      - name: Prepare ephemeral CI signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Run focused tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.feature.motion.*' \
            --tests 'com.luc4n3x.levyra.data.EditorialArtworkContinuityTest'

      - name: Compile release Kotlin
        run: ./gradlew --no-daemon :app:compileReleaseKotlin

      - name: Remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_final_player_polish.py
          rm .github/workflows/apply-final-player-polish.yml
          rm -f "${LEVYRA_KEYSTORE_FILE}"

      - name: Commit verified final polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(player): finalize controls and artwork motion"
          git push origin HEAD:agent/scalable-canvas-index
