name: Levyra review fix applicator

on:
  push:
    branches:
      - agent/levyra-resonance-engine
    paths:
      - .github/workflows/levyra-apply-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/levyra-review-fixes.patch
          git apply --check /tmp/levyra-review-fixes.patch
          git apply /tmp/levyra-review-fixes.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/luc4n3x/levyra/data/LevyraResonanceEngine.kt
          git add app/src/main/java/com/luc4n3x/levyra/data/LevyraSmartMusicProfileStore.kt
          git add app/src/main/java/com/luc4n3x/levyra/player/queue/PersistentQueueEngine.kt
          git add app/src/test/java/com/luc4n3x/levyra/data/LevyraResonancePersistenceTest.kt
          git commit -m 'fix: address resonance review feedback'
          git push origin HEAD:agent/levyra-resonance-engine
