name: PR Check

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  apply-auto-advance-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/levyra-resonance-engine
          fetch-depth: 0
      - name: Preserve completion position
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/player/PlaybackService.kt')
          text = path.read_text()
          old = '''            val player = activePlayer ?: return@launch
            if (rewindInsteadOfSkip(player, forward)) return@launch
            val target = withContext(Dispatchers.IO) {
'''
          new = '''            val player = activePlayer ?: return@launch
            if (rewindInsteadOfSkip(player, forward)) return@launch
            if (forward && autoAdvance) {
                val durationMs = player.duration.takeIf { it > 0L && it != C.TIME_UNSET }
                val completionPositionMs = maxOf(player.currentPosition.coerceAtLeast(0L), durationMs ?: 0L)
                queueEngine.updatePosition(completionPositionMs)
            }
            val target = withContext(Dispatchers.IO) {
'''
          if text.count(old) != 1:
              raise SystemExit('Expected skipQueue insertion point exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/luc4n3x/levyra/player/PlaybackService.kt
          git commit -m 'fix: preserve auto-advance completion position'
          git push origin HEAD:agent/levyra-resonance-engine
