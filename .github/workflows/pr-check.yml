name: PR Check

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/levyra-resonance-engine
          fetch-depth: 0
      - name: Apply reviewed files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/levyra-fixes/part* | base64 --decode > /tmp/levyra-fixes.tar.gz
          echo "98902295351c112f7ce9e638e8fc2251040d435efd5d6dfd9840d913296d1894  /tmp/levyra-fixes.tar.gz" | sha256sum --check
          tar -xzf /tmp/levyra-fixes.tar.gz -C .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/luc4n3x/levyra/data/LevyraResonanceEngine.kt
          git add app/src/main/java/com/luc4n3x/levyra/data/LevyraSmartMusicProfileStore.kt
          git add app/src/main/java/com/luc4n3x/levyra/player/queue/PersistentQueueEngine.kt
          git add app/src/test/java/com/luc4n3x/levyra/data/LevyraResonancePersistenceTest.kt
          git commit -m 'fix: address resonance review feedback'
          git push origin HEAD:agent/levyra-resonance-engine
