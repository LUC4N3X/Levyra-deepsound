name: PR Check

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  fix-accessibility-format:
    if: github.head_ref == 'feature/refactor-home-screen-yt-music-style' && github.actor != 'github-actions[bot]'
    name: Fix accessibility formatting
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/refactor-home-screen-yt-music-style

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Apply exact formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')
          function_start = text.index('private fun HomeQuickSelectionCard(')
          block_start = text.index('    val strings = LocalLevyraStrings.current\n', function_start)
          block_end = text.index('    val shape = RoundedCornerShape(14.dp)', block_start)
          lines = [
              '    val strings = LocalLevyraStrings.current',
              '    val accessibilityDescription = if (isCurrent) {',
              '        val playbackState = when {',
              '            isResolving -> strings.searchingYouTubeMusic',
              '            isPlaying -> strings.currentlyPlaying',
              '            else -> strings.play',
              '        }',
              '        "${track.title}. $playbackState"',
              '    } else {',
              '        track.title',
              '    }',
              ''
          ]
          text = text[:block_start] + '\n'.join(lines) + text[block_end:]
          text = '\n'.join(line.rstrip() for line in text.split('\n')).rstrip() + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          ./gradlew --no-daemon :app:compileDebugKotlin
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.ui.HomeQuickSelectionTest'

      - name: Restore workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/pr-check.yml > .github/workflows/pr-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr-check.yml
          git diff --cached --check
          git commit -m "style(ui): align accessibility state block"
          git push origin HEAD:feature/refactor-home-screen-yt-music-style
