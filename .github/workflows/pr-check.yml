name: PR Check

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  repair-pr-428:
    if: ${{ github.event.pull_request.number == 428 && github.head_ref == 'feat/youtube-resilience-upstream-2026-08' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/youtube-resilience-upstream-2026-08
          fetch-depth: 0
          persist-credentials: true

      - name: Repair extractor regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/YoutubeParsingHelper.java')
          text = helper.read_text(encoding='utf-8')
          start_marker = '    @Nullable\n    public static SongMetadata getSongMetadata(@Nonnull final Description description) {'
          end_marker = '\n\n    @Nullable\n    static SongMetadata parseSongMetadataText'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '\n'.join([
              '    @Nullable',
              '    public static SongMetadata getSongMetadata(@Nonnull final Description description) {',
              '        if (description.getType() == Description.PLAIN_TEXT) {',
              '            return parseSongMetadataText(description.getContent());',
              '        }',
              '        final String htmlWithParagraphBoundaries = description.getContent()',
              '                .replaceAll("(?i)<br\\\\s*/?>", "$0\\n")',
              '                .replaceAll("(?i)</(?:p|div|li|h[1-6])>", "$0\\n");',
              '        return parseSongMetadataText(Jsoup.parse(htmlWithParagraphBoundaries).wholeText());',
              '    }',
          ])
          helper.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          music_test = Path('third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/extractors/YoutubeMusicUrlFallbackTest.java')
          text = music_test.read_text(encoding='utf-8')
          old = r'\"overlay1234\"}}}}}}}}"'
          new = r'\"overlay1234\"}}}}}}"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one malformed overlay fixture, found {text.count(old)}')
          music_test.write_text(text.replace(old, new), encoding='utf-8')

          single = Path('third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrClientVersionSingleFlightTest.java')
          text = single.read_text(encoding='utf-8')
          class_marker = '    private static final class BlockingDownloader extends Downloader {'
          class_start = text.index(class_marker)
          start_marker = '            return new Response(200, "OK", Collections.emptyMap(),'
          end_marker = '\n        }\n\n        @Override'
          start = text.index(start_marker, class_start)
          end = text.index(end_marker, start)
          replacement = '''            final String responseBody = ")]}'\\n[[null,null,[[["
                      + String.join(",", Collections.nCopies(16, "null"))
                      + ",\\\"" + CLIENT_VERSION + "\\\"]]]]]";
              return new Response(200, "OK", Collections.emptyMap(), responseBody,
                      null, "https://www.youtube.com/sw.js_data");'''
          single.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate SongMetadata regression
        run: ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test --tests 'org.schabi.newpipe.extractor.services.youtube.YoutubeSongMetadataTest'

      - name: Validate full extractor suite
        run: ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test

      - name: Restore CI and publish validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/pr-check.yml
          git rm -f .github/workflows/pr428-repair.yml
          git add \
            .github/workflows/pr-check.yml \
            third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/YoutubeParsingHelper.java \
            third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/extractors/YoutubeMusicUrlFallbackTest.java \
            third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrClientVersionSingleFlightTest.java
          git diff --cached --check
          git commit -m "fix(extractor): align metadata regression paths"
          git push origin HEAD:feat/youtube-resilience-upstream-2026-08
