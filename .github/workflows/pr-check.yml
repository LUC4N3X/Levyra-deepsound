name: PR Check

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Lint and Release Compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-disabled: true

      - name: Validate Build Inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Validate Agent Configuration
        run: python3 scripts/validate_agent_config.py

      - name: Validate AI Efficiency Layer
        run: python3 scripts/validate_ai_efficiency.py

      - name: F-Droid Metadata Generator Tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_fdroid_metadata.py'

      - name: F-Droid Review Contract Tests
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_fdroid_review_contract.py'
          python3 scripts/validate_fdroid_review_contract.py

      - name: Prepare CI Release Signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null

      - name: Gradle Version
        run: ./gradlew --no-daemon --version

      - name: Android Runtime Compatibility Scan
        run: python3 scripts/check_android_regex_compatibility.py

      - name: Extractor Unit Tests
        run: ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test

      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Android and F-Droid Regression Unit Tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.LevyraPreferencesDefaultsTest' \
            --tests 'com.luc4n3x.levyra.data.PlaybackResolverOfflineExportTest' \
            --tests 'com.luc4n3x.levyra.player.offline.OfflineAudioExporterTest' \
            --tests 'com.luc4n3x.levyra.player.offline.tagging.LevyraM4aTagWriterTest' \
            --tests 'com.luc4n3x.levyra.ui.support.RemoteAnnouncementRepositoryTest' \
            --tests 'com.luc4n3x.levyra.data.HomeAlbumDeduplicationTest' \
            --tests 'com.luc4n3x.levyra.data.HomeRefreshStabilityTest' \
            --tests 'com.luc4n3x.levyra.data.UniversalPlaylistImporterTest' \
            --tests 'com.luc4n3x.levyra.data.SponsorBlockRepositoryTest' \
            --tests 'com.luc4n3x.levyra.domain.LevyraAudioPresetsTest' \
            --tests 'com.luc4n3x.levyra.feature.motion.*' \
            --tests 'com.luc4n3x.levyra.data.EditorialArtworkContinuityTest' \
            --tests 'com.luc4n3x.levyra.data.LyricsParsingTest' \
            --tests 'com.luc4n3x.levyra.ui.i18n.LevyraStringsTest' \
            --tests 'com.luc4n3x.levyra.viewmodel.AudioSettingsPersistenceCoordinatorTest' \
            --tests 'com.luc4n3x.levyra.player.LevyraDspAudioProcessorTest'

      - name: Release Compile
        run: ./gradlew --no-daemon --no-configuration-cache assembleRelease

      - name: Setup Java 21 for F-Droid
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: F-Droid Release Compile
        shell: bash
        env:
          YOUTUBE_INNERTUBE_API_KEY: ""
          LEVYRA_KEYSTORE_FILE: ""
          LEVYRA_KEYSTORE_PASSWORD: ""
          LEVYRA_KEY_ALIAS: ""
          LEVYRA_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease \
            -PlevyraFdroidBuild=true
          FDROID_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "${FDROID_APK}"
          if "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "${FDROID_APK}" >/dev/null 2>&1; then
            echo "F-Droid source build must remain unsigned."
            exit 1
          fi

      - name: Collect Reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/reports
          find app/build/reports -maxdepth 6 -type f 2>/dev/null | sort > artifacts/reports-index.txt || true
          if [ -d app/build/reports ]; then
            cp -R app/build/reports artifacts/reports/app-build-reports
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-reports-${{ github.run_number }}
          path: artifacts
          if-no-files-found: ignore

  coderabbit-panel-fix:
    name: Apply final CodeRabbit panel fix
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/smart-library-backup-auto-crossfade'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TARGET_BRANCH: codex/smart-library-backup-auto-crossfade
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: codex/smart-library-backup-auto-crossfade
          fetch-depth: 2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-disabled: true

      - name: Patch, compile, and restore CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Levyra Worker"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"

          git fetch origin main "${TARGET_BRANCH}"
          REMOTE_HEAD="$(git rev-parse "origin/${TARGET_BRANCH}")"
          if [ "${REMOTE_HEAD}" != "${GITHUB_SHA}" ]; then
            echo "Target branch moved: ${REMOTE_HEAD}"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")
          old = '''                .navigationBarsPadding()
                .clickable(interactionSource = blocker, indication = null) {}
        ) {'''
          new = '''                .navigationBarsPadding()
                .pointerInput(Unit) {
                    awaitPointerEventScope {
                        while (true) {
                            val event = awaitPointerEvent(PointerEventPass.Main)
                            event.changes.forEach { change ->
                                if (change.previousPressed && !change.pressed && !change.isConsumed) {
                                    change.consume()
                                }
                            }
                        }
                    }
                }
        ) {'''
          if text.count(old) != 1:
              raise SystemExit(f"Audio panel target mismatch: {text.count(old)} matches")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check
          ./gradlew --no-daemon :app:compileDebugKotlin

          git show origin/main:.github/workflows/pr-check.yml > .github/workflows/pr-check.yml
          rm -f .github/workflows/tmp-fix-audio-panel-322.yml
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr-check.yml
          git add -u .github/workflows
          git commit -m "fix(android): make audio panel touch shield semantic-free"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
