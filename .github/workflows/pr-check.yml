name: PR Check

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: pr-263-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-accessibility:
    if: github.head_ref == 'feature/refactor-home-screen-yt-music-style' && github.actor != 'github-actions[bot]'
    name: Fix quick-selection accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/refactor-home-screen-yt-music-style

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Apply accessibility fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')

          anchor = '''    val shape = RoundedCornerShape(14.dp)
          '''
          replacement = '''    val strings = LocalLevyraStrings.current
          val accessibilityDescription = if (isCurrent) {
              val playbackState = when {
                  isResolving -> strings.searchingYouTubeMusic
                  isPlaying -> strings.currentlyPlaying
                  else -> strings.play
              }
              "${track.title}. $playbackState"
          } else {
              track.title
          }
              val shape = RoundedCornerShape(14.dp)
          '''
          if text.count(anchor) != 1:
              raise RuntimeError(f'card anchor count: {text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          old = '                contentDescription = track.title\n'
          new = '                contentDescription = accessibilityDescription\n'
          if text.count(old) != 1:
              raise RuntimeError(f'content description count: {text.count(old)}')
          text = text.replace(old, new, 1)

          text = '\n'.join(line.rstrip() for line in text.split('\n')).rstrip() + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate fix
        run: |
          ./gradlew --no-daemon :app:compileDebugKotlin
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.ui.HomeQuickSelectionTest'

      - name: Restore workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/pr-check.yml > .github/workflows/pr-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr-check.yml
          git diff --cached --check
          git commit -m "fix(ui): announce quick-selection playback state"
          git push origin HEAD:feature/refactor-home-screen-yt-music-style
