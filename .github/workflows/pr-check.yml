name: PR Check

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-active-video-toggle:
    name: Apply active video toggle
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'refactor/home-experience'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0

      - name: Patch active video behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')

          call_old = "                        onPlay = { track -> viewModel.playFrom(homeVideoTracks, track) }\n"
          call_new = "                        onPlay = { track -> viewModel.playFrom(homeVideoTracks, track) },\n                        onToggleCurrent = viewModel::togglePlay\n"
          if text.count(call_old) != 1:
              raise SystemExit(f'Expected one video shelf callback, found {text.count(call_old)}')
          text = text.replace(call_old, call_new, 1)

          block_start = text.index('private fun HomeMusicVideoShelf(')
          block_end = text.index('private val HomeVideoIdPattern', block_start)
          block = text[block_start:block_end]

          signature_old = "    onPlay: (Track) -> Unit\n) {"
          signature_new = "    onPlay: (Track) -> Unit,\n    onToggleCurrent: () -> Unit\n) {"
          if block.count(signature_old) != 1:
              raise SystemExit(f'Expected one video shelf signature, found {block.count(signature_old)}')
          block = block.replace(signature_old, signature_new, 1)

          click_old = "modifier = Modifier.width(236.dp).pressable(onClick = { onPlay(track) }),"
          click_new = "modifier = Modifier.width(236.dp).pressable(onClick = { if (active) onToggleCurrent() else onPlay(track) }),"
          if block.count(click_old) != 1:
              raise SystemExit(f'Expected one video card click, found {block.count(click_old)}')
          block = block.replace(click_old, click_new, 1)

          text = text[:block_start] + block + text[block_end:]
          path.write_text(text, encoding='utf-8')
          PY

          git fetch origin main
          git checkout origin/main -- \
            .github/workflows/pr-check.yml \
            .github/workflows/workflow-duplicates-guard.yml
          rm -f .github/workflows/fix-active-home-video-toggle.yml
          git diff --check

      - name: Commit clean fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): toggle active video playback"
          git push origin HEAD:refactor/home-experience

  android:
    name: Lint and Release Compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Validate Build Inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Prepare CI Release Signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null

      - name: Gradle Version
        run: ./gradlew --no-daemon --version

      - name: Android Runtime Compatibility Scan
        run: python3 scripts/check_android_regex_compatibility.py

      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Motion, Canvas, and Artwork Continuity Unit Tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.feature.motion.*' \
            --tests 'com.luc4n3x.levyra.data.EditorialArtworkContinuityTest'

      - name: Release Compile
        run: ./gradlew --no-daemon --no-configuration-cache assembleRelease

      - name: Setup Java 21 for F-Droid
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: F-Droid Release Compile
        shell: bash
        env:
          YOUTUBE_INNERTUBE_API_KEY: ""
          LEVYRA_KEYSTORE_FILE: ""
          LEVYRA_KEYSTORE_PASSWORD: ""
          LEVYRA_KEY_ALIAS: ""
          LEVYRA_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease \
            -PlevyraFdroidBuild=true
          FDROID_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "${FDROID_APK}"
          if "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "${FDROID_APK}" >/dev/null 2>&1; then
            echo "F-Droid source build must remain unsigned."
            exit 1
          fi

      - name: Collect Reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/reports
          find app/build/reports -maxdepth 6 -type f 2>/dev/null | sort > artifacts/reports-index.txt || true
          if [ -d app/build/reports ]; then
            cp -R app/build/reports artifacts/reports/app-build-reports
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-reports-${{ github.run_number }}
          path: artifacts
          if-no-files-found: ignore
