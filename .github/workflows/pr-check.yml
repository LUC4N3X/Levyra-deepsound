name: PR Check

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: remove-duplicate-home-quick-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Remove duplicate Home quick access
    if: github.head_ref == 'feature/refactor-home-screen-yt-music-style'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/refactor-home-screen-yt-music-style
          fetch-depth: 0

      - name: Remove top quick-access code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text()

          data_pattern = re.compile(
              r'\n    val homeMixTracks = remember\(quickPicks, visiblePersonalTracks, resonanceTracks\) \{\n'
              r'.*?'
              r'\n    \}\n'
              r'    val homeReleaseTracks = remember\(newReleases\) \{ newReleases\?\.tracks\.orEmpty\(\) \}\n',
              re.DOTALL,
          )
          text, data_count = data_pattern.subn('\n', text, count=1)
          if data_count != 1:
              raise SystemExit(f'Expected one quick-access data block, found {data_count}')

          item_pattern = re.compile(
              r'\n        item\(key = "home-quick-access", contentType = "home-quick-access"\) \{'
              r'.*?'
              r'\n        \}\n(?=        spotlightCandidate\?\.let)',
              re.DOTALL,
          )
          text, item_count = item_pattern.subn('\n', text, count=1)
          if item_count != 1:
              raise SystemExit(f'Expected one top quick-access item, found {item_count}')

          forbidden = (
              'home-quick-access',
              'LevyraHomeQuickAccessGrid(',
              'homeMixTracks',
              'homeReleaseTracks',
          )
          remaining = [token for token in forbidden if token in text]
          if remaining:
              raise SystemExit(f'Obsolete quick-access references remain: {remaining}')

          if 'HomeQuickPicksShelf(' not in text:
              raise SystemExit('The lower Quick Picks shelf must remain')

          path.write_text(text)
          PY

      - name: Restore repository PR workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git show origin/main:.github/workflows/pr-check.yml > .github/workflows/pr-check.yml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Compile Android app
        env:
          YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Commit source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr-check.yml
          git diff --cached --check
          git commit -m "fix(home): remove duplicate top quick access"
          git push origin HEAD:feature/refactor-home-screen-yt-music-style
