name: PR Check

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Lint and Release Compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-disabled: true

      - name: Validate Build Inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Validate Agent Configuration
        run: python3 scripts/validate_agent_config.py

      - name: Prepare CI Release Signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null

      - name: Gradle Version
        run: ./gradlew --no-daemon --version

      - name: Android Runtime Compatibility Scan
        run: python3 scripts/check_android_regex_compatibility.py

      - name: Extractor Unit Tests
        run: ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test

      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Home, Motion, Canvas, Artwork, Lyrics, and DSP Unit Tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.HomeAlbumDeduplicationTest' \
            --tests 'com.luc4n3x.levyra.data.HomeRefreshStabilityTest' \
            --tests 'com.luc4n3x.levyra.feature.motion.*' \
            --tests 'com.luc4n3x.levyra.data.EditorialArtworkContinuityTest' \
            --tests 'com.luc4n3x.levyra.data.LyricsParsingTest' \
            --tests 'com.luc4n3x.levyra.ui.i18n.LevyraStringsTest' \
            --tests 'com.luc4n3x.levyra.viewmodel.AudioSettingsPersistenceCoordinatorTest' \
            --tests 'com.luc4n3x.levyra.player.LevyraDspAudioProcessorTest'

      - name: Release Compile
        run: ./gradlew --no-daemon --no-configuration-cache assembleRelease

      - name: Setup Java 21 for F-Droid
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: F-Droid Release Compile
        shell: bash
        env:
          YOUTUBE_INNERTUBE_API_KEY: ""
          LEVYRA_KEYSTORE_FILE: ""
          LEVYRA_KEYSTORE_PASSWORD: ""
          LEVYRA_KEY_ALIAS: ""
          LEVYRA_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease \
            -PlevyraFdroidBuild=true
          FDROID_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "${FDROID_APK}"
          if "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "${FDROID_APK}" >/dev/null 2>&1; then
            echo "F-Droid source build must remain unsigned."
            exit 1
          fi

      - name: Collect Reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/reports
          find app/build/reports -maxdepth 6 -type f 2>/dev/null | sort > artifacts/reports-index.txt || true
          if [ -d app/build/reports ]; then
            cp -R app/build/reports artifacts/reports/app-build-reports
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-reports-${{ github.run_number }}
          path: artifacts
          if-no-files-found: ignore

  agent_patch:
    name: Apply PR 309 startup serialization
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/cold-start-thermal-smoothness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: perf/cold-start-thermal-smoothness
          fetch-depth: 0

      - name: Apply startup scheduling refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    private val homeInteractionGate = HomeInteractionGate()
    private val homeFeedRequestGeneration = AtomicLong(0L)
''',
              '''    private val homeInteractionGate = HomeInteractionGate()
    private val startupWorkGate = Semaphore(1)
    private val startupStartedAtMs = System.nanoTime() / 1_000_000L
    private val homeFeedRequestGeneration = AtomicLong(0L)
''',
              'startup gate fields'
          )

          replace_once(
              '''    private suspend fun awaitHomeUiIdle(plan: HomeStartupWorkPlan = homeStartupWorkPlan()) {
        homeInteractionGate.awaitIdle(plan.idleWindowMs)
    }

    val state: StateFlow<LevyraUiState> = _state.asStateFlow()
''',
              '''    private suspend fun awaitHomeUiIdle(plan: HomeStartupWorkPlan = homeStartupWorkPlan()) {
        homeInteractionGate.awaitIdle(plan.idleWindowMs)
    }

    private suspend fun awaitColdStartWindow(
        plan: HomeStartupWorkPlan,
        requestedDelayMs: Long
    ) {
        while (currentCoroutineContext().isActive) {
            val elapsedMs = (System.nanoTime() / 1_000_000L - startupStartedAtMs).coerceAtLeast(0L)
            val targetDelayMs = if (player.isPlaying) {
                maxOf(requestedDelayMs, plan.activePlaybackProtectionMs)
            } else {
                requestedDelayMs
            }
            val remainingMs = targetDelayMs - elapsedMs
            if (remainingMs <= 0L) break
            delay(remainingMs.coerceIn(80L, 400L))
        }
        awaitHomeUiIdle(plan)
    }

    private suspend fun runColdStartWork(
        plan: HomeStartupWorkPlan,
        requestedDelayMs: Long,
        block: suspend () -> Unit
    ) {
        awaitColdStartWindow(plan, requestedDelayMs)
        startupWorkGate.withPermit { block() }
    }

    val state: StateFlow<LevyraUiState> = _state.asStateFlow()
''',
              'cold-start helpers'
          )

          replace_once(
              '''        applyFollowedArtists(followedArtistsStore.load())
        startTicker()
''',
              '''        viewModelScope.launch(Dispatchers.IO) {
            applyFollowedArtists(followedArtistsStore.load())
        }
        startTicker()
''',
              'followed artist load'
          )

          replace_once(
              '''        refreshListeningPulse(force = true)
        scheduleColdStartRefresh(initialTracks)
''',
              '''        viewModelScope.launch {
            delay(2_500L)
            refreshListeningPulse(force = true)
        }
        scheduleColdStartRefresh(initialTracks)
''',
              'listening pulse delay'
          )

          schedule_pattern = re.compile(
              r'''    private fun scheduleColdStartRefresh\(initialTracks: List<Track>\) \{.*?\n    \}\n\n    private fun warmPersistentOrbit''',
              re.S
          )
          schedule_replacement = '''    private fun scheduleColdStartRefresh(initialTracks: List<Track>) {
        val appContext = getApplication<Application>().applicationContext
        val orbitSeed = _state.value.personalOrbitTracks.take(LevyraPersonalOrbit.DISPLAY_LIMIT)
        val playbackPlan = adaptivePlaybackPolicy.current(videoMode = false)
        val playbackWarmPlan = StartupPlaybackWarmPolicy.create(
            lowRam = playbackPlan.lowRam,
            powerConstrained = playbackPlan.powerConstrained,
            preferredConcurrency = playbackPlan.concurrency
        )
        val startupPlan = homeStartupWorkPlan()

        viewModelScope.launch(Dispatchers.IO) {
            runColdStartWork(startupPlan, playbackWarmPlan.delayMs) {
                resolver.warmNetwork()
                if (!player.isPlaying && !playbackPlan.lowRam && !playbackPlan.powerConstrained) {
                    resolver.warmPlaybackSecurity()
                }
                val hot = (orbitSeed.take(1) + initialTracks.take(playbackWarmPlan.trackCount))
                    .filter { it.id.isNotBlank() || it.videoUrl.isNotBlank() || it.title.isNotBlank() }
                    .distinctBy { playbackIdentity(it) }
                    .take(playbackWarmPlan.trackCount)
                warmTracks(
                    tracks = hot,
                    concurrency = playbackWarmPlan.concurrency,
                    delayStepMs = playbackPlan.staggerMs,
                    prime = true,
                    respectHomeScroll = true
                )
            }
        }

        if (orbitSeed.isNotEmpty()) {
            viewModelScope.launch(Dispatchers.IO) {
                runColdStartWork(startupPlan, startupPlan.secondaryStartDelayMs) {
                    LevyraArtworkCache.preloadPriority(
                        appContext,
                        orbitSeed,
                        startupPlan.priorityArtworkCount
                    )
                    refreshMissingOfficialOrbitArtwork(orbitSeed, deferUntilHomeIdle = false)
                    orbitArtworkJob?.join()
                }
            }
        }

        viewModelScope.launch {
            runColdStartWork(startupPlan, startupPlan.homeFeedStartDelayMs) {
                loadHomeFeed(deferUntilHomeIdle = true)
                homeFeedJob?.join()
                refreshHomeResonanceIfStale()
                homeResonanceJob?.join()
            }
        }

        viewModelScope.launch {
            runColdStartWork(startupPlan, startupPlan.chartRefreshStartDelayMs) {
                loadCharts(deferUntilHomeIdle = false)
                chartsJob?.join()
            }
        }

        viewModelScope.launch {
            runColdStartWork(startupPlan, startupPlan.chartPrefetchStartDelayMs) {
                prefetchChartRegions(_state.value.selectedChartId)
                chartPrefetchJob?.join()
            }
        }

        viewModelScope.launch {
            runColdStartWork(startupPlan, startupPlan.chartMemoryWarmStartDelayMs) {
                warmChartRegionMemoryCache()
                chartMemoryWarmJob?.join()
            }
        }

        viewModelScope.launch {
            runColdStartWork(startupPlan, startupPlan.maintenanceStartDelayMs) {
                checkForUpdates(silent = true)
                updateJob?.join()
                loadReleaseRadar(deferUntilHomeIdle = false)
                radarJob?.join()
            }
        }
    }

    private fun warmPersistentOrbit'''
          text, count = schedule_pattern.subn(schedule_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'scheduleColdStartRefresh: expected 1 match, found {count}')

          replace_once(
              '''    private fun startTicker() {
        viewModelScope.launch {
            var lastBackgroundUiUpdateMs = 0L
''',
              '''    private fun startTicker() {
        viewModelScope.launch {
            delay(600L)
            var lastBackgroundUiUpdateMs = 0L
''',
              'ticker initial delay'
          )

          replace_once(
              '''                    nowElapsed - lastBackgroundUiUpdateMs >= 1_000L ||
''',
              '''                    nowElapsed - lastBackgroundUiUpdateMs >= 2_000L ||
''',
              'background publish interval'
          )

          replace_once(
              '''                delay(if (snapshot.showLyrics) 50L else 500L)
''',
              '''                delay(
                    when {
                        snapshot.showLyrics -> 50L
                        snapshot.selectedTab == LevyraTab.Player -> 250L
                        else -> 1_000L
                    }
                )
''',
              'ticker cadence'
          )

          replace_once(
              '''    private fun loadPlaylists() {
        viewModelScope.launch {
            val lists = playlistStore.loadAll()
''',
              '''    private fun loadPlaylists() {
        viewModelScope.launch(Dispatchers.IO) {
            val lists = playlistStore.loadAll()
''',
              'playlist loading dispatcher'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate source patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'startupWorkGate = Semaphore(1)' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q 'activePlaybackProtectionMs' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q 'chartPrefetchStartDelayMs' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          grep -q 'snapshot.selectedTab == LevyraTab.Player -> 250L' app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt

      - name: Commit patch and restore workflows
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/pr-check.yml > .github/workflows/pr-check.yml
          rm -f .github/workflows/agent-perf-pr309.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt .github/workflows/pr-check.yml .github/workflows/agent-perf-pr309.yml
          git commit -m 'perf(startup): serialize cold-start work around active playback'
          git push origin HEAD:perf/cold-start-thermal-smoothness
