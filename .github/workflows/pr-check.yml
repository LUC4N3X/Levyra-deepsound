name: PR Check

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-playlist-import-placement:
    name: Apply playlist import placement
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/pro-audio-and-smart-importer' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/pro-audio-and-smart-importer
          fetch-depth: 0

      - name: Apply placement and dismissible-card wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt')
          source = path.read_text(encoding='utf-8')

          overview = '''            if (category == LibraryCategory.Overview) {
                item(key = "overview-import-playlist") {
                    LibraryImportPlaylistCard(
                        onClick = { showImportPlaylist = true },
                        isItalian = isItalian
                    )
                }
            }

'''
          if overview in source:
              source = source.replace(overview, '', 1)

          state_old = '''    var showCreatePlaylist by remember { mutableStateOf(false) }
    var showImportPlaylist by remember { mutableStateOf(false) }
'''
          state_new = '''    var showCreatePlaylist by remember { mutableStateOf(false) }
    var showImportPlaylist by remember { mutableStateOf(false) }
    var showImportPlaylistCard by rememberSaveable { mutableStateOf(true) }
'''
          if state_new not in source:
              count = source.count(state_old)
              if count != 1:
                  raise SystemExit(f'import card state: expected one match, found {count}')
              source = source.replace(state_old, state_new, 1)

          playlist_old = '''                    item(key = "playlist-import-action") {
                        LibraryImportPlaylistCard(
                            onClick = { showImportPlaylist = true },
                            isItalian = isItalian
                        )
                    }
'''
          playlist_new = '''                    item(key = "playlist-import-action") {
                        if (showImportPlaylistCard) {
                            LibraryImportPlaylistCard(
                                onClick = { showImportPlaylist = true },
                                onDismiss = { showImportPlaylistCard = false },
                                isItalian = isItalian
                            )
                        } else {
                            LibraryImportPlaylistCompactAction(
                                onClick = { showImportPlaylist = true }
                            )
                        }
                    }
'''
          if playlist_new not in source:
              count = source.count(playlist_old)
              if count != 1:
                  raise SystemExit(f'playlist import action: expected one match, found {count}')
              source = source.replace(playlist_old, playlist_new, 1)

          if 'overview-import-playlist' in source:
              raise SystemExit('Import card still appears in Library overview')
          if 'LibraryImportPlaylistCompactAction' not in source:
              raise SystemExit('Compact fallback import action is missing')
          path.write_text(source, encoding='utf-8')
          PY

          # Remove all one-shot CI scaffolding and restore the real workflows from main.
          git checkout origin/main -- .github/workflows/pr-check.yml
          git checkout origin/main -- .github/workflows/editorial-catalog.yml
          git rm -f .github/workflows/pr319-fix-library-placement.yml || true

          git add -A
          git diff --cached --check
          grep -q 'showImportPlaylistCard' app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt
          ! grep -q 'overview-import-playlist' app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt
          grep -q 'LibraryImportPlaylistCompactAction' app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt
          git status --short
          git commit -m 'fix(library): keep playlist import optional and accessible'
          git push origin HEAD:feature/pro-audio-and-smart-importer

  android:
    name: Lint and Release Compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-disabled: true

      - name: Validate Build Inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Validate Agent Configuration
        run: python3 scripts/validate_agent_config.py

      - name: Validate AI Efficiency Layer
        run: python3 scripts/validate_ai_efficiency.py

      - name: Prepare CI Release Signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null

      - name: Gradle Version
        run: ./gradlew --no-daemon --version

      - name: Android Runtime Compatibility Scan
        run: python3 scripts/check_android_regex_compatibility.py

      - name: Extractor Unit Tests
        run: ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test

      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Home, Motion, Canvas, Artwork, Lyrics, and DSP Unit Tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.HomeAlbumDeduplicationTest' \
            --tests 'com.luc4n3x.levyra.data.HomeRefreshStabilityTest' \
            --tests 'com.luc4n3x.levyra.feature.motion.*' \
            --tests 'com.luc4n3x.levyra.data.EditorialArtworkContinuityTest' \
            --tests 'com.luc4n3x.levyra.data.LyricsParsingTest' \
            --tests 'com.luc4n3x.levyra.ui.i18n.LevyraStringsTest' \
            --tests 'com.luc4n3x.levyra.viewmodel.AudioSettingsPersistenceCoordinatorTest' \
            --tests 'com.luc4n3x.levyra.player.LevyraDspAudioProcessorTest'

      - name: Release Compile
        run: ./gradlew --no-daemon --no-configuration-cache assembleRelease

      - name: Setup Java 21 for F-Droid
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: F-Droid Release Compile
        shell: bash
        env:
          YOUTUBE_INNERTUBE_API_KEY: ""
          LEVYRA_KEYSTORE_FILE: ""
          LEVYRA_KEYSTORE_PASSWORD: ""
          LEVYRA_KEY_ALIAS: ""
          LEVYRA_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease \
            -PlevyraFdroidBuild=true
          FDROID_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "${FDROID_APK}"
          if "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "${FDROID_APK}" >/dev/null 2>&1; then
            echo "F-Droid source build must remain unsigned."
            exit 1
          fi

      - name: Collect Reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/reports
          find app/build/reports -maxdepth 6 -type f 2>/dev/null | sort > artifacts/reports-index.txt || true
          if [ -d app/build/reports ]; then
            cp -R app/build/reports artifacts/reports/app-build-reports
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-reports-${{ github.run_number }}
          path: artifacts
          if-no-files-found: ignore
