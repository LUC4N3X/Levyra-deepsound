name: PR Check

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  format-accessibility:
    if: github.head_ref == 'feature/refactor-home-screen-yt-music-style' && github.actor != 'github-actions[bot]'
    name: Format accessibility fix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/refactor-home-screen-yt-music-style

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Normalize accessibility block
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')
          old = '''    val strings = LocalLevyraStrings.current
          val accessibilityDescription = if (isCurrent) {
              val playbackState = when {
                  isResolving -> strings.searchingYouTubeMusic
                  isPlaying -> strings.currentlyPlaying
                  else -> strings.play
              }
              "${track.title}. $playbackState"
          } else {
              track.title
          }
          '''
          new = '''    val strings = LocalLevyraStrings.current
          val accessibilityDescription = if (isCurrent) {
              val playbackState = when {
                  isResolving -> strings.searchingYouTubeMusic
                  isPlaying -> strings.currentlyPlaying
                  else -> strings.play
              }
              "${track.title}. $playbackState"
          } else {
              track.title
          }
          '''
          start = text.index('    val strings = LocalLevyraStrings.current\n', text.index('private fun HomeQuickSelectionCard('))
          end = text.index('    val shape = RoundedCornerShape(14.dp)', start)
          text = text[:start] + new + text[end:]
          text = '\n'.join(line.rstrip() for line in text.split('\n')).rstrip() + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          ./gradlew --no-daemon :app:compileDebugKotlin
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.ui.HomeQuickSelectionTest'

      - name: Restore workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/pr-check.yml > .github/workflows/pr-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr-check.yml
          git diff --cached --check
          git commit -m "style(ui): format quick-selection accessibility"
          git push origin HEAD:feature/refactor-home-screen-yt-music-style
