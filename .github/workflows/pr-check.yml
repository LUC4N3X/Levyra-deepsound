name: PR Check

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  review-fixes:
    if: ${{ github.event.pull_request.number == 428 && github.head_ref == 'feat/youtube-resilience-upstream-2026-08' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/youtube-resilience-upstream-2026-08
          fetch-depth: 0
          persist-credentials: true

      - name: Apply review fixes and restore repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/pr428_review_patch.py
          git checkout origin/main -- .github/workflows/pr-check.yml
          rm .github/pr428_review_patch.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Repository script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Extractor tests
        run: ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test

      - name: Focused Android tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.YoutubeExtractorFallbackContractTest' \
            --tests 'com.luc4n3x.levyra.data.PlaybackRecoveryBudgetContractTest'

      - name: Publish validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/pr428_review_patch.py \
            .github/workflows/pr-check.yml \
            app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt \
            app/src/test/java/com/luc4n3x/levyra/data/YoutubeExtractorFallbackContractTest.kt \
            scripts/youtube_canary.py \
            scripts/tests/test_youtube_canary.py \
            third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/YoutubeParsingHelper.java \
            third_party/LevyraExtractor/extractor/src/test/java/org/schabi/newpipe/extractor/services/youtube/YoutubeModernAudioMetadataTest.java \
            third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/extractor/services/youtube/sabr/YoutubeSabrFormat.java
          git diff --cached --check
          git commit -m "fix(youtube): address review correctness findings"
          git push origin HEAD:feat/youtube-resilience-upstream-2026-08
