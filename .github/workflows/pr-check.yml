name: PR Check

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  apply-auto-advance-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/levyra-resonance-engine
          fetch-depth: 0
      - name: Keep auto-advance out of skip learning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/player/queue/PersistentQueueEngine.kt')
          text = path.read_text()
          old = '''            if (target == null) return@mutate current
            transition = current
            result = current.tracks[target]
'''
          new = '''            if (target == null) return@mutate current
            if (!respectRepeatOne) transition = current
            result = current.tracks[target]
'''
          if text.count(old) != 1:
              raise SystemExit('Expected next transition block exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/luc4n3x/levyra/player/queue/PersistentQueueEngine.kt
          git commit -m 'fix: distinguish auto-advance from manual skips'
          git push origin HEAD:agent/levyra-resonance-engine
