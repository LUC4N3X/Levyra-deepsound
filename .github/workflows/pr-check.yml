name: PR Check

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix-pr299:
    name: Apply and Verify PR 299 Review Fixes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 299 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-disabled: true

      - name: Apply verified fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/pr299-one-shot.yml").read_text(encoding="utf-8")
          marker = "          python3 - <<'PY'\n"
          start = workflow.find(marker)
          if start < 0:
              raise SystemExit("PR 299 transformation script start marker missing")
          start += len(marker)
          end = workflow.find("\n          PY", start)
          if end < 0:
              raise SystemExit("PR 299 transformation script end marker missing")
          raw_script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_script.splitlines()
          )
          buggy = "\n".join([
              "    text = text.replace(class_marker, restore_block, 1)",
              "    text = text.replace(\"private static Fixture createFixture\", \"private Fixture createFixture\")",
              "    if \"NewPipe.init(downloader);\" not in text:",
              "        raise SystemExit(f\"Downloader install call missing: {path}\")",
              "    text = text.replace(\"NewPipe.init(downloader);\", \"installDownloader(downloader);\")",
          ])
          fixed = "\n".join([
              "    if \"NewPipe.init(downloader);\" not in text:",
              "        raise SystemExit(f\"Downloader install call missing: {path}\")",
              "    text = text.replace(\"NewPipe.init(downloader);\", \"installDownloader(downloader);\")",
              "    text = text.replace(class_marker, restore_block, 1)",
              "    text = text.replace(\"private static Fixture createFixture\", \"private Fixture createFixture\")",
          ])
          if buggy not in script:
              raise SystemExit("PR 299 downloader teardown patch marker missing")
          script = script.replace(buggy, fixed, 1)
          exec(compile(script, "pr299-one-shot", "exec"), {"__name__": "__main__"})

          reader_path = Path(
              "third_party/LevyraExtractor/extractor/src/main/java/org/schabi/newpipe/"
              "extractor/services/youtube/sabr/SabrStreamingResponseReader.java"
          )
          reader = reader_path.read_text(encoding="utf-8")
          old_signature = (
              "    private static byte[] readPayloadBytes(@Nonnull final InputStream input, final int size)\n"
              "            throws IOException {"
          )
          new_signature = (
              "    private static byte[] readPayloadBytes(@Nonnull final InputStream input, final int size)\n"
              "            throws IOException, SabrProtocolException {"
          )
          if old_signature not in reader:
              raise SystemExit("SABR readPayloadBytes signature marker missing")
          reader_path.write_text(reader.replace(old_signature, new_signature, 1), encoding="utf-8")
          PY

      - name: Verify extractor tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -p third_party/LevyraExtractor --no-daemon :extractor:test

      - name: Verify Android compilation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            third_party/LevyraExtractor/extractor/src/main/java \
            third_party/LevyraExtractor/extractor/src/test/java
          git diff --cached --check
          git commit -m "fix: address PR 299 review findings"
          git push origin "HEAD:${HEAD_REF}"
