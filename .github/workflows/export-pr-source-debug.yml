name: Export PR source debug

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-pr-source-debug.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Package source tree
        shell: bash
        run: |
          tar \
            --exclude='.git' \
            --exclude='**/build' \
            --exclude='.gradle' \
            --exclude='.idea' \
            -czf /tmp/levyra-pr-source.tgz .
      - uses: actions/upload-artifact@v7
        with:
          name: levyra-pr-source-debug
          path: /tmp/levyra-pr-source.tgz
          if-no-files-found: error
          retention-days: 1
