name: Restore PR 320 Static Home Header

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.number == 320
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: perf/home-scroll-header
          fetch-depth: 0

      - name: Restore main Home header and clean experiment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          if [ -f app/src/test/java/com/luc4n3x/levyra/ui/HomeScrollHeaderTest.kt ]; then
            git rm -f app/src/test/java/com/luc4n3x/levyra/ui/HomeScrollHeaderTest.kt
          fi
          git rm -f .github/workflows/restore-pr320-static-header.yml
          if [ -f .pr320-static-header-trigger ]; then
            git rm -f .pr320-static-header-trigger
          fi
          git diff --cached --check

      - name: Commit restore
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(home): keep Levyra header anchored at top'
          git push origin HEAD:perf/home-scroll-header
