name: Apply PR 313 fixes

on:
  push:
    branches:
      - claude/menu-esplora-redesign-t3j2l4

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path_value}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraScreenViewModels.kt",
              '''private data class ExploreProjection(
              val currentTrack: Track?,
              val exploreTracks: List<Track>,
              val exploreNewReleases: List<AlbumHit>,
              val exploreVideos: List<Track>,
              val exploreZoneId: String?,
              val favoriteIds: Set<String>,
              val isExploreLoading: Boolean,
              val isNewReleasesLoading: Boolean,
              val newReleasesLoadFailed: Boolean,
              val isPlaying: Boolean,
              val isSamplesOpen: Boolean
          )

          private fun exploreProjection(state: LevyraUiState): ExploreProjection = ExploreProjection(
              currentTrack = state.currentTrack,
              exploreTracks = state.exploreTracks,
              exploreNewReleases = state.exploreNewReleases,
              exploreVideos = state.exploreVideos,
              exploreZoneId = state.exploreZoneId,
              favoriteIds = state.favoriteIds,
              isExploreLoading = state.isExploreLoading,
              isNewReleasesLoading = state.isNewReleasesLoading,
              newReleasesLoadFailed = state.newReleasesLoadFailed,
              isPlaying = state.isPlaying,
              isSamplesOpen = state.isSamplesOpen
          )''',
              '''internal data class ExploreProjection(
              val currentTrack: Track?,
              val exploreTracks: List<Track>,
              val exploreNewReleases: List<AlbumHit>,
              val exploreVideos: List<Track>,
              val exploreZoneId: String?,
              val favoriteIds: Set<String>,
              val isExploreLoading: Boolean,
              val isNewReleasesLoading: Boolean,
              val newReleasesLoadFailed: Boolean,
              val isPlaying: Boolean,
              val isResolving: Boolean,
              val isVideoMode: Boolean,
              val isSamplesLoading: Boolean,
              val samplesLoadFailed: Boolean,
              val isSamplesOpen: Boolean,
              val playlists: List<Playlist>
          )

          internal fun exploreProjection(state: LevyraUiState): ExploreProjection = ExploreProjection(
              currentTrack = state.currentTrack,
              exploreTracks = state.exploreTracks,
              exploreNewReleases = state.exploreNewReleases,
              exploreVideos = state.exploreVideos,
              exploreZoneId = state.exploreZoneId,
              favoriteIds = state.favoriteIds,
              isExploreLoading = state.isExploreLoading,
              isNewReleasesLoading = state.isNewReleasesLoading,
              newReleasesLoadFailed = state.newReleasesLoadFailed,
              isPlaying = state.isPlaying,
              isResolving = state.isResolving,
              isVideoMode = state.isVideoMode,
              isSamplesLoading = state.isSamplesLoading,
              samplesLoadFailed = state.samplesLoadFailed,
              isSamplesOpen = state.isSamplesOpen,
              playlists = state.playlists
          )'''
          )

          view_model = "app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt"
          replace_once(view_model, "    private var pauseAfterNextPlaybackStart: Boolean = false\n", "")
          replace_once(
              view_model,
              '''        val startupShortsSnapshot = shortsCache.load(settings.languageCode)
          val startupShorts = startupShortsSnapshot.tracks
          ''',
              ""
          )
          replace_once(view_model, "                exploreVideos = startupShorts,\n", "")
          replace_once(
              view_model,
              '''        viewModelScope.launch {
              delay(if (startupShortsSnapshot.isFresh()) 1_200L else 80L)
              ensureMusicVideosLoaded()
          }''',
              '''        val startupSamplesLanguage = _state.value.languageCode
          val startupSamplesProfileSignature = samplesDiscoveryProfileSignature(_state.value)
          viewModelScope.launch {
              val cachedSamples = withContext(Dispatchers.IO) {
                  shortsCache.load(startupSamplesLanguage, startupSamplesProfileSignature)
              }
              val current = _state.value
              val profileMatches = current.languageCode == startupSamplesLanguage &&
                  samplesDiscoveryProfileSignature(current) == startupSamplesProfileSignature
              if (profileMatches && cachedSamples.tracks.isNotEmpty()) {
                  updateSamplesState(startupSamplesLanguage) { state ->
                      state.copy(
                          exploreVideos = cachedSamples.tracks,
                          isSamplesLoading = false,
                          samplesLoadFailed = false
                      )
                  }
                  if (cachedSamples.isFresh()) {
                      musicVideosLoadedLanguage = startupSamplesLanguage
                      musicVideosLoadedProfileSignature = startupSamplesProfileSignature
                  }
              }
              delay(if (profileMatches && cachedSamples.isFresh()) 1_200L else 80L)
              ensureMusicVideosLoaded()
          }'''
          )
          replace_once(
              view_model,
              '''        if (restoredTrack.streamUrl.isBlank()) {
              pendingSeekMs = resumeMs
              pauseAfterNextPlaybackStart = !session.wasPlaying
              startResolve(restoredTrack)
              return
          }''',
              '''        if (restoredTrack.streamUrl.isBlank()) {
              pendingSeekMs = resumeMs
              startResolve(restoredTrack, startPaused = !session.wasPlaying)
              return
          }'''
          )
          replace_once(
              view_model,
              "    private fun startResolve(track: Track, preserveCrossfade: Boolean = false, autoRetryWhenOffline: Boolean = false) {",
              '''    private fun startResolve(
              track: Track,
              preserveCrossfade: Boolean = false,
              autoRetryWhenOffline: Boolean = false,
              startPaused: Boolean = false
          ) {'''
          )
          replace_once(
              view_model,
              "            resolveAndStartPlayback(track, requestId, autoRetryWhenOffline)\n",
              "            resolveAndStartPlayback(track, requestId, autoRetryWhenOffline, startPaused)\n"
          )
          replace_once(
              view_model,
              '''    private suspend fun CoroutineScope.resolveAndStartPlayback(
              track: Track,
              requestId: Long,
              autoRetryWhenOffline: Boolean
          ) {''',
              '''    private suspend fun CoroutineScope.resolveAndStartPlayback(
              track: Track,
              requestId: Long,
              autoRetryWhenOffline: Boolean,
              startPaused: Boolean
          ) {'''
          )
          replace_once(
              view_model,
              "            startPlayback(preserveEditorialArtwork(track, instant))\n",
              "            startPlayback(preserveEditorialArtwork(track, instant), startPaused)\n"
          )
          replace_once(
              view_model,
              "            startPlayback(playable)\n",
              "            startPlayback(playable, startPaused)\n"
          )
          replace_once(view_model, "        pauseAfterNextPlaybackStart = false\n", "")
          replace_once(
              view_model,
              '''    private fun startPlayback(playable: Track) {
              val selectedIndex = queueEngine.state.value.currentIndex
              if (selectedIndex >= 0) queueEngine.updateTrackAt(selectedIndex, playable)
              repository.replace(playable)
              val startPaused = pauseAfterNextPlaybackStart
              pauseAfterNextPlaybackStart = false
              player.play(playable, _state.value.isVideoMode)
              // Resume from the saved position when continuing the last session's track.
              val resumeMs = pendingSeekMs.takeIf { it > 1500L && it < playable.durationMs } ?: 0L''',
              '''    private fun startPlayback(playable: Track, startPaused: Boolean = false) {
              val selectedIndex = queueEngine.state.value.currentIndex
              if (selectedIndex >= 0) queueEngine.updateTrackAt(selectedIndex, playable)
              repository.replace(playable)
              player.play(playable, _state.value.isVideoMode)
              val resumeMs = pendingSeekMs.takeIf { it > 1500L && it < playable.durationMs } ?: 0L'''
          )

          replace_once(
              "app/src/main/java/com/luc4n3x/levyra/data/YoutubeShortsRepository.kt",
              '''internal fun isYoutubeShortSearchFallbackCandidate(
              isShortFormContent: Boolean,
              url: String,
              durationSeconds: Long
          ): Boolean {
              if (isYoutubeShortCandidate(isShortFormContent, url, durationSeconds)) return true
              return durationSeconds in 1L..MAX_SHORT_DURATION_SECONDS &&
                  YOUTUBE_VIDEO_ID_REGEX.containsMatchIn(url)
          }''',
              '''internal fun isYoutubeShortSearchFallbackCandidate(
              isShortFormContent: Boolean,
              url: String,
              durationSeconds: Long
          ): Boolean = isYoutubeShortCandidate(isShortFormContent, url, durationSeconds)'''
          )

          replace_once(
              "app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt",
              '''            .weight(1f)
              .height(58.dp)
              .clip(shape)''',
              '''            .weight(1f)
              .heightIn(min = 58.dp)
              .clip(shape)'''
          )
          replace_once(
              "app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt",
              '''            fontWeight = FontWeight.SemiBold,
              maxLines = 1,
              overflow = TextOverflow.Ellipsis
          )
      }
  }

  @Composable
  private fun ExploreSamplesRow(''',
              '''            fontWeight = FontWeight.SemiBold,
              maxLines = 2,
              overflow = TextOverflow.Ellipsis
          )
      }
  }

  @Composable
  private fun ExploreSamplesRow('''
          )

          replace_once(
              "app/src/test/java/com/luc4n3x/levyra/data/YoutubeShortsRepositoryTest.kt",
              '''    @Test
      fun shortSearchFallbackAcceptsBoundedVideoResults() {
          assertTrue(
              isYoutubeShortSearchFallbackCandidate(
                  isShortFormContent = false,
                  url = "https://www.youtube.com/watch?v=abcdefghijk",
                  durationSeconds = 90L
              )
          )
          assertFalse(
              isYoutubeShortSearchFallbackCandidate(
                  isShortFormContent = false,
                  url = "https://www.youtube.com/watch?v=abcdefghijk",
                  durationSeconds = 181L
              )
          )
      }''',
              '''    @Test
      fun shortSearchFallbackRejectsUnverifiedBoundedVideos() {
          assertFalse(
              isYoutubeShortSearchFallbackCandidate(
                  isShortFormContent = false,
                  url = "https://www.youtube.com/watch?v=abcdefghijk",
                  durationSeconds = 90L
              )
          )
          assertTrue(
              isYoutubeShortSearchFallbackCandidate(
                  isShortFormContent = false,
                  url = "https://www.youtube.com/shorts/abcdefghijk",
                  durationSeconds = 90L
              )
          )
      }'''
          )

          Path("app/src/test/java/com/luc4n3x/levyra/viewmodel/ExploreProjectionTest.kt").write_text(
              '''package com.luc4n3x.levyra.viewmodel

          import com.luc4n3x.levyra.domain.Playlist
          import org.junit.Assert.assertNotEquals
          import org.junit.Test

          class ExploreProjectionTest {
              @Test
              fun sampleRuntimeStateChangesProjection() {
                  val base = LevyraUiState()
                  val baseline = exploreProjection(base)

                  assertNotEquals(baseline, exploreProjection(base.copy(isResolving = true)))
                  assertNotEquals(baseline, exploreProjection(base.copy(isVideoMode = true)))
                  assertNotEquals(baseline, exploreProjection(base.copy(isSamplesLoading = true)))
                  assertNotEquals(baseline, exploreProjection(base.copy(samplesLoadFailed = true)))
              }

              @Test
              fun playlistChangesProjection() {
                  val base = LevyraUiState()
                  val playlist = Playlist(id = "playlist", name = "Playlist", tracks = emptyList())

                  assertNotEquals(exploreProjection(base), exploreProjection(base.copy(playlists = listOf(playlist))))
              }
          }
          ''',
              encoding="utf-8"
          )
          PY

          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/workflow-duplicates-guard.yml > .github/workflows/workflow-duplicates-guard.yml
          rm .github/workflows/apply-pr-313-fixes.yml
          git diff --check
          if git diff --unified=0 -- '*.kt' | grep '^+' | grep -v '^+++' | grep -E '^\+[[:space:]]*(//|/\*|\*)'; then
            exit 1
          fi

      - name: Validate
        shell: bash
        run: |
          ./gradlew :app:testDebugUnitTest --tests "com.luc4n3x.levyra.viewmodel.ExploreProjectionTest" --tests "com.luc4n3x.levyra.data.YoutubeShortsRepositoryTest"
          ./gradlew :app:compileDebugKotlin

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraScreenViewModels.kt
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          git add app/src/main/java/com/luc4n3x/levyra/data/YoutubeShortsRepository.kt
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git add app/src/test/java/com/luc4n3x/levyra/data/YoutubeShortsRepositoryTest.kt
          git add app/src/test/java/com/luc4n3x/levyra/viewmodel/ExploreProjectionTest.kt
          git add .github/workflows/workflow-duplicates-guard.yml
          git add .github/workflows/apply-pr-313-fixes.yml
          git commit -m "fix(explore): harden samples state and playback restore"
          git push origin HEAD:claude/menu-esplora-redesign-t3j2l4
