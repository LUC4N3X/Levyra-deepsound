name: Polish verified motion review fixes once

on:
  push:
    branches:
      - fix/instant-page-canvas

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      ORG_GRADLE_PROJECT_levyraNativeAudio: "true"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/instant-page-canvas
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Polish implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('app/src/main/java/com/luc4n3x/levyra/feature/motion/MotionArtworkEngine.kt')
          text = engine.read_text()
          start_marker = '    private suspend fun prepareLookupTrackWithinBudget(track: Track): Track {'
          next_marker = '    private suspend fun prepareLookupTrack(track: Track): Track {'
          start = text.find(start_marker)
          end = text.find(next_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('metadata budget function boundaries not found')
          formatted = '''    private suspend fun prepareLookupTrackWithinBudget(track: Track): Track {
              val remembered = metadataWarmCache.get(track) ?: track
              val budgetMs = motionMetadataForegroundBudgetMs(remembered)
              if (budgetMs <= 0L) return remembered
              val prepared = lookupScope.async {
                  prepareLookupTrack(remembered).also { resolved ->
                      metadataWarmCache.put(track, resolved)
                  }
              }
              return withTimeoutOrNull(budgetMs) { prepared.await() } ?: remembered
          }

          '''
          engine.write_text(text[:start] + formatted + text[end:])

          layer = Path('app/src/main/java/com/luc4n3x/levyra/ui/MotionArtworkLayer.kt')
          text = layer.read_text()
          old = '''    if (videoUnavailable) return true
              if (motionResolving) return false
              return true
          '''
          new = '''    if (videoUnavailable) return true
              if (motionResolving) return false
              if (videoCandidatePending) return true
              return true
          '''
          if text.count(old) != 1:
              raise SystemExit(f'static bed visibility tail expected once, found {text.count(old)}')
          layer.write_text(text.replace(old, new, 1))
          PY

      - name: Verify motion tests and Kotlin compile
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.ArtistPopularSongsMergeTest' \
            --tests 'com.luc4n3x.levyra.ui.MotionArtworkLayerTest' \
            --tests 'com.luc4n3x.levyra.feature.motion.MotionArtworkRequestCoordinatorTest' \
            --console=plain --warning-mode summary
          ./gradlew :app:compileDebugKotlin --console=plain --warning-mode summary
          git diff --check

      - name: Remove one-shot workflow and push result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr762-review-polish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/luc4n3x/levyra/feature/motion/MotionArtworkEngine.kt \
            app/src/main/java/com/luc4n3x/levyra/ui/MotionArtworkLayer.kt \
            .github/workflows/pr762-review-polish-once.yml
          git commit -m "style(motion): clarify verified page fallback logic"
          git push origin HEAD:fix/instant-page-canvas
