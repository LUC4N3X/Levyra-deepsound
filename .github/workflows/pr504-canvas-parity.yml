# second push activates the branch workflow after creation
name: PR504 Canvas Parity Fix

on:
  push:
    branches:
      - feat/amazon-inspired-explore-cards
    paths:
      - .github/workflows/pr504-canvas-parity.yml

permissions:
  contents: write

jobs:
  patch-canvas-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/amazon-inspired-explore-cards
          fetch-depth: 0

      - name: Apply Canvas metadata parity fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          vm = Path('app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt')
          text = vm.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import com.luc4n3x.levyra.data.ChartsRepository\n',
              'import com.luc4n3x.levyra.data.ChartsRepository\nimport com.luc4n3x.levyra.data.ChartOfficialArtworkResolver\n',
              'chart resolver import'
          )

          replace_once(
              '    private val chartsRepository = ChartsRepository(application.applicationContext)\n    private val officialArtworkRepository = OfficialArtworkRepository(application.applicationContext)\n',
              '    private val chartsRepository = ChartsRepository(application.applicationContext)\n    private val motionTrackMetadataResolver = ChartOfficialArtworkResolver(application.applicationContext)\n    private val officialArtworkRepository = OfficialArtworkRepository(application.applicationContext)\n',
              'motion metadata resolver field'
          )

          marker = '    private fun refreshMotionArtworkAround(current: Track) {\n'
          helper = '''    private suspend fun motionArtworkLookupTrack(track: Track): Track {
        val snapshot = _state.value
        val country = ChartsCatalog.regions
            .firstOrNull { it.id == snapshot.selectedChartId }
            ?.country
            .orEmpty()
            .ifBlank { ChartsCatalog.defaultRegionForLanguage(snapshot.languageCode).country }
        return motionTrackMetadataResolver
            .enrich(listOf(track), country)
            .firstOrNull()
            ?: track
    }

'''
          if text.count(marker) != 1:
              raise SystemExit(f'motion helper marker: expected exactly one match, found {text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)

          replace_once(
              '''                val resolved = runCatching {
                    motionArtworkEngine.resolve(current, _state.value.interfaceSettings.canvasSource)
                }
''',
              '''                val lookupTrack = runCatchingPreservingCancellation {
                    motionArtworkLookupTrack(current)
                }
                    .onFailure { error ->
                        Timber.d(error, "Motion artwork metadata enrichment failed for %s", current.id)
                    }
                    .getOrDefault(current)
                val resolved = runCatching {
                    motionArtworkEngine.resolve(lookupTrack, _state.value.interfaceSettings.canvasSource)
                }
''',
              'current motion lookup enrichment'
          )

          replace_once(
              '''            runCatching {
                motionArtworkEngine.prefetchNext(next, _state.value.interfaceSettings.canvasSource)
            }
''',
              '''            runCatchingPreservingCancellation {
                val lookupNext = motionArtworkLookupTrack(next)
                motionArtworkEngine.prefetchNext(lookupNext, _state.value.interfaceSettings.canvasSource)
            }
''',
              'next motion lookup enrichment'
          )

          replace_once(
              '        handlePlaybackStartSideEffects(playable, startPaused)\n',
              '        refreshMotionArtworkAround(playable)\n        handlePlaybackStartSideEffects(playable, startPaused)\n',
              'canonical playback motion refresh'
          )

          vm.write_text(text)

          runtime = Path('app/src/main/java/com/luc4n3x/levyra/feature/motion/MotionArtworkRuntime.kt')
          runtime_text = runtime.read_text()
          old_epoch = 'internal const val MOTION_ARTWORK_CACHE_SCHEMA_EPOCH = 5L'
          new_epoch = 'internal const val MOTION_ARTWORK_CACHE_SCHEMA_EPOCH = 6L'
          if runtime_text.count(old_epoch) != 1:
              raise SystemExit(f'cache epoch: expected exactly one match, found {runtime_text.count(old_epoch)}')
          runtime.write_text(runtime_text.replace(old_epoch, new_epoch, 1))
          PY

      - name: Commit final Canvas fix
        shell: bash
        run: |
          rm -f .github/workflows/pr504-canvas-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt app/src/main/java/com/luc4n3x/levyra/feature/motion/MotionArtworkRuntime.kt .github/workflows/pr504-canvas-parity.yml
          git commit -m "fix(canvas): use chart-grade metadata for every track"
          git push origin HEAD:feat/amazon-inspired-explore-cards
