name: Apply Home redesign

on:
  push:
    branches:
      - agent/home-levyra-aura

permissions:
  contents: write

concurrency:
  group: apply-home-redesign
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: agent/home-levyra-aura
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic Home patch
        run: python scripts/apply_home_redesign.py

      - name: Commit source changes and remove patch tooling
        shell: bash
        run: |
          rm -f scripts/apply_home_redesign.py .github/workflows/apply-home-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were produced"
            exit 1
          fi
          git commit -m "feat(home): redesign the discovery experience"
          git push origin HEAD:agent/home-levyra-aura
