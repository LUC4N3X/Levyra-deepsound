name: Format artist UI refinement once

on:
  push:
    branches:
      - fix/instant-page-canvas

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/instant-page-canvas
          fetch-depth: 0

      - name: Normalize indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text()

          hero = re.compile(
              r'(?m)^(?P<i>[ ]*)\.drawBehind \{\n[ ]*drawRect\(\n[ ]*Brush\.verticalGradient\(\n[ ]*0f to Color\(0xFF111214\),\n[ ]*0\.58f to Color\(0xFF08090B\),\n[ ]*1f to scrim\n[ ]*\)\n[ ]*\)\n[ ]*\}'
          )
          def hero_repl(match):
              i = match.group('i')
              return (
                  i + '.drawBehind {\n' +
                  i + '    drawRect(\n' +
                  i + '        Brush.verticalGradient(\n' +
                  i + '            0f to Color(0xFF111214),\n' +
                  i + '            0.58f to Color(0xFF08090B),\n' +
                  i + '            1f to scrim\n' +
                  i + '        )\n' +
                  i + '    )\n' +
                  i + '}'
              )
          text, count = hero.subn(hero_repl, text, count=1)
          if count != 1:
              raise SystemExit(f'hero indent: expected 1 match, found {count}')

          stops = re.compile(
              r'(?m)^(?P<i>[ ]*)0f to statusProtection,\n[ ]*0\.20f to Color\.Transparent,\n[ ]*0\.54f to Color\.Black\.copy\(alpha = 0\.08f\),\n[ ]*0\.74f to Color\.Black\.copy\(alpha = 0\.62f\),\n[ ]*0\.92f to Color\.Black\.copy\(alpha = 0\.96f\),\n[ ]*1f to Color\.Black'
          )
          def stops_repl(match):
              i = match.group('i')
              return '\n'.join([
                  i + '0f to statusProtection,',
                  i + '0.20f to Color.Transparent,',
                  i + '0.54f to Color.Black.copy(alpha = 0.08f),',
                  i + '0.74f to Color.Black.copy(alpha = 0.62f),',
                  i + '0.92f to Color.Black.copy(alpha = 0.96f),',
                  i + '1f to Color.Black',
              ])
          text, count = stops.subn(stops_repl, text, count=1)
          if count != 1:
              raise SystemExit(f'hero stops indent: expected 1 match, found {count}')

          shadow = re.compile(
              r'(?m)^(?P<i>[ ]*)\.shadow\(\n[ ]*elevation = 10\.dp,\n[ ]*shape = CircleShape,\n[ ]*ambientColor = Color\.Black\.copy\(alpha = 0\.24f\),\n[ ]*spotColor = playShadow\.copy\(alpha = 0\.18f\)\n[ ]*\)\n[ ]*\.background\(playContainer, CircleShape\)'
          )
          def shadow_repl(match):
              i = match.group('i')
              return (
                  i + '.shadow(\n' +
                  i + '    elevation = 10.dp,\n' +
                  i + '    shape = CircleShape,\n' +
                  i + '    ambientColor = Color.Black.copy(alpha = 0.24f),\n' +
                  i + '    spotColor = playShadow.copy(alpha = 0.18f)\n' +
                  i + ')\n' +
                  i + '.background(playContainer, CircleShape)'
              )
          text, count = shadow.subn(shadow_repl, text, count=1)
          if count != 1:
              raise SystemExit(f'play shadow indent: expected 1 match, found {count}')

          path.write_text(text)
          PY

      - name: Remove one-shot workflow and push result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/artist-ui-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/artist-ui-format-once.yml
          git diff --cached --check
          git commit -m "style(ui): normalize artist screen formatting"
          git push origin HEAD:fix/instant-page-canvas
