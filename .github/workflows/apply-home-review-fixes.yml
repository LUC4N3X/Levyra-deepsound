name: Apply Home review fixes

on:
  push:
    branches:
      - refactor/home-experience
    paths:
      - .github/workflows/apply-home-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-home-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Fix quick-pick playback action
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/home-review-fixes.patch
          git apply --check /tmp/home-review-fixes.patch
          git apply /tmp/home-review-fixes.patch
          rm .github/workflows/apply-home-review-fixes.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): toggle playback for active quick picks"
          git push origin HEAD:refactor/home-experience
