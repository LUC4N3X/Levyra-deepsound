name: Apply Home review fixes

on:
  push:
    branches:
      - refactor/home-experience
    paths:
      - .github/workflows/apply-home-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-home-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Fix reviewed Home interactions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")

          old = """                        onPlay = { track -> viewModel.playFrom(quickPicks.tracks, track) },
"""
          new = """                        onPlay = { track ->
                            if (track.id == state.currentTrack?.id) {
                                viewModel.togglePlay()
                            } else {
                                viewModel.playFrom(quickPicks.tracks, track)
                            }
                        },
"""

          if text.count(old) != 1:
              raise SystemExit(f"Expected one quick-pick callback, found {text.count(old)}")

          text = text.replace(old, new, 1)

          if "onSearch = viewModel::openSearch" not in text:
              raise SystemExit("Header Search is not wired to openSearch")

          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/apply-home-review-fixes.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): correct search and quick-pick actions"
          git push origin HEAD:refactor/home-experience
