name: PR504 Home Spotlight Lint Fix

on:
  push:
    branches:
      - feat/amazon-inspired-explore-cards

permissions:
  contents: write

jobs:
  fix-lint:
    if: ${{ github.actor == 'LUC4N3X' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/amazon-inspired-explore-cards
          fetch-depth: 0

      - name: Replace unused BoxWithConstraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')
          marker = 'val soundtrackLead = homeSoundtrackLead(strings, soundtrackArtists)'
          start = text.index(marker)
          target = text.index('BoxWithConstraints(', start)
          artist_branch = text.index('if (artistArtworkUrl.isNotBlank())', target)
          if target > artist_branch:
              raise SystemExit('home spotlight BoxWithConstraints not found before artist artwork branch')
          text = text[:target] + 'Box(' + text[target + len('BoxWithConstraints('):]
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Prepare CI release signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null

      - name: Verify release lint
        shell: bash
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr504-lint-fix.yml
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --cached --check
          git commit -m "fix(home): replace unused BoxWithConstraints"
          git push origin HEAD:feat/amazon-inspired-explore-cards
