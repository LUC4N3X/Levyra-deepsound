name: PR504 Red CI Fix

on:
  push:
    branches:
      - feat/amazon-inspired-explore-cards

permissions:
  contents: write

jobs:
  fix-home-artist-pool:
    if: ${{ github.actor == 'LUC4N3X' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/amazon-inspired-explore-cards
          fetch-depth: 0

      - name: Normalize soundtrack artist portrait sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')

          pool_start = text.index('    val soundtrackArtistPool = remember(')
          pool_end = text.index('    val spotlightCandidate = remember(', pool_start)
          new_pool = '''    val soundtrackArtistPool = remember(
              state.followedArtists,
              state.homeArtists,
              state.similarArtists
          ) {
              buildList {
                  state.followedArtists.forEach { artist ->
                      if (artist.thumbnailUrl.isNotBlank()) {
                          add(Triple(artist.name, artist.browseId, artist.thumbnailUrl))
                      }
                  }
                  (state.homeArtists + state.similarArtists).forEach { artist ->
                      if (artist.thumbnailUrl.isNotBlank()) {
                          add(Triple(artist.name, artist.browseId, artist.thumbnailUrl))
                      }
                  }
              }.distinctBy { artist ->
                  artist.second.ifBlank { artist.first.trim().lowercase(Locale.ROOT) }
              }
          }
'''
          text = text[:pool_start] + new_pool + text[pool_end:]

          candidate_start = text.index('    val spotlightCandidate = remember(', pool_start)
          candidate_end = text.index('    val spotlightTracks = remember(', candidate_start)
          candidate = text[candidate_start:candidate_end]
          candidate = candidate.replace(
              'homeSoundtrackMatchesArtist(candidate.track, artist.name, artist.browseId)',
              'homeSoundtrackMatchesArtist(candidate.track, artist.first, artist.second)'
          )
          if 'artist.name' in candidate or 'artist.browseId' in candidate:
              raise SystemExit('unexpected artist model access remains in spotlight candidate block')
          text = text[:candidate_start] + candidate + text[candidate_end:]

          hero_start = text.index('            spotlightCandidate?.let { candidate ->')
          hero_end = text.index(
              '\n            if (\n                showDeferredHomeSections && state.interfaceSettings.showNewReleases',
              hero_start
          )
          hero = text[hero_start:hero_end]
          replacements = {
              'homeSoundtrackMatchesArtist(heroTrack, artist.name, artist.browseId)':
                  'homeSoundtrackMatchesArtist(heroTrack, artist.first, artist.second)',
              'homeSoundtrackMatchesArtist(track, artist.name, artist.browseId)':
                  'homeSoundtrackMatchesArtist(track, artist.first, artist.second)',
              'heroPortraitArtist?.name': 'heroPortraitArtist?.first',
              'heroPortraitArtist?.thumbnailUrl': 'heroPortraitArtist?.third',
              'homeSoundtrackPrimaryArtist(artist.name)': 'homeSoundtrackPrimaryArtist(artist.first)',
              '}?.thumbnailUrl': '}?.third',
          }
          for old, new in replacements.items():
              if old not in hero:
                  raise SystemExit(f'missing hero patch target: {old}')
              hero = hero.replace(old, new)
          if 'artist.name' in hero or 'artist.browseId' in hero or 'heroPortraitArtist?.name' in hero or 'heroPortraitArtist?.thumbnailUrl' in hero:
              raise SystemExit('unexpected mixed artist model access remains in hero block')
          text = text[:hero_start] + hero + text[hero_end:]

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/pr504-red-ci-fix.yml
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --cached --check
          git commit -m "fix(home): normalize soundtrack artist portrait sources"
          git push origin HEAD:feat/amazon-inspired-explore-cards
