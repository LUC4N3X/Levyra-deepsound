name: Resolve PR 269 against latest main

on:
  push:
    branches:
      - agent/pro-readme-badges-docs
    paths:
      - .github/workflows/resolve-and-merge-pr-269.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/pro-readme-badges-docs
          fetch-depth: 0

      - name: Merge latest main and preserve redesigned badge
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=.github/workflows/resolve-and-merge-pr-269.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "docs/assets/levyra-downloads.svg" ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours -- docs/assets/levyra-downloads.svg
            git add docs/assets/levyra-downloads.svg
            git rm "$workflow_path"
            git commit --no-edit
          else
            git rm "$workflow_path"
            git commit --amend --no-edit
          fi

          git push origin HEAD:agent/pro-readme-badges-docs
