name: Rebuild Levyra 2.5.6

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-2.5.6.yml"

permissions:
  contents: write

concurrency:
  group: rebuild-levyra-2.5.6
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: "2.5.6"
      VERSION_CODE: "2050600"
      TAG: "v2.5.6"
      APK_NAME: "LEVYRA-2.5.6.apk"
      CHECKSUM_NAME: "LEVYRA-2.5.6.apk.sha256"
      LEVYRA_SIGNING_CERT_SHA256: "90221b5db83ec605c349fb256efe6801a4b0f2e6ed5da19e18dba6fa1f23e97b"

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary rebuild workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git rm ".github/workflows/rebuild-2.5.6.yml"
          git commit -m "chore: remove temporary 2.5.6 rebuild workflow"
          git push origin HEAD:main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep '^levyraVersionName=' gradle.properties | cut -d= -f2- | xargs)" = "$VERSION"
          test "$(grep '^levyraVersionCode=' gradle.properties | cut -d= -f2- | xargs)" = "$VERSION_CODE"
          test "$(sed -n '/./{p;q;}' docs/RELEASE_NOTES.md)" = "# Levyra $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-37.0"             "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-disabled: true

      - name: Prepare release signing
        shell: bash
        env:
          LEVYRA_KEYSTORE_BASE64: ${{ secrets.LEVYRA_KEYSTORE_BASE64 }}
          LEVYRA_KEYSTORE_FILE: app/levyra-release.jks
          LEVYRA_KEYSTORE_PASSWORD: ${{ secrets.LEVYRA_KEYSTORE_PASSWORD }}
          LEVYRA_KEY_ALIAS: ${{ secrets.LEVYRA_KEY_ALIAS }}
          LEVYRA_KEY_PASSWORD: ${{ secrets.LEVYRA_KEY_PASSWORD }}
          YOUTUBE_INNERTUBE_API_KEY: ${{ secrets.YOUTUBE_INNERTUBE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$YOUTUBE_INNERTUBE_API_KEY"
          test -n "$LEVYRA_KEYSTORE_BASE64"
          test -n "$LEVYRA_KEYSTORE_PASSWORD"
          test -n "$LEVYRA_KEY_ALIAS"
          test -n "$LEVYRA_KEY_PASSWORD"
          printf '%s' "$LEVYRA_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$LEVYRA_KEYSTORE_FILE"
          keytool -list             -keystore "$LEVYRA_KEYSTORE_FILE"             -storepass "$LEVYRA_KEYSTORE_PASSWORD"             -alias "$LEVYRA_KEY_ALIAS" >/dev/null

      - name: Validate Quick Picks regression
        shell: bash
        env:
          YOUTUBE_INNERTUBE_API_KEY: ${{ secrets.YOUTUBE_INNERTUBE_API_KEY }}
        run: |
          set -euo pipefail
          ./gradlew             --no-daemon             --no-configuration-cache             :app:testDebugUnitTest             --tests "com.luc4n3x.levyra.viewmodel.HomeRenderSnapshotTest"

      - name: Android lint
        shell: bash
        env:
          YOUTUBE_INNERTUBE_API_KEY: ${{ secrets.YOUTUBE_INNERTUBE_API_KEY }}
          LEVYRA_KEYSTORE_FILE: app/levyra-release.jks
          LEVYRA_KEYSTORE_PASSWORD: ${{ secrets.LEVYRA_KEYSTORE_PASSWORD }}
          LEVYRA_KEY_ALIAS: ${{ secrets.LEVYRA_KEY_ALIAS }}
          LEVYRA_KEY_PASSWORD: ${{ secrets.LEVYRA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew             --no-daemon             --no-configuration-cache             :app:lintRelease             -PlevyraVersionName="$VERSION"             -PlevyraVersionCode="$VERSION_CODE"

      - name: Build signed release APK
        shell: bash
        env:
          YOUTUBE_INNERTUBE_API_KEY: ${{ secrets.YOUTUBE_INNERTUBE_API_KEY }}
          LEVYRA_KEYSTORE_FILE: app/levyra-release.jks
          LEVYRA_KEYSTORE_PASSWORD: ${{ secrets.LEVYRA_KEYSTORE_PASSWORD }}
          LEVYRA_KEY_ALIAS: ${{ secrets.LEVYRA_KEY_ALIAS }}
          LEVYRA_KEY_PASSWORD: ${{ secrets.LEVYRA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew             --no-daemon             --no-configuration-cache             :app:assembleRelease             -PlevyraVersionName="$VERSION"             -PlevyraVersionCode="$VERSION_CODE"

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          mkdir -p release-assets
          test -f "$SOURCE_APK"
          test "$(stat -c%s "$SOURCE_APK")" -gt 1048576

          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$SOURCE_APK")"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$VERSION_CODE'"

          CERTS="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SOURCE_APK")"
          SIGNER_SHA256="$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
          test "$SIGNER_SHA256" = "$LEVYRA_SIGNING_CERT_SHA256"

          cp "$SOURCE_APK" "release-assets/$APK_NAME"
          (
            cd release-assets
            sha256sum "$APK_NAME" > "$CHECKSUM_NAME"
          )
          echo "APK_SHA256=$(sha256sum "release-assets/$APK_NAME" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Remove release signing key
        if: always()
        shell: bash
        run: rm -f app/levyra-release.jks

      - name: Replace Levyra 2.5.6 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)"
          if [ -n "$RELEASE_ID" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          fi

          gh release create "$TAG"             "release-assets/$APK_NAME#LEVYRA Android APK"             "release-assets/$CHECKSUM_NAME#SHA-256 checksum"             --target "$TARGET_SHA"             --title "Levyra $VERSION"             --notes-file docs/RELEASE_NOTES.md             --latest             --repo "$GITHUB_REPOSITORY"

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"

          APK_COUNT="$(printf '%s' "$RELEASE_JSON" | jq '[.assets[] | select(.name | endswith(".apk"))] | length')"
          test "$APK_COUNT" = "1"
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".apk")) | .name')" = "$APK_NAME"
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.target_commitish')" = "$TARGET_SHA"

          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"

          rm -rf release-verification
          mkdir release-verification
          gh release download "$TAG"             --pattern "$APK_NAME"             --pattern "$CHECKSUM_NAME"             --dir release-verification             --repo "$GITHUB_REPOSITORY"

          test "$(sha256sum "release-verification/$APK_NAME" | awk '{print $1}')" = "$APK_SHA256"
          (
            cd release-verification
            sha256sum --check "$CHECKSUM_NAME"
          )

          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "release-verification/$APK_NAME")"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$VERSION_CODE'"

          CERTS="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release-verification/$APK_NAME")"
          SIGNER_SHA256="$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
          test "$SIGNER_SHA256" = "$LEVYRA_SIGNING_CERT_SHA256"
