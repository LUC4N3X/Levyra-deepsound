name: Workflow Duplicates Guard

on:
  pull_request:

permissions:
  contents: write

jobs:
  workflow-duplicates-guard:
    name: Detect duplicated workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Temporary guard
        run: echo "Final review verification runner is active."

  apply-final-review-fixes:
    name: Apply verified final review fixes
    if: >-
      github.event.pull_request.head.ref == 'feat/central-ytm-editorial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/central-ytm-editorial
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Apply source fixes and clean temporary lint hooks
        run: |
          set -euo pipefail
          python tools/apply_final_review_fixes.py
          python tools/fix_final_review_generated_test.py
          python tools/fix_final_review_python_test.py
          python tools/fix_artist_separator_regression.py
          rm -f tools/sitecustomize.py tools/levyra-editorial/tests/ruff.toml

      - name: Verify editorial collector
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e "tools/levyra-editorial[dev]"
          python -m compileall -q tools/levyra-editorial/levyra_editorial
          ruff check tools/levyra-editorial
          pytest tools/levyra-editorial/tests

      - name: Verify Android regressions, lint, and compile
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            --tests com.luc4n3x.levyra.domain.LevyraPersonalOrbitIdentityTest \
            --tests com.luc4n3x.levyra.data.EditorialCatalogParserTest \
            --tests com.luc4n3x.levyra.player.LevyraPlayerTest \
            :app:lintDebug \
            :app:compileDebugKotlin

      - name: Verify strict mapping contract
        run: |
          set -euo pipefail
          grep -q 'def combine_verified_youtube_mapping' tools/levyra-editorial/levyra_editorial/youtube_music.py
          grep -q 'verified_audio = combine_verified_youtube_mapping(audio_result, None)' tools/levyra-editorial/levyra_editorial/youtube_music.py
          grep -q 'val youtubePlaybackId = youtubeAudioVideoId' app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt
          grep -q 'MIN_OFFICIAL_VIDEO_CONFIDENCE = 90' app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt
          grep -q 'strings.exploreNewVideos)' app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          ! git diff -- app/src/main tools/levyra-editorial | grep -E 'LEVYRA_EDITORIAL_YTM_COOKIE|SAPISID|__Secure-' >/dev/null

      - name: Commit verified fixes and remove all temporary files
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/workflow-duplicates-guard.yml
          git rm --ignore-unmatch \
            .github/workflows/apply-final-review-fixes.yml \
            tools/final-review-trigger.txt \
            tools/apply_final_review_fixes.py \
            tools/fix_final_review_generated_test.py \
            tools/fix_final_review_python_test.py \
            tools/fix_artist_separator_regression.py \
            tools/sitecustomize.py \
            tools/levyra-editorial/tests/ruff.toml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(editorial): require verified audio-backed video mapping"
          git push origin HEAD:feat/central-ytm-editorial
