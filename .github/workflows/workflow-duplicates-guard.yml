name: Workflow Duplicates Guard

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-home-video-shelf
  cancel-in-progress: false

jobs:
  apply-home-video-shelf:
    if: github.event.pull_request.head.ref == 'refactor/home-experience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Apply concise video shelf and real previews
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')

          old_call = '''                    HomeMusicVideoShelf(
                        title = strings.exploreNewVideos,
'''
          new_call = '''                    HomeMusicVideoShelf(
                        title = strings.video,
'''
          if text.count(old_call) != 1:
              raise SystemExit(f'Expected one Home video shelf title call, found {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)

          old_videos = '''    val videos = remember(tracks) { LevyraPersonalOrbit.distinctRecordings(tracks).take(12) }
'''
          new_videos = '''    val videos = remember(tracks) {
        LevyraPersonalOrbit.distinctRecordings(tracks)
            .take(12)
            .map(::homeMusicVideoPreviewTrack)
    }
'''
          if text.count(old_videos) != 1:
              raise SystemExit(f'Expected one Home video list declaration, found {text.count(old_videos)}')
          text = text.replace(old_videos, new_videos, 1)

          old_card = '''                Column(
                    modifier = Modifier.width(154.dp).pressable(onClick = { onPlay(track) }),
                    verticalArrangement = Arrangement.spacedBy(7.dp)
                ) {
                    Box(
                        modifier = Modifier
                            .fillMaxWidth()
                            .aspectRatio(1f)
                            .clip(RoundedCornerShape(22.dp))
                            .border(
                                if (active) 1.5.dp else Dp.Hairline,
                                if (active) LevyraCyan.copy(alpha = 0.82f) else LevyraAdaptiveSoftHairline,
                                RoundedCornerShape(22.dp)
                            )
                    ) {
'''
          new_card = '''                Column(
                    modifier = Modifier.width(236.dp).pressable(onClick = { onPlay(track) }),
                    verticalArrangement = Arrangement.spacedBy(7.dp)
                ) {
                    Box(
                        modifier = Modifier
                            .fillMaxWidth()
                            .aspectRatio(16f / 9f)
                            .clip(LevyraHomeDesign.ShelfShape)
                            .border(
                                if (active) 1.5.dp else Dp.Hairline,
                                if (active) LevyraCyan.copy(alpha = 0.82f) else LevyraAdaptiveSoftHairline,
                                LevyraHomeDesign.ShelfShape
                            )
                    ) {
'''
          if text.count(old_card) != 1:
              raise SystemExit(f'Expected one square Home video card block, found {text.count(old_card)}')
          text = text.replace(old_card, new_card, 1)

          anchor = '''private fun isMusicVideoSectionTitle(title: String, strings: LevyraStrings): Boolean {
'''
          helper = '''private val HOME_VIDEO_ID_PATTERN = Regex("[A-Za-z0-9_-]{11}")

private fun homeMusicVideoPreviewTrack(track: Track): Track {
    val videoId = track.counterpartVideoId.trim().takeIf(HOME_VIDEO_ID_PATTERN::matches)
        ?: com.luc4n3x.levyra.data.PlaybackSourceIdentity.sourceVideoId(track)
            .trim()
            .takeIf(HOME_VIDEO_ID_PATTERN::matches)
        ?: return track
    return track.copy(
        thumbnailUrl = "https://i.ytimg.com/vi/$videoId/hqdefault.jpg",
        largeThumbnailUrl = "https://i.ytimg.com/vi/$videoId/maxresdefault.jpg"
    )
}

'''
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one music-video helper anchor, found {text.count(anchor)}')
          if 'private fun homeMusicVideoPreviewTrack' in text:
              raise SystemExit('Video preview helper already exists unexpectedly')
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git fetch origin main --depth=1
          git show origin/main:.github/workflows/workflow-duplicates-guard.yml > .github/workflows/workflow-duplicates-guard.yml
          rm -f .github/workflows/fix-home-video-shelf.yml
          git diff --check
      - name: Commit clean fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): show concise video shelf with previews"
          git push origin HEAD:refactor/home-experience
