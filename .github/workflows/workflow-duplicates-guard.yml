name: Workflow Duplicates Guard

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  workflow-duplicates-guard:
    name: Detect duplicated workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan workflows
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          workflows_dir = Path(".github/workflows")
          allowed_build_workflows = {
              "pr-check.yml",
              "nightly-extractor-check.yml",
              "apk-artifact-check.yml",
              "release-apk.yml",
              "quick-apk.yml"
          }
          desktop_release_workflows = {"desktop-windows.yml"}
          self_workflow = "workflow-duplicates-guard.yml"

          if not workflows_dir.exists():
              print("No .github/workflows directory found.")
              sys.exit(0)

          files = sorted([
              path for path in workflows_dir.iterdir()
              if path.is_file()
              and path.suffix.lower() in {".yml", ".yaml"}
              and path.name != self_workflow
          ])

          name_map = {}
          android_release_publishers = []
          desktop_release_publishers = []
          release_builders = []
          apk_uploaders = []
          duplicate_candidates = []
          failures = []

          def read(path: Path) -> str:
              return path.read_text(encoding="utf-8", errors="replace")

          def workflow_name(text: str, fallback: str) -> str:
              match = re.search(r"(?m)^name:\s*[\"']?(.+?)[\"']?\s*$", text)
              return match.group(1).strip() if match else fallback

          def has_release_build(text: str) -> bool:
              return "assembleRelease" in text or ":app:assembleRelease" in text

          def has_apk_upload(text: str) -> bool:
              return "upload-artifact" in text and (".apk" in text or "apk" in text.lower())

          def has_release_publish(text: str) -> bool:
              markers = [
                  "softprops/action-gh-release",
                  "gh release",
                  "upload-release-asset",
                  "create-release",
                  "releases/upload"
              ]
              lowered = text.lower()
              return any(marker.lower() in lowered for marker in markers)

          def normalized_signature(text: str) -> str:
              cleaned = []
              for line in text.splitlines():
                  stripped = line.strip()
                  if not stripped:
                      continue
                  if stripped.startswith("name:"):
                      continue
                  if stripped.startswith("#"):
                      continue
                  if "run:" in stripped:
                      cleaned.append(stripped)
                  elif "uses:" in stripped:
                      cleaned.append(stripped)
                  elif "assembleRelease" in stripped:
                      cleaned.append(stripped)
                  elif "upload-artifact" in stripped:
                      cleaned.append(stripped)
                  elif "softprops/action-gh-release" in stripped:
                      cleaned.append(stripped)
                  elif "gh release" in stripped:
                      cleaned.append(stripped)
              return "\n".join(cleaned)

          signatures = {}

          for path in files:
              text = read(path)
              name = workflow_name(text, path.name)
              lower_name = name.lower()

              name_map.setdefault(lower_name, []).append(path.name)

              if path.name != "release-guard.yml" and has_release_build(text):
                  release_builders.append(path.name)

              if has_apk_upload(text):
                  apk_uploaders.append(path.name)

              if has_release_publish(text):
                  if path.name in desktop_release_workflows:
                      desktop_release_publishers.append(path.name)
                  else:
                      android_release_publishers.append(path.name)

              signature = normalized_signature(text)
              if signature:
                  signatures.setdefault(signature, []).append(path.name)

          for name, paths in name_map.items():
              if len(paths) > 1:
                  failures.append("Duplicated workflow name: " + ", ".join(paths))

          for signature, paths in signatures.items():
              if len(paths) > 1:
                  duplicate_candidates.append(paths)

          for paths in duplicate_candidates:
              failures.append("Very similar workflow bodies: " + ", ".join(paths))

          unexpected_release_builders = [
              item for item in release_builders
              if item not in allowed_build_workflows
          ]

          if unexpected_release_builders:
              failures.append(
                  "Unexpected release build workflow detected: "
                  + ", ".join(unexpected_release_builders)
                  + ". Keep release APK generation in release-apk.yml or apk-artifact-check.yml."
              )

          if len(android_release_publishers) > 1:
              failures.append(
                  "Multiple workflows appear to publish Android GitHub releases: "
                  + ", ".join(android_release_publishers)
              )

          if len(desktop_release_publishers) > 1:
              failures.append(
                  "Multiple workflows appear to publish Desktop GitHub releases: "
                  + ", ".join(desktop_release_publishers)
              )

          suspicious_pairs = [
              {"android-apk.yml", "release-apk.yml"},
              {"android-apk.yaml", "release-apk.yml"},
              {"android-apk.yml", "release-apk.yaml"},
              {"build-apk.yml", "release-apk.yml"},
              {"build-release.yml", "release-apk.yml"}
          ]

          existing = {path.name for path in files}

          for pair in suspicious_pairs:
              if pair.issubset(existing):
                  failures.append(
                      "Suspicious duplicated APK workflow pair: "
                      + ", ".join(sorted(pair))
                  )

          if failures:
              print("Workflow duplicate problems found:")
              for failure in failures:
                  print("- " + failure)
              sys.exit(1)

          print("No duplicated workflow problems found.")
          print("Release builders: " + (", ".join(release_builders) if release_builders else "none"))
          print("APK uploaders: " + (", ".join(apk_uploaders) if apk_uploaders else "none"))
          print("Android release publishers: " + (", ".join(android_release_publishers) if android_release_publishers else "none"))
          print("Desktop release publishers: " + (", ".join(desktop_release_publishers) if desktop_release_publishers else "none"))
          PY

  apply-final-review-fixes:
    name: Apply verified final review fixes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/central-ytm-editorial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/central-ytm-editorial
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Apply source and regression fixes
        run: python tools/apply_final_review_fixes.py

      - name: Verify editorial collector
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e "tools/levyra-editorial[dev]"
          python -m compileall -q tools/levyra-editorial/levyra_editorial
          ruff check tools/levyra-editorial
          pytest tools/levyra-editorial/tests

      - name: Verify Android regressions, lint, and compile
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            --tests com.luc4n3x.levyra.domain.LevyraPersonalOrbitIdentityTest \
            --tests com.luc4n3x.levyra.data.EditorialCatalogParserTest \
            --tests com.luc4n3x.levyra.player.LevyraPlayerTest \
            :app:lintDebug \
            :app:compileDebugKotlin

      - name: Verify strict mapping contract
        run: |
          set -euo pipefail
          grep -q 'def combine_verified_youtube_mapping' tools/levyra-editorial/levyra_editorial/youtube_music.py
          grep -q 'if audio_result is not None:' tools/levyra-editorial/levyra_editorial/youtube_music.py
          grep -q 'val youtubePlaybackId = youtubeAudioVideoId' app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt
          grep -q 'MIN_OFFICIAL_VIDEO_CONFIDENCE = 90' app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt
          ! git diff -- app/src/main tools/levyra-editorial | grep -E 'LEVYRA_EDITORIAL_YTM_COOKIE|SAPISID|__Secure-' >/dev/null

      - name: Commit verified fixes and restore workflows
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/workflow-duplicates-guard.yml
          git rm \
            .github/workflows/apply-final-review-fixes.yml \
            tools/final-review-trigger.txt \
            tools/apply_final_review_fixes.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/workflow-duplicates-guard.yml \
            app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/domain/LevyraPersonalOrbit.kt \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/test/java/com/luc4n3x/levyra/data/EditorialCatalogParserTest.kt \
            app/src/test/java/com/luc4n3x/levyra/domain/LevyraPersonalOrbitIdentityTest.kt \
            tools/levyra-editorial/levyra_editorial/youtube_music.py \
            tools/levyra-editorial/tests/test_youtube_music.py
          git commit -m "fix(editorial): require verified audio-backed video mapping"
          git push origin HEAD:feat/central-ytm-editorial
