name: Apply home resume and orbit fix

on:
  push:
    branches:
      - fix/home-resume-orbit-live
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/home-resume-orbit-live

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          app_path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          screen_vm_path = Path('app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraScreenViewModels.kt')
          test_path = Path('app/src/test/java/com/luc4n3x/levyra/viewmodel/HomeRenderSnapshotTest.kt')

          app = app_path.read_text()
          start_marker = '@Composable\nprivate fun ContinueListeningCard('
          end_marker = '\n@Composable\nprivate fun HomeShortcutRow('
          if app.count(start_marker) != 1:
              raise SystemExit(f'Expected one ContinueListeningCard, found {app.count(start_marker)}')
          start = app.index(start_marker)
          end = app.index(end_marker, start)
          new_card = '''@Composable
          private fun ContinueListeningCard(
              track: Track,
              progress: Float,
              onResume: () -> Unit
          ) {
              val accentStart = if (track.accentStart == 0) LevyraCyan else Color(track.accentStart)
              val accentEnd = if (track.accentEnd == 0) LevyraViolet else Color(track.accentEnd)
              val safeProgress = progress.coerceIn(0f, 1f)
              val outerShape = RoundedCornerShape(22.dp)
              val innerShape = RoundedCornerShape(21.dp)
              val cardBase = if (LevyraIsLight) {
                  Color.White.copy(alpha = 0.92f)
              } else {
                  CinematicGlassDeep.copy(alpha = 0.94f)
              }
              val progressTrack = if (LevyraIsLight) {
                  Color(0x22101322)
              } else {
                  Color.White.copy(alpha = 0.12f)
              }

              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .heightIn(min = 84.dp)
                      .clip(outerShape)
                      .background(
                          Brush.linearGradient(
                              listOf(
                                  accentStart.copy(alpha = if (LevyraIsLight) 0.32f else 0.46f),
                                  LevyraAdaptiveHairline,
                                  accentEnd.copy(alpha = if (LevyraIsLight) 0.24f else 0.36f)
                              )
                          )
                      )
                      .padding(1.dp)
                      .clip(innerShape)
                      .background(cardBase)
                      .pressable(onClick = onResume)
              ) {
                  Box(
                      modifier = Modifier
                          .size(126.dp)
                          .align(Alignment.CenterStart)
                          .offset(x = (-34).dp)
                          .background(
                              Brush.radialGradient(
                                  listOf(
                                      accentStart.copy(alpha = if (LevyraIsLight) 0.13f else 0.22f),
                                      Color.Transparent
                                  )
                              )
                          )
                  )
                  Box(
                      modifier = Modifier
                          .size(112.dp)
                          .align(Alignment.CenterEnd)
                          .offset(x = 40.dp)
                          .background(
                              Brush.radialGradient(
                                  listOf(
                                      accentEnd.copy(alpha = if (LevyraIsLight) 0.10f else 0.18f),
                                      Color.Transparent
                                  )
                              )
                          )
                  )
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 11.dp, vertical = 10.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(11.dp)
                  ) {
                      CoverImage(
                          track = track,
                          modifier = Modifier
                              .size(56.dp)
                              .clip(RoundedCornerShape(15.dp))
                              .border(
                                  1.dp,
                                  Color.White.copy(alpha = if (LevyraIsLight) 0.42f else 0.16f),
                                  RoundedCornerShape(15.dp)
                              ),
                          highRes = false
                      )
                      Column(
                          modifier = Modifier.weight(1f),
                          verticalArrangement = Arrangement.spacedBy(2.dp)
                      ) {
                          Surface(
                              color = accentStart.copy(alpha = if (LevyraIsLight) 0.10f else 0.16f),
                              shape = RoundedCornerShape(999.dp),
                              border = BorderStroke(
                                  Dp.Hairline,
                                  accentStart.copy(alpha = if (LevyraIsLight) 0.22f else 0.30f)
                              )
                          ) {
                              Row(
                                  modifier = Modifier.padding(horizontal = 7.dp, vertical = 3.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(5.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Rounded.Headphones,
                                      contentDescription = null,
                                      tint = accentStart,
                                      modifier = Modifier.size(12.dp)
                                  )
                                  Text(
                                      text = LocalLevyraStrings.current.continueListening,
                                      color = if (LevyraIsLight) LevyraText else Color.White.copy(alpha = 0.90f),
                                      fontSize = 9.5.sp,
                                      lineHeight = 10.5.sp,
                                      fontWeight = FontWeight.ExtraBold,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                          }
                          Text(
                              text = track.title,
                              color = LevyraText,
                              fontSize = 15.5.sp,
                              lineHeight = 18.sp,
                              fontWeight = FontWeight.Black,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          Text(
                              text = track.artist,
                              color = LevyraMuted,
                              fontSize = 11.3.sp,
                              lineHeight = 13.sp,
                              fontWeight = FontWeight.SemiBold,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      Box(
                          modifier = Modifier.size(48.dp),
                          contentAlignment = Alignment.Center
                      ) {
                          Canvas(modifier = Modifier.matchParentSize()) {
                              val strokeWidth = 2.dp.toPx()
                              val radius = (size.minDimension - strokeWidth) / 2f
                              drawCircle(
                                  color = progressTrack,
                                  radius = radius,
                                  style = Stroke(width = strokeWidth)
                              )
                              if (safeProgress > 0f) {
                                  drawArc(
                                      color = accentStart,
                                      startAngle = -90f,
                                      sweepAngle = safeProgress * 360f,
                                      useCenter = false,
                                      style = Stroke(width = strokeWidth, cap = StrokeCap.Round)
                                  )
                              }
                          }
                          Surface(
                              color = if (LevyraIsLight) {
                                  Color.White.copy(alpha = 0.92f)
                              } else {
                                  Color.White.copy(alpha = 0.09f)
                              },
                              shape = CircleShape,
                              border = BorderStroke(Dp.Hairline, LevyraAdaptiveHairline),
                              modifier = Modifier.size(38.dp)
                          ) {
                              Box(contentAlignment = Alignment.Center) {
                                  Icon(
                                      imageVector = Icons.Rounded.PlayArrow,
                                      contentDescription = null,
                                      tint = LevyraText,
                                      modifier = Modifier.size(22.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }
          '''
          new_card = textwrap.dedent(new_card).rstrip()
          app = app[:start] + new_card + app[end:]

          old_history_gate = '''                    canRemoveFromHistory = remember(state.recentSearches, target.id) {
                              val identity = LevyraPersonalOrbit.identityKey(target)
                              state.recentSearches.any {
                                  it.id == target.id || LevyraPersonalOrbit.identityKey(it) == identity
                              }
                          },'''
          old_history_gate = textwrap.dedent(old_history_gate).rstrip()
          new_history_gate = '''                    canRemoveFromHistory = remember(
                              state.recentSearches,
                              state.personalOrbitTracks,
                              target.id
                          ) {
                              val identity = LevyraPersonalOrbit.identityKey(target)
                              val matchesTarget: (Track) -> Boolean = { candidate ->
                                  candidate.id == target.id || LevyraPersonalOrbit.identityKey(candidate) == identity
                              }
                              state.recentSearches.any(matchesTarget) || state.personalOrbitTracks.any(matchesTarget)
                          },'''
          new_history_gate = textwrap.dedent(new_history_gate).rstrip()
          if app.count(old_history_gate) != 1:
              raise SystemExit(f'Expected one history removal gate, found {app.count(old_history_gate)}')
          app = app.replace(old_history_gate, new_history_gate, 1)
          app_path.write_text(app)

          screen_vm = screen_vm_path.read_text()
          old_orbit_freeze = '        personalOrbitTracks = previous.personalOrbitTracks,\n'
          new_orbit_freeze = '        personalOrbitTracks = personalOrbitTracks,\n'
          if screen_vm.count(old_orbit_freeze) != 1:
              raise SystemExit(f'Expected one frozen personal orbit assignment, found {screen_vm.count(old_orbit_freeze)}')
          screen_vm = screen_vm.replace(old_orbit_freeze, new_orbit_freeze, 1)
          screen_vm_path.write_text(screen_vm)

          tests = test_path.read_text()
          test_anchor = '''    @Test
              fun publishesLatestStructuralHomeContentAfterScrollingSettles() {'''
          test_anchor = textwrap.dedent(test_anchor)
          if tests.count(test_anchor) != 1:
              raise SystemExit(f'Expected one HomeRenderSnapshot test anchor, found {tests.count(test_anchor)}')
          new_test = '''    @Test
              fun publishesPersonalOrbitRemovalImmediatelyWhileHomeStructureIsFrozen() {
                  val keptTrack = track("aaaaaaaaaaa")
                  val removedTrack = track("bbbbbbbbbbb")
                  val initialState = LevyraUiState(
                      tracks = listOf(keptTrack, removedTrack),
                      personalOrbitTracks = listOf(keptTrack, removedTrack),
                      homeSections = listOf(HomeSection("Initial", listOf(keptTrack, removedTrack)))
                  )
                  val previous = buildHomeRenderSnapshot(initialState)
                  val updatedState = initialState.copy(
                      tracks = listOf(removedTrack),
                      personalOrbitTracks = listOf(keptTrack),
                      homeSections = listOf(HomeSection("Refreshed", listOf(removedTrack)))
                  )
          
                  val frozen = buildStableHomeRenderSnapshot(updatedState, previous, freezeContent = true)
          
                  assertEquals(listOf(keptTrack), frozen.state.personalOrbitTracks)
                  assertSame(previous.state.tracks, frozen.state.tracks)
                  assertSame(previous.state.homeSections, frozen.state.homeSections)
              }
          
          '''
          new_test = textwrap.dedent(new_test)
          tests = tests.replace(test_anchor, new_test + test_anchor, 1)
          test_path.write_text(tests)
          PY

      - name: Validate patch formatting
        run: git diff --check

      - name: Run focused Home unit tests
        run: ./gradlew :app:testDebugUnitTest --tests com.luc4n3x.levyra.viewmodel.HomeRenderSnapshotTest --no-daemon

      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-home-resume-orbit-fix.yml
          git add \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraScreenViewModels.kt \
            app/src/test/java/com/luc4n3x/levyra/viewmodel/HomeRenderSnapshotTest.kt
          git diff --cached --check
          git commit -m "fix(home): polish resume card and update orbit instantly"
          git push origin HEAD:fix/home-resume-orbit-live
