name: PR504 Code Review Fix

on:
  push:
    branches:
      - feat/amazon-inspired-explore-cards

permissions:
  contents: write

jobs:
  review-fix:
    if: ${{ github.actor == 'LUC4N3X' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      LEVYRA_KEYSTORE_FILE: app/levyra-ci-release.jks
      LEVYRA_KEYSTORE_PASSWORD: levyra_ci_password
      LEVYRA_KEY_ALIAS: levyra_ci
      LEVYRA_KEY_PASSWORD: levyra_ci_password
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/amazon-inspired-explore-cards
          fetch-depth: 0

      - name: Apply code review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')

          old_open = '''                        onOpen = {
                            stableSpotlightId = heroTrack.id
                            viewModel.playFrom(spotlightTracks, heroTrack)
                        }
'''
          new_open = '''                        onOpen = {
                            stableSpotlightId = heroTrack.id
                            when {
                                heroTrack.id != state.currentTrack?.id ->
                                    viewModel.playFrom(spotlightTracks, heroTrack)
                                state.isResolving -> Unit
                                else -> viewModel.togglePlay()
                            }
                        }
'''
          if old_open not in text:
              raise SystemExit('Home spotlight onOpen block not found')
          text = text.replace(old_open, new_open, 1)

          # Old release-oriented helpers are no longer used by the soundtrack hero.
          text, count = re.subn(
              r'private fun homeSpotlightBadge\(.*?\n(?=private fun homeSoundtrackPrimaryArtist\()',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected to remove old spotlight helpers once, removed {count}')

          # This helper became dead code after the artist pool was resolved directly in HomeScreen.
          text, count = re.subn(
              r'private fun homeSoundtrackArtistArtwork\(.*?\n}\n\n(?=private fun homeSoundtrackTitle\()',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected to remove unused artist artwork helper once, removed {count}')

          signature_old = '''    isResolving: Boolean,
    animationsEnabled: Boolean,
    onPaletteChanged: (Color, Color) -> Unit,
'''
          signature_new = '''    isResolving: Boolean,
    onPaletteChanged: (Color, Color) -> Unit,
'''
          if signature_old not in text:
              raise SystemExit('HomeEditorialSpotlight animation parameter not found')
          text = text.replace(signature_old, signature_new, 1)

          call_old = '''                        isResolving = state.isResolving && heroTrack.id == state.currentTrack?.id,
                        animationsEnabled = state.animationsEnabled,
                        onPaletteChanged = { start, end ->
'''
          call_new = '''                        isResolving = state.isResolving && heroTrack.id == state.currentTrack?.id,
                        onPaletteChanged = { start, end ->
'''
          if call_old not in text:
              raise SystemExit('HomeEditorialSpotlight call animation argument not found')
          text = text.replace(call_old, call_new, 1)

          unused_animation = '''    val effectiveAnimationsEnabled = animationsEnabled && LocalAnimationsEnabled.current
'''
          hero_start = text.index('private fun HomeEditorialSpotlight(')
          hero_end = text.index('\nprivate fun homeCollectionTitle(', hero_start)
          hero = text[hero_start:hero_end]
          if unused_animation not in hero:
              raise SystemExit('Unused HomeEditorialSpotlight animation local not found')
          hero = hero.replace(unused_animation, '', 1)

          pause_old = '''                isCurrent && isPlaying -> Icon(
                    imageVector = Icons.Rounded.Pause,
                    contentDescription = strings.playing,
'''
          pause_new = '''                isCurrent && isPlaying -> Icon(
                    imageVector = Icons.Rounded.Pause,
                    contentDescription = strings.pause,
'''
          if pause_old not in hero:
              raise SystemExit('Home hero pause semantics block not found')
          hero = hero.replace(pause_old, pause_new, 1)
          text = text[:hero_start] + hero + text[hero_end:]

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Prepare CI release signing
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${LEVYRA_KEYSTORE_FILE}"
          keytool -genkeypair \
            -keystore "${LEVYRA_KEYSTORE_FILE}" \
            -storepass "${LEVYRA_KEYSTORE_PASSWORD}" \
            -alias "${LEVYRA_KEY_ALIAS}" \
            -keypass "${LEVYRA_KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LEVYRA CI,O=LUC4N3X,C=IT" \
            >/dev/null

      - name: Run focused regression tests
        shell: bash
        run: |
          ./gradlew --no-daemon :app:testReleaseUnitTest \
            --tests com.luc4n3x.levyra.domain.LevyraVideoArtworkFallbackTest \
            --tests com.luc4n3x.levyra.feature.motion.CanonicalTrackMatcherTest \
            --tests com.luc4n3x.levyra.feature.motion.MotionArtworkIdentityParityTest

      - name: Verify release lint
        shell: bash
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr504-code-review-fix.yml
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --cached --check
          git commit -m "fix(home): align soundtrack hero playback behavior"
          git push origin HEAD:feat/amazon-inspired-explore-cards
