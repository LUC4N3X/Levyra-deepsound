name: PR424 Desktop Playback Parity Patch

on:
  push:
    branches:
      - feature/desktop-audio-and-local-library
    paths:
      - .github/workflows/patch-pr424-desktop-playback.yml
      - .github/scripts/patch_pr424_desktop_playback.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/desktop-audio-and-local-library
          fetch-depth: 0

      - name: Apply playback parity patch
        run: python3 .github/scripts/patch_pr424_desktop_playback.py

      - name: Validate focused diff
        run: |
          git diff --check
          git diff -- \
            desktop/player/src/main/kotlin/com/luc4n3x/levyra/desktop/player/VlcAudioPlayer.kt \
            desktop/core/src/main/kotlin/com/luc4n3x/levyra/desktop/core/stream/YoutubeStreamResolver.kt

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            desktop/player/src/main/kotlin/com/luc4n3x/levyra/desktop/player/VlcAudioPlayer.kt \
            desktop/core/src/main/kotlin/com/luc4n3x/levyra/desktop/core/stream/YoutubeStreamResolver.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix(desktop): match Android YouTube playback identity"
          git push origin HEAD:feature/desktop-audio-and-local-library
