name: Finalize Home Density

on:
  push:
    branches:
      - chatgpt/home-visual-hierarchy
    paths:
      - ".github/workflows/_refine-home-density-v5.yml"

permissions:
  contents: write

concurrency:
  group: finalize-home-density
  cancel-in-progress: false

jobs:
  finalize:
    name: Validate and publish Home polish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_FILE: app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chatgpt/home-visual-hierarchy
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-disabled: true

      - name: Apply verified Home transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/_refine-home-density-v4.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          embedded = workflow[start:end]
          lines = []
          for line in embedded.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          code = '\n'.join(lines)
          exec(compile(code, '_refine-home-density-v4.yml', 'exec'), {})
          PY

          rm -f \
            .github/workflows/_refine-home-density.yml \
            .github/workflows/_refine-home-density-v4.yml \
            .github/workflows/_refine-home-density-v5.yml
          git diff --check
          if git diff -- "$TARGET_FILE" | grep -E '^[-+].*(home-personal|PersonalListeningShelf|visiblePersonalTracks)'; then
            echo "Personal Orbit appeared in the diff"
            exit 1
          fi

      - name: Fast AI quality gate
        shell: bash
        run: python3 scripts/ai_quality_gate.py --profile fast --base-ref origin/main

      - name: Full AI quality gate
        shell: bash
        run: python3 scripts/ai_quality_gate.py --profile full --base-ref origin/main

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            "$TARGET_FILE" \
            .github/workflows/_refine-home-density.yml \
            .github/workflows/_refine-home-density-v4.yml \
            .github/workflows/_refine-home-density-v5.yml
          git diff --cached --check
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git commit -m "Refine Home density and rhythm"
          git push origin HEAD:refs/heads/chatgpt/home-visual-hierarchy
