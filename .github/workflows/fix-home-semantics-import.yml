name: Fix Home semantics import

on:
  push:
    branches:
      - refactor/home-experience
    paths:
      - .github/workflows/fix-home-semantics-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Add missing Compose semantics import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text(encoding='utf-8')
          required = 'import androidx.compose.ui.semantics.contentDescription\n'
          anchor = 'import androidx.compose.ui.semantics.ProgressBarRangeInfo\n'

          if required not in text:
              if anchor not in text:
                  raise SystemExit('Semantics import anchor not found')
              text = text.replace(anchor, required + anchor, 1)

          if '.semantics { this.contentDescription = contentDescription }' not in text:
              raise SystemExit('Expected header semantics assignment not found')

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-home-semantics-import.yml
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): import semantics content description"
          git push origin HEAD:refactor/home-experience
