name: One-shot isolate player surfaces

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/player-experience-motion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/player-experience-motion
          fetch-depth: 0

      - name: Isolate the new player experience
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          def sub_once(source: str, pattern: str, replacement, label: str, flags: int = 0) -> str:
              updated, count = re.subn(pattern, replacement, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return updated

          app_path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          app = app_path.read_text(encoding='utf-8')

          app = replace_once(
              app,
              'fun LevyraApp(viewModel: LevyraViewModel, isInPictureInPicture: Boolean = false) {',
              'fun LevyraApp(\n'
              '    viewModel: LevyraViewModel,\n'
              '    isInPictureInPicture: Boolean = false,\n'
              '    suppressLegacyPlayerSurfaces: Boolean = false\n'
              ') {',
              'LevyraApp signature'
          )

          player_pattern = (
              r'(?ms)^(?P<indent>[ \t]*)LevyraTab\.Player -> \{\n'
              r'(?P=indent)[ \t]+val playerViewModel: PlayerViewModel = composeViewModel\(key = "levyra-player", factory = screenViewModelFactory\)\n'
              r'(?P=indent)[ \t]+val screenState by playerViewModel\.state\.collectAsStateWithLifecycle\(\)\n'
              r'(?P=indent)[ \t]+PlayerScreen\(\n'
              r'(?P<arguments>.*?)'
              r'(?P=indent)[ \t]+\)\n'
              r'(?P=indent)\}'
          )

          def isolate_player(match: re.Match) -> str:
              indent = match.group('indent')
              arguments = match.group('arguments')
              return (
                  f'{indent}LevyraTab.Player -> {{\n'
                  f'{indent}    if (!suppressLegacyPlayerSurfaces) {{\n'
                  f'{indent}        val playerViewModel: PlayerViewModel = composeViewModel(key = "levyra-player", factory = screenViewModelFactory)\n'
                  f'{indent}        val screenState by playerViewModel.state.collectAsStateWithLifecycle()\n'
                  f'{indent}        PlayerScreen(\n'
                  + ''.join(f'{indent}    {line}\n' if line else '\n' for line in arguments.rstrip('\n').split('\n'))
                  + f'{indent}        )\n'
                  f'{indent}    }}\n'
                  f'{indent}}}'
              )

          app = sub_once(app, player_pattern, isolate_player, 'legacy full player branch')
          app = replace_once(
              app,
              'visible = state.selectedTab != LevyraTab.Player && state.currentTrack != null,',
              'visible = !suppressLegacyPlayerSurfaces && state.selectedTab != LevyraTab.Player && state.currentTrack != null,',
              'legacy mini-player visibility'
          )
          app_path.write_text(app, encoding='utf-8')

          host_path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraExperienceHost.kt')
          host = host_path.read_text(encoding='utf-8')

          host = replace_once(
              host,
              '    val state by viewModel.state.collectAsStateWithLifecycle()\n'
              '    var lastContentTabName by rememberSaveable { mutableStateOf(LevyraTab.Home.name) }',
              '    val state by viewModel.state.collectAsStateWithLifecycle()\n'
              '    var playerExpanded by rememberSaveable { mutableStateOf(state.selectedTab == LevyraTab.Player) }\n'
              '    var lastContentTabName by rememberSaveable { mutableStateOf(LevyraTab.Home.name) }',
              'player expanded state'
          )

          host = replace_once(
              host,
              '    LaunchedEffect(state.selectedTab) {\n'
              '        if (state.selectedTab != LevyraTab.Player) {\n'
              '            lastContentTabName = state.selectedTab.name\n'
              '        }\n'
              '    }',
              '    LaunchedEffect(state.selectedTab) {\n'
              '        if (state.selectedTab == LevyraTab.Player) {\n'
              '            playerExpanded = true\n'
              '        } else {\n'
              '            lastContentTabName = state.selectedTab.name\n'
              '        }\n'
              '    }',
              'selected tab synchronization'
          )

          host = replace_once(
              host,
              '    val returnTab = remember(lastContentTabName) {\n'
              '        LevyraTab.entries.firstOrNull { it.name == lastContentTabName && it != LevyraTab.Player }\n'
              '            ?: LevyraTab.Home\n'
              '    }\n\n'
              '    Box(modifier = Modifier.fillMaxSize()) {',
              '    val returnTab = remember(lastContentTabName) {\n'
              '        LevyraTab.entries.firstOrNull { it.name == lastContentTabName && it != LevyraTab.Player }\n'
              '            ?: LevyraTab.Home\n'
              '    }\n\n'
              '    LaunchedEffect(state.selectedTab, returnTab) {\n'
              '        if (state.selectedTab == LevyraTab.Player) {\n'
              '            viewModel.selectTab(returnTab)\n'
              '        }\n'
              '    }\n'
              '    LaunchedEffect(state.currentTrack?.id) {\n'
              '        if (state.currentTrack == null) playerExpanded = false\n'
              '    }\n\n'
              '    Box(modifier = Modifier.fillMaxSize()) {',
              'external player tab bridge'
          )

          host = replace_once(
              host,
              '        LevyraApp(\n'
              '            viewModel = viewModel,\n'
              '            isInPictureInPicture = isInPictureInPicture\n'
              '        )',
              '        LevyraApp(\n'
              '            viewModel = viewModel,\n'
              '            isInPictureInPicture = isInPictureInPicture,\n'
              '            suppressLegacyPlayerSurfaces = true\n'
              '        )',
              'legacy surface suppression argument'
          )

          host = replace_once(
              host,
              '                        LevyraMotionPlayerSheet(\n'
              '                            state = state,\n'
              '                            track = track,\n'
              '                            expanded = state.selectedTab == LevyraTab.Player,\n'
              '                            returnTab = returnTab,\n'
              '                            viewModel = viewModel\n'
              '                        )',
              '                        LevyraMotionPlayerSheet(\n'
              '                            state = state,\n'
              '                            track = track,\n'
              '                            expanded = playerExpanded,\n'
              '                            onExpandedChange = { playerExpanded = it },\n'
              '                            viewModel = viewModel\n'
              '                        )',
              'motion player call'
          )

          host = replace_once(
              host,
              'private fun LevyraMotionPlayerSheet(\n'
              '    state: LevyraUiState,\n'
              '    track: Track,\n'
              '    expanded: Boolean,\n'
              '    returnTab: LevyraTab,\n'
              '    viewModel: LevyraViewModel\n'
              ') {',
              'private fun LevyraMotionPlayerSheet(\n'
              '    state: LevyraUiState,\n'
              '    track: Track,\n'
              '    expanded: Boolean,\n'
              '    onExpandedChange: (Boolean) -> Unit,\n'
              '    viewModel: LevyraViewModel\n'
              ') {',
              'motion player signature'
          )

          host = replace_once(
              host,
              '    BackHandler(enabled = expanded) {\n'
              '        viewModel.selectTab(returnTab)\n'
              '    }',
              '    BackHandler(enabled = expanded) {\n'
              '        onExpandedChange(false)\n'
              '    }',
              'player back handler'
          )
          host = replace_once(
              host,
              'onOpen = { viewModel.selectTab(LevyraTab.Player) },',
              'onOpen = { onExpandedChange(true) },',
              'mini-player open action'
          )
          host = replace_once(
              host,
              'onCollapse = { viewModel.selectTab(returnTab) },',
              'onCollapse = { onExpandedChange(false) },',
              'expanded player collapse action'
          )
          host = replace_once(
              host,
              '            }\n'
              '            .clickable(onClick = onOpen)\n'
              '    ) {',
              '            }\n'
              '    ) {',
              'parent mini-player click target'
          )
          host = replace_once(
              host,
              '                primary = primary,\n'
              '                modifier = Modifier.size(70.dp)\n'
              '            )\n'
              '            Column(\n'
              '                modifier = Modifier.weight(1f),\n'
              '                verticalArrangement = Arrangement.Center\n'
              '            ) {\n'
              '                AnimatedContent(',
              '                primary = primary,\n'
              '                modifier = Modifier\n'
              '                    .size(70.dp)\n'
              '                    .clickable(onClick = onOpen)\n'
              '            )\n'
              '            Column(\n'
              '                modifier = Modifier\n'
              '                    .weight(1f)\n'
              '                    .clickable(onClick = onOpen),\n'
              '                verticalArrangement = Arrangement.Center\n'
              '            ) {\n'
              '                AnimatedContent(',
              'independent mini-player click targets'
          )

          host_path.write_text(host, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/one-shot-isolate-player-surfaces.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt app/src/main/java/com/luc4n3x/levyra/ui/LevyraExperienceHost.kt .github/workflows/one-shot-isolate-player-surfaces.yml
          git commit -m "fix(ui): isolate motion player from legacy surfaces"
          git push origin HEAD:feat/player-experience-motion
