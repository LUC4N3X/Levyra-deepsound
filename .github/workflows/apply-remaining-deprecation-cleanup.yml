name: Apply remaining deprecation cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, expected: int, label: str) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} occurrence(s), found {count}")
              return text.replace(old, new)

          security_path = Path("app/src/main/java/com/luc4n3x/levyra/data/YoutubePlaybackSecurity.kt")
          security = security_path.read_text(encoding="utf-8")
          security = replace_exact(
              security,
              """            override fun onFailure(call: Call, error: IOException) {\n                continuation.resumeResultIfActive(Result.failure(error))\n            }""",
              """            override fun onFailure(call: Call, e: IOException) {\n                continuation.resumeResultIfActive(Result.failure(e))\n            }""",
              1,
              "OkHttp Callback parameter"
          )
          security_path.write_text(security, encoding="utf-8")

          service_path = Path("app/src/main/java/com/luc4n3x/levyra/player/PlaybackService.kt")
          service = service_path.read_text(encoding="utf-8")
          service = replace_exact(
              service,
              ".setIconResId(",
              ".setCustomIconResId(",
              2,
              "Media3 custom command icons"
          )
          service_path.write_text(service, encoding="utf-8")
          PY

      - name: Commit cleanup and remove runner
        shell: bash
        run: |
          rm .github/workflows/apply-remaining-deprecation-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/luc4n3x/levyra/data/YoutubePlaybackSecurity.kt \
            app/src/main/java/com/luc4n3x/levyra/player/PlaybackService.kt \
            .github/workflows/apply-remaining-deprecation-cleanup.yml
          git commit -m "chore(android): remove remaining deprecated API usage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
