name: Apply home resume and orbit fix v2

on:
  push:
    branches:
      - fix/home-resume-orbit-live

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply patch
        run: python scripts/apply_home_resume_orbit_fix.py

      - name: Validate diff
        run: git diff --check

      - name: Run focused tests
        run: ./gradlew :app:testDebugUnitTest --tests com.luc4n3x.levyra.viewmodel.HomeRenderSnapshotTest --no-daemon

      - name: Commit final changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-home-resume-orbit-fix.yml \
            .github/workflows/apply-home-resume-orbit-fix-v2.yml \
            scripts/apply_home_resume_orbit_fix.py
          git add \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraScreenViewModels.kt \
            app/src/test/java/com/luc4n3x/levyra/viewmodel/HomeRenderSnapshotTest.kt
          git diff --cached --check
          git commit -m "fix(home): polish resume card and update orbit instantly"
          git push origin HEAD:fix/home-resume-orbit-live
