name: Apply product experience overhaul

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/product-experience-navigation-search-player' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Repair patch anchor for current imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_product_experience.py')
          text = path.read_text()
          old = '''    '''"'"'''import com.luc4n3x.levyra.domain.SearchFilter
          import com.luc4n3x.levyra.domain.SearchResults
          '''"'"''',
              '''"'"'''import com.luc4n3x.levyra.domain.SearchFilter
          import com.luc4n3x.levyra.domain.SearchResults
          import com.luc4n3x.levyra.domain.filterPlaylistsForSearch
          import com.luc4n3x.levyra.domain.isSearchVideo
          import com.luc4n3x.levyra.domain.searchFiltersFor
          '''"'"'''
          '''
          new = '''    '''"'"'''import com.luc4n3x.levyra.domain.SearchFilter
          '''"'"''',
              '''"'"'''import com.luc4n3x.levyra.domain.SearchFilter
          import com.luc4n3x.levyra.domain.filterPlaylistsForSearch
          import com.luc4n3x.levyra.domain.isSearchVideo
          import com.luc4n3x.levyra.domain.searchFiltersFor
          '''"'"'''
          '''
          if old not in text:
              raise SystemExit('patch-script import anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply product experience changes
        run: python3 .github/scripts/apply_product_experience.py

      - name: Validate focused product behavior
        run: ./gradlew :app:testDebugUnitTest --tests com.luc4n3x.levyra.domain.LevyraProductExperienceTest --no-daemon

      - name: Run required Android validation
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:compileReleaseKotlin --no-daemon

      - name: Commit validated changes and remove temporary tooling
        run: |
          rm .github/scripts/apply_product_experience.py
          rm .github/workflows/apply-product-experience.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/luc4n3x/levyra/domain/Models.kt \
                  app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraScreenViewModels.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
                  .github/scripts/apply_product_experience.py \
                  .github/workflows/apply-product-experience.yml
          git commit -m "feat: refine core music product experience"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
