name: Patch PR 424 UI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/patch_pr424_ui.py
      - .github/workflows/patch-pr424-ui.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/desktop-audio-and-local-library
          fetch-depth: 0
      - name: Apply scoped UI patch
        run: python3 .github/scripts/patch_pr424_ui.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryOverviewComponents.kt app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git commit -m "feat(android): add Replay dashboard and lyrics cards"
          git push origin HEAD:feature/desktop-audio-and-local-library
