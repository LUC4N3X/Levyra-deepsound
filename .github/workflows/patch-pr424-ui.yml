name: Patch PR 424 UI

on:
  push:
    branches:
      - feature/desktop-audio-and-local-library
    paths:
      - .github/workflows/patch-pr424-ui.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/desktop-audio-and-local-library
          fetch-depth: 0
      - name: Apply surgical UI edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryOverviewComponents.kt')
          text = dashboard.read_text(encoding='utf-8')
          replacement = r'''@Composable
internal fun LibraryListeningDashboard(
    pulse: ListeningPulse,
    artistCount: Int,
    trackCount: Int,
    playlistCount: Int,
    offlineCount: Int
) {
    val strings = LocalLevyraStrings.current
    val week = pulse.week.takeLast(7)
    val weekMinutes = week.sumOf { it.listenedMs } / 60_000L
    val locale = remember(strings.code) { Locale.forLanguageTag(strings.code) }

    Surface(
        modifier = Modifier.fillMaxWidth(),
        color = LevyraPanel.copy(alpha = 0.92f),
        border = BorderStroke(1.dp, Color.White.copy(alpha = 0.09f)),
        shape = RoundedCornerShape(26.dp)
    ) {
        Box(
            modifier = Modifier.fillMaxWidth().background(
                Brush.linearGradient(
                    listOf(
                        LevyraViolet.copy(alpha = 0.18f),
                        LevyraPanel.copy(alpha = 0.96f),
                        LevyraCyan.copy(alpha = 0.10f)
                    )
                )
            ).padding(18.dp)
        ) {
            Column(verticalArrangement = Arrangement.spacedBy(17.dp)) {
                Row(
                    modifier = Modifier.fillMaxWidth(),
                    verticalAlignment = Alignment.CenterVertically,
                    horizontalArrangement = Arrangement.spacedBy(12.dp)
                ) {
                    Surface(color = LevyraCyan.copy(alpha = 0.14f), shape = CircleShape) {
                        Icon(
                            imageVector = Icons.Rounded.Replay,
                            contentDescription = null,
                            tint = LevyraCyan,
                            modifier = Modifier.padding(9.dp).size(18.dp)
                        )
                    }
                    Column(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(1.dp)) {
                        Text(
                            text = strings.formatLibraryDuration(pulse.totalListenMs),
                            color = LevyraText,
                            fontSize = 24.sp,
                            fontWeight = FontWeight.Black,
                            letterSpacing = (-0.5).sp,
                            maxLines = 1,
                            overflow = TextOverflow.Ellipsis
                        )
                        Text(strings.pulseMinutes, color = LevyraMuted, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                    }
                }

                Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        LibraryInsightMetric(Modifier.weight(1f), Icons.Rounded.PlayArrow, pulse.plays.toString(), strings.pulsePlays, LevyraCyan)
                        LibraryInsightMetric(Modifier.weight(1f), Icons.Rounded.Replay, pulse.streakDays.toString(), strings.pulseStreak, LevyraViolet)
                    }
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        LibraryInsightMetric(Modifier.weight(1f), Icons.Rounded.DoneAll, "${pulse.completionRate}%", strings.pulseCompletion, LevyraPink)
                        LibraryInsightMetric(Modifier.weight(1f), Icons.Rounded.MusicNote, pulse.distinctTracks.toString(), strings.statTracks, Color(0xFFFFC857))
                    }
                }

                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                    ReplayPeriodMetric(
                        modifier = Modifier.weight(1f),
                        periodLabel = "30D",
                        minutes = pulse.last30Days.totalMinutes,
                        plays = pulse.last30Days.plays,
                        minuteLabel = strings.pulseMinuteShort,
                        playLabel = strings.pulsePlays,
                        accent = LevyraCyan
                    )
                    ReplayPeriodMetric(
                        modifier = Modifier.weight(1f),
                        periodLabel = "365D",
                        minutes = pulse.last365Days.totalMinutes,
                        plays = pulse.last365Days.plays,
                        minuteLabel = strings.pulseMinuteShort,
                        playLabel = strings.pulsePlays,
                        accent = LevyraViolet
                    )
                }

                if (pulse.topTracks.isNotEmpty()) {
                    Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                        Text(strings.songsPlain, color = LevyraMuted, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                        pulse.topTracks.take(3).forEachIndexed { index, track ->
                            Row(
                                modifier = Modifier.fillMaxWidth(),
                                verticalAlignment = Alignment.CenterVertically,
                                horizontalArrangement = Arrangement.spacedBy(10.dp)
                            ) {
                                Text(
                                    text = (index + 1).toString().padStart(2, '0'),
                                    color = LevyraCyan,
                                    fontSize = 11.sp,
                                    fontWeight = FontWeight.Black
                                )
                                Column(modifier = Modifier.weight(1f)) {
                                    Text(track.title, color = LevyraText, fontSize = 12.sp, fontWeight = FontWeight.Black, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                    Text(track.artist, color = LevyraMuted, fontSize = 10.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                }
                                Text("${track.plays}×", color = LevyraMuted, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                            }
                        }
                    }
                }

                Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.SpaceBetween
                    ) {
                        Text(strings.pulseWeek, color = LevyraText, fontSize = 13.sp, fontWeight = FontWeight.Black)
                        Text("$weekMinutes ${strings.pulseMinuteShort}", color = LevyraCyan, fontSize = 12.sp, fontWeight = FontWeight.Black)
                    }
                    LibraryWeekChart(pulse = pulse, locale = locale)
                }

                if (pulse.topArtists.isNotEmpty() || pulse.peakHour >= 0) {
                    Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                        if (pulse.topArtists.isNotEmpty()) {
                            Text(strings.pulseTopArtists, color = LevyraMuted, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                            Row(
                                modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                horizontalArrangement = Arrangement.spacedBy(7.dp)
                            ) {
                                pulse.topArtists.take(4).forEach { artist ->
                                    Surface(
                                        color = LevyraViolet.copy(alpha = 0.12f),
                                        border = BorderStroke(1.dp, LevyraViolet.copy(alpha = 0.20f)),
                                        shape = RoundedCornerShape(999.dp)
                                    ) {
                                        Text(
                                            text = artist.name,
                                            color = LevyraText,
                                            fontSize = 11.sp,
                                            fontWeight = FontWeight.Bold,
                                            maxLines = 1,
                                            modifier = Modifier.padding(horizontal = 11.dp, vertical = 7.dp)
                                        )
                                    }
                                }
                            }
                        }
                        if (pulse.peakHour >= 0) {
                            Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                                Icon(Icons.Rounded.Schedule, contentDescription = null, tint = LevyraMuted, modifier = Modifier.size(15.dp))
                                Text(
                                    text = "${strings.pulsePeakHour} · ${pulse.peakHour.toString().padStart(2, '0')}:00",
                                    color = LevyraMuted,
                                    fontSize = 11.sp,
                                    fontWeight = FontWeight.Bold
                                )
                            }
                        }
                    }
                }
            }
        }
    }
}

@Composable
private fun ReplayPeriodMetric(
    modifier: Modifier,
    periodLabel: String,
    minutes: Long,
    plays: Int,
    minuteLabel: String,
    playLabel: String,
    accent: Color
) {
    Surface(
        modifier = modifier,
        color = accent.copy(alpha = 0.08f),
        shape = RoundedCornerShape(16.dp),
        border = BorderStroke(1.dp, accent.copy(alpha = 0.18f))
    ) {
        Column(modifier = Modifier.padding(11.dp), verticalArrangement = Arrangement.spacedBy(3.dp)) {
            Text(periodLabel, color = accent, fontSize = 10.sp, fontWeight = FontWeight.Black)
            Text("$minutes $minuteLabel", color = LevyraText, fontSize = 14.sp, fontWeight = FontWeight.Black)
            Text("$plays $playLabel", color = LevyraMuted, fontSize = 9.sp, fontWeight = FontWeight.Bold, maxLines = 1)
        }
    }
}
'''
          pattern = re.compile(r'@Composable\ninternal fun LibraryListeningDashboard\(.*?\n}\n\n(?=@Composable\nprivate fun LibraryInsightMetric)', re.S)
          updated, count = pattern.subn(replacement + '\n', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one dashboard block, found {count}')
          dashboard.write_text(updated, encoding='utf-8')

          app = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = app.read_text(encoding='utf-8')
          import_line = 'import com.luc4n3x.levyra.ui.lyrics.LyricsShareCard\n'
          if import_line not in text:
              anchor = 'import com.luc4n3x.levyra.ui.components.playerGlass\n'
              if anchor not in text:
                  raise SystemExit('lyrics import anchor missing')
              text = text.replace(anchor, anchor + import_line, 1)

          old = '''                                onClick = {
                                    val intent = Intent(Intent.ACTION_SEND).apply {
                                        type = "text/plain"
                                        putExtra(Intent.EXTRA_TEXT, selectedLyricsText())
                                    }
                                    shareContext.startActivity(Intent.createChooser(intent, strings.shareVia))
                                }
'''
          new = '''                                onClick = {
                                    val selectedText = selectedLyricsText()
                                    val selectedTrack = track
                                    if (selectedTrack == null) {
                                        val fallback = Intent(Intent.ACTION_SEND).apply {
                                            type = "text/plain"
                                            putExtra(Intent.EXTRA_TEXT, selectedText)
                                        }
                                        shareContext.startActivity(Intent.createChooser(fallback, strings.shareVia))
                                    } else {
                                        clipboardScope.launch {
                                            val shareIntent = LyricsShareCard.createShareIntent(
                                                context = shareContext,
                                                track = selectedTrack,
                                                selectedLyrics = selectedText
                                            ) ?: Intent(Intent.ACTION_SEND).apply {
                                                type = "text/plain"
                                                putExtra(Intent.EXTRA_TEXT, selectedText)
                                            }
                                            shareContext.startActivity(Intent.createChooser(shareIntent, strings.shareVia))
                                        }
                                    }
                                }
'''
          if old not in text:
              raise SystemExit('lyrics share block missing or already changed')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryOverviewComponents.kt app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryOverviewComponents.kt app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git commit -m "feat(android): add Replay dashboard and lyrics cards"
          git push origin HEAD:feature/desktop-audio-and-local-library
