name: PR 462 Library Pulse polish

on:
  push:
    branches:
      - feat/sleep-timer-system-actions

permissions:
  contents: write

jobs:
  apply-ui-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/sleep-timer-system-actions
          fetch-depth: 0

      - name: Apply focused Library UI changes
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/apply_pr462_ui.py
          python3 /tmp/apply_pr462_ui.py

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileDebugKotlin
          git diff --check

      - name: Commit UI polish and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr462-library-pulse-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(android): polish Library listening pulse'
          git push origin HEAD:feat/sleep-timer-system-actions
