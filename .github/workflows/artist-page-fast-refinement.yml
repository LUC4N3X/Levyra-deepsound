    artistName: String,
    onOpen: (ArtistRelease, String) -> Unit
) {
    val visibleReleases = remember(releases) { releases.distinctBy { it.browseId.ifBlank { it.title } }.take(24) }
    LazyRow(
        horizontalArrangement = Arrangement.spacedBy(14.dp),
        contentPadding = PaddingValues(start = 20.dp, end = 20.dp)
    ) {
        items(
            items = visibleReleases,
            key = { "rel-${it.browseId.ifBlank { it.title }}" },
            contentType = { "artist-release" }
        ) { release ->
            Column(
                modifier = Modifier
                    .width(152.dp)
                    .pressable { onOpen(release, artistName) },
                verticalArrangement = Arrangement.spacedBy(7.dp)
            ) {
                Box(
                    modifier = Modifier
