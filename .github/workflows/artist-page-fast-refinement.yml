name: Artist Page Fast Refinement

on:
  push:
    paths:
      - '.github/workflows/artist-page-fast-refinement.yml'

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/ui-evolution-living-capsule-home-artist-collections
          fetch-depth: 0

      - name: Apply focused artist refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/artist_page_refine.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "loading_end = '                state.artistError != null && profile == null -> {'",
              "loading_end = '                showArtistError -> {'"
          )
          text = text.replace(
              "popular_end = text.index('private fun normalizeBiographyPreview(', popular_start)",
              "popular_end = text.index('@Composable\\nprivate fun ArtistHeader(', popular_start)"
          )
          text = text.replace(
              'url = release.thumbnailUrl,\n                            contentDescription = null,',
              'url = release.thumbnailUrl,\n                            contentDescription = release.title,'
          )
          text = text.replace(
              'url = artworkUrl,\n                    contentDescription = null,',
              'url = artworkUrl,\n                    contentDescription = track.title,'
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 .github/artist_page_refine.py

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit refinement
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'LUC4N3X'
          git config user.email 'LUC4N3X@users.noreply.github.com'
          git add \
            app/src/main/java/com/luc4n3x/levyra/data/ArtistRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git commit -m 'refactor(ui): streamline artist page loading and hierarchy'
          git push origin HEAD:feature/ui-evolution-living-capsule-home-artist-collections
