name: Validate player PR 531

on:
  push:
    branches:
      - automation/sync-player-pr-531

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout player branch
        uses: actions/checkout@v7
        with:
          ref: feat/player-experience-redesign
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Compile Android debug
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Test video zoom
        run: ./gradlew :app:testDebugUnitTest --tests 'com.luc4n3x.levyra.ui.player.PlayerVideoZoomTest' --no-daemon

      - name: AI quality gate
        run: python3 scripts/ai_quality_gate.py --profile fast
