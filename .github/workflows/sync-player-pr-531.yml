name: Polish player PR 531 fullscreen

on:
  push:
    branches:
      - automation/sync-player-pr-531

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@v7
        with:
          ref: automation/sync-player-pr-531
          path: helper
          fetch-depth: 1

      - name: Checkout player branch
        uses: actions/checkout@v7
        with:
          ref: feat/player-experience-redesign
          path: repo
          fetch-depth: 0

      - name: Move fullscreen control onto video surface
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          python3 ../helper/.github/scripts/fix_player_fullscreen_overlay.py .
          git add app/src/main/java/com/luc4n3x/levyra/ui/player/LevyraNowPlaying.kt
          git diff --cached --check
          git commit -m "refactor(player): place fullscreen action on video"
          git push origin HEAD:feat/player-experience-redesign
