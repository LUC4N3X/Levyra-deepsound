@Composable
internal fun ExploreSamplesScreen(
    samples: List<Track>,
    initialPage: Int,
    currentTrack: Track?,
    isPlaying: Boolean,
    isResolving: Boolean,
    isVideoMode: Boolean,
    favoriteIds: Set<String>,
    strings: LevyraStrings,
    onPlaySample: (List<Track>, Track) -> Unit,
    onTogglePlay: () -> Unit,
    onToggleFavorite: (Track) -> Unit,
    onDismiss: () -> Unit
) {
    if (samples.isEmpty()) return
    BackHandler(onBack = onDismiss)

    val safeInitialPage = initialPage.coerceIn(0, samples.lastIndex)
    val pagerState = rememberPagerState(
        initialPage = safeInitialPage,
        pageCount = { samples.size }
    )

    LaunchedEffect(pagerState, samples) {
        snapshotFlow { pagerState.settledPage }
            .distinctUntilChanged()
            .collectLatest { page ->
                samples.getOrNull(page)?.let { track -> onPlaySample(samples, track) }
            }
    }

    Box(
        modifier = Modifier
            .fillMaxSize()
            .background(Color.Black)
            .zIndex(30f)
    ) {
        VerticalPager(
            state = pagerState,
            beyondViewportPageCount = 1,
            modifier = Modifier.fillMaxSize()
        ) { page ->
            val track = samples[page]
            val isCurrent = sampleTrackMatches(currentTrack, track)
            ExploreSamplePage(
                track = track,
                isCurrent = isCurrent,
                isPlaying = isPlaying && isCurrent,
                isResolving = isResolving && isCurrent,
                showVideo = isCurrent && isVideoMode,
                isFavorite = track.id in favoriteIds,
                strings = strings,
                onTogglePlay = onTogglePlay,
                onToggleFavorite = { onToggleFavorite(track) }
            )
        }

        Row(
            modifier = Modifier
                .align(Alignment.TopCenter)
                .fillMaxWidth()
                .statusBarsPadding()
                .padding(horizontal = 16.dp, vertical = 12.dp),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.spacedBy(12.dp)
        ) {
            Box(
                modifier = Modifier
                    .size(42.dp)
                    .background(Color.Black.copy(alpha = 0.48f), CircleShape)
                    .clickable(onClick = onDismiss),
                contentAlignment = Alignment.Center
            ) {
                Icon(
                    imageVector = Icons.Rounded.Close,
                    contentDescription = strings.close,
                    tint = Color.White,
                    modifier = Modifier.size(21.dp)
                )
            }
            Text(
                text = strings.exploreSamples,
                color = Color.White,
                fontSize = 22.sp,
                fontWeight = FontWeight.Black,
                modifier = Modifier.weight(1f)
            )
            Text(
                text = "${pagerState.currentPage + 1}/${samples.size}",
                color = Color.White.copy(alpha = 0.78f),
                fontSize = 13.sp,
                fontWeight = FontWeight.Bold,
                modifier = Modifier
                    .background(Color.Black.copy(alpha = 0.42f), CircleShape)
                    .padding(horizontal = 10.dp, vertical = 7.dp)
            )
        }
    }
}

@Composable
private fun ExploreSamplePage(
    track: Track,
    isCurrent: Boolean,
    isPlaying: Boolean,
    isResolving: Boolean,
    showVideo: Boolean,
    isFavorite: Boolean,
    strings: LevyraStrings,
    onTogglePlay: () -> Unit,
    onToggleFavorite: () -> Unit
) {
    val context = LocalContext.current
    val artwork = track.largeThumbnailUrl.ifBlank { track.thumbnailUrl }

    Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
        if (artwork.isNotBlank()) {
            AsyncImage(
                model = artwork,
                contentDescription = null,
                contentScale = ContentScale.Crop,
                modifier = Modifier.fillMaxSize()
            )
        }

        if (showVideo) {
            ExploreSampleVideoSurface(
                isPlaying = isPlaying,
                modifier = Modifier.fillMaxSize()
            )
        }

        Box(
            modifier = Modifier
                .fillMaxSize()
                .background(
                    Brush.verticalGradient(
                        listOf(
                            Color.Black.copy(alpha = 0.12f),
                            Color.Transparent,
                            Color.Black.copy(alpha = 0.22f),
                            Color.Black.copy(alpha = 0.88f)
                        )
                    )
                )
        )

        if (isResolving) {
            CircularProgressIndicator(
                color = Color.White,
                strokeWidth = 3.dp,
                modifier = Modifier.align(Alignment.Center).size(42.dp)
            )
        } else if (isCurrent && !isPlaying) {
            Box(
                modifier = Modifier
                    .align(Alignment.Center)
                    .size(68.dp)
                    .background(Color.Black.copy(alpha = 0.46f), CircleShape)
                    .clickable(onClick = onTogglePlay),
                contentAlignment = Alignment.Center
            ) {
                Icon(
                    imageVector = Icons.Rounded.PlayArrow,
                    contentDescription = strings.play,
                    tint = Color.White,
                    modifier = Modifier.size(36.dp)
                )
            }
        }

        Column(
            modifier = Modifier
                .align(Alignment.CenterEnd)
                .padding(end = 16.dp, bottom = 84.dp),
            horizontalAlignment = Alignment.CenterHorizontally,
            verticalArrangement = Arrangement.spacedBy(18.dp)
        ) {
            SampleActionButton(
                icon = if (isFavorite) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder,
                label = if (isFavorite) strings.removeFromFavorites else strings.addToFavorites,
                selected = isFavorite,
                onClick = onToggleFavorite
            )
            SampleActionButton(
                icon = Icons.Rounded.Share,
                label = strings.share,
                onClick = {
                    val link = track.videoUrl.ifBlank { track.streamUrl }
                    val text = buildString {
                        append(track.title)
                        if (track.artist.isNotBlank()) append(" - ").append(track.artist)
                        if (link.isNotBlank()) append('\n').append(link)
                    }
                    val intent = Intent(Intent.ACTION_SEND).apply {
                        type = "text/plain"
                        putExtra(Intent.EXTRA_TEXT, text)
                    }
                    context.startActivity(Intent.createChooser(intent, strings.share))
                }
            )
            if (isCurrent) {
                SampleActionButton(
                    icon = if (isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                    label = if (isPlaying) strings.pause else strings.play,
                    onClick = onTogglePlay
                )
            }
        }

        Row(
            modifier = Modifier
                .align(Alignment.BottomStart)
                .fillMaxWidth()
                .navigationBarsPadding()
                .padding(start = 18.dp, end = 94.dp, bottom = 104.dp),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.spacedBy(12.dp)
        ) {
            if (artwork.isNotBlank()) {
                AsyncImage(
                    model = artwork,
                    contentDescription = null,
                    contentScale = ContentScale.Crop,
                    modifier = Modifier
                        .size(54.dp)
                        .clip(RoundedCornerShape(8.dp))
                )
            }
            Column(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                Text(
                    text = track.title,
                    color = Color.White,
                    fontSize = 20.sp,
                    lineHeight = 23.sp,
                    fontWeight = FontWeight.Black,
                    maxLines = 2,
                    overflow = TextOverflow.Ellipsis
                )
                Text(
                    text = track.artist,
                    color = Color.White.copy(alpha = 0.82f),
                    fontSize = 15.sp,
                    lineHeight = 18.sp,
                    fontWeight = FontWeight.SemiBold,
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis
                )
            }
        }
    }
}

@Composable
private fun ExploreSampleVideoSurface(
    isPlaying: Boolean,
    modifier: Modifier = Modifier
) {
    val player = PlaybackService.activePlayer
    if (player == null) return

    AndroidView(
        factory = { context ->
            (LayoutInflater.from(context).inflate(
                R.layout.levyra_video_player_view,
                null,
                false
            ) as PlayerView).apply {
                keepScreenOn = true
                resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                this.player = player
            }
        },
        update = { view ->
            val active = PlaybackService.activePlayer
            if (view.player !== active) view.player = active
            view.resizeMode = AspectRatioFrameLayout.RESIZE_MODE_ZOOM
            view.keepScreenOn = isPlaying
        },
        onRelease = { view ->
            view.player = null
            view.keepScreenOn = false
        },
        modifier = modifier
    )
}

@Composable
private fun SampleActionButton(
    icon: androidx.compose.ui.graphics.vector.ImageVector,
    label: String,
    selected: Boolean = false,
    onClick: () -> Unit
) {
    Column(
        horizontalAlignment = Alignment.CenterHorizontally,
        verticalArrangement = Arrangement.spacedBy(5.dp),
        modifier = Modifier.widthIn(max = 74.dp)
    ) {
        Box(
            modifier = Modifier
                .size(52.dp)
                .background(Color.Black.copy(alpha = 0.46f), CircleShape)
                .clickable(onClick = onClick),
            contentAlignment = Alignment.Center
        ) {
            Icon(
                imageVector = icon,
                contentDescription = label,
                tint = if (selected) LevyraCyan else LevyraText,
                modifier = Modifier.size(26.dp)
            )
        }
        Text(
            text = label,
            color = Color.White,
            fontSize = 10.5.sp,
            lineHeight = 12.sp,
            fontWeight = FontWeight.Bold,
            maxLines = 1,
            overflow = TextOverflow.Ellipsis
        )
    }
}

private fun sampleTrackMatches(current: Track?, target: Track): Boolean {
    if (current == null) return false
    if (current.id.isNotBlank() && target.id.isNotBlank() && current.id == target.id) return true
    return current.videoUrl.isNotBlank() && current.videoUrl == target.videoUrl
}
