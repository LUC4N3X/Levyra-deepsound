name: Apply Home beta polish

on:
  push:
    branches:
      - refactor/home-experience
    paths:
      - .github/workflows/apply-home-beta-polish.yml

permissions:
  contents: write

concurrency:
  group: apply-home-beta-polish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0
      - name: Apply reviewed Home fixes
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/home-beta-polish.patch
          git apply --check /tmp/home-beta-polish.patch
          git apply /tmp/home-beta-polish.patch
          rm .github/workflows/apply-home-beta-polish.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): polish carousel navigation and insets"
          git push origin HEAD:refactor/home-experience
