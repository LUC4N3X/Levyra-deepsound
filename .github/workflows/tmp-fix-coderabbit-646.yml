name: Targeted CodeRabbit 646 Fix

on:
  push:
    branches:
      - codex/persistent-queue-spaces-local-library
    paths:
      - .github/workflows/tmp-fix-coderabbit-646.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-disabled: true

      - name: Apply targeted patch
        run: python scripts/tmp_fix_coderabbit_646.py

      - name: Validate diff
        run: git diff --check

      - name: Run targeted tests and compile
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests com.luc4n3x.levyra.player.queue.QueueDestinationPolicyTest --tests com.luc4n3x.levyra.player.queue.QueueSpaceEngineTest :app:compileDebugKotlin

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/tmp_fix_coderabbit_646.py .github/workflows/tmp-fix-coderabbit-646.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve queue batches and restored library sort"
          git push origin HEAD:codex/persistent-queue-spaces-local-library
