name: PR504 CodeRabbit Fixes

on:
  push:
    branches:
      - feat/amazon-inspired-explore-cards
    paths:
      - .github/workflows/pr504-coderabbit-fixes.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/amazon-inspired-explore-cards
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cache = Path('app/src/main/java/com/luc4n3x/levyra/data/LevyraArtworkCache.kt')
          text = cache.read_text()
          old = """    internal fun artworkUrlCandidates(track: Track, highRes: Boolean): List<String> {\n        val largeIsWidescreenVideoFrame = track.largeThumbnailUrl\n            .trim()\n            .contains(\"maxresdefault\", ignoreCase = true)\n        val ordered = when {\n            highRes || largeIsWidescreenVideoFrame -> sequenceOf(\n"""
          new = """    internal fun artworkUrlCandidates(track: Track, highRes: Boolean): List<String> {\n        val ordered = when {\n            highRes -> sequenceOf(\n"""
          if text.count(old) != 1:
              raise SystemExit(f'artwork source selection: expected 1 match, found {text.count(old)}')
          cache.write_text(text.replace(old, new, 1))

          app = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = app.read_text()
          old_two = """        2 -> when (strings.code.lowercase(Locale.ROOT)) {\n            \"it\", \"es\", \"pt\" -> \"${cleaned[0]} e ${cleaned[1]}\"\n            \"fr\" -> \"${cleaned[0]} et ${cleaned[1]}\"\n"""
          new_two = """        2 -> when (strings.code.lowercase(Locale.ROOT)) {\n            \"it\", \"pt\" -> \"${cleaned[0]} e ${cleaned[1]}\"\n            \"es\" -> \"${cleaned[0]} y ${cleaned[1]}\"\n            \"fr\" -> \"${cleaned[0]} et ${cleaned[1]}\"\n"""
          old_three = """        else -> when (strings.code.lowercase(Locale.ROOT)) {\n            \"it\", \"es\", \"pt\" -> \"${cleaned[0]}, ${cleaned[1]} e ${cleaned[2]}\"\n            \"fr\" -> \"${cleaned[0]}, ${cleaned[1]} et ${cleaned[2]}\"\n"""
          new_three = """        else -> when (strings.code.lowercase(Locale.ROOT)) {\n            \"it\", \"pt\" -> \"${cleaned[0]}, ${cleaned[1]} e ${cleaned[2]}\"\n            \"es\" -> \"${cleaned[0]}, ${cleaned[1]} y ${cleaned[2]}\"\n            \"fr\" -> \"${cleaned[0]}, ${cleaned[1]} et ${cleaned[2]}\"\n"""
          if text.count(old_two) != 1:
              raise SystemExit(f'Spanish two-artist join: expected 1 match, found {text.count(old_two)}')
          text = text.replace(old_two, new_two, 1)
          if text.count(old_three) != 1:
              raise SystemExit(f'Spanish three-artist join: expected 1 match, found {text.count(old_three)}')
          app.write_text(text.replace(old_three, new_three, 1))
          PY

      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr504-coderabbit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/data/LevyraArtworkCache.kt app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr504-coderabbit-fixes.yml
          git commit -m "fix(ui): address CodeRabbit review findings"
          git push origin HEAD:feat/amazon-inspired-explore-cards
