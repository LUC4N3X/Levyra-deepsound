name: One-shot GPU-safe player patch

on:
  push:
    branches: [feat/player-experience-motion]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/player-experience-motion
          fetch-depth: 0

      - name: Make the expanded player GPU-safe
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraExperienceHost.kt')
          source = path.read_text(encoding='utf-8')

          old_surfaces = '''                LevyraPlayerBackdrop(
                    track = track,
                    expandedProgress = progress.value,
                    modifier = Modifier.fillMaxSize()
                )

                CollapsedLivingPlayer(
                    state = state,
                    track = track,
                    strings = strings,
                    primary = primary,
                    secondary = secondary,
                    alpha = (1f - progress.value * 1.65f).coerceIn(0f, 1f),
                    onOpen = { onExpandedChange(true) },
                    onToggle = viewModel::togglePlay,
                    onPrevious = viewModel::previous,
                    onNext = viewModel::next,
                    onClose = viewModel::closePlayer
                )

                ExpandedPlayerExperience(
                    state = state,
                    track = track,
                    strings = strings,
                    primary = primary,
                    secondary = secondary,
                    alpha = ((progress.value - 0.18f) / 0.82f).coerceIn(0f, 1f),
                    onCollapse = { onExpandedChange(false) },
                    viewModel = viewModel
                )'''

          new_surfaces = '''                LevyraPlayerBackdrop(
                    track = track,
                    expandedProgress = progress.value,
                    modifier = Modifier.fillMaxSize()
                )

                if (progress.value < 0.82f) {
                    CollapsedLivingPlayer(
                        state = state,
                        track = track,
                        strings = strings,
                        primary = primary,
                        secondary = secondary,
                        alpha = (1f - progress.value * 1.65f).coerceIn(0f, 1f),
                        onOpen = { onExpandedChange(true) },
                        onToggle = viewModel::togglePlay,
                        onPrevious = viewModel::previous,
                        onNext = viewModel::next,
                        onClose = viewModel::closePlayer
                    )
                }

                if (progress.value > 0.20f) {
                    ExpandedPlayerExperience(
                        state = state,
                        track = track,
                        strings = strings,
                        primary = primary,
                        secondary = secondary,
                        alpha = ((progress.value - 0.20f) / 0.80f).coerceIn(0f, 1f),
                        onCollapse = { onExpandedChange(false) },
                        viewModel = viewModel
                    )
                }'''

          if source.count(old_surfaces) != 1:
              raise SystemExit(f'player surfaces: expected 1 match, found {source.count(old_surfaces)}')
          source = source.replace(old_surfaces, new_surfaces, 1)

          pattern = re.compile(
              r'@Composable\nprivate fun LevyraPlayerBackdrop\(.*?\n\}\n\n@Composable\nprivate fun CollapsedLivingPlayer\(',
              re.S,
          )
          replacement = '''@Composable
private fun LevyraPlayerBackdrop(
    track: Track,
    expandedProgress: Float,
    modifier: Modifier = Modifier
) {
    val primary = Color(track.accentStart)
    val secondary = Color(track.accentEnd)
    val glowAlpha = 0.18f + expandedProgress.coerceIn(0f, 1f) * 0.10f

    Box(
        modifier = modifier.background(
            Brush.verticalGradient(
                listOf(
                    primary.copy(alpha = 0.34f),
                    secondary.copy(alpha = 0.18f),
                    LevyraInk.copy(alpha = 0.98f),
                    LevyraBlack
                )
            )
        )
    ) {
        Box(
            modifier = Modifier
                .fillMaxSize()
                .background(
                    Brush.radialGradient(
                        colors = listOf(
                            primary.copy(alpha = glowAlpha),
                            Color.Transparent
                        )
                    )
                )
        )
        Box(
            modifier = Modifier
                .fillMaxSize()
                .background(
                    Brush.verticalGradient(
                        listOf(
                            Color.White.copy(alpha = 0.025f),
                            Color.Transparent,
                            Color.Black.copy(alpha = 0.62f)
                        )
                    )
                )
        )
    }
}

@Composable
private fun CollapsedLivingPlayer('''

          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'backdrop replacement: expected 1 match, found {count}')

          source = source.replace('import androidx.compose.ui.draw.blur\n', '', 1)
          path.write_text(source, encoding='utf-8')

      - name: Remove one-shot files and commit
        run: |
          rm -f .github/workflows/one-shot-player-gpu-safe.yml
          rm -f .github/.pr306-gpu-safe-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraExperienceHost.kt .github/workflows/one-shot-player-gpu-safe.yml .github/.pr306-gpu-safe-trigger
          git commit -m "fix(ui): make expanded player rendering GPU-safe"
          git push origin HEAD:feat/player-experience-motion
