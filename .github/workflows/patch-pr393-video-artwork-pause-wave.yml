name: Patch PR 393 video artwork and player wave

on:
  push:
    branches:
      - feat/player-wave-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/player-wave-polish
          fetch-depth: 0

      - name: Apply focused fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          seekbar_path = Path("app/src/main/java/com/luc4n3x/levyra/ui/components/PremiumSeekbar.kt")
          seekbar = seekbar_path.read_text(encoding="utf-8")
          for unused_import in (
              "import androidx.compose.animation.core.RepeatMode\n",
              "import androidx.compose.animation.core.animateFloat\n",
              "import androidx.compose.animation.core.infiniteRepeatable\n",
              "import androidx.compose.animation.core.rememberInfiniteTransition\n",
          ):
              seekbar = seekbar.replace(unused_import, "")
          seekbar = replace_once(
              seekbar,
              "    thumbColor: Color = Color.White,\n    animated: Boolean = true,\n",
              "    thumbColor: Color = Color.White,\n    isPlaying: Boolean = true,\n    animated: Boolean = true,\n",
              "PremiumSeekbar isPlaying parameter",
          )
          motion_start = seekbar.find('    val waveMotion = rememberInfiniteTransition(label = "player-wave-motion")')
          motion_end = seekbar.find("\n\n    val scrubMillis", motion_start)
          if motion_start < 0 or motion_end < 0:
              raise SystemExit("water phase animation markers not found")
          new_motion = '''    val wavePhase = remember { Animatable(0f) }
          LaunchedEffect(animated, isPlaying, isDragging) {
              if (!animated || !isPlaying || isDragging) return@LaunchedEffect
              val fullPhase = 2f * PI.toFloat()
              while (true) {
                  val remainingFraction = ((fullPhase - wavePhase.value) / fullPhase)
                      .coerceIn(0.001f, 1f)
                  wavePhase.animateTo(
                      targetValue = fullPhase,
                      animationSpec = tween(
                          durationMillis = (4_200f * remainingFraction).roundToInt().coerceAtLeast(1),
                          easing = LinearEasing
                      )
                  )
                  wavePhase.snapTo(0f)
              }
          }'''.replace("\n          ", "\n")
          seekbar = seekbar[:motion_start] + new_motion + seekbar[motion_end:]
          seekbar = replace_once(
              seekbar,
              "                        val phaseOffset = if (animated && !isDragging) wavePhase else 0f\n",
              "                        val phaseOffset = if (animated && !isDragging) wavePhase.value else 0f\n",
              "water phase draw value",
          )
          seekbar_path.write_text(seekbar, encoding="utf-8")

          app_path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              "                secondaryColor = Color.White.copy(alpha = 0.62f),\n                animationsEnabled = state.animationsEnabled,\n",
              "                secondaryColor = Color.White.copy(alpha = 0.62f),\n                isPlaying = state.isPlaying,\n                animationsEnabled = state.animationsEnabled,\n",
              "PlayerTimeline call",
          )
          app = replace_once(
              app,
              "    activeColor: Color,\n    secondaryColor: Color,\n    animationsEnabled: Boolean,\n    compact: Boolean,\n    onSeek: (Float) -> Unit\n) {\n",
              "    activeColor: Color,\n    secondaryColor: Color,\n    isPlaying: Boolean,\n    animationsEnabled: Boolean,\n    compact: Boolean,\n    onSeek: (Float) -> Unit\n) {\n",
              "PlayerTimeline signature",
          )
          app = replace_once(
              app,
              "            bufferedPositionMs = bufferedPositionMs,\n            onSeekTo = { seekMs ->\n",
              "            bufferedPositionMs = bufferedPositionMs,\n            isPlaying = isPlaying,\n            onSeekTo = { seekMs ->\n",
              "PremiumSeekbar timeline call",
          )
          app_path.write_text(app, encoding="utf-8")

          repo_path = Path("app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicRepository.kt")
          repo = repo_path.read_text(encoding="utf-8")
          repo = replace_once(
              repo,
              "        }\n        return Track(\n            id = id,\n            title = title.cleanLabel(),\n",
              '''        }
          val youtubeVideoId = id.trim().takeIf { value ->
              value.length == 11 && value.all { character ->
                  character.isLetterOrDigit() || character == '_' || character == '-'
              }
          }
          val resolvedThumbnailUrl = thumbnailUrl.trim().ifBlank {
              youtubeVideoId?.let { videoId -> "https://i.ytimg.com/vi/$videoId/hqdefault.jpg" }.orEmpty()
          }
          val resolvedLargeThumbnailUrl = largeThumbnailUrl.trim().ifBlank {
              youtubeVideoId?.let { videoId -> "https://i.ytimg.com/vi/$videoId/maxresdefault.jpg" }
                  .orEmpty()
                  .ifBlank { resolvedThumbnailUrl }
          }
          return Track(
              id = id,
              title = title.cleanLabel(),
          '''.replace("\n          ", "\n"),
              "YoutubeMusic buildTrack fallback",
          )
          repo = replace_once(
              repo,
              "            thumbnailUrl = thumbnailUrl,\n            largeThumbnailUrl = largeThumbnailUrl,\n",
              "            thumbnailUrl = resolvedThumbnailUrl,\n            largeThumbnailUrl = resolvedLargeThumbnailUrl,\n",
              "YoutubeMusic resolved artwork assignment",
          )
          repo_path.write_text(repo, encoding="utf-8")

          orbit_path = Path("app/src/main/java/com/luc4n3x/levyra/domain/LevyraPersonalOrbit.kt")
          orbit = orbit_path.read_text(encoding="utf-8")
          orbit = replace_once(
              orbit,
              "        if (fromUrl != null) return fromUrl\n        return track.id.trim().takeIf(youtubeVideoIdPattern::matches)\n",
              "        if (fromUrl != null) return fromUrl\n        val counterpart = track.counterpartVideoId.trim().takeIf(youtubeVideoIdPattern::matches)\n        if (counterpart != null) return counterpart\n        return track.id.trim().takeIf(youtubeVideoIdPattern::matches)\n",
              "counterpart artwork fallback",
          )
          orbit_path.write_text(orbit, encoding="utf-8")

          test_path = Path("app/src/test/java/com/luc4n3x/levyra/domain/LevyraVideoArtworkFallbackTest.kt")
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text('''package com.luc4n3x.levyra.domain

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class LevyraVideoArtworkFallbackTest {
              @Test
              fun `counterpart video id provides artwork when song artwork is missing`() {
                  val track = testTrack(id = "catalog-entry", counterpartVideoId = "AbCdEfGhI12")
                  assertEquals(
                      "https://i.ytimg.com/vi/AbCdEfGhI12/hqdefault.jpg",
                      LevyraPersonalOrbit.youtubeFallbackArtwork(track)
                  )
              }

              @Test
              fun `video artwork fallback is independent from localized display text`() {
                  val italian = testTrack(
                      id = "catalog-entry",
                      counterpartVideoId = "AbCdEfGhI12",
                      title = "Dopo il tramonto",
                      artist = "Artista"
                  )
                  val japanese = italian.copy(title = "夜のあと", artist = "アーティスト")
                  assertEquals(
                      LevyraPersonalOrbit.youtubeFallbackArtwork(italian),
                      LevyraPersonalOrbit.youtubeFallbackArtwork(japanese)
                  )
              }

              private fun testTrack(
                  id: String,
                  counterpartVideoId: String,
                  title: String = "Video",
                  artist: String = "Artist"
              ) = Track(
                  id = id,
                  title = title,
                  artist = artist,
                  album = "",
                  durationMs = 0L,
                  streamUrl = "",
                  videoUrl = "",
                  thumbnailUrl = "",
                  largeThumbnailUrl = "",
                  source = "test",
                  moodTags = emptySet(),
                  energy = 0,
                  vocal = 0,
                  replayScore = 0,
                  cacheScore = 0,
                  accentStart = 0,
                  accentEnd = 0,
                  counterpartVideoId = counterpartVideoId
              )
          }
          '''.replace("\n          ", "\n").lstrip(), encoding="utf-8")

      - name: Commit focused changes and remove helper
        shell: bash
        run: |
          rm .github/workflows/patch-pr393-video-artwork-pause-wave.yml
          git config user.name "LUC4N3X"
          git config user.email "luca.testing96@gmail.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/components/PremiumSeekbar.kt
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git add app/src/main/java/com/luc4n3x/levyra/data/YoutubeMusicRepository.kt
          git add app/src/main/java/com/luc4n3x/levyra/domain/LevyraPersonalOrbit.kt
          git add app/src/test/java/com/luc4n3x/levyra/domain/LevyraVideoArtworkFallbackTest.kt
          git add .github/workflows/patch-pr393-video-artwork-pause-wave.yml
          git commit -m "fix(ui): guarantee video artwork and pause player wave"
          git push origin HEAD:feat/player-wave-polish
