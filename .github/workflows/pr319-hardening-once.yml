name: PR 319 Hardening Once

on:
  push:
    branches:
      - feature/pro-audio-and-smart-importer

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply hardening patch
        run: python3 scripts/pr319_hardening_once.py

      - name: Commit clean hardening result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pr319-hardening-once.yml scripts/pr319_hardening_once.py
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(import): harden playlist resolution and cache semantics"
          git push origin HEAD:feature/pro-audio-and-smart-importer
