name: Apply Spotify Artwork Fix

on:
  push:
    branches:
      - feat/editorial-collector
    paths:
      - tools/apply_spotify_artwork_fix.py
      - .github/workflows/apply-spotify-artwork-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-spotify-artwork-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(editorial): trigger Spotify artwork fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/editorial-collector
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_spotify_artwork_fix.py

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/levyra-editorial/pyproject.toml

      - name: Verify collector
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e 'tools/levyra-editorial[dev]'
          python -m compileall -q tools/levyra-editorial/levyra_editorial
          ruff check tools/levyra-editorial
          pytest tools/levyra-editorial/tests

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify Android artwork continuity
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.EditorialCatalogParserTest' \
            --tests 'com.luc4n3x.levyra.data.EditorialArtworkContinuityTest'

      - name: Commit verified fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/levyra-editorial/levyra_editorial/models.py \
            tools/levyra-editorial/tests/test_collector.py \
            tools/levyra-editorial/README.md \
            app/src/main/java/com/luc4n3x/levyra/data/EditorialChartsRepository.kt \
            app/src/main/java/com/luc4n3x/levyra/data/ChartOfficialArtworkResolver.kt \
            app/src/test/java/com/luc4n3x/levyra/data/EditorialCatalogParserTest.kt \
            app/src/test/java/com/luc4n3x/levyra/data/EditorialArtworkContinuityTest.kt
          git diff --cached --quiet && { echo 'No changes to commit.'; exit 0; }
          git commit -m 'fix(editorial): preserve Spotify artwork into playback'
          git push origin HEAD:feat/editorial-collector
