name: APK Size Report

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-official-video-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/newpipe-runtime-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-disabled: true

      - name: Apply official video lookup fix
        run: python3 .github/official-video-lookup-patch.py

      - name: Verify official video lookup
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'com.luc4n3x.levyra.data.OfficialVideoCandidateTest'
          --tests 'com.luc4n3x.levyra.player.LevyraPlayerTest'
          :app:compileDebugKotlin --stacktrace

      - name: Commit fix and restore workflow
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout "origin/${GITHUB_BASE_REF}" -- .github/workflows/apk-size-ruler.yml
          rm -f .github/official-video-lookup-patch.py
          git config user.name "Levyra Worker"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt \
            app/src/test/java/com/luc4n3x/levyra/data/OfficialVideoCandidateTest.kt \
            .github/workflows/apk-size-ruler.yml \
            .github/official-video-lookup-patch.py
          git diff --cached --check
          git commit -m "fix: bound official video lookup"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/newpipe-runtime-hardening
