name: Address PR 334 CodeRabbit findings

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/newpipe-runtime-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/newpipe-runtime-hardening
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply CodeRabbit fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          resolver = Path("app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt")
          text = resolver.read_text()

          old_known = '''            return track.copy(\n                videoUrl = "https://www.youtube.com/watch?v=$knownCounterpart",\n                counterpartVideoId = knownCounterpart,\n                videoType = "MUSIC_VIDEO_TYPE_OMV"\n            )'''
          new_known = '''            return track.copy(\n                videoUrl = "https://www.youtube.com/watch?v=$knownCounterpart",\n                counterpartVideoId = knownCounterpart\n            )'''
          if text.count(old_known) != 1:
              raise SystemExit(f"known counterpart block matches: {text.count(old_known)}")
          text = text.replace(old_known, new_known, 1)

          old_discovered = '''        return track.copy(\n            videoUrl = "https://www.youtube.com/watch?v=${official.videoId}",\n            counterpartVideoId = official.videoId,\n            videoType = official.videoType\n        )'''
          new_discovered = '''        return track.copy(\n            videoUrl = "https://www.youtube.com/watch?v=${official.videoId}",\n            counterpartVideoId = official.videoId\n        )'''
          if text.count(old_discovered) != 1:
              raise SystemExit(f"discovered counterpart block matches: {text.count(old_discovered)}")
          text = text.replace(old_discovered, new_discovered, 1)

          start = text.index("    private suspend fun resolveWithInnerTubeOnce(")
          end = text.index("    private fun selectAudioStream(", start)
          block = text[start:end]
          block = block.replace("track.id", "requestVideoId")
          anchor = ''') : DirectStream = withContext(Dispatchers.IO) {'''
          if anchor not in block:
              anchor = '''): DirectStream = withContext(Dispatchers.IO) {'''
          if block.count(anchor) != 1:
              raise SystemExit(f"InnerTube anchor matches: {block.count(anchor)}")
          block = block.replace(
              anchor,
              anchor + '\n        val requestVideoId = extractVideoId(track.videoUrl).ifBlank { track.id }',
              1
          )
          text = text[:start] + block + text[end:]
          resolver.write_text(text)

          test = Path("app/src/test/java/com/luc4n3x/levyra/player/LevyraPlayerTest.kt")
          test_text = test.read_text()
          anchor_test = '''    @Test\n    fun youtubePlayableTrackAllowsCanonicalVideoWhileOfficialLookupRuns() {'''
          new_test = '''    @Test\n    fun youtubePlayableTrackKeepsCanonicalAudioIdentityWithSelectedOfficialUrl() {\n        val hybrid = track(streamUrl = "").copy(\n            id = "audio123456",\n            videoUrl = "https://www.youtube.com/watch?v=video123456",\n            counterpartVideoId = "video123456",\n            videoType = "MUSIC_VIDEO_TYPE_ATV"\n        )\n\n        val video = youtubePlayableTrack(hybrid, preferVideo = true)\n        val audio = youtubePlayableTrack(hybrid, preferVideo = false)\n\n        assertEquals("audio123456", video?.id)\n        assertEquals("https://www.youtube.com/watch?v=video123456", video?.videoUrl)\n        assertEquals("audio123456", audio?.id)\n        assertEquals("https://www.youtube.com/watch?v=audio123456", audio?.videoUrl)\n    }\n\n'''
          if test_text.count(anchor_test) != 1:
              raise SystemExit(f"test anchor matches: {test_text.count(anchor_test)}")
          test.write_text(test_text.replace(anchor_test, new_test + anchor_test, 1))
          PY

      - name: Verify focused playback tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.player.LevyraPlayerTest' \
            --tests 'com.luc4n3x.levyra.data.OfficialVideoCandidateTest'

      - name: Commit fixes
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -f app/schemas/com.luc4n3x.levyra.data.local.LevyraDatabase/14.json
          rm .github/workflows/address-coderabbit-334.yml
          git config user.name "Levyra Worker"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/luc4n3x/levyra/data/PlaybackResolver.kt \
            app/src/test/java/com/luc4n3x/levyra/player/LevyraPlayerTest.kt
          git add -u -- \
            app/schemas/com.luc4n3x.levyra.data.local.LevyraDatabase/14.json \
            .github/workflows/address-coderabbit-334.yml
          git diff --cached --check
          git commit -m "fix: keep official video identity separate"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/newpipe-runtime-hardening
