name: Finalize PR 762 cache fix once

on:
  push:
    branches:
      - fix/instant-page-canvas

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    env:
      YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
      ORG_GRADLE_PROJECT_levyraNativeAudio: "true"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/instant-page-canvas
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Normalize Kotlin formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('app/src/main/java/com/luc4n3x/levyra/feature/motion/MotionArtworkEngine.kt')
          text = engine.read_text()
          start_token = '    private fun key(track: Track): String = listOf('
          class_end_token = '\n}\n\ninternal fun motionArtworkCacheKey'
          start = text.find(start_token)
          end = text.find(class_end_token, start)
          if start < 0 or end < 0:
              raise SystemExit('MotionMetadataWarmCache key block not found')
          replacement = '''    private fun key(track: Track): String = listOf(
              track.id,
              track.title,
              track.artist,
              track.album,
              track.isrc,
              track.year,
              track.releaseDate,
              track.albumArtist,
              track.albumBrowseId,
              track.artistBrowseIds.joinToString(",")
          ).joinToString("|") { value -> value.trim().lowercase(Locale.ROOT) }
          '''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          ).rstrip()
          engine.write_text(text[:start] + replacement + text[end:])

          test = Path('app/src/test/java/com/luc4n3x/levyra/feature/motion/MotionArtworkRequestCoordinatorTest.kt')
          text = test.read_text()
          start_token = '    @Test\nfun cachedMetadataDoesNotReplaceNewerInputForTheSameTrackId() {'
          next_token = '    @Test\n    fun cancellingLastSubscriberCancelsUnderlyingResolution() = runBlocking {'
          start = text.find(start_token)
          end = text.find(next_token, start)
          if start < 0 or end < 0:
              raise SystemExit('cache regression test block not found')
          replacement = '''    @Test
              fun cachedMetadataDoesNotReplaceNewerInputForTheSameTrackId() {
                  val cache = MotionMetadataWarmCache(maxEntries = 4)
                  val raw = track(
                      id = "youtube-id",
                      title = "Song",
                      artist = "Wrong Artist",
                      album = "YouTube Music"
                  )
                  val prepared = raw.copy(
                      artist = "Correct Artist",
                      album = "Real Album",
                      isrc = "ITABC2600001"
                  )
                  val newerInput = raw.copy(
                      artist = "New Correct Artist",
                      album = "New Real Album",
                      isrc = "ITABC2600002"
                  )

                  cache.put(raw, prepared)

                  assertEquals(prepared, cache.get(raw))
                  assertEquals(null, cache.get(newerInput))
              }

          '''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          )
          test.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check

      - name: Verify regressions and compile
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.data.ArtistPopularSongsMergeTest' \
            --tests 'com.luc4n3x.levyra.ui.MotionArtworkLayerTest' \
            --tests 'com.luc4n3x.levyra.feature.motion.MotionArtworkRequestCoordinatorTest' \
            --console=plain --warning-mode summary
          ./gradlew :app:compileDebugKotlin --console=plain --warning-mode summary
          git diff --check

      - name: Commit formatting cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/luc4n3x/levyra/feature/motion/MotionArtworkEngine.kt \
            app/src/test/java/com/luc4n3x/levyra/feature/motion/MotionArtworkRequestCoordinatorTest.kt
          git commit -m "style(motion): clean cache regression formatting"
          git pull --rebase origin fix/instant-page-canvas
          git push origin HEAD:fix/instant-page-canvas
