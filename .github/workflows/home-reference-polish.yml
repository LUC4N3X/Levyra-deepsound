name: Home reference polish

on:
  push:
    branches:
      - feat/home-ytmusic-style
    paths:
      - scripts/home_reference_polish.py
      - .github/workflows/home-reference-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/home-ytmusic-style
          fetch-depth: 0
      - name: Apply Home reference polish
        run: python3 scripts/home_reference_polish.py
      - name: Verify diff
        run: git diff --check
      - name: Commit polished Home
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt scripts/home_reference_polish.py .github/workflows/home-reference-polish.yml
          git commit -m "style(home): match the approved Home reference"
          git push origin HEAD:feat/home-ytmusic-style
