name: Queue Picker Global Fix

on:
  push:
    branches:
      - codex/persistent-queue-spaces-local-library

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/persistent-queue-spaces-local-library
          fetch-depth: 0

      - name: Add regression test first
        run: python3 .github/queue_picker_global_fix.py test

      - name: Verify regression is red
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.luc4n3x.levyra.player.queue.QueueDestinationPolicyTest"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "Expected queue destination regression test to fail before production fix"
            exit 1
          fi
          echo "Regression reproduced before fix"

      - name: Apply production fix
        run: python3 .github/queue_picker_global_fix.py prod

      - name: Check diff
        run: git diff --check

      - name: Verify queue destination fix
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.luc4n3x.levyra.player.queue.QueueDestinationPolicyTest" :app:compileDebugKotlin

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/queue_picker_global_fix.py .github/workflows/queue-picker-global-fix.yml
          git add app/src/main/java/com/luc4n3x/levyra/player/queue/QueueDestinationPolicy.kt
          git add app/src/main/java/com/luc4n3x/levyra/player/queue/QueueSpacesPanel.kt 2>/dev/null || true
          git add app/src/main/java/com/luc4n3x/levyra/ui/player/QueueSpacesPanel.kt
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraUiState.kt
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git add app/src/test/java/com/luc4n3x/levyra/player/queue/QueueDestinationPolicyTest.kt
          git commit -m "fix: choose queue space before adding tracks"
          git push origin HEAD:codex/persistent-queue-spaces-local-library
