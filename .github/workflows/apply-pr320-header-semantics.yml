name: Apply PR 320 Header Semantics

on:
  push:
    branches:
      - perf/home-scroll-header

permissions:
  contents: write

concurrency:
  group: apply-pr320-header-semantics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: perf/home-scroll-header

      - name: Apply semantics ownership fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          test_path = Path('app/src/test/java/com/luc4n3x/levyra/ui/HomeScrollHeaderTest.kt')
          app = app_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          app = replace_once(
              app,
              'import androidx.compose.ui.semantics.contentDescription\n',
              'import androidx.compose.ui.semantics.contentDescription\nimport androidx.compose.ui.semantics.clearAndSetSemantics\n',
              'semantics import',
          )

          home_screen_marker = '\n@Composable\nprivate fun HomeScreen(\n'
          semantics_helpers = '''
internal const val HOME_HEADER_SEMANTICS_SWITCH_PROGRESS = 0.5f

internal data class HomeHeaderSemanticsState(
    val expandedActive: Boolean,
    val compactActive: Boolean
)

internal fun homeHeaderSemanticsState(collapseProgress: Float): HomeHeaderSemanticsState {
    val compactActive = collapseProgress.coerceIn(0f, 1f) >= HOME_HEADER_SEMANTICS_SWITCH_PROGRESS
    return HomeHeaderSemanticsState(
        expandedActive = !compactActive,
        compactActive = compactActive
    )
}

private fun Modifier.homeHeaderSemanticsActive(active: Boolean): Modifier =
    if (active) this else clearAndSetSemantics { }
'''
          app = replace_once(
              app,
              home_screen_marker,
              semantics_helpers + home_screen_marker,
              'semantics policy helpers',
          )

          header_start = app.index('@Composable\nprivate fun HomeScrollReactiveHeader(')
          header_end = app.index('\n@Composable\nprivate fun LevyraLogoMark', header_start)
          header = app[header_start:header_end]

          header = replace_once(
              header,
              '    val divider = if (LevyraIsLight) Color(0x2011131F) else Color.White.copy(alpha = 0.09f)\n\n',
              '''    val divider = if (LevyraIsLight) Color(0x2011131F) else Color.White.copy(alpha = 0.09f)
    val semanticsState by remember(collapseProgress) {
        derivedStateOf { homeHeaderSemanticsState(collapseProgress()) }
    }

''',
              'thresholded semantics state',
          )

          expanded_old = '''                HomeSectionInset {
                    GreetingBar(
                        userName = userName,
                        isResolving = isResolving,
                        animationsEnabled = animationsEnabled,
                        onSearch = onSearch,
                        onSettings = onSettings
                    )
                }
'''
          expanded_new = '''                HomeSectionInset {
                    Box(
                        modifier = Modifier
                            .fillMaxWidth()
                            .homeHeaderSemanticsActive(semanticsState.expandedActive)
                    ) {
                        GreetingBar(
                            userName = userName,
                            isResolving = isResolving,
                            animationsEnabled = animationsEnabled,
                            onSearch = onSearch,
                            onSettings = onSettings
                        )
                    }
                }
'''
          header = replace_once(header, expanded_old, expanded_new, 'expanded semantics owner')

          compact_old = '''                        modifier = Modifier
                            .fillMaxWidth()
                            .graphicsLayer {
'''
          compact_new = '''                        modifier = Modifier
                            .fillMaxWidth()
                            .homeHeaderSemanticsActive(semanticsState.compactActive)
                            .graphicsLayer {
'''
          header = replace_once(header, compact_old, compact_new, 'compact semantics owner')

          app = app[:header_start] + header + app[header_end:]

          if 'fun expandedHeaderOwnsSemanticsBeforeSwitchThreshold()' in test:
              raise SystemExit('semantics regression tests already present')
          stripped = test.rstrip()
          if not stripped.endswith('}'):
              raise SystemExit('HomeScrollHeaderTest class closing brace not found')
          stripped = stripped[:-1].rstrip()
          test = stripped + '''

    @Test
    fun expandedHeaderOwnsSemanticsBeforeSwitchThreshold() {
        assertEquals(
            HomeHeaderSemanticsState(expandedActive = true, compactActive = false),
            homeHeaderSemanticsState(0f)
        )
        assertEquals(
            HomeHeaderSemanticsState(expandedActive = true, compactActive = false),
            homeHeaderSemanticsState(HOME_HEADER_SEMANTICS_SWITCH_PROGRESS - 0.01f)
        )
    }

    @Test
    fun compactHeaderOwnsSemanticsAtAndAfterSwitchThreshold() {
        assertEquals(
            HomeHeaderSemanticsState(expandedActive = false, compactActive = true),
            homeHeaderSemanticsState(HOME_HEADER_SEMANTICS_SWITCH_PROGRESS)
        )
        assertEquals(
            HomeHeaderSemanticsState(expandedActive = false, compactActive = true),
            homeHeaderSemanticsState(1f)
        )
    }
}
'''

          required = [
              'clearAndSetSemantics',
              'HOME_HEADER_SEMANTICS_SWITCH_PROGRESS = 0.5f',
              'derivedStateOf { homeHeaderSemanticsState(collapseProgress()) }',
              '.homeHeaderSemanticsActive(semanticsState.expandedActive)',
              '.homeHeaderSemanticsActive(semanticsState.compactActive)',
              'fun expandedHeaderOwnsSemanticsBeforeSwitchThreshold()',
              'fun compactHeaderOwnsSemanticsAtAndAfterSwitchThreshold()',
          ]
          combined = app + '\n' + test
          missing = [marker for marker in required if marker not in combined]
          if missing:
              raise SystemExit(f'missing expected markers: {missing}')

          app_path.write_text(app, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')
          print('Applied thresholded header semantics ownership and regression coverage')
          PY

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
            app/src/test/java/com/luc4n3x/levyra/ui/HomeScrollHeaderTest.kt
          git diff --cached --check
          git commit -m 'fix(home): gate header accessibility semantics'
          git push origin HEAD:perf/home-scroll-header
