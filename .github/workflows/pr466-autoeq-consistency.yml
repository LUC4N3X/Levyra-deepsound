name: PR 466 AutoEQ consistency fix

on:
  push:
    branches:
      - feat/artist-alive-autoeq-album-canvas
    paths:
      - .github/workflows/pr466-autoeq-consistency.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/artist-alive-autoeq-album-canvas
          fetch-depth: 0

      - name: Apply reviewed AutoEQ consistency fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt")
          text = path.read_text(encoding="utf-8")
          old = """                bandLevels = profile.bandLevels,\n                preampDb = profile.preampDb\n"""
          new = """                bandLevels = profile.bandLevels,\n                bassBoost = 0,\n                virtualizer = 0,\n                preampDb = profile.preampDb\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"applyAutoEqImport anchor mismatch: expected 1, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate current generation
        shell: bash
        env:
          YOUTUBE_INNERTUBE_API_KEY: levyra_ci_dummy_key
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/validate_fdroid_review_contract.py
          python3 scripts/ai_quality_gate.py --profile fast --base-ref HEAD~1
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.luc4n3x.levyra.domain.AutoEqImporterTest' \
            --tests 'com.luc4n3x.levyra.viewmodel.PageMotionArtworkPolicyTest'
          ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Commit clean result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr466-autoeq-consistency.yml
          git add app/src/main/java/com/luc4n3x/levyra/viewmodel/LevyraViewModel.kt
          git diff --cached --check
          python3 scripts/ai_quality_gate.py --profile full --base-ref HEAD~1
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git commit -m "fix(android): keep AutoEQ apply and saved preset consistent"
          git push origin HEAD:feat/artist-alive-autoeq-album-canvas
