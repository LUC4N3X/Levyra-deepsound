name: Render Levyra final banner

on:
  push:
    branches:
      - docs/refresh-levyra-github-banner-pro
    paths:
      - .github/workflows/assemble-levyra-banner-final.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render 2880x1080 Levyra banner
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import math, os

          W, H = 2880, 1080
          out = 'docs/assets/levyra-github-banner.webp'
          logo_path = 'app/src/main/res/drawable/levyra_logo.png'

          if not os.path.exists(logo_path):
              raise SystemExit(f'Missing official Levyra logo: {logo_path}')

          # Premium deep-navy background
          bg = Image.new('RGB', (W, H))
          px = bg.load()
          for y in range(H):
              for x in range(W):
                  nx, ny = x / W, y / H
                  # dark navy base with very restrained blue/violet ambient light
                  blue_glow = math.exp(-((nx-0.16)/0.27)**2 - ((ny-0.10)/0.32)**2)
                  violet_glow = math.exp(-((nx-0.88)/0.30)**2 - ((ny-0.70)/0.35)**2)
                  center_glow = math.exp(-((nx-0.55)/0.42)**2 - ((ny-0.55)/0.60)**2)
                  r = int(3 + 5*center_glow + 8*violet_glow)
                  g = int(7 + 11*center_glow + 4*violet_glow + 7*blue_glow)
                  b = int(19 + 22*center_glow + 30*blue_glow + 21*violet_glow)
                  px[x, y] = (min(r,255), min(g,255), min(b,255))

          canvas = bg.convert('RGBA')

          # Soft ambient glows
          glows = Image.new('RGBA', (W, H), (0,0,0,0))
          gd = ImageDraw.Draw(glows)
          gd.ellipse((-250,-300,1050,760), fill=(17,75,255,48))
          gd.ellipse((1850,300,3300,1450), fill=(137,34,255,38))
          gd.ellipse((1050,400,2150,1200), fill=(14,96,255,18))
          glows = glows.filter(ImageFilter.GaussianBlur(155))
          canvas = Image.alpha_composite(canvas, glows)

          # Elegant audio contour artwork: custom, restrained, no floor / no space motifs
          wave_glow = Image.new('RGBA', (W, H), (0,0,0,0))
          wgd = ImageDraw.Draw(wave_glow)
          wave_lines = Image.new('RGBA', (W, H), (0,0,0,0))
          wd = ImageDraw.Draw(wave_lines)

          def curve_y(x, phase=0.0, offset=0.0, amp=1.0):
              t = x / W
              return (720 + offset
                      + 118*amp*math.sin(t*2.55*math.pi + phase)
                      + 44*amp*math.sin(t*5.1*math.pi + phase*0.55))

          # layered fine lines: more fantasy than a stock waveform, still minimal
          for i in range(23):
              off = (i-11)*8
              alpha = max(14, 55 - abs(i-11)*3)
              pts=[]
              for x in range(-80, W+81, 12):
                  y = curve_y(x, phase=0.10, offset=off, amp=1.0)
                  pts.append((x,y))
              # subtle blue -> violet impression using split segments
              mid = len(pts)//2
              wd.line(pts[:mid+1], fill=(35,111,255,alpha), width=2)
              wd.line(pts[mid:], fill=(139,58,255,alpha), width=2)

          # one luminous hero contour
          pts=[]
          for x in range(-80, W+81, 8):
              pts.append((x, curve_y(x, phase=0.10, offset=0, amp=1.0)))
          wgd.line(pts, fill=(57,118,255,120), width=14)
          wgd.line(pts[len(pts)//2:], fill=(190,52,255,125), width=14)
          wave_glow = wave_glow.filter(ImageFilter.GaussianBlur(26))
          canvas = Image.alpha_composite(canvas, wave_glow)
          canvas = Image.alpha_composite(canvas, wave_lines)

          # Secondary ultra-thin contour on far right for visual rhythm
          detail = Image.new('RGBA', (W,H), (0,0,0,0))
          dd = ImageDraw.Draw(detail)
          for i in range(9):
              pts=[]
              for x in range(1800, W+50, 14):
                  t=(x-1800)/(W-1800)
                  y=375 + 72*math.sin(t*2.2*math.pi + i*0.035) + i*8
                  pts.append((x,y))
              dd.line(pts, fill=(106,54,255,20+i*2), width=1)
          canvas = Image.alpha_composite(canvas, detail)

          # Official logo, extracted from its original raster asset (no redraw)
          logo = Image.open(logo_path).convert('RGBA')
          # If the source has an opaque near-black backdrop, soften it to transparency.
          if logo.getextrema()[3] == (255,255):
              data=[]
              for r,g,b,a in logo.getdata():
                  m=max(r,g,b)
                  if m < 18:
                      na=0
                  elif m < 48:
                      na=int((m-18)/30*210)
                  else:
                      na=255
                  data.append((r,g,b,na))
              logo.putdata(data)
          bbox = logo.getbbox()
          if bbox:
              logo = logo.crop(bbox)
          max_w, max_h = 820, 830
          scale = min(max_w/logo.width, max_h/logo.height)
          logo = logo.resize((int(logo.width*scale), int(logo.height*scale)), Image.Resampling.LANCZOS)

          # restrained logo halo
          halo = Image.new('RGBA', (W,H), (0,0,0,0))
          hd = ImageDraw.Draw(halo)
          lx, ly = 145, 115
          hd.ellipse((lx-80,ly-90,lx+logo.width+90,ly+logo.height+90), fill=(38,74,255,28))
          halo = halo.filter(ImageFilter.GaussianBlur(100))
          canvas = Image.alpha_composite(canvas, halo)
          canvas.alpha_composite(logo, (lx,ly))

          # Typography on the right
          font_bold_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font_reg_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold = ImageFont.truetype(font_bold_path, 128)
          sub = ImageFont.truetype(font_reg_path, 43)
          badge_font = ImageFont.truetype(font_reg_path, 38)

          tx, ty = 1390, 270

          def gradient_text(text, xy, font, start=(245,248,255), end=(188,59,255)):
              x,y=xy
              mask=Image.new('L',(W,H),0)
              md=ImageDraw.Draw(mask)
              md.text((x,y),text,font=font,fill=255,stroke_width=0)
              box=mask.getbbox()
              if not box: return
              grad=Image.new('RGBA',(W,H),(0,0,0,0))
              gp=grad.load()
              x0,y0,x1,y1=box
              span=max(1,x1-x0)
              for xx in range(x0,x1):
                  q=(xx-x0)/span
                  col=tuple(int(start[k]*(1-q)+end[k]*q) for k in range(3))
                  for yy in range(y0,y1):
                      gp[xx,yy]=(*col,255)
              grad.putalpha(mask)
              canvas.alpha_composite(grad)

          # First line neutral, second line brand gradient
          text_layer=Image.new('RGBA',(W,H),(0,0,0,0))
          td=ImageDraw.Draw(text_layer)
          td.text((tx,ty),'Play beyond',font=bold,fill=(247,249,253,255))
          canvas=Image.alpha_composite(canvas,text_layer)
          gradient_text('the obvious.', (tx,ty+142), bold, (218,232,255), (211,54,255))

          sub_layer=Image.new('RGBA',(W,H),(0,0,0,0))
          sd=ImageDraw.Draw(sub_layer)
          sd.text((tx+8,ty+318),'A cleaner space for deep listening.',font=sub,fill=(178,188,218,225))
          canvas=Image.alpha_composite(canvas,sub_layer)

          # Small open-source badge with a discreet GitHub-style mark
          badge = Image.new('RGBA',(W,H),(0,0,0,0))
          bd=ImageDraw.Draw(badge)
          bx,by,bw,bh=tx+8,ty+415,390,82
          bd.rounded_rectangle((bx,by,bx+bw,by+bh),radius=41,fill=(10,16,34,165),outline=(93,118,190,100),width=2)
          # simple monochrome GitHub accent: cat-head silhouette inside a circle
          cx,cy=bx+50,by+41
          bd.ellipse((cx-23,cy-23,cx+23,cy+23),fill=(243,246,252,245))
          bd.polygon([(cx-18,cy-15),(cx-25,cy-29),(cx-8,cy-21)],fill=(243,246,252,245))
          bd.polygon([(cx+18,cy-15),(cx+25,cy-29),(cx+8,cy-21)],fill=(243,246,252,245))
          bd.ellipse((cx-14,cy-11,cx+14,cy+17),fill=(10,16,34,255))
          bd.line((bx+91,by+21,bx+91,by+61),fill=(93,118,190,110),width=2)
          bd.text((bx+116,by+18),'Open source',font=badge_font,fill=(202,210,231,235))
          canvas=Image.alpha_composite(canvas,badge)

          # Very gentle vignette
          vign=Image.new('L',(W,H),0)
          vp=vign.load()
          for y in range(H):
              for x in range(W):
                  dx=(x-W/2)/(W/2); dy=(y-H/2)/(H/2)
                  d=min(1.0,(dx*dx+dy*dy)*0.42)
                  vp[x,y]=int(95*d)
          black=Image.new('RGBA',(W,H),(0,0,0,0)); black.putalpha(vign)
          canvas=Image.alpha_composite(canvas,black)

          final=canvas.convert('RGB')
          final.save(out,'WEBP',quality=92,method=6)
          check=Image.open(out)
          assert check.size==(2880,1080), check.size
          print('rendered',out,check.size,os.path.getsize(out),'bytes')
          PY

      - name: Clean temporary assembler files
        run: |
          rm -f docs/assets/levyra-github-banner-final.webp.b64
          rm -rf docs/assets/.banner_final2_parts docs/assets/.banner_hq_parts docs/assets/.banner_parts docs/assets/.banner_upload_parts
          rm -f docs/assets/levyra-github-banner-fix.webp.b64
          rm -f .github/workflows/assemble-levyra-banner-final.yml

      - name: Commit final banner
        run: |
          git config user.name "LUC4N3X"
          git config user.email "luca.testing96@gmail.com"
          git add -A
          git commit -m "docs(assets): replace GitHub banner with final HQ artwork" || exit 0
          git push origin HEAD:docs/refresh-levyra-github-banner-pro
