name: Apply PR 318 compact resume card

on:
  push:
    branches:
      - fix/home-resume-orbit-live

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply compact Continue Listening patch
        run: python scripts/apply_pr318_compact_resume.py

      - name: Validate diff
        run: git diff --check

      - name: Compile Android UI
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit final PR changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-pr318-compact-resume.yml \
            scripts/apply_pr318_compact_resume.py
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt
          git diff --cached --check
          git commit -m "fix(home): make Continue Listening compact"
          git push origin HEAD:fix/home-resume-orbit-live
