name: Verify Official Video Mapping

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'feat/central-ytm-editorial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEVYRA_EDITORIAL_YTM_COOKIE: ${{ secrets.LEVYRA_EDITORIAL_YTM_COOKIE }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply official-video resolver
        run: python tools/apply_web_official_video_mapping.py
      - name: Install collector
        run: python -m pip install --disable-pip-version-check -e "tools/levyra-editorial[dev]"
      - name: Static checks and unit tests
        run: |
          set -euo pipefail
          python -m compileall -q tools/levyra-editorial/levyra_editorial
          ruff check --fix tools/levyra-editorial/tests/test_youtube_music.py
          ruff check tools/levyra-editorial
          pytest -q tools/levyra-editorial/tests
      - name: Verify Dai Dai against live sources
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LEVYRA_EDITORIAL_YTM_COOKIE:-}"
          python - <<'PY'
          import os
          from levyra_editorial.youtube_music import YoutubeMusicWebClient

          client = YoutubeMusicWebClient(
              os.environ["LEVYRA_EDITORIAL_YTM_COOKIE"],
              workers=1,
              timeout_seconds=12,
          )
          try:
              result = client.resolve("Dai Dai", "Shakira, Burna Boy", 223_448)
          finally:
              client.close()

          assert result is not None, "Dai Dai mapping is missing"
          assert result.get("videoId") == "fcnDmrtj6Sk", result
          assert result.get("videoId") != "NWU1m16yzAY", result
          assert result.get("audioVideoId"), result
          assert result.get("audioVideoId") != result.get("videoId"), result
          print({
              "audioVideoId": result.get("audioVideoId"),
              "videoId": result.get("videoId"),
              "confidence": result.get("confidence"),
          })
          PY
      - name: Commit verified resolver
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm -f tools/apply_web_official_video_mapping.py .github/.diagnose-dai-dai-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/levyra-editorial/levyra_editorial/youtube_music.py \
            tools/levyra-editorial/tests/test_youtube_music.py
          git commit -m "fix(video): resolve official videos through artist-verified YouTube search"
          git push origin "HEAD:$HEAD_REF"
