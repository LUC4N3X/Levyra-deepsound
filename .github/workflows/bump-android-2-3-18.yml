name: Bump Android 2.3.18

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bump-android-2-3-18.yml"

permissions:
  contents: write

concurrency:
  group: bump-android-2-3-18
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update Android release version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          version_files = [
              Path("gradle.properties"),
              Path("app/build.gradle.kts"),
              Path("README.md"),
              Path("RELEASE_NOTES.md"),
              Path("docs/ARCHITECTURE.md"),
              Path("app/src/main/java/com/luc4n3x/levyra/data/YoutubeLocalDecoder.kt"),
              Path("app/src/main/java/com/luc4n3x/levyra/data/OfficialArtworkRepository.kt"),
              Path("docs/assets/levyra-release.svg"),
              Path("docs/assets/levyra-android-platform.svg"),
          ]

          changed = []
          for path in version_files:
              text = path.read_text(encoding="utf-8")
              updated = text.replace("2.3.17", "2.3.18").replace("2031700", "2031800")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          if not changed:
              raise SystemExit("No Android version references were updated")

          expected = {
              "gradle.properties": ("levyraVersionName=2.3.18", "levyraVersionCode=2031800"),
              "app/build.gradle.kts": ('"2.3.18"',),
              "README.md": ("levyraVersionName=2.3.18", "levyraVersionCode=2031800"),
              "RELEASE_NOTES.md": ("# Levyra 2.3.18", "- Version name: `2.3.18`", "- Version code: `2031800`"),
              "docs/ARCHITECTURE.md": ("**Current application version:** 2.3.18",),
              "app/src/main/java/com/luc4n3x/levyra/data/YoutubeLocalDecoder.kt": ("Levyra/2.3.18 Android local-decoder",),
              "app/src/main/java/com/luc4n3x/levyra/data/OfficialArtworkRepository.kt": ("Levyra/2.3.18 Android",),
              "docs/assets/levyra-release.svg": ("v2.3.18",),
              "docs/assets/levyra-android-platform.svg": ("v2.3.18",),
          }
          for filename, markers in expected.items():
              text = Path(filename).read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f"Missing expected marker in {filename}: {marker}")

          for path in version_files:
              text = path.read_text(encoding="utf-8")
              if "2.3.17" in text or "2031700" in text:
                  raise SystemExit(f"Stale Android version remains in {path}")

          print("Updated Android release files:")
          for path in changed:
              print(f"- {path}")
          PY

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gradle.properties \
            app/build.gradle.kts \
            README.md \
            RELEASE_NOTES.md \
            docs/ARCHITECTURE.md \
            app/src/main/java/com/luc4n3x/levyra/data/YoutubeLocalDecoder.kt \
            app/src/main/java/com/luc4n3x/levyra/data/OfficialArtworkRepository.kt \
            docs/assets/levyra-release.svg \
            docs/assets/levyra-android-platform.svg
          git diff --cached --check
          git commit -m "chore(release): bump Android version to 2.3.18"
          git push origin HEAD:main
