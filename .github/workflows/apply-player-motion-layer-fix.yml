name: Apply Player Motion Layer Fix

# One-shot branch repair; the job deletes this workflow after applying the patch.
on:
  push:
    branches:
      - agent/scalable-canvas-index
    paths:
      - .github/workflows/apply-player-motion-layer-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/scalable-canvas-index
          fetch-depth: 0

      - name: Move motion layer inside artwork frame
        run: python3 scripts/apply_player_motion_layer_fix.py

      - name: Remove one-shot helper
        run: |
          rm scripts/apply_player_motion_layer_fix.py
          rm .github/workflows/apply-player-motion-layer-fix.yml

      - name: Commit artwork layer fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
                  scripts/apply_player_motion_layer_fix.py \
                  .github/workflows/apply-player-motion-layer-fix.yml
          git commit -m "fix(player): place motion inside artwork frame"
          git push origin HEAD:agent/scalable-canvas-index
