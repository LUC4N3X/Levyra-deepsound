name: Temporary PR 360 final fixes

on:
  push:
    branches:
      - agent/fix-localization-region-consistency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-localization-region-consistency
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          models = "app/src/main/java/com/luc4n3x/levyra/domain/Models.kt"
          replace(models, "import java.util.Locale\n", "")
          replace(
              models,
              '''    fun defaultRegionForLanguage(\n        languageCode: String,\n        deviceCountry: String = Locale.getDefault().country\n    ): ChartRegion {\n        val normalizedCountry = deviceCountry.trim().lowercase(Locale.ROOT)\n        val deviceRegion = regions.firstOrNull { candidate ->\n            candidate.country.equals(normalizedCountry, ignoreCase = true) ||\n                candidate.id.equals(normalizedCountry, ignoreCase = true)\n        }\n        return deviceRegion ?: region(LevyraContentLocales.forLanguage(languageCode).chartRegionId)\n    }\n''',
              '''    fun defaultRegionForLanguage(languageCode: String): ChartRegion =\n        region(LevyraContentLocales.forLanguage(languageCode).chartRegionId)\n'''
          )

          screen = "app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt"
          replace(
              screen,
              "import com.luc4n3x.levyra.ui.i18n.LocalLevyraStrings\n",
              "import com.luc4n3x.levyra.ui.i18n.LocalLevyraStrings\nimport com.luc4n3x.levyra.ui.i18n.formatLibraryBytes\n"
          )
          replace(screen, "formatBytes(item.download.sizeBytes)", "strings.formatLibraryBytes(item.download.sizeBytes)")

          overview = "app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryOverviewComponents.kt"
          replace(
              overview,
              "import com.luc4n3x.levyra.ui.i18n.LocalLevyraStrings\n",
              "import com.luc4n3x.levyra.ui.i18n.LocalLevyraStrings\nimport com.luc4n3x.levyra.ui.i18n.formatLibraryDuration\n"
          )
          replace(overview, "text = formatListeningTime(pulse.totalListenMs),", "text = strings.formatLibraryDuration(pulse.totalListenMs),")
          replace(
              overview,
              '''\nprivate fun formatListeningTime(totalMs: Long): String {\n    val totalMinutes = (totalMs / 60_000L).coerceAtLeast(0L)\n    if (totalMinutes < 60L) return "$totalMinutes min"\n    val hours = totalMinutes / 60L\n    val minutes = totalMinutes % 60L\n    return if (minutes == 0L) "${hours}h" else "${hours}h ${minutes}m"\n}\n''',
              "\n"
          )

          locale_test = "app/src/test/java/com/luc4n3x/levyra/domain/LevyraContentLocalesTest.kt"
          replace(
              locale_test,
              '''            assertEquals(\n                locale.chartRegionId,\n                ChartsCatalog.defaultRegionForLanguage(language.code, deviceCountry = "").id\n            )\n''',
              '''            assertEquals(locale.chartRegionId, ChartsCatalog.defaultRegionForLanguage(language.code).id)\n'''
          )
          replace(
              locale_test,
              '''    @Test\n    fun supportedDeviceRegionIsIndependentFromUiLanguage() {\n        assertEquals("pt", ChartsCatalog.defaultRegionForLanguage("en", "PT").id)\n        assertEquals("br", ChartsCatalog.defaultRegionForLanguage("pt", "BR").id)\n        assertEquals("jp", ChartsCatalog.defaultRegionForLanguage("fr", "JP").id)\n        assertEquals("it", ChartsCatalog.defaultRegionForLanguage("ja", "IT").id)\n    }\n''',
              '''    @Test\n    fun initialChartRegionFollowsUiLanguage() {\n        assertEquals("it", ChartsCatalog.defaultRegionForLanguage("it").id)\n        assertEquals("pt", ChartsCatalog.defaultRegionForLanguage("pt").id)\n        assertEquals(LevyraContentLocales.forLanguage("ja").chartRegionId, ChartsCatalog.defaultRegionForLanguage("ja").id)\n    }\n'''
          )

          regression = "app/src/test/java/com/luc4n3x/levyra/ui/i18n/LibraryLocalizationRegressionTest.kt"
          replace(regression, "import org.junit.Assert.assertFalse\n", "import org.junit.Assert.assertEquals\nimport org.junit.Assert.assertFalse\n")
          insert = '''\n    @Test\n    fun libraryValueFormattersFollowSelectedLocale() {\n        val strings = LevyraStrings.forCode("it")\n        assertEquals("1 h 30 min", strings.formatLibraryDuration(90L * 60_000L))\n        assertEquals("1,5 GB", strings.formatLibraryBytes((1.5 * 1024 * 1024 * 1024).toLong()))\n    }\n'''
          p = Path(regression)
          text = p.read_text()
          if insert.strip() not in text:
              pos = text.rfind("\n}")
              if pos < 0:
                  raise SystemExit("test class closing brace not found")
              p.write_text(text[:pos] + insert + text[pos:])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/domain/Models.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/library/LevyraLibraryScreen.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/library/LibraryOverviewComponents.kt \
                  app/src/test/java/com/luc4n3x/levyra/domain/LevyraContentLocalesTest.kt \
                  app/src/test/java/com/luc4n3x/levyra/ui/i18n/LibraryLocalizationRegressionTest.kt
          git commit -m "fix(android): finish localized library and chart defaults"
          git push origin HEAD:agent/fix-localization-region-consistency

          git rm .github/workflows/tmp-pr360-final-fixes.yml
          git commit -m "chore(ci): remove temporary PR 360 workflow"
          git push origin HEAD:agent/fix-localization-region-consistency
