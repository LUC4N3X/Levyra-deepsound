name: Apply Premium Player Motion

on:
  push:
    branches:
      - agent/scalable-canvas-index
    paths:
      - .github/workflows/apply-premium-player-motion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/scalable-canvas-index
          fetch-depth: 0

      - name: Apply premium motion pass
        run: python3 scripts/apply_premium_player_motion.py

      - name: Remove one-shot helper
        run: |
          rm scripts/apply_premium_player_motion.py
          rm .github/workflows/apply-premium-player-motion.yml

      - name: Commit player motion
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/MotionArtworkLayer.kt \
                  scripts/apply_premium_player_motion.py \
                  .github/workflows/apply-premium-player-motion.yml
          git commit -m "feat(player): add premium whole-card artwork motion"
          git push origin HEAD:agent/scalable-canvas-index
