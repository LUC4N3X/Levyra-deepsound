name: Review Hardening PR 424

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/review_hardening_pr424.py
      - .github/workflows/review-hardening-pr424.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/desktop-audio-and-local-library
          fetch-depth: 0
      - name: Align patch anchors with current head
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          app_text = app.read_text(encoding='utf-8')
          app_text = app_text.replace(
              'import coil3.request.allowHardware\nimport coil3.request.bitmapConfig\n',
              '',
              1,
          )
          app.write_text(app_text, encoding='utf-8')

          path = Path('.github/scripts/review_hardening_pr424.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import_anchor = "import coil3.request.CachePolicy\\nimport coil3.request.ImageRequest\\nimport coil3.request.crossfade\\n"',
              'import_anchor = "import coil3.toBitmap\\nimport coil3.request.CachePolicy\\nimport coil3.request.ImageRequest\\nimport coil3.request.crossfade\\n"',
              1,
          )
          text = text.replace(
              '        "import coil3.request.CachePolicy\\n"\n',
              '        "import coil3.toBitmap\\n"\n        "import coil3.request.CachePolicy\\n"\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply review hardening
        run: python3 .github/scripts/review_hardening_pr424.py
      - name: Validate diff
        run: git diff --check
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app desktop
          git commit -m "fix: harden player cold start and desktop transitions"
          git push origin HEAD:feature/desktop-audio-and-local-library

# Temporary workflow: removed immediately after the scoped patch is applied.
