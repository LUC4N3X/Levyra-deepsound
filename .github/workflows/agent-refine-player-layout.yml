name: Agent Refine Player Layout

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/pixel-inspired-player
          fetch-depth: 0

      - name: Apply responsive player layout
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          controls_path = Path("app/src/main/java/com/luc4n3x/levyra/ui/components/PlayerControls.kt")
          controls = controls_path.read_text(encoding="utf-8")

          controls = replace_once(
              controls,
              "import androidx.compose.material.icons.rounded.Pause\n",
              "import androidx.compose.material.icons.rounded.KeyboardArrowDown\nimport androidx.compose.material.icons.rounded.Pause\n",
              "keyboard arrow import",
          )
          controls = replace_once(
              controls,
              "import androidx.compose.ui.draw.shadow\n",
              "import androidx.compose.ui.draw.rotate\nimport androidx.compose.ui.draw.shadow\n",
              "rotate import",
          )
          controls = replace_once(
              controls,
              "    val next: String,\n    val repeat: String\n)",
              "    val next: String,\n    val repeat: String,\n    val options: String\n)",
              "control labels",
          )
          controls = replace_once(
              controls,
              "    val stackSpacing: Dp,\n    val modeRowPadding: Dp,\n    val modeRailPadding: Dp\n)",
              "    val stackSpacing: Dp,\n    val modeRowPadding: Dp\n)",
              "transport metric fields",
          )
          for label, old in (
              ("compact rail metric", "            modeRowPadding = LevyraPlayerDesign.ModeRowPaddingCompact,\n            modeRailPadding = LevyraPlayerDesign.ModeRailPaddingCompact\n"),
              ("regular rail metric", "            modeRowPadding = LevyraPlayerDesign.ModeRowPadding,\n            modeRailPadding = LevyraPlayerDesign.ModeRailPadding\n"),
          ):
              controls = replace_once(
                  controls,
                  old,
                  old.split(",\n            modeRailPadding")[0] + "\n",
                  label,
              )
          controls = replace_once(
              controls,
              "    repeatOn: Boolean,\n    repeatOne: Boolean,\n    accents: PlayerAccentColors,",
              "    repeatOn: Boolean,\n    repeatOne: Boolean,\n    advancedExpanded: Boolean,\n    hasAdvancedState: Boolean,\n    accents: PlayerAccentColors,",
              "transport state parameters",
          )
          controls = replace_once(
              controls,
              "    onNext: () -> Unit,\n    onRepeat: () -> Unit,\n    modifier: Modifier = Modifier",
              "    onNext: () -> Unit,\n    onRepeat: () -> Unit,\n    onAdvancedToggle: () -> Unit,\n    modifier: Modifier = Modifier",
              "transport callbacks",
          )

          row_start = controls.index(
              "        Row(\n"
              "            modifier = Modifier\n"
              "                .fillMaxWidth()\n"
              "                .padding(horizontal = metrics.modeRowPadding),\n"
              "            verticalAlignment = Alignment.CenterVertically\n"
              "        ) {"
          )
          mode_button_marker = "\n@Composable\nprivate fun PlayerModeToggleButton("
          row_end = controls.index(mode_button_marker, row_start)
          replacement = '''        Row(
            modifier = Modifier
                .fillMaxWidth()
                .padding(horizontal = metrics.modeRowPadding),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.SpaceBetween
        ) {
            PlayerModeToggleButton(
                icon = Icons.Rounded.Shuffle,
                contentDescription = labels.shuffle,
                active = shuffleOn,
                accent = accents.primary,
                accentTarget = accents.primaryTarget,
                compact = compact,
                animated = animated,
                onClick = onShuffle
            )
            PlayerAdvancedToggleButton(
                expanded = advancedExpanded,
                hasActiveState = hasAdvancedState,
                primary = accents.primary,
                secondary = accents.secondary,
                compact = compact,
                animated = animated,
                contentDescription = labels.options,
                onClick = onAdvancedToggle
            )
            PlayerModeToggleButton(
                icon = if (repeatOne) Icons.Rounded.RepeatOne else Icons.Rounded.Repeat,
                contentDescription = labels.repeat,
                active = repeatOn,
                accent = accents.secondary,
                accentTarget = accents.secondaryTarget,
                compact = compact,
                animated = animated,
                onClick = onRepeat
            )
        }
    }
}

@Composable
private fun PlayerAdvancedToggleButton(
    expanded: Boolean,
    hasActiveState: Boolean,
    primary: Color,
    secondary: Color,
    compact: Boolean,
    animated: Boolean,
    contentDescription: String,
    onClick: () -> Unit
) {
    val metrics = remember(compact) { playerModeMetrics(compact) }
    val motionSpec: AnimationSpec<Float> =
        if (animated) LevyraPlayerDesign.standardTween(180) else snap()
    val rotation by animateFloatAsState(
        targetValue = if (expanded) 180f else 0f,
        animationSpec = motionSpec,
        label = "player-advanced-toggle-rotation"
    )
    val emphasis by animateFloatAsState(
        targetValue = if (expanded || hasActiveState) 0.34f else 0.18f,
        animationSpec = motionSpec,
        label = "player-advanced-toggle-emphasis"
    )

    SpringIconButton(
        onClick = onClick,
        modifier = Modifier
            .sizeIn(
                minWidth = LevyraPlayerDesign.MinimumTouchTarget,
                minHeight = LevyraPlayerDesign.MinimumTouchTarget
            )
            .semantics { toggleableState = ToggleableState(expanded) },
        pressedScale = 0.92f,
        contentDescription = contentDescription
    ) {
        Box(
            modifier = Modifier
                .size(width = metrics.width, height = metrics.height)
                .background(
                    Brush.linearGradient(
                        listOf(
                            primary.copy(alpha = emphasis),
                            secondary.copy(alpha = emphasis)
                        )
                    ),
                    LevyraPlayerDesign.ShapePill
                )
                .border(
                    BorderStroke(
                        LevyraPlayerDesign.Hairline,
                        Color.White.copy(alpha = if (expanded) 0.22f else 0.12f)
                    ),
                    LevyraPlayerDesign.ShapePill
                ),
            contentAlignment = Alignment.Center
        ) {
            Icon(
                imageVector = Icons.Rounded.KeyboardArrowDown,
                contentDescription = null,
                tint = LevyraPlayerDesign.TextPrimary,
                modifier = Modifier
                    .size(metrics.iconSize)
                    .rotate(rotation)
            )
            if (hasActiveState && !expanded) {
                Box(
                    modifier = Modifier
                        .align(Alignment.TopEnd)
                        .padding(
                            top = LevyraPlayerDesign.ModeIndicatorTopInset,
                            end = LevyraPlayerDesign.ModeIndicatorEndInset
                        )
                        .size(LevyraPlayerDesign.ModeIndicator)
                        .background(Color.White, CircleShape)
                )
            }
        }
    }
}
'''
          controls = controls[:row_start] + replacement + controls[row_end:]
          controls_path.write_text(controls, encoding="utf-8")

          app_path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              "            next = strings.next,\n            repeat = strings.repeat\n",
              "            next = strings.next,\n            repeat = strings.repeat,\n            options = strings.options\n",
              "player labels call",
          )
          app = replace_once(
              app,
              '''        val compactPlayer = maxWidth < 380.dp || maxHeight < 700.dp
        var advancedControlsExpanded by remember(track?.id) {
            mutableStateOf(false)
        }
        val playerHorizontalPadding = when {
            state.isVideoMode -> LevyraPlayerDesign.SpaceSm
            compactPlayer -> LevyraPlayerDesign.GutterCompact
            else -> LevyraPlayerDesign.Gutter
        }
        val playerItemSpacing = if (compactPlayer) LevyraPlayerDesign.SpaceSm else LevyraPlayerDesign.SpaceMd
        val artworkSize = minOf(
            (maxWidth - playerHorizontalPadding * 2f).coerceAtLeast(180.dp),
            520.dp
        )
''',
              '''        val compactPlayer = maxWidth < 420.dp || maxHeight < 860.dp
        var advancedControlsExpanded by remember(track?.id) {
            mutableStateOf(false)
        }
        val playerHorizontalPadding = when {
            state.isVideoMode -> LevyraPlayerDesign.SpaceSm
            compactPlayer -> LevyraPlayerDesign.GutterCompact
            else -> LevyraPlayerDesign.Gutter
        }
        val playerItemSpacing = if (compactPlayer) 6.dp else 9.dp
        val artworkLimit = if (compactPlayer) 330.dp else 410.dp
        val reservedPlayerHeight = if (compactPlayer) 500.dp else 540.dp
        val availableArtworkHeight = (maxHeight - reservedPlayerHeight)
            .coerceIn(220.dp, artworkLimit)
        val artworkSize = minOf(
            (maxWidth - playerHorizontalPadding * 2f).coerceAtLeast(180.dp),
            availableArtworkHeight,
            artworkLimit
        )
''',
              "responsive artwork block",
          )
          app = replace_once(
              app,
              '''                top = if (compactPlayer) 8.dp else 10.dp,
                bottom = if (compactPlayer) 28.dp else 34.dp
''',
              '''                top = if (compactPlayer) 5.dp else 8.dp,
                bottom = if (compactPlayer) 12.dp else 18.dp
''',
              "player content padding",
          )
          app = replace_once(
              app,
              "                                    fontSize = if (compactPlayer) 24.sp else 26.sp,\n                                    lineHeight = if (compactPlayer) 26.sp else 28.sp,",
              "                                    fontSize = if (compactPlayer) 22.sp else 24.sp,\n                                    lineHeight = if (compactPlayer) 24.sp else 26.sp,",
              "track title metrics",
          )
          app = replace_once(
              app,
              "                                        fontSize = if (compactPlayer) 14.sp else 15.sp,",
              "                                        fontSize = if (compactPlayer) 13.sp else 14.sp,",
              "artist metrics",
          )
          app = replace_once(
              app,
              '''                        repeatOn = state.repeatMode != com.luc4n3x.levyra.domain.RepeatMode.Off,
                        repeatOne = state.repeatMode == com.luc4n3x.levyra.domain.RepeatMode.One,
                        accents = playerAccentColors,
''',
              '''                        repeatOn = state.repeatMode != com.luc4n3x.levyra.domain.RepeatMode.Off,
                        repeatOne = state.repeatMode == com.luc4n3x.levyra.domain.RepeatMode.One,
                        advancedExpanded = advancedControlsExpanded,
                        hasAdvancedState = state.playbackSpeed != 1f || state.sleepTimerMinutes > 0 || state.isOfflineExporting,
                        accents = playerAccentColors,
''',
              "advanced transport state",
          )
          app = replace_once(
              app,
              '''                        onNext = viewModel::next,
                        onRepeat = viewModel::toggleRepeat,
                        modifier = Modifier.padding(vertical = LevyraPlayerDesign.SpaceXs)
''',
              '''                        onNext = viewModel::next,
                        onRepeat = viewModel::toggleRepeat,
                        onAdvancedToggle = { advancedControlsExpanded = !advancedControlsExpanded },
                        modifier = Modifier
''',
              "advanced transport callback",
          )
          app = replace_once(
              app,
              '''                item {
                    LevyraControlPulseHandle(
                        expanded = advancedControlsExpanded,
                        compact = compactPlayer,
                        activeColor = primary,
                        secondaryColor = secondary,
                        hasActiveState = state.playbackSpeed != 1f || state.sleepTimerMinutes > 0 || state.isOfflineExporting,
                        onToggle = { advancedControlsExpanded = !advancedControlsExpanded }
                    )
                }
''',
              "",
              "standalone advanced handle",
          )

          handle_start = app.index("@Composable\nprivate fun LevyraControlPulseHandle(")
          utility_marker = "@Composable\nprivate fun PlayerUtilityDock("
          handle_end = app.index(utility_marker, handle_start)
          app = app[:handle_start] + app[handle_end:]
          app_path.write_text(app, encoding="utf-8")
          PY

      - name: Commit refinement
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt \
                  app/src/main/java/com/luc4n3x/levyra/ui/components/PlayerControls.kt
          git commit -m "refactor(player): fit core controls without scrolling"
          git push origin HEAD:agent/pixel-inspired-player
