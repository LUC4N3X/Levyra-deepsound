name: Normalize PR769 settle formatting once

on:
  push:
    branches:
      - fix/player-morph-motion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/player-morph-motion
          fetch-depth: 0

      - name: Normalize only the verified settle block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<i>[ ]*)playerExpansion\.animateTo\(\n'
              r'[ ]*target,\n'
              r'[ ]*if \(target > playerExpansion\.value\) \{\n'
              r'[ ]*LevyraPlayerDesign\.expandSpring\(\)\n'
              r'[ ]*\} else \{\n'
              r'[ ]*LevyraPlayerDesign\.collapseSpring\(\)\n'
              r'[ ]*\}\n'
              r'[ ]*\)'
          )

          def repl(match):
              i = match.group('i')
              return (
                  i + 'playerExpansion.animateTo(\n' +
                  i + '    target,\n' +
                  i + '    if (target > playerExpansion.value) {\n' +
                  i + '        LevyraPlayerDesign.expandSpring()\n' +
                  i + '    } else {\n' +
                  i + '        LevyraPlayerDesign.collapseSpring()\n' +
                  i + '    }\n' +
                  i + ')'
              )

          updated, count = pattern.subn(repl, text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one directional settle block, found {count}')
          path.write_text(updated)
          PY

          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt"

      - name: Remove workflow and push formatting-only commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr769-format-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/pr769-format-final-once.yml
          git diff --cached --check
          git commit -m "style(player): align directional settle block"
          git push origin HEAD:fix/player-morph-motion
