name: PR637 CodeFactor Diagnostics

on:
  push:
    branches:
      - feat/system-player-experience

permissions:
  checks: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read CodeFactor annotations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          for attempt in {1..30}; do
            checks="$(curl -fsSL "${auth[@]}" "${api}/commits/${GITHUB_SHA}/check-runs")"
            check_id="$(jq -r '.check_runs[] | select(.name == "CodeFactor") | .id' <<<"${checks}" | head -n1)"
            status="$(jq -r '.check_runs[] | select(.name == "CodeFactor") | .status' <<<"${checks}" | head -n1)"
            if [[ -n "${check_id}" && "${check_id}" != "null" && "${status}" == "completed" ]]; then
              echo "CODEFACTOR_CHECK_ID=${check_id}"
              curl -fsSL "${auth[@]}" "${api}/check-runs/${check_id}/annotations" | jq .
              exit 0
            fi
            sleep 2
          done
          echo "CodeFactor did not complete in time" >&2
          exit 1
