name: Home Order Pass

on:
  push:
    branches:
      - chatgpt/home-visual-hierarchy

permissions:
  contents: write

concurrency:
  group: home-order-pass
  cancel-in-progress: false

jobs:
  refine:
    if: ${{ github.actor == 'LUC4N3X' && !contains(github.event.head_commit.message, 'Refine Home shelf hierarchy') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chatgpt/home-visual-hierarchy
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-disabled: true

      - name: Apply ordered Home shelves
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt')
          text = path.read_text()

          def block(source: str, start: str, end: str) -> str:
              start_index = source.index(start)
              end_index = source.index(end, start_index)
              return source[start_index:end_index]

          orbit_before = block(text, '@Composable\nprivate fun PersonalListeningShelf(', '@Composable\nprivate fun HomeOrbitTrackCard(')
          quick_before = block(text, '@Composable\nprivate fun HomeQuickPicksShelf(', '@Composable\nprivate fun HomeQuickPickRow(')

          old_constants = '''private val HOME_COLLECTION_CARD_WIDTH = 236.dp
          private val HOME_COLLECTION_CARD_HEIGHT = 112.dp
          private val HOME_ALBUM_CARD_WIDTH = 150.dp'''
          new_constants = '''private val HOME_COLLECTION_CARD_WIDTH = 154.dp
          private val HOME_ALBUM_CARD_WIDTH = 154.dp
          private val HOME_ARTIST_CARD_WIDTH = 148.dp
          private val HOME_ARTIST_ARTWORK_SIZE = 140.dp'''
          if old_constants not in text:
              raise SystemExit('Home sizing constants no longer match expected source')
          text = text.replace(old_constants, new_constants, 1)

          collections = r'''@Composable
          private fun HomeEditorialCollectionsShelf(
              collections: List<HomeEditorialCollection>,
              animationsEnabled: Boolean,
              onOpen: (HomeEditorialCollection) -> Unit
          ) {
              val strings = LocalLevyraStrings.current
              Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  HomeSectionHeader(
                      title = strings.collectionsTitle,
                      modifier = Modifier.padding(horizontal = HomeHorizontalInset)
                  )
                  LazyRow(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(LevyraHomeDesign.ShelfItemGap),
                      contentPadding = PaddingValues(start = HomeHorizontalInset, end = HOME_COLLECTION_SHELF_END_PADDING)
                  ) {
                      itemsIndexed(
                          items = collections,
                          key = { _, collection -> "home-collection-${collection.id}" },
                          contentType = { _, _ -> "home-collection-card" }
                      ) { _, collection ->
                          HomeEditorialCollectionCard(
                              collection = collection,
                              animationsEnabled = animationsEnabled,
                              onOpen = { onOpen(collection) }
                          )
                      }
                  }
              }
          }

          @Composable
          private fun HomeEditorialCollectionCard(
              collection: HomeEditorialCollection,
              animationsEnabled: Boolean,
              onOpen: () -> Unit
          ) {
              val strings = LocalLevyraStrings.current
              val effectiveAnimationsEnabled = animationsEnabled && LocalAnimationsEnabled.current
              val interaction = remember { MutableInteractionSource() }
              val isPressed by interaction.collectIsPressedAsState()
              val scale by animateFloatAsState(
                  targetValue = if (isPressed && effectiveAnimationsEnabled) 0.975f else 1f,
                  animationSpec = tween(150, easing = FastOutSlowInEasing),
                  label = "homeCollectionScale-${collection.id}"
              )
              val primaryTrack = collection.tracks.firstOrNull()
              val artistLine = collection.tracks
                  .asSequence()
                  .map { it.artist.trim() }
                  .filter(String::isNotBlank)
                  .distinct()
                  .take(2)
                  .joinToString(" · ")
              val artworkShape = LevyraHomeDesign.ArtworkShape

              Column(
                  modifier = Modifier
                      .width(HOME_COLLECTION_CARD_WIDTH)
                      .graphicsLayer {
                          scaleX = scale
                          scaleY = scale
                      }
                      .clickable(
                          interactionSource = interaction,
                          indication = null,
                          onClick = onOpen
                      ),
                  verticalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .aspectRatio(1f)
                          .clip(artworkShape)
                          .background(Brush.linearGradient(listOf(LevyraPanel, LevyraInk)))
                  ) {
                      if (primaryTrack != null) {
                          CoverImage(
                              track = primaryTrack,
                              modifier = Modifier.fillMaxSize(),
                              highRes = false,
                              zoom = 1f
                          )
                      } else {
                          Box(
                              modifier = Modifier.fillMaxSize(),
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  imageVector = Icons.Rounded.AutoAwesome,
                                  contentDescription = null,
                                  tint = LevyraCyan.copy(alpha = 0.78f),
                                  modifier = Modifier.size(40.dp)
                              )
                          }
                      }
                  }
                  Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                      Text(
                          text = homeCollectionTitle(strings, collection),
                          color = LevyraText,
                          fontSize = 14.5.sp,
                          lineHeight = LevyraTypeRhythm.lineHeight(14.5.sp),
                          fontWeight = FontWeight.SemiBold,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis,
                          minLines = 2
                      )
                      if (artistLine.isNotBlank()) {
                          Text(
                              text = artistLine,
                              color = LevyraMuted,
                              fontSize = 12.sp,
                              lineHeight = LevyraTypeRhythm.lineHeight(12.sp),
                              fontWeight = FontWeight.Medium,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                  }
              }
          }

          @Composable
          private fun HomeEditorialArtworkStack('''

          text, count = re.subn(
              r'@Composable\nprivate fun HomeEditorialCollectionsShelf\(.*?\n@Composable\nprivate fun HomeEditorialArtworkStack\(',
              collections,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Collections replacement count was {count}')

          artists_and_resonance = r'''@Composable
          private fun TrendingArtistsShelf(
              artists: List<ArtistHit>,
              loadingSlots: Int,
              onArtistClick: (ArtistHit) -> Unit
          ) {
              val strings = LocalLevyraStrings.current
              Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  HomeSectionHeader(
                      title = strings.artists,
                      modifier = Modifier.padding(horizontal = HomeHorizontalInset)
                  )
                  LazyRow(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(12.dp),
                      contentPadding = PaddingValues(start = HomeHorizontalInset, end = HomeHorizontalShelfEndPadding)
                  ) {
                      itemsIndexed(
                          items = artists,
                          key = { index, artist -> "trending-artist-$index-${artist.browseId.ifBlank { artist.name.trim().lowercase(Locale.ROOT) }}" },
                          contentType = { _, _ -> "trending-artist" }
                      ) { _, artist ->
                          ArtistHitShelfItem(
                              artist = artist,
                              onClick = { onArtistClick(artist) }
                          )
                      }
                      items(
                          count = loadingSlots,
                          key = { index -> "artist-loading-${artists.size + index}" },
                          contentType = { "trending-artist-loading" }
                      ) {
                          TrendingArtistLoadingItem()
                      }
                  }
              }
          }

          @Composable
          private fun ArtistHitShelfItem(
              artist: ArtistHit,
              onClick: () -> Unit
          ) {
              Column(
                  modifier = Modifier.width(HOME_ARTIST_CARD_WIDTH).pressable(onClick = onClick),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(9.dp)
              ) {
                  StableRemoteArtwork(
                      url = artist.thumbnailUrl,
                      contentDescription = artist.name,
                      modifier = Modifier.size(HOME_ARTIST_ARTWORK_SIZE).clip(CircleShape),
                      contentScale = ContentScale.Crop,
                      highRes = true
                  )
                  Text(
                      text = artist.name,
                      color = LevyraText,
                      fontSize = 14.5.sp,
                      lineHeight = LevyraTypeRhythm.lineHeight(14.5.sp),
                      fontWeight = FontWeight.SemiBold,
                      textAlign = TextAlign.Center,
                      maxLines = 2,
                      overflow = TextOverflow.Ellipsis,
                      modifier = Modifier.fillMaxWidth()
                  )
              }
          }

          @Composable
          private fun TrendingArtistLoadingItem() {
              Column(
                  modifier = Modifier.width(HOME_ARTIST_CARD_WIDTH),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(9.dp)
              ) {
                  Box(
                      modifier = Modifier
                          .size(HOME_ARTIST_ARTWORK_SIZE)
                          .clip(CircleShape)
                          .levyraShimmer()
                          .background(CinematicGlassDeep)
                  )
                  Box(
                      modifier = Modifier
                          .fillMaxWidth(0.68f)
                          .height(14.dp)
                          .clip(RoundedCornerShape(99.dp))
                          .levyraShimmer()
                          .background(CinematicGlassDeep)
                  )
              }
          }

          @Composable
          private fun ResonanceShelf(
              tracks: List<Track>,
              comments: Map<String, ResonanceCommentSnippet>,
              currentId: String?,
              isPlaying: Boolean,
              isResolving: Boolean,
              onPlay: (Track) -> Unit,
              onOpenComments: (Track) -> Unit
          ) {
              val strings = LocalLevyraStrings.current
              val displayTracks = remember(tracks) { tracks.take(4) }
              if (displayTracks.isEmpty()) return

              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  HomeSectionHeader(
                      title = strings.mostCommentedTracks,
                      modifier = Modifier.padding(horizontal = HomeHorizontalInset)
                  )
                  Column(
                      modifier = Modifier.padding(horizontal = HomeHorizontalInset),
                      verticalArrangement = Arrangement.spacedBy(2.dp)
                  ) {
                      displayTracks.forEach { track ->
                          ResonanceListRow(
                              track = track,
                              snippet = comments[track.id],
                              active = track.id == currentId,
                              isPlaying = isPlaying,
                              isResolving = isResolving,
                              onPlay = { onPlay(track) },
                              onOpenComments = { onOpenComments(track) }
                          )
                      }
                  }
              }
          }

          @Composable
          private fun ResonanceListRow(
              track: Track,
              snippet: ResonanceCommentSnippet?,
              active: Boolean,
              isPlaying: Boolean,
              isResolving: Boolean,
              onPlay: () -> Unit,
              onOpenComments: () -> Unit
          ) {
              val strings = LocalLevyraStrings.current
              val shape = RoundedCornerShape(12.dp)
              val commentCount = snippet?.countText
                  ?.let(::youtubeCommentCountBadge)
                  ?.takeIf(String::isNotBlank)

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .heightIn(min = 66.dp)
                      .clip(shape)
                      .then(
                          if (active) Modifier.background(LevyraCyan.copy(alpha = 0.07f)) else Modifier
                      )
                      .pressable(onClick = onPlay)
                      .padding(horizontal = 4.dp, vertical = 5.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Box(
                      modifier = Modifier
                          .size(54.dp)
                          .clip(RoundedCornerShape(9.dp)),
                      contentAlignment = Alignment.Center
                  ) {
                      CoverImage(track = track, modifier = Modifier.fillMaxSize(), highRes = false)
                      if (active) {
                          Box(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .background(Color.Black.copy(alpha = 0.32f)),
                              contentAlignment = Alignment.Center
                          ) {
                              if (isResolving) {
                                  CircularProgressIndicator(
                                      modifier = Modifier.size(17.dp),
                                      strokeWidth = 2.dp,
                                      color = LevyraCyan
                                  )
                              } else {
                                  ActiveTrackEqualizer(
                                      color = LevyraCyan,
                                      isPlaying = isPlaying,
                                      width = 16.dp,
                                      height = 11.dp
                                  )
                              }
                          }
                      }
                  }

                  Column(
                      modifier = Modifier.weight(1f),
                      verticalArrangement = Arrangement.spacedBy(2.dp)
                  ) {
                      Text(
                          text = track.title,
                          color = if (active) LevyraCyan else LevyraText,
                          fontSize = 14.5.sp,
                          lineHeight = LevyraTypeRhythm.lineHeight(14.5.sp),
                          fontWeight = FontWeight.SemiBold,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                      Text(
                          text = track.artist,
                          color = LevyraMuted,
                          fontSize = 12.sp,
                          lineHeight = LevyraTypeRhythm.lineHeight(12.sp),
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  }

                  Row(
                      modifier = Modifier
                          .heightIn(min = 48.dp)
                          .pressable(onClick = onOpenComments)
                          .padding(horizontal = 5.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(4.dp)
                  ) {
                      Icon(
                          imageVector = Icons.Rounded.ChatBubbleOutline,
                          contentDescription = strings.tapToOpenComments,
                          tint = LevyraMuted,
                          modifier = Modifier.size(16.dp)
                      )
                      when {
                          snippet?.isLoading == true -> CircularProgressIndicator(
                              modifier = Modifier.size(12.dp),
                              strokeWidth = 1.5.dp,
                              color = LevyraMuted
                          )
                          commentCount != null -> Text(
                              text = commentCount,
                              color = LevyraMuted,
                              fontSize = 11.5.sp,
                              fontWeight = FontWeight.Medium,
                              maxLines = 1
                          )
                      }
                      Icon(
                          imageVector = Icons.Rounded.ChevronRight,
                          contentDescription = null,
                          tint = LevyraMuted.copy(alpha = 0.55f),
                          modifier = Modifier.size(15.dp)
                      )
                  }
              }
          }

          @Composable
          private fun ResonanceCommentShimmer('''

          text, count = re.subn(
              r'@Composable\nprivate fun TrendingArtistsShelf\(.*?\n@Composable\nprivate fun ResonanceCommentShimmer\(',
              artists_and_resonance,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Artists/resonance replacement count was {count}')

          album_row = r'''@Composable
          private fun HomeAlbumHitRow(albums: List<AlbumHit>, animationsEnabled: Boolean, onOpen: (AlbumHit) -> Unit) {
              if (albums.isEmpty()) return
              val effectiveAnimationsEnabled = animationsEnabled && LocalAnimationsEnabled.current
              LazyRow(
                  horizontalArrangement = Arrangement.spacedBy(LevyraHomeDesign.ShelfItemGap),
                  contentPadding = PaddingValues(start = HomeHorizontalInset, end = HomeHorizontalShelfEndPadding)
              ) {
                  itemsIndexed(
                      items = albums,
                      key = { index, album -> "home-album-$index-${album.browseId.ifBlank { "${album.title.trim().lowercase()}|${album.artist.trim().lowercase()}" }}" },
                      contentType = { _, _ -> "home-album-card" }
                  ) { _, album ->
                      val interaction = remember { MutableInteractionSource() }
                      val isPressed by interaction.collectIsPressedAsState()
                      val scale by animateFloatAsState(
                          targetValue = if (isPressed && effectiveAnimationsEnabled) 0.975f else 1f,
                          animationSpec = tween(durationMillis = 150, easing = FastOutSlowInEasing),
                          label = "homeAlbumScale"
                      )
                      Column(
                          modifier = Modifier
                              .graphicsLayer {
                                  scaleX = scale
                                  scaleY = scale
                              }
                              .width(HOME_ALBUM_CARD_WIDTH)
                              .clickable(
                                  interactionSource = interaction,
                                  indication = null,
                                  onClick = { onOpen(album) }
                              ),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          val artworkShape = LevyraHomeDesign.ArtworkShape
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .aspectRatio(1f)
                                  .clip(artworkShape)
                                  .background(Brush.linearGradient(listOf(LevyraPanel, LevyraInk)))
                          ) {
                              if (album.thumbnailUrl.isNotBlank()) {
                                  StableRemoteArtwork(
                                      url = album.thumbnailUrl,
                                      contentDescription = album.title,
                                      contentScale = ContentScale.Crop,
                                      modifier = Modifier.fillMaxSize()
                                  )
                              } else {
                                  Box(
                                      modifier = Modifier.fillMaxSize(),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Icon(
                                          imageVector = Icons.Rounded.Album,
                                          contentDescription = null,
                                          tint = LevyraCyan.copy(alpha = 0.78f),
                                          modifier = Modifier.size(42.dp)
                                      )
                                  }
                              }
                          }
                          Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                              Text(
                                  text = album.title,
                                  color = LevyraText,
                                  fontSize = 14.5.sp,
                                  lineHeight = LevyraTypeRhythm.lineHeight(14.5.sp),
                                  fontWeight = FontWeight.SemiBold,
                                  maxLines = 2,
                                  overflow = TextOverflow.Ellipsis,
                                  minLines = 2
                              )
                              Text(
                                  text = album.artist,
                                  color = LevyraMuted,
                                  fontSize = 12.sp,
                                  lineHeight = LevyraTypeRhythm.lineHeight(12.sp),
                                  fontWeight = FontWeight.Medium,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun AlbumCardRow('''

          text, count = re.subn(
              r'@Composable\nprivate fun HomeAlbumHitRow\(.*?\n@Composable\nprivate fun AlbumCardRow\(',
              album_row,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Album replacement count was {count}')

          old_resonance_call = '                            onPlay = { track -> viewModel.playFrom(resonanceTracks, track) },\n                            onPlayAll = { viewModel.playAll(resonanceTracks) },\n                            onOpenComments = { track -> viewModel.openYoutubeCommentsFor(track) }'
          new_resonance_call = '                            onPlay = { track -> viewModel.playFrom(resonanceTracks, track) },\n                            onOpenComments = { track -> viewModel.openYoutubeCommentsFor(track) }'
          if old_resonance_call not in text:
              raise SystemExit('Resonance call site no longer matches expected source')
          text = text.replace(old_resonance_call, new_resonance_call, 1)

          orbit_after = block(text, '@Composable\nprivate fun PersonalListeningShelf(', '@Composable\nprivate fun HomeOrbitTrackCard(')
          quick_after = block(text, '@Composable\nprivate fun HomeQuickPicksShelf(', '@Composable\nprivate fun HomeQuickPickRow(')
          if orbit_before != orbit_after:
              raise SystemExit('Personal Orbit changed unexpectedly')
          if quick_before != quick_after:
              raise SystemExit('Quick Picks changed unexpectedly')

          path.write_text(text)
          PY
          git diff --check
          git diff -- app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt

      - name: Fast AI quality gate
        run: python3 scripts/ai_quality_gate.py --profile fast

      - name: Full AI quality gate
        run: python3 scripts/ai_quality_gate.py --profile full

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_home-order-pass.yml
          git config user.name 'LUC4N3X'
          git config user.email '241364318+LUC4N3X@users.noreply.github.com'
          git add app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt .github/workflows/_home-order-pass.yml
          git diff --cached --check
          git commit -m 'Refine Home shelf hierarchy'
          git push origin HEAD:chatgpt/home-visual-hierarchy
