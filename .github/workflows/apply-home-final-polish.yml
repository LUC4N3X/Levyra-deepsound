name: Apply Home final polish

on:
  push:
    branches:
      - refactor/home-experience
    paths:
      - .github/workflows/apply-home-final-polish.yml

permissions:
  contents: write

concurrency:
  group: apply-home-final-polish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0

      - name: Apply final Home UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/luc4n3x/levyra/ui/LevyraApp.kt")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              text = text.replace(old, new, 1)

          def replace_in_region(start_marker: str, end_marker: str, old: str, new: str, label: str) -> None:
              global text
              start = text.find(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit(f"{label}: region not found")
              block = text[start:end]
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]

          text = text.replace(
              "import androidx.compose.foundation.gestures.snapping.rememberSnapFlingBehavior\n",
              "",
              1,
          )

          import_anchor = "import androidx.compose.ui.res.painterResource\n"
          semantics_imports = (
              "import androidx.compose.ui.semantics.contentDescription\n"
              "import androidx.compose.ui.semantics.semantics\n"
          )
          if "import androidx.compose.ui.semantics.semantics\n" not in text:
              replace_once(import_anchor, import_anchor + semantics_imports, "semantics imports")

          replace_once(
              "contentPadding = PaddingValues(top = 8.dp, bottom = homeBottomInset + 28.dp)",
              "contentPadding = PaddingValues(top = 8.dp, bottom = homeBottomInset + 64.dp)",
              "Home bottom clearance",
          )

          replace_once(
              '''            item(key = "home-top", contentType = "home-header") {
                HomeSectionInset {
                    Column(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                        GreetingBar(
                            userName = state.userName,
                            isResolving = state.isResolving,
                            onSearch = viewModel::openSearch,
                            onSettings = viewModel::openSettings
                        )
                        MoodRow(
                            moods = state.moods,
                            selectedId = state.selectedMood?.id,
                            onSelect = viewModel::selectMood
                        )
                    }
                }
            }
''',
              '''            item(key = "home-top", contentType = "home-header") {
                Column(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                    HomeSectionInset {
                        GreetingBar(
                            userName = state.userName,
                            isResolving = state.isResolving,
                            onSearch = viewModel::openSearch,
                            onSettings = viewModel::openSettings
                        )
                    }
                    MoodRow(
                        moods = state.moods,
                        selectedId = state.selectedMood?.id,
                        onSelect = viewModel::selectMood
                    )
                }
            }
''',
              "Mood row outside header inset",
          )

          replace_in_region(
              "private fun HomeSectionHeader(",
              "private fun CoverImage(",
              """                modifier = Modifier
                    .height(36.dp)
""",
              """                modifier = Modifier
                    .sizeIn(minHeight = LevyraPlayerDesign.MinimumTouchTarget)
                    .height(36.dp)
""",
              "Play-all touch target",
          )

          replace_once(
              ".height(LevyraHomeDesign.HeroHeight)\n",
              ".heightIn(min = LevyraHomeDesign.HeroHeight)\n",
              "Scalable hero",
          )

          replace_in_region(
              "private fun HomeEditorialCollectionCard(",
              "private fun CollectionArtworkMosaic(",
              "    val shape = RoundedCornerShape(20.dp)\n",
              "    val shape = LevyraHomeDesign.ShelfShape\n",
              "Editorial shelf shape",
          )

          replace_in_region(
              "private fun HomeQuickPicksShelf(",
              "private fun HomeQuickPickRow(",
              """            contentPadding = PaddingValues(
                start = HomeHorizontalInset,
                end = HomeHorizontalShelfEndPadding
            )
""",
              """            contentPadding = PaddingValues(
                start = HomeHorizontalInset,
                end = 36.dp
            )
""",
              "Quick Picks trailing padding",
          )
          replace_in_region(
              "private fun HomeQuickPicksShelf(",
              "private fun HomeQuickPickRow(",
              "modifier = Modifier.width(280.dp)",
              "modifier = Modifier.width(304.dp)",
              "Quick Picks column width",
          )

          replace_in_region(
              "private fun HomeQuickPickRow(",
              "private fun HomeContinueListeningCard(",
              "    val shape = RoundedCornerShape(15.dp)\n",
              "    val shape = LevyraHomeDesign.ShelfShape\n",
              "Quick Pick shared shape",
          )
          replace_in_region(
              "private fun HomeQuickPickRow(",
              "private fun HomeContinueListeningCard(",
              ".padding(start = 8.dp, end = 10.dp),",
              ".padding(start = 8.dp, end = 6.dp),",
              "Quick Pick end padding",
          )
          replace_in_region(
              "private fun HomeQuickPickRow(",
              "private fun HomeContinueListeningCard(",
              "horizontalArrangement = Arrangement.spacedBy(10.dp)",
              "horizontalArrangement = Arrangement.spacedBy(6.dp)",
              "Quick Pick row gap",
          )
          replace_in_region(
              "private fun HomeQuickPickRow(",
              "private fun HomeContinueListeningCard(",
              ".size(30.dp)\n                .background(",
              ".size(28.dp)\n                .background(",
              "Quick Pick icon container",
          )

          replace_in_region(
              "private fun HomeHeaderIconButton(",
              "private fun MetroHeroDeck(",
              """            .border(Dp.Hairline, border, shape)
            .pressable(onClick = onClick),
""",
              """            .border(Dp.Hairline, border, shape)
            .pressable(onClick = onClick)
            .semantics { this.contentDescription = contentDescription },
""",
              "Header button semantics",
          )
          replace_in_region(
              "private fun HomeHeaderIconButton(",
              "private fun MetroHeroDeck(",
              """            Icon(
                imageVector = icon,
                contentDescription = contentDescription,
""",
              """            Icon(
                imageVector = icon,
                contentDescription = null,
""",
              "Header child icon label",
          )

          mood_start = text.find("@Composable\nprivate fun MoodRow(")
          mood_end = text.find("\n@Composable\n", mood_start + 20)
          if mood_start < 0 or mood_end < 0:
              raise SystemExit("MoodRow boundaries not found")

          new_mood = '''@Composable
private fun MoodRow(moods: List<Mood>, selectedId: String?, onSelect: (Mood) -> Unit) {
    LazyRow(
        modifier = Modifier
            .fillMaxWidth()
            .padding(bottom = 4.dp),
        horizontalArrangement = Arrangement.spacedBy(8.dp),
        contentPadding = PaddingValues(
            start = HomeHorizontalInset,
            end = 48.dp
        )
    ) {
        items(
            items = moods,
            key = { it.id },
            contentType = { "home-mood" }
        ) { mood ->
            val selected = mood.id == selectedId
            val shape = LevyraHomeDesign.MoodChipShape
            val background = when {
                selected -> Brush.linearGradient(
                    listOf(
                        LevyraCyan.copy(alpha = 0.94f),
                        LevyraViolet.copy(alpha = 0.88f)
                    )
                )
                LevyraIsLight -> SolidColor(Color.White.copy(alpha = 0.76f))
                else -> SolidColor(Color(0xFF12141A).copy(alpha = 0.78f))
            }
            val border = when {
                selected -> Color.White.copy(alpha = 0.16f)
                LevyraIsLight -> Color(0x1711131F)
                else -> Color.White.copy(alpha = 0.07f)
            }

            Box(
                modifier = Modifier
                    .height(LevyraHomeDesign.MoodChipHeight)
                    .clip(shape)
                    .background(background, shape)
                    .border(Dp.Hairline, border, shape)
                    .pressable(onClick = { onSelect(mood) }),
                contentAlignment = Alignment.Center
            ) {
                Text(
                    text = mood.title,
                    color = if (selected) Color.White else LevyraText.copy(alpha = 0.90f),
                    fontSize = 13.sp,
                    lineHeight = 15.sp,
                    fontWeight = if (selected) FontWeight.Bold else FontWeight.SemiBold,
                    maxLines = 1,
                    modifier = Modifier.padding(horizontal = 14.dp)
                )
            }
        }
    }
}
'''
          text = text[:mood_start] + new_mood + text[mood_end:]

          required = (
              "bottom = homeBottomInset + 64.dp",
              "end = 48.dp",
              "modifier = Modifier.width(304.dp)",
              "end = 36.dp",
              ".padding(start = 8.dp, end = 6.dp)",
              "horizontalArrangement = Arrangement.spacedBy(6.dp)",
              ".size(28.dp)",
              ".sizeIn(minHeight = LevyraPlayerDesign.MinimumTouchTarget)",
              ".heightIn(min = LevyraHomeDesign.HeroHeight)",
              "val shape = LevyraHomeDesign.MoodChipShape",
              "val shape = LevyraHomeDesign.ShelfShape",
              ".semantics { this.contentDescription = contentDescription }",
              "onSearch = viewModel::openSearch",
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"Missing required marker: {marker}")
          if "rememberSnapFlingBehavior" in text:
              raise SystemExit("Snap fling behavior still present")
          if "contentPadding = PaddingValues(start = 1.dp, end = 1.dp)" in text:
              raise SystemExit("Old MoodRow edge padding still present")

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          rm -f .github/workflows/apply-home-final-polish.yml

      - name: Commit clean changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): polish shelf peeks and accessibility"
          git push origin HEAD:refactor/home-experience
