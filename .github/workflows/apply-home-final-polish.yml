name: Apply Home final polish

on:
  push:
    branches:
      - refactor/home-experience
    paths:
      - .github/workflows/apply-home-final-polish.yml
      - .github/home_final_polish.py

permissions:
  contents: write

concurrency:
  group: apply-home-final-polish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/home-experience
          fetch-depth: 0

      - name: Apply final Home UI fixes
        shell: bash
        run: |
          python .github/home_final_polish.py
          git diff --check
          rm -f .github/home_final_polish.py .github/workflows/apply-home-final-polish.yml

      - name: Commit clean changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): polish shelf peeks and accessibility"
          git push origin HEAD:refactor/home-experience
