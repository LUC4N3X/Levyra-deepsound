name: Bug report
description: Report a reproducible problem in Levyra
title: "[Bug] "

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Please provide clear reproduction steps and the exact environment where the issue occurred. Incomplete reports may be closed if there is not enough information to investigate them.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and did not find an existing report for this problem.
          required: true
        - label: I tested the latest official Levyra release, or I clearly explain below why I could not.
          required: true
        - label: I removed passwords, tokens, private URLs, and other sensitive information from logs and screenshots.
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the platform where the issue occurs.
      options:
        - Android
        - Windows Desktop
        - Android and Windows Desktop
        - Shared infrastructure or extractor
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the area most closely related to the problem.
      options:
        - App startup or crash
        - Playback, queue, or audio
        - Stream extraction or loading
        - Search, charts, or catalog
        - Downloads or offline playback
        - Library, playlists, or history
        - Lyrics or metadata
        - User interface or navigation
        - Android Auto, media session, or system controls
        - Windows integration, updater, or packaging
        - Settings, localization, RTL, or accessibility
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what is wrong and when you first noticed it.
      placeholder: Describe the problem clearly and include any relevant context.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that triggers the issue.
      placeholder: |
        1. Open Levyra
        2. Go to ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency
      options:
        - Every time
        - Often
        - Sometimes
        - Happened once
        - Unable to reproduce again
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Levyra version
      description: Use the version shown in Settings or About. Include the build or commit when using a development build.
      placeholder: Example: 2.3.11 or desktop-v1.1.0
    validations:
      required: true

  - type: dropdown
    id: installation_source
    attributes:
      label: Installation source
      options:
        - GitHub Releases
        - F-Droid
        - Locally built from source
        - Development or pull-request artifact
        - Other
    validations:
      required: true

  - type: textarea
    id: system_information
    attributes:
      label: System information
      description: Provide the details relevant to the selected platform.
      placeholder: |
        Android: device model, Android version, stock or custom ROM
        Windows: Windows version and build, system architecture, VLC or libVLC version if relevant
    validations:
      required: true

  - type: textarea
    id: network_region
    attributes:
      label: Network and region
      description: Complete this when the issue involves streaming, search, charts, downloads, or availability.
      placeholder: Country or content region, Wi-Fi/mobile/Ethernet, VPN/proxy/DNS use, and whether another network was tested.

  - type: textarea
    id: media_reference
    attributes:
      label: Media or content reference
      description: For content-specific issues, provide the search query or a public YouTube/YouTube Music link that reproduces the problem.
      placeholder: Track, album, artist, playlist, video, or search query.

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or recordings
      description: Drag and drop screenshots or a short recording when the problem is visual or timing-dependent.

  - type: textarea
    id: logs
    attributes:
      label: Logs or error details
      description: Paste the relevant crash report, stack trace, or application log. Remove sensitive information first.
      render: text

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add workarounds, regression details, related changes, or anything else that may help the investigation.
