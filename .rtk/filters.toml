# Levyra project-local RTK filters.
#
# RTK already handles Gradle/gradlew, Git, GitHub CLI, common test runners,
# linters, Docker, logs, grep, find, and many other commands with compact output.
#
# These filters are only for Levyra-specific commands that are not already
# covered well by RTK's built-in handlers.
#
# Project-local filters override built-in or user-global filters only when
# their match_command expression matches.
#
# Keep useful errors, failure details, and final summaries. The goal here is
# simply to cut noisy output without making debugging harder.

schema_version = 1


[filters.levyra-agent-config]
description = "Compact Levyra agent configuration validation"
match_command = "^(python3?|py)\\s+scripts[/\\\\]validate_agent_config\\.py\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
truncate_lines_at = 240
max_lines = 80
on_empty = "Levyra agent configuration validation produced no output"

[[tests.levyra-agent-config]]
name = "keeps successful validation summary"
input = "Agent configuration validation passed: 20 required files, 14 native skills.\n"
expected = "Agent configuration validation passed: 20 required files, 14 native skills."

[[tests.levyra-agent-config]]
name = "keeps validation failures"
input = "Agent configuration validation failed:\n- missing required file: docs/ai/RTK.md\n"
expected = "Agent configuration validation failed:\n- missing required file: docs/ai/RTK.md"


[filters.levyra-coderabbit]
description = "Compact local CodeRabbit review output while keeping useful findings"
match_command = "^coderabbit\\s+review\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Scanning repository",
  "^Indexing files",
  "^Analyzing changes",
  "^Generating review",
  "^Progress:",
]
truncate_lines_at = 320
max_lines = 180
on_empty = "CodeRabbit review completed without textual findings"


[filters.levyra-adb-logcat]
description = "Keep recent Android logcat diagnostics while dropping banner noise"
match_command = "^adb(?:\\.exe)?(?:\\s+-s\\s+\\S+)?\\s+logcat\\b"
strip_ansi = true
strip_lines_matching = [
  "^--------- beginning of (main|system|crash)$",
]
truncate_lines_at = 400
tail_lines = 240
on_empty = "adb logcat produced no matching lines"

[[tests.levyra-adb-logcat]]
name = "drops standard logcat buffer banners"
input = "--------- beginning of main\n09-04 19:10:00.000  1234  1234 I Levyra: ready\n"
expected = "09-04 19:10:00.000  1234  1234 I Levyra: ready"


[filters.levyra-agent-tests]
description = "Compact Levyra AI setup-script output"
match_command = "^(?:(?:pwsh|powershell|bash|sh)\\s+.*|(?:\\.?[./\\\\])?)scripts[/\\\\]setup-ai\\.(ps1|sh)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
truncate_lines_at = 300
max_lines = 140
on_empty = "Levyra AI setup completed without textual output"
